  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: My in-app notifications
      description: 'The bell polls this with `X-PMIS-Live: 1`; such a call does not extend the idle timeout. Only the caller''s own notifications; one that points at a task or a register record is left out (with its count) once the caller can no longer read that module in that region (0.6.0).'
      parameters:
      - {$ref: '#/components/parameters/LivePoll'}
      - name: unread_only
        in: query
        schema: {type: boolean, default: false}
      - name: snoozed
        in: query
        description: 'hide (default): a snoozed notification is hidden until its date. only: just the snoozed ones. include: both.'
        schema: {type: string, enum: [hide, only, include], default: hide}
      - name: kind
        in: query
        schema: {$ref: '#/components/schemas/NotificationKind'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - {$ref: '#/components/schemas/PageEnvelope'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Notification'}
                - type: object
                  properties:
                    unread_count: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /notifications/{notification_id}/read:
    parameters:
    - {$ref: '#/components/parameters/NotificationId'}
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one as read
      responses:
        '200':
          description: Read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications/{notification_id}/unread:
    parameters:
    - {$ref: '#/components/parameters/NotificationId'}
    post:
      tags: [notifications]
      operationId: markNotificationUnread
      summary: Mark one as unread (0.4.10, X1)
      description: Only the owner of the notification; anyone else gets 404. Audited.
      responses:
        '200':
          description: Unread.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications/{notification_id}/snooze:
    parameters:
    - {$ref: '#/components/parameters/NotificationId'}
    post:
      tags: [notifications]
      operationId: snoozeNotification
      summary: Hide a notification until a date (0.4.10, X1)
      description: '`until` is a date-time, or a plain date (the start of that day in Tripoli time), in the future and within one year (else 422). `null` clears the snooze. Snoozing does not mark it read. Audited.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              additionalProperties: false
              properties:
                until: {oneOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
      responses:
        '200':
          description: Snoozed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /sites/{site_id}/follow:
    parameters:
    - {$ref: '#/components/parameters/SiteId'}
    put:
      tags: [notifications]
      operationId: followSite
      summary: Follow a site (0.4.10, X2)
      description: Needs `view` on `sites` for the site's region (403 `module_forbidden` without the module, 404 for a site outside the caller's regions). Idempotent. The follower gets a `followed_change` notification when a task of the site changes, only while they can still read it. Audited. Follows grant no access.
      x-db-path: x_follow
      responses:
        '200':
          description: Following.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Follow'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [notifications]
      operationId: unfollowSite
      summary: Stop following a site (0.4.10, X2)
      description: 'Needs only a session (0.7.1), because it removes the caller''s own follow, also one the caller can no longer read. A malformed id is 404.'
      x-db-path: x_unfollow
      responses:
        '204': {description: Not following (also when it was not followed).}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /registers/{register_key}/records/{record_id}/follow:
    parameters:
    - {$ref: '#/components/parameters/RegisterKeyPath'}
    - {$ref: '#/components/parameters/RegisterRecordId'}
    put:
      tags: [notifications]
      operationId: followRegisterRecord
      summary: Follow a register record (0.4.10, X2)
      description: Follows the record across its versions. Needs `view` on the register's module for the record's region (403 / 404 as for the site). Idempotent, audited. The followers of a site also hear about the register changes of that site if they can read the register.
      x-db-path: x_follow
      responses:
        '200':
          description: Following.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Follow'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [notifications]
      operationId: unfollowRegisterRecord
      summary: Stop following a register record (0.4.10, X2)
      description: 'Needs only a session (0.7.1), like stopping a site follow. A malformed id is 404.'
      x-db-path: x_unfollow
      responses:
        '204': {description: Not following.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
