  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: The main dashboard, limited to the caller's regions and modules (0.7.2)
      description: |
        One call for the whole dashboard page (owner request 2026-11-02; `docs/spec/dashboard-kpis.md`). It supersedes the five `/dashboard/*` reads below, which are not built.
        Needs `dashboard.view`; a caller without it is 403 `module_forbidden`. **Every figure is computed from the sites in the caller's `dashboard.view` regions** (B3, VI-04): a Tripoli user never sees a Benghazi count, and the project-wide ("central") Project Status items (1.3, 1.5, 3.2 to 3.9, 6.1, 6.6, 7.7, 8.1) are left out and reported in `meta.central_items_hidden` whenever the figures are not for the whole project. The `issues` section needs `issues.view` as well and is null without it. Cancelled sites are left out of every figure; their number is `headline.sites_cancelled`.
        **Reference date (Q34).** `ref_date` defaults to today and may be any earlier date. `basis.source` says how the figures were made: `live` (today), `snapshot` (a weekly snapshot dated exactly `ref_date` exists: headline, pipeline, streams and Project Status come from it; SLA, issues, delay attribution and health are computed as of the date) or `as_of_computed` (no snapshot: everything is computed from dated facts, an actual date counts when it is on or before the date; blocked gates are not available, `gates.available` is false). A date in the future is 422 `validation_failed` with `/ref_date` `in_future`.
        **Counting (Q36).** Issues are counted for the owner bars and the totals, sites for `sites_with_open_issue`; the issue age is in working days from the raised date. **Health index** (rules.md section 9, version 1) is a draft under owner review (`health.draft`); the bands are the setting `dashboard.health_bands` (green from 85, amber from 70, red below, Q35). **Delay attribution** (rules.md section 8) is a draft too and has no attribution periods yet. Working days use the default work calendar (Friday and Saturday weekend, holidays table).
        **Streams** are the stream codes of the workflow plus `DISMANTLE` (Q41). The `stream` filter keeps the sites the stream applies to (for `DISMANTLE` the sites with a Dismantle part) and limits the pipeline and the SLA to its stages.
      parameters:
      - name: ref_date
        in: query
        schema: {type: string, format: date}
        description: Reference date, today or earlier. Default today (Africa/Tripoli).
      - name: region_id
        in: query
        schema: {$ref: '#/components/schemas/RegionId'}
        description: One region. A region outside the caller's regions gives an empty view, not the other region.
      - name: cluster_code
        in: query
        schema: {type: string, minLength: 1, maxLength: 40}
      - name: scenario
        in: query
        schema: {$ref: '#/components/schemas/DeliveryScenario'}
      - name: stream
        in: query
        schema: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,30}$'}
        description: A stream code from `filters.streams`. An unknown one is 422 `unknown_stream`.
      - name: exclude_overrides
        in: query
        schema: {type: boolean}
        description: Leave out tasks closed by an admin override. Default is the setting `dashboard.exclude_overrides` (true). The number left out is `meta.override_flagged_count`.
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /dashboard/export:
    get:
      tags: [dashboard]
      operationId: exportDashboard
      summary: Export exactly the current dashboard view as a CSV file (0.7.2)
      description: |
        Same query as `GET /dashboard`. The file holds the rows `section,item,metric,value` of the headline figures, the milestones, the Final Closure KPI, the streams, the SLA, the issues, the health index (marked draft), the delay attribution (marked draft) and the regions of the view the caller sees. It is UTF-8 with a byte-order mark so Excel opens Arabic text. Needs `dashboard.export` as well as `dashboard.view` (403 `action_forbidden` otherwise). Scoped by the caller's regions exactly as the dashboard is. Every export writes an audit row (`export`, entity `dashboard`). The Master-format Excel export of `/exports/master` has no dashboard part.
      parameters:
      - {name: ref_date, in: query, schema: {type: string, format: date}}
      - {name: region_id, in: query, schema: {$ref: '#/components/schemas/RegionId'}}
      - {name: cluster_code, in: query, schema: {type: string, minLength: 1, maxLength: 40}}
      - {name: scenario, in: query, schema: {$ref: '#/components/schemas/DeliveryScenario'}}
      - {name: stream, in: query, schema: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,30}$'}}
      - {name: exclude_overrides, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: The file `GSDN_Dashboard_<ref_date>.csv`.
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /project-status:
    get:
      tags: [project-status]
      operationId: getProjectStatus
      summary: Project Status (ends at HOTO) with the weight-set version used
      description: Uses the active weight set, or `weight_set_version` / `weight_set_id` (0.2.6) to re-run with an older set for comparison. Both together, a set of another code, or an unknown `weight_set_version` is 422. Weekly snapshots are never recomputed.
      parameters:
      - name: region_id
        in: query
        schema: {$ref: '#/components/schemas/RegionId'}
      - name: site_id
        in: query
        schema: {type: string, format: uuid}
      - name: group_by
        in: query
        schema:
          type: string
          enum: [none, region, site]
          default: none
      - name: weight_set_version
        in: query
        schema: {type: integer, minimum: 1}
      - name: weight_set_id
        in: query
        description: 'Re-run with this weight set (any published or older set of code `project_status`) instead of the one in force, for comparison (0.2.6). Not together with `weight_set_version` (422). The response `weight_set.is_active` is false. Nothing is saved and snapshots are not touched.'
        schema: {type: string, format: uuid}
      - name: exclude_overrides
        in: query
        schema: {type: boolean, default: false}
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /project-status/snapshots:
    get:
      tags: [project-status]
      operationId: listProjectStatusSnapshots
      summary: Saved weekly snapshots (values frozen at the time)
      parameters:
      - name: region_id
        in: query
