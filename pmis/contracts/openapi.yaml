      operationId: downloadTemplate
      summary: Download the current version (hidden `_tpl` sheet holds template_id and version)
      description: |
        Audited. Needs `download_documents` on `templates` and `view` on the register's module. Only the current version can be downloaded, and only the current version is accepted on upload.
        The data sheet `Data` has the locked header row (Master order, then the custom fields that appear in templates, then `Record ID`), drop-downs for the list fields, and grey locked columns for calculated values (never read on upload).
        The very-hidden `_tpl` sheet holds `template_id`, `version`, `kind`, `register_key`, `stream`, `header_checksum`, `field_set_hash`, `issued_by` and `issued_at`.
        For a pre-filled copy pass `prefill=true`, `task_id` (the task's site; the task must use this template, else 422 `template_rejected` with `wrong_template`) or `site_ids`: the records in force inside the caller's regions, with their `Record ID`.
      parameters:
      - name: task_id
        in: query
        schema: {type: string, format: uuid}
      - name: site_ids
        in: query
        description: Repeated, or a comma separated list. At most 500.
        schema:
          type: array
          items: {type: string, format: uuid}
      - name: prefill
        in: query
        description: Pre-fill with the current records of the register (at most 5000 rows).
        schema: {type: boolean, default: false}
      - name: region_id
        in: query
        description: Limit a pre-filled copy to one region (inside the caller's regions).
        schema: {type: integer}
      responses:
        '200':
          description: The xlsx file.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /import-batches:
    get:
      tags: [templates]
      operationId: listImportBatches
      summary: Upload batches visible to the caller
      parameters:
      - name: status
        in: query
        schema: {type: string}
      - name: template_id
        in: query
        schema: {type: string}
      - name: register_key
        in: query
        schema: {type: string}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Batches. Those the caller uploaded, and those of registers whose module the caller may view (inside the caller's regions).
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageEnvelope'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/ImportBatch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [templates]
      operationId: uploadImportBatch
      summary: 'Upload a filled template: validate and create a batch'
      description: |
        Needs `import` on `templates` (403 otherwise, before the file is read). Then, in order: the form (one file, size limit 5 MB, 2000 data rows; larger answers 413 or 422 `size_or_rows_exceeded`), a plain `.xlsx` package without macros, embedded objects or external links (`not_xlsx`, `macros_not_allowed`), the hidden `_tpl` sheet (`tpl_missing`, `tpl_invalid`), a known and active template (`template_unknown_or_inactive`), the current version (`outdated_version`; the message names both versions), the template the user selected (`wrong_template`), the header checksum (`checksum_mismatch`), and the caller's right to create or edit in the register (`import_not_allowed`).
        The first failure answers 422 `template_rejected` with `reason` = TemplateRejectReason, writes a System Log row (`source = template-check`, the reason, the file name and hash) and creates no batch.
        A file that passes is read as values (a formula or a text starting with `=` is a cell error), staged by the database and answered 202 with the batch in status `validated`: each row is resolved inside the caller's regions, matched to a record by `Record ID` or by the register's natural key, validated with the same rules as manual entry, and classified. Rows with errors stay in the batch as `error` and never go on. Nothing reaches the register until the uploader sends the batch and the rows are approved.
      x-db-path: imp_stage_batch
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                template_id: {type: string, description: The template the user selected.}
                task_id: {type: string, format: uuid, description: 'Set when uploading from beside a task (per-task template). The batch response then carries `task_id` and its `site_id`; the template must be one the task uses, else 422.'}
      responses:
        '202':
          description: Accepted. The file is parsed and staged in the request, so the batch is already `validated` (`job_id` stays null; `parsing` is kept for a future background parse).
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /import-batches/{batch_id}:
    parameters:
    - {$ref: '#/components/parameters/BatchId'}
    get:
      tags: [templates]
      operationId: getImportBatch
      summary: One batch (status and counts follow the rows and the records they created)
      responses:
        '200':
          description: Batch.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
