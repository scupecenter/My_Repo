      responses:
        '200':
          description: Catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionCatalogue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /permission-profiles:
    get:
      tags: [permissions]
      operationId: listPermissionProfiles
      summary: Named permission profiles
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PermissionProfile' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [permissions]
      operationId: createPermissionProfile
      summary: Create a profile with its grid and field rules
      x-step-up: true
      x-db-path: idm_save_profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionProfileInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /permission-profiles/{profile_id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [permissions]
      operationId: getPermissionProfile
      summary: One profile
      responses:
        '200':
          description: Profile.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [permissions]
      operationId: replacePermissionProfile
      summary: Replace the grid and field rules of a profile (or deactivate it)
      description: A caller linked to this profile through an active assignment is refused with `self_beneficiary`, unless they are a System Admin acting without delegation.
      x-step-up: true
      x-db-path: idm_save_profile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionProfileInput' }
      responses:
        '200':
          description: Saved (new version).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ groups
  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: Groups with member counts and matrix usage
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group
      x-step-up: true
      x-db-path: idm_group_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reason]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                member_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: getGroup
      summary: One group with members
      responses:
        '200':
          description: Group.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Rename, describe or deactivate a group
      x-step-up: true
      x-db-path: idm_group_update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                is_active: { type: boolean }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      operationId: addGroupMembers
      summary: Add members
      description: Only a System Admin acting without delegation may change the System Admins group. Pending users are refused.
      x-step-up: true
      x-db-path: idm_group_add_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, reason]
              properties:
                user_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Per-user result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{group_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [groups]
      operationId: removeGroupMember
      summary: Remove a member
      description: Refused with `last_admin` when it would leave the System Admins group without an active member. Claimed tasks of the member under this group return to the group.
      x-step-up: true
      x-db-path: idm_group_remove_member
      parameters:
        - name: reason
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Reason' }
      responses:
        '204': { description: 'Removed.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ delegations
  /delegations:
    get:
      tags: [delegations]
      operationId: listDelegations
      summary: Delegations (timeline)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [active, scheduled, expired, revoked, all], default: active } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Delegations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Delegation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [delegations]
      operationId: createDelegation
      summary: Delegate full or partial admin rights (System Admin only, never by a delegate)
      x-step-up: true
      x-db-path: idm_delegate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /delegations/{delegation_id}/revoke:
    post:
      tags: [delegations]
      operationId: revokeDelegation
      summary: Revoke a delegation
      x-step-up: true
      x-db-path: idm_revoke_delegation
      parameters:
        - name: delegation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ regions
  /regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: The 7 regions (with the caller's visibility flag)
      responses:
        '200':
          description: Regions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Region' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ sites
  /sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: Sites with filters and the mini rail
      description: Only sites in the caller's regions for the `sites` module are returned (RLS).
      parameters:
        - { name: q, in: query, description: 'Site code, owner ID or name.', schema: { type: string } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, description: 'Current milestone/stage code (stable code, ADR 0010).', schema: { type: string } }
        - { name: scenario, in: query, schema: { $ref: '#/components/schemas/DeliveryScenario' } }
        - { name: overall_status, in: query, schema: { $ref: '#/components/schemas/OverallStatus' } }
        - { name: bucket, in: query, schema: { type: string, enum: [all, mine, late, waiting_approval, closed], default: all } }
        - { name: cluster_code, in: query, schema: { type: string } }
        - { name: delivery_batch, in: query, schema: { type: string } }
        - { name: workflow_version, in: query, schema: { type: integer, minimum: 1 } }
        - name: custom
          in: query
          description: Filter on custom fields shown in filters, as `code:value` pairs (repeatable).
          style: form
          explode: true
          schema: { type: array, items: { type: string, pattern: '^[a-z0-9_]+:.+$' } }
        - { name: sort, in: query, schema: { type: string, enum: [site_code, -site_code, region, -region, stage, -stage, due_date, -due_date], default: site_code } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteListItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: getSite
      summary: Site detail with pipeline, gates and cluster progress
      responses:
        '200':
          description: Site.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sites/{site_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: listSiteTasks
      summary: Task grid of a site, grouped by stage (site's workflow version)
      responses:
        '200':
          description: Stages with their tasks.
          content:
            application/json:
              schema:
                type: object
                required: [workflow_version, stages]
                properties:
                  workflow_version: { type: integer }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [code, name_en, tasks]
                      properties:
                        code: { type: string }
                        name_en: { type: string }
                        name_ar: { type: [string, 'null'] }
                        tasks: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ tasks
  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Task detail (drawer)
      responses:
        '200':
          description: Task.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateTaskEntry
      summary: Save entry data (dates, values, custom fields) at level 1
      description: Allowed in states `open` and `entry` to an eligible entry holder. Read-only and hidden fields are refused with `field_read_only`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskEntryPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/start:
    post:
      tags: [tasks]
      operationId: startTask
      summary: Move a Pending task to Ongoing with a start date
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actual_start: { type: string, format: date, description: 'Default today (TE MOS date for D6).' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/submit:
    post:
      tags: [tasks]
      operationId: submitTask
      summary: Submit for review (level 1 done)
      description: |
        Refused with 422 `mandatory_slots_missing` or `mandatory_fields_missing` (listing them). Freezes `levels_required`.
        Self-skip may carry the task further (`skipped_levels` in the result). If the chain reaches final approval, step-up is required.
      x-step-up: conditional (only when self-skip reaches final approval, or levels_required = 1)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/review:
    post:
      tags: [tasks]
      operationId: reviewTask
      summary: Pass a review level (levels 2..N-1)
      x-step-up: conditional (only when self-skip reaches final approval)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/approve:
    post:
      tags: [tasks]
      operationId: approveTask
      summary: Final approval (level N)
      description: Refused with 422 `open_snags` for preliminary acceptances while snags are open. Under `all_members` the result shows the votes still missing.
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/reject:
    post:
      tags: [tasks]
      operationId: rejectTask
      summary: Return the task one level back, with a note
      description: Allowed at level >= 2. `note` is mandatory (422 `note_required`). Target level follows ADR 0004 §6.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Claim a group-assigned level (any one member)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/release:
    post:
      tags: [tasks]
      operationId: releaseTask
      summary: Release my claim back to the group
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/history:
    get:
      tags: [tasks]
      operationId: getTaskHistory
      summary: Workflow steps (timeline), including auto-skips and overrides
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Steps, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{task_id}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskComments
      summary: Comment thread
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      operationId: addTaskComment
      summary: Add a comment (with optional mentions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                mention_user_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/slots/{slot_id}/files:
    post:
      tags: [tasks]
      operationId: uploadSlotFile
      summary: Upload a file into a document slot (new version if the slot has files)
      description: Streams through the API; format by magic bytes, size and file count from the slot's document-type version (ADR 0008).
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: slot_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                replaces_file_group_id: { type: string, format: uuid, description: 'Set to upload a new version of an existing file.' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/overrides:
    post:
      tags: [tasks]
      operationId: createOverride
      summary: Admin override on a task (reason and step-up)
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '201':
          description: Applied.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /overrides/{override_id}/revert:
    post:
      tags: [tasks]
      operationId: revertOverride
      summary: Revert an admin override
      description: 409 `override_not_revertible` if the task has moved on since.
      x-step-up: true
      parameters:
        - name: override_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /files/{file_id}/download:
    get:
      tags: [tasks]
      operationId: downloadFile
      summary: Download a file (audited before streaming)
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The file, named `SITE_TASK_DOC_APPROVEDDATE.ext` (ADR 0008 §3).
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ approvals
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approvals inbox (items where I can act at review or approve level)
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [all, review, approve], default: all } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: group_only, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inbox.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ApprovalItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/bulk:
    post:
      tags: [approvals]
      operationId: bulkApprovals
      summary: Pass or approve many tasks at once (one step-up)
      description: Each item is processed in its own transaction; the result lists done, skipped (with reason) and failed items. Rejection is never bulk because each needs its own note.
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, items]
              properties:
                action: { type: string, enum: [pass, approve], description: 'pass = review level, approve = final level.' }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/VersionedRef' }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Per-item result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ matrix
  /matrix:
    get:
      tags: [matrix]
      operationId: getMatrix
      summary: Responsibility Matrix for a workflow version, with self-skip preview
      parameters:
        - { name: workflow_version, in: query, description: 'Default = current published version.', schema: { type: integer, minimum: 1 } }
        - { name: region_id, in: query, description: 'Show region-specific cells for this region.', schema: { $ref: '#/components/schemas/RegionId' } }
      responses:
        '200':
          description: Matrix.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [matrix]
      operationId: updateMatrix
      summary: Save changed cells and stage level counts in one step
      description: |
        All changes in one transaction. A used level with no assignee is refused (422 `empty_cell`). Roles with
        `can_hold_matrix_levels = false` are refused. Applies to new level transitions only (MX-04).
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ workflow (ADR 0010)
  /workflow/versions:
    get:
      tags: [workflow]
      operationId: listWorkflowVersions
      summary: Workflow definition versions with site counts
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkflowVersionSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [workflow]
      operationId: createWorkflowDraft
      summary: Create a draft (copy of a published version) for structural changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_version, reason]
              properties:
                parent_version: { type: integer, minimum: 1 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflow/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/WorkflowVersionNo'
    get:
      tags: [workflow]
      operationId: getWorkflowVersion
      summary: Full definition of a version (milestones, gates, task placements)
      responses:
        '200':
          description: Version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [workflow]
      operationId: replaceWorkflowDraft
      summary: Replace the structure of a draft (add, remove, reorder milestones and gates; move tasks)
      description: Only for `status = draft`. Codes of existing nodes are kept; new nodes get new codes that are never reused.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowStructure' }
      responses:
        '200':
          description: Saved, with validation warnings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/publish:
    post:
      tags: [workflow]
      operationId: publishWorkflowVersion
      summary: Publish a draft (structural change); new sites use it
      description: |
        Runs the ADR 0010 §2 validation. Returns 422 `workflow_invalid` with the list of problems.
        Answers 409 `freeze_active` during the structural freeze (`GET /settings/structural-freeze`, B9).
        During the parallel run, a change that affects Master export columns needs `confirm_master_impact` equal to the
        phrase in `master_impact.confirmation_phrase` of the validation result.
      x-step-up: true
      x-db-path: admin_publish_workflow_version (app_actor_is_admin('workflow.publish'))
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/milestones/{code}:
    patch:
      tags: [workflow]
      operationId: updateMilestoneLight
      summary: Light change to a milestone (names, custom fields, counts in Project Status); applies at once
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/NodeCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                counts_in_project_status: { type: boolean }
                custom: { $ref: '#/components/schemas/CustomValues' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Saved (light revision + 1).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowMilestone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/gates/{code}:
    patch:
      tags: [workflow]
      operationId: updateGateLight
      summary: Light change to a gate (names, conditions, SLA, custom fields); applies to gates not yet open
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/NodeCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                conditions: { type: array, items: { $ref: '#/components/schemas/GateCondition' } }
                sla_min_wd: { type: integer, minimum: 0 }
                sla_max_wd: { type: integer, minimum: 0 }
                custom: { $ref: '#/components/schemas/CustomValues' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Saved (light revision + 1).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/migration-preview:
    post:
      tags: [workflow]
      operationId: previewSiteMigration
      summary: Preview migrating sites to this version (tasks kept, added, retired; date changes; blockers)
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteSelection' }
      responses:
        '200':
          description: Preview with a hash to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workflow/versions/{version}/migrations:
    post:
      tags: [workflow]
      operationId: migrateSites
      summary: Migrate the previewed sites (job, one transaction per site)
      x-step-up: true
      x-db-path: admin_migrate_site_workflow (app_actor_is_admin('workflow.migrate'))
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_hash, selection, reason]
              properties:
                preview_hash: { type: string }
                selection: { $ref: '#/components/schemas/SiteSelection' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflow/site-migrations:
    get:
      tags: [workflow]
      operationId: listSiteMigrations
      summary: Site migration log
      parameters:
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: to_version, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Migrations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteMigration' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workflow/site-migrations/{migration_id}/revert:
    post:
      tags: [workflow]
      operationId: revertSiteMigration
      summary: Move a site back to its previous version (only if nothing was approved since)
      x-step-up: true
      x-db-path: admin_migrate_site_workflow (revert)
      parameters:
        - name: migration_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMigration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ audit
  /audit-log:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Read the Audit Log (append-only; no write endpoint exists)
      description: Needs `view_audit`. Rows are limited to the reader's regions; rows without a region need all regions. Newest first.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: bulk_action_id, in: query, schema: { type: string, format: uuid } }
        - { name: admin_override, in: query, schema: { type: boolean } }
        - { name: privileged, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-log/exports:
    post:
      tags: [audit]
      operationId: exportAuditLog
      summary: Export the filtered Audit Log as CSV (job; the export is itself audited)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                actor_id: { type: string, format: uuid }
                site_id: { type: string, format: uuid }
                entity_type: { type: string }
                action: { type: string }
                q: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ settings (read)
  /settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Settings visible to the caller (admin sees all keys)
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/sla-rules:
    get:
      tags: [settings]
      operationId: listSlaRules
      summary: SLA rules with version history
      parameters:
        - { name: task_code, in: query, schema: { type: string } }
        - { name: active_on, in: query, schema: { type: string, format: date } }
        - { name: include_history, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: SLA rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SlaRule' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/weight-sets:
    get:
      tags: [settings]
      operationId: listWeightSets
      summary: Weight sets (Project Status, health index, delay attribution)
      parameters:
        - { name: code, in: query, schema: { type: string, enum: [project_status, health_index, delay_attribution] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
      responses:
        '200':
          description: Weight sets with activities and items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WeightSet' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/calendars:
    get:
      tags: [settings]
      operationId: listCalendars
      summary: Work calendars with weekend days and holidays
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2020, maximum: 2035 } }
      responses:
        '200':
          description: Calendars.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Calendar' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/task-definitions:
    get:
      tags: [settings]
      operationId: listTaskDefinitions
      summary: Task definitions (catalogue) with placement in a workflow version
      parameters:
        - { name: workflow_version, in: query, schema: { type: integer, minimum: 1 } }
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Task definitions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskDefinition' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ system
  /jobs/{job_id}:
    get:
      tags: [system]
      operationId: getJob
      summary: Status of a background job (exports, migrations)
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /client-errors:
    post:
      tags: [system]
      operationId: reportClientError
      summary: Report a caught UI error to the System Log (rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
                route: { type: string, maxLength: 500 }
                stack: { type: string, maxLength: 8000 }
                request_id: { type: string }
      responses:
        '202': { description: 'Logged.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ================================================================ v0.2 additions
  /staff-registry:
    get:
      tags: [staff-registry]
      operationId: listStaffRegistry
      summary: List and search the staff registry (admin view, full rows)
      description: Needs `view` on `admin.staff_registry`. Personal data is returned in full to the people allowed to administer the registry. Everyone else uses the card endpoint.
      parameters:
      - name: q
        in: query
        schema: {type: string}
        description: Name EN/AR, employee ID, email or phone.
      - name: team
        in: query
        schema: {$ref: '#/components/schemas/TeamKind'}
      - name: region
        in: query
        schema: {$ref: '#/components/schemas/StaffRegion'}
      - name: status
        in: query
        schema:
          type: string
          enum: [active, inactive]
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Rows.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageEnvelope'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/StaffMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [staff-registry]
      operationId: createStaffMember
      x-step-up: true
      summary: Add a staff member (admin or delegate)
      description: Employee ID must be 4 digits and unique across all rows. Duplicate ID, email or phone gives 409 `duplicate`.
      x-db-path: people_save_staff
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffMemberInput'}
      responses:
        '201':
          description: Created.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /staff-registry/{employee_id}:
    parameters:
    - {$ref: '#/components/parameters/EmployeeIdPath'}
    get:
      tags: [staff-registry]
      operationId: getStaffMember
      summary: Hover-card payload for one person
      description: Any signed-in employee may read a card. The server applies the field-visibility settings and the per-employee hide; hidden fields come back null and are named in `hidden_fields`. An inactive person is still returned, with status
        `inactive`.
      responses:
        '200':
          description: Card.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffCard'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [staff-registry]
      operationId: updateStaffMember
      x-step-up: true
      summary: Edit a row or hide fields for this employee
      description: Changing `employee_id` is not possible here (blocked when linked to an account). `hidden_fields` hides email or phone for this one employee.
      x-db-path: people_save_staff
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffMemberPatch'}
      responses:
        '200':
          description: Updated.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /staff-registry/{employee_id}/deactivate:
    parameters:
    - {$ref: '#/components/parameters/EmployeeIdPath'}
    post:
      tags: [staff-registry]
      operationId: deactivateStaffMember
      x-step-up: true
      summary: Deactivate (never deleted)
      description: The person keeps their ID and history and cannot sign in. Refused with `last_admin` when the linked account is the last active System Admin.
      x-db-path: people_set_staff_status
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithReason'}
      responses:
        '200':
          description: Deactivated.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /staff-registry/{employee_id}/reactivate:
    parameters:
    - {$ref: '#/components/parameters/EmployeeIdPath'}
    post:
      tags: [staff-registry]
      operationId: reactivateStaffMember
      x-step-up: true
      summary: Reactivate a row
      x-db-path: people_set_staff_status
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithReason'}
      responses:
        '200':
          description: Reactivated.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /staff-registry/import:
    post:
      tags: [staff-registry]
      operationId: importStaffRegistry
      x-step-up: true
      summary: Upload the TPL-STAFF template (creates an import batch)
      description: Same rules as every template upload (ADR 0005 §4). Rows absent from the file are untouched. The valid rows can be approved while error rows stay listed. Follow with `/import-batches/{batch_id}`.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202':
          description: Batch accepted; parsing runs as a job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /staff-registry/visibility:
    get:
      tags: [staff-registry]
      operationId: getStaffVisibility
      summary: Field-visibility settings for email and phone
      responses:
        '200':
          description: Settings.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffVisibility'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [staff-registry]
      operationId: setStaffVisibility
      x-step-up: true
      summary: Set who sees email and phone
      description: 'Per field: default (everyone signed in), roles, groups or persons who see it, and who never do (deny wins). Audited with before/after values.'
      x-db-path: people_save_staff_visibility
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffVisibilityInput'}
      responses:
        '200':
          description: Saved.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffVisibility'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /absences:
    get:
      tags: [absences]
      operationId: listAbsences
      summary: Absence records
      description: An employee sees their own. A Team Lead (or anyone with `reassign` for the module and region) sees their people. A System Admin sees all.
      parameters:
      - name: user_id
        in: query
        schema: {type: string, format: uuid}
      - name: active_on
        in: query
        schema: {type: string, format: date}
      - name: from
        in: query
        schema: {type: string, format: date}
      - name: to
        in: query
        schema: {type: string, format: date}
      - name: kind
        in: query
        schema:
          type: string
          enum: [annual, sick, emergency, other]
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Absences.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageEnvelope'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/Absence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [absences]
      operationId: createAbsence
      summary: Record an absence (informational; nothing moves automatically)
      x-db-path: ops_save_absence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AbsenceInput'}
      responses:
        '201':
          description: Created.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Absence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /absences/{absence_id}:
    parameters:
    - {$ref: '#/components/parameters/AbsenceId'}
    get:
      tags: [absences]
      operationId: getAbsence
      summary: One absence
      responses:
        '200':
          description: Absence.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Absence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [absences]
      operationId: updateAbsence
      summary: Change dates, kind or note
      x-db-path: ops_save_absence
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AbsencePatch'}
      responses:
        '200':
          description: Updated.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Absence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    delete:
      tags: [absences]
      operationId: deleteAbsence
      summary: Remove an absence record (audited)
      description: Absence records are informational, so they can be removed; the audit row keeps the values.
      x-db-path: ops_delete_absence
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Removed.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /tasks/reassign:
    post:
      tags: [reassignment]
      operationId: reassignTasks
      summary: Decide for one task, one site, or all open tasks of a person (B12b)
      description: Needs the `reassign` grant for the module and region, or admin. Keeps all entered data, documents and comments. It does not reset or pause the SLA (its start date and version stay) or stage progress. The Matrix is not changed.
        If the caller takes over a level and also holds the next one, the skip rule and the self-approval rule apply (a final approval then needs step-up on the transition itself). `dry_run` previews. One request is one audit group (`bulk_action_id`).
      x-db-path: ops_reassign_tasks
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReassignRequest'}
      responses:
        '200':
          description: Per-task result. Failures use `not_eligible_holder` or `note_required`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /reassignments/eligible-users:
    get:
      tags: [reassignment]
      operationId: listEligibleReassignees
      summary: People who may receive the task(s)
      description: Eligible = would be a valid holder of the level in the Responsibility Matrix, region and module. Pass `task_id`, or `site_id` with `from_user_id`, or `from_user_id` alone.
      parameters:
      - name: task_id
        in: query
        schema: {type: string, format: uuid}
      - name: site_id
        in: query
