      x-step-up: true
      x-db-path: idm_save_profile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionProfileInput' }
      responses:
        '200':
          description: Saved (new version).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ groups
  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: Groups with member counts and matrix usage
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group
      x-step-up: true
      x-db-path: idm_group_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reason]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                member_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: getGroup
      summary: One group with members
      responses:
        '200':
          description: Group.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Rename, describe or deactivate a group
      description: Deactivating the System Admins group is refused with 409 `last_admin`.
      x-step-up: true
      x-db-path: idm_group_update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                is_active: { type: boolean }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      operationId: addGroupMembers
      summary: Add members
      description: Only a System Admin acting without delegation may change the System Admins group. Pending users are refused. When the group is the target of an active delegation (0.2.5), the caller cannot add themselves (403 `self_beneficiary`) unless they are a System Admin acting without delegation, so group membership cannot be used to grant oneself delegated rights.
      x-step-up: true
      x-db-path: idm_group_add_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, reason]
              properties:
                user_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Per-user result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{group_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [groups]
      operationId: removeGroupMember
      summary: Remove a member
      description: Refused with 409 `last_admin` when it would leave the System Admins group without an active member. Claimed tasks of the member under this group return to the group.
      x-step-up: true
      x-db-path: idm_group_remove_member
      parameters:
        - name: reason
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Reason' }
      responses:
        '204': { description: 'Removed.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ delegations
  /delegations:
    get:
      tags: [delegations]
      operationId: listDelegations
      summary: Delegations (timeline)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [active, scheduled, expired, revoked, all], default: active } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Delegations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Delegation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [delegations]
      operationId: createDelegation
      summary: Delegate full or partial admin rights (System Admin only, never by a delegate)
      x-step-up: true
      x-db-path: idm_delegate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /delegations/{delegation_id}/revoke:
    post:
      tags: [delegations]
      operationId: revokeDelegation
      summary: Revoke a delegation
      x-step-up: true
      x-db-path: idm_revoke_delegation
      parameters:
        - name: delegation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ regions
  /regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: The 7 regions (with the caller's visibility flag)
      responses:
        '200':
          description: Regions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Region' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ sites
  /sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: Sites with filters and the mini rail
      description: |
        Only sites in the caller's regions for the `sites` module are returned (RLS and decision B3: each assignment counts for its own regions and modules).
        Every item carries `streams`: the status of the site in each stream of its workflow version.
      parameters:
        - { name: q, in: query, description: 'Site code, owner ID or name.', schema: { type: string } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, description: 'Current milestone/stage code (stable code, ADR 0010).', schema: { type: string } }
        - { name: scenario, in: query, schema: { $ref: '#/components/schemas/DeliveryScenario' } }
        - { name: overall_status, in: query, schema: { $ref: '#/components/schemas/OverallStatus' } }
        - name: stream
          in: query
          description: 'Stream code (for example `CW`). Shows each site''s status within that stream only: rail, late and waiting counts, `stage_code` and `bucket` are then computed over the stages of the stream. Sites with no task in the stream are left out. 422 `validation_failed` for an unknown code.'
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,30}$' }
        - $ref: '#/components/parameters/ViewCode'
        - { name: bucket, in: query, schema: { type: string, enum: [all, mine, late, waiting_approval, closed], default: all } }
        - { name: cluster_code, in: query, schema: { type: string } }
        - { name: delivery_batch, in: query, schema: { type: string } }
        - { name: workflow_version, in: query, schema: { type: integer, minimum: 1 } }
        - name: custom
          in: query
          description: Filter on custom fields shown in filters, as `code:value` pairs (repeatable).
          style: form
          explode: true
          schema: { type: array, items: { type: string, pattern: '^[a-z0-9_]+:.+$' } }
        - { name: sort, in: query, schema: { type: string, enum: [site_code, -site_code, region, -region, stage, -stage, due_date, -due_date], default: site_code } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteListItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: getSite
      summary: Site detail with pipeline, gates and cluster progress
      responses:
        '200':
          description: Site.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sites/{site_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: listSiteTasks
      summary: Task grid of a site, grouped by stage (site's workflow version)
      parameters:
        - name: stream
          in: query
          description: Only the stages of this stream (default all). 422 `validation_failed` for a code the site's workflow version does not have.
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,30}$' }
        - $ref: '#/components/parameters/ViewCode'
      responses:
        '200':
          description: Stages with their tasks.
          content:
            application/json:
              schema:
                type: object
                required: [workflow_version, stages]
                properties:
                  workflow_version: { type: integer }
                  streams: { type: array, items: { $ref: '#/components/schemas/Stream' }, description: 'The streams of the site''s workflow version, in order.' }
                  views: { type: array, items: { $ref: '#/components/schemas/View' }, description: '0.4.7. The views of the site''s workflow version, in order, with the stages and tasks in force.' }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [code, name_en, tasks]
                      properties:
                        code: { type: string }
                        stream_code: { type: [string, 'null'] }
                        name_en: { type: string }
                        name_ar: { type: [string, 'null'] }
                        tasks: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ tasks
  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Task detail (drawer)
      responses:
        '200':
          description: Task.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateTaskEntry
      summary: Save entry data (dates, values, custom fields) at level 1
      description: Allowed in states `open` and `entry` to an eligible entry holder. Read-only and hidden fields are refused with `field_read_only`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskEntryPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/start:
    post:
      tags: [tasks]
      operationId: startTask
      summary: Move a Pending task to Ongoing with a start date
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actual_start: { type: string, format: date, description: 'Default today (TE MOS date for D6).' }
                via: { $ref: '#/components/schemas/WorkflowVia' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/submit:
    post:
      tags: [tasks]
      operationId: submitTask
      summary: Submit for review (level 1 done)
      description: |
        Refused with 422 `mandatory_slots_missing` or `mandatory_fields_missing` (listing them). Freezes `levels_required`.
        CW PAC (B13) and CW FAC (B15) are refused with 422 `open_snags` (with `count` and `scope: CW`) while any open CW snag exists on the site; TE PAC (D16) and TE FAC (D18) likewise for open TE snags (owner decision 2026-10-29). The same check applies to review and approve.
        Self-skip may carry the task further (`skipped_levels` in the result). If the chain reaches final approval, step-up is required.
      x-step-up: conditional (only when self-skip reaches final approval, or levels_required = 1)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
                via: { $ref: '#/components/schemas/WorkflowVia' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/review:
    post:
      tags: [tasks]
      operationId: reviewTask
      summary: Pass a review level (levels 2..N-1)
      x-step-up: conditional (only when self-skip reaches final approval)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
                via: { $ref: '#/components/schemas/WorkflowVia' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/approve:
    post:
      tags: [tasks]
      operationId: approveTask
      summary: Final approval (level N)
      description: Refused with 422 `open_snags` (with `count` and `scope`) for CW PAC (B13) and CW FAC (B15) while an open CW snag exists on the site, and for TE PAC (D16) and TE FAC (D18) while an open TE snag exists; snags of the other stream do not block. Under `all_members` the result shows the votes still missing.
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
                via: { $ref: '#/components/schemas/WorkflowVia' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/reject:
    post:
      tags: [tasks]
      operationId: rejectTask
      summary: Return the task one level back, with a note
      description: Allowed at level >= 2. `note` is mandatory (422 `note_required`). Target level follows ADR 0004 §6.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Claim a group-assigned level (any one member)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/release:
    post:
      tags: [tasks]
      operationId: releaseTask
      summary: Release my claim back to the group
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/history:
    get:
      tags: [tasks]
      operationId: getTaskHistory
      summary: Workflow steps (timeline), including auto-skips and overrides
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Steps, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{task_id}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskComments
      summary: Comment thread
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      operationId: addTaskComment
      summary: Add a comment (with optional mentions)
      description: 0.4.10 (X3). Mentions come from `mention_user_ids` and from `@1234` employee-ID tokens in the body. Only a person who can read the task is stored as mentioned and notified; anyone else is dropped silently, so the answer never shows whether a person can see the task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                mention_user_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/slots:
    get:
      tags: [tasks]
      operationId: listTaskSlots
      summary: The task's document slots
      description: Same items as `TaskDetail.slots`, without loading the whole task (for example the per-task template upload and the slot pickers).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Slots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      operationId: addTaskSlot
      summary: Add a slot to the task (one more candidate, or a conditional document that applies)
      description: |
        For a document type placed on the task: a document that is `conditional` and whose rule the PMIS cannot evaluate yet (declare that it applies), or one more slot of the same type for another candidate
        (`candidate_label`, for example each SAR candidate of A1). Allowed to Data Entry (L1) while the task is pending or ongoing. 409 `duplicate` when a slot of that type and label exists already.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_code]
              additionalProperties: false
              properties:
                doc_code: { type: string }
                candidate_label: { type: [string, 'null'], maxLength: 100 }
      responses:
        '201':
          description: The new slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/slots/{slot_id}/files:
    post:
      tags: [tasks]
      operationId: uploadSlotFile
      summary: Upload a file into a document slot (new version if the slot has files)
      description: |
        Streams through the API (ADR 0008). Checks, in order: the caller holds Data Entry (L1) of the task (or is a System Admin when nobody holds it) and the task is pending or ongoing;
        size against the slot's document-type version (413 `file_too_large`); the content type by magic bytes, never by the name or the client's content type, against the allowed formats
        (422 `file_rejected` with `reason` = `format_not_allowed`, `executable`, `archive`, `macro`, `script`, `html`, `empty`, `unknown_type`); the number of files (422 `file_rejected`, `reason` = `too_many_files`).
        Files are kept under a random key; the name the user typed is metadata only. A photo's EXIF capture date is read (`capture_date`); a photo without one is accepted with `unknown_capture_date`.
        The slot becomes `uploaded` once it has `min_files` current files. With `replaces_file_group_id` the new file is the next version of that file and the old one stays downloadable.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: slot_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                replaces_file_group_id: { type: string, format: uuid, description: 'Set to upload a new version of an existing file.' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/slots/{slot_id}/files/{file_id}:
    delete:
      tags: [tasks]
      operationId: withdrawSlotFile
      summary: Withdraw a file from a slot before the task is submitted
      description: The file is not deleted, it leaves the current set (`is_current` false, `superseded_by` null) and stays on record and in the audit log. Allowed to Data Entry (L1) while the task is pending or ongoing. The slot goes back to `missing` when it falls below `min_files`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: slot_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: file_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The slot after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks/{task_id}/slots/suggest:
    post:
      tags: [tasks]
      operationId: suggestSlotTypes
      summary: Suggest the document slot of each file from its name (multi-file upload)
      description: The suggestion is confirmed by the user in a dropdown; nothing is stored. Matches the document code and the words of the document name against the file name, best first.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_names]
              properties:
                file_names: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 255 } }
      responses:
        '200':
          description: One entry per file name, in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [file_name, suggestions]
                      properties:
                        file_name: { type: string }
                        suggestions:
                          type: array
                          description: Best first; empty when nothing matches.
                          items:
                            type: object
                            required: [slot_id, doc_code, score]
                            properties:
                              slot_id: { type: string, format: uuid }
                              doc_code: { type: string }
                              score: { type: number, minimum: 0, maximum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/overrides:
    post:
      tags: [tasks]
      operationId: createOverride
      summary: Admin override on a task (reason and step-up)
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '201':
          description: Applied.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /overrides/{override_id}/revert:
    post:
      tags: [tasks]
      operationId: revertOverride
      summary: Revert an admin override
      description: 409 `override_not_revertible` if the task has moved on since.
      x-step-up: true
      parameters:
        - name: override_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /files/{file_id}/download:
    get:
      tags: [tasks]
      operationId: downloadFile
      summary: Download a file (audited before streaming)
      description: |
        Needs `download_documents` on the Documents screen in the file's region (404 outside the caller's regions). The audit row is written first, then the object is streamed through the API (no public bucket, no presigned URL).
        `Content-Disposition: attachment` with the computed name `SITE_TASK_DOC_APPROVEDDATE.ext` (before approval `DRAFT` and the upload date replace the approved date; a superseded version adds `_v<n>`).
        `Content-Type` is the type sniffed from the content when it was stored, with `X-Content-Type-Options: nosniff`. The id may also be the blank form of a document type.
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The file, named `SITE_TASK_DOC_APPROVEDDATE.ext` (ADR 0008 §3).
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Files of the document slots (the site Documents tab, and the cross-site list)
      description: |
        Region and module scope apply as everywhere (a file outside the caller's regions is not listed). Needs `view` on the Documents screen. Newest first. Current files only unless `include_superseded` is true
        (version history). `file_group_id` lists every version of one file.
      parameters:
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, schema: { type: string }, description: 'Milestone code of the stage, for example MS2.' }
        - { name: task_code, in: query, schema: { type: string } }
        - name: doc_code
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [scanned_document, photo, email, report, excel_template, generated_form] } }
        - { name: slot_status, in: query, schema: { type: string, enum: [uploaded, in_review, approved, rejected, missing] } }
        - { name: uploaded_by, in: query, schema: { type: string, format: uuid } }
        - { name: uploaded_from, in: query, schema: { type: string, format: date } }
        - { name: uploaded_to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string }, description: 'Site code, document name or the name the file was uploaded with.' }
        - { name: include_superseded, in: query, schema: { type: boolean, default: false } }
        - { name: file_group_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Files.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DocumentListItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /exports/zip:
    post:
      tags: [documents]
      operationId: startZipExport
      summary: Bulk zip of documents, as a background job
      description: |
        Scope: one `site_id`, one `stage_code` (across the sites in scope, or one site), one `doc_code` across sites, or an explicit `file_ids` list; combined with `slot_status`.
        The caller needs `download_documents` and only files in the caller's regions are packed (the job runs with the requester's verified context). Layout `SITE/STAGE/NAME`, with the computed names and a `manifest.csv`
        (name, original name, SHA-256, version, slot status). Superseded versions are packed only with `include_superseded`. Starting is audited with the scope and the number of files; each download of the zip is audited again.
        422 `validation_failed` when the scope is empty, or no file matches. The file is kept 7 days, then 410 `export_expired`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZipExportRequest' }
      responses:
        '202':
          description: Job started (`kind` = `zip_export`; the job id is the export id). On `done`, `result` carries `export_id`, `file_count` and `size_bytes`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /exports/zip/{export_id}/download:
    get:
      tags: [documents]
      operationId: downloadZipExport
      summary: Download a finished zip (audited before streaming)
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zip, `GSDN_Documents_<date>.zip`. Only the person who started it (or a System Admin) can download it.
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  # ------------------------------------------------------------------ approvals
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approvals inbox (items where I can act at review or approve level)
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [all, review, approve], default: all } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: group_only, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inbox.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ApprovalItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/bulk:
    post:
      tags: [approvals]
      operationId: bulkApprovals
      summary: Pass or approve many tasks at once (one step-up)
      description: Each item is processed in its own transaction; the result lists done, skipped (with reason) and failed items. Rejection is never bulk because each needs its own note.
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, items]
              properties:
                action: { type: string, enum: [pass, approve], description: 'pass = review level, approve = final level.' }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/VersionedRef' }
                note: { type: string, maxLength: 2000 }
                via: { description: 'Default bulk; a board drag of several cards sends drag.', $ref: '#/components/schemas/WorkflowVia' }
      responses:
        '200':
          description: Per-item result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ matrix
  /matrix:
    get:
      tags: [matrix]
      operationId: getMatrix
      summary: Responsibility Matrix for a workflow version, with self-skip preview
      description: |
        One row per workflow stage (`kind` stage), one per register and one for Dismantle (decision B11; `kind` register or
        dismantle, `code` is the register key). Every row has exactly two levels (owner decision 2026-11-01): L1 Data Entry
        (cell level 1) and L2 Data Reviewer & Approver (cell level 3); `approval_levels` is always 2 and `used_levels` is always
        [1, 3]. Cell level 2 is a leftover of the old 3-level model, kept only for tasks and records already submitted on a
        3-level snapshot (`used = false`). A cell holds users, roles and groups, shown with names and employee IDs, and a rule (`any_one` or
        `all_members`). Without `region_id` the answer has the cells that apply to every region; with it, also the cells specific
        to that region (`region_ids_with_cells` lists the regions that have their own cells). Register and Dismantle rows are the same
        for every workflow version. Cells and counts are limited to the regions the caller can see (B3).
        `preview` shows in advance where one person holds consecutive levels, so the level is skipped (B6), and where that reaches
        the last level, which is a self-approval that needs step-up (B5). Needs view on `admin.matrix`, or the `matrix.edit` right.
        The `ETag` is the matrix revision, to send back in `If-Match` on `PATCH /matrix`.
      parameters:
        - { name: workflow_version, in: query, description: 'Default = current published version.', schema: { type: integer, minimum: 1 } }
        - { name: region_id, in: query, description: 'Also return the cells specific to this region.', schema: { $ref: '#/components/schemas/RegionId' } }
      responses:
        '200':
          description: Matrix.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      tags: [matrix]
      operationId: updateMatrix
      summary: Save changed cells and stage level counts in one step
      description: |
        All changes in one transaction, with step-up, `If-Match` (the matrix revision) and a reason. Needs System Admin or a
        delegation with `matrix.edit`; a cell without `region_id` and a level count reach every region and need the right for all
        regions, a cell with `region_id` needs it for that region. `stage_code` is a stage code of the workflow version or the
        code of a register or Dismantle row. A used level with no holder is refused (422 `empty_cell`, `Problem.cells` lists the
        cells). A role with `can_hold_matrix_levels = false`, an inactive user or group, and `all_members` on the Entry level are
        refused (422 `validation_failed` with the field path). Nothing is written when nothing changed. Every changed cell and
        level count is audited with before and after values and the reason.
        The change applies to new transitions only (MX-04). Who holds a level applies to tasks created later and to tasks not yet
        submitted; a task that was already submitted keeps the level path it was frozen on at its first submission, also after a
        rejection (decision B7). The number of levels is fixed at 2: `stage_levels` accepts only 2 (anything else is 422).
        The answer shows both counts per stage in `task_counts`.
      x-step-up: true
      x-db-path: matrix_save
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /matrix/cells/{cell_id}:
    delete:
      tags: [matrix]
      operationId: deleteMatrixCell
      summary: Delete a region or task override cell of the Responsibility Matrix (0.6.1, owner answer Q86)
      description: |
        Removes one override cell (a cell with a `region_id` or a `task_code`) and its holders; the row default of that level then applies again.
        A row default cannot be deleted (422 `validation_failed`, path `/cell_id`, code `row_default`): change its holders with `PATCH /matrix`. Needs System Admin
        or a delegation with `matrix.edit` (for the cell's region, or for all regions when the override has no region), step-up, a reason and `If-Match` (the matrix
        revision). The reason is a query parameter because DELETE has no body here. Audited as `matrix_cell_delete` with the cell's before values and the reason.
        Answers with the whole matrix, as `PATCH /matrix` does, and the new `ETag`.
      x-step-up: true
      x-db-path: matrix_delete_cell
      parameters:
        - { name: cell_id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The id of a `MatrixCell` that has a region or a task.' }
        - { name: reason, in: query, required: true, schema: { $ref: '#/components/schemas/Reason' } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deleted.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ workflow (ADR 0010)
  /workflow/versions:
    get:
      tags: [workflow]
      operationId: listWorkflowVersions
      summary: Workflow definition versions with site counts
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkflowVersionSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [workflow]
      operationId: createWorkflowDraft
      summary: Create a draft (copy of a published version) for structural changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_version, reason]
              properties:
                parent_version: { type: integer, minimum: 1 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflow/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/WorkflowVersionNo'
    get:
      tags: [workflow]
      operationId: getWorkflowVersion
      summary: Full definition of a version (milestones, gates, task placements)
      responses:
        '200':
          description: Version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [workflow]
      operationId: replaceWorkflowDraft
      summary: Replace the structure of a draft (add, remove, reorder milestones and gates; move tasks)
      description: Only for `status = draft`. Codes of existing nodes are kept; new nodes get new codes that are never reused.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowStructure' }
      responses:
        '200':
          description: Saved, with validation warnings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/publish:
    post:
      tags: [workflow]
      operationId: publishWorkflowVersion
      summary: Publish a draft (structural change); new sites use it
      description: |
        Runs the ADR 0010 §2 validation. Returns 422 `workflow_invalid` with the list of problems.
        Answers 409 `freeze_active` during the structural freeze (`GET /settings/structural-freeze`, B9).
        During the parallel run, a change that affects Master export columns needs `confirm_master_impact` equal to the
        phrase in `master_impact.confirmation_phrase` of the validation result.
        Required typed confirmation (0.2.5, per CLAUDE.md), `confirm_text` must equal `v<version>` (for example `v4`), else 422 `confirmation_mismatch`.
      x-step-up: true
      x-db-path: admin_publish_workflow_version (app_actor_is_admin('workflow.publish'))
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirm_text]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
                confirm_text: { $ref: '#/components/schemas/ConfirmText' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/milestones/{code}:
    patch:
      tags: [workflow]
      operationId: updateMilestoneLight
      summary: Light change to a milestone (names, custom fields, counts in Project Status); applies at once
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/NodeCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                counts_in_project_status: { type: boolean }
                custom: { $ref: '#/components/schemas/CustomValues' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Saved (light revision + 1).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowMilestone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/gates/{code}:
    patch:
      tags: [workflow]
      operationId: updateGateLight
      summary: Light change to a gate (names, conditions, SLA, custom fields); applies to gates not yet open
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/NodeCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                conditions: { type: array, items: { $ref: '#/components/schemas/GateCondition' } }
                sla_min_wd: { type: integer, minimum: 0 }
                sla_max_wd: { type: integer, minimum: 0 }
                custom: { $ref: '#/components/schemas/CustomValues' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Saved (light revision + 1).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/migration-preview:
    post:
      tags: [workflow]
      operationId: previewSiteMigration
      summary: Preview migrating sites to this version (tasks kept, added, retired; date changes; blockers)
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteSelection' }
      responses:
        '200':
          description: Preview with a hash to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workflow/versions/{version}/migrations:
    post:
      tags: [workflow]
      operationId: migrateSites
      summary: Migrate the previewed sites (job, one transaction per site)
      x-step-up: true
      x-db-path: admin_migrate_site_workflow (app_actor_is_admin('workflow.migrate'))
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_hash, selection, reason]
              properties:
                preview_hash: { type: string }
                selection: { $ref: '#/components/schemas/SiteSelection' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflow/site-migrations:
    get:
      tags: [workflow]
      operationId: listSiteMigrations
      summary: Site migration log
      parameters:
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: to_version, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Migrations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteMigration' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workflow/site-migrations/{migration_id}/revert:
    post:
      tags: [workflow]
      operationId: revertSiteMigration
      summary: Move a site back to its previous version (only if nothing was approved since)
      x-step-up: true
      x-db-path: admin_migrate_site_workflow (revert)
      parameters:
        - name: migration_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMigration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ audit
  /audit-log:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Read the Audit Log (append-only; no write endpoint exists)
      description: Needs `view_audit`. Rows are limited to the reader's regions; rows without a region need all regions. Newest first.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: bulk_action_id, in: query, schema: { type: string, format: uuid } }
        - { name: admin_override, in: query, schema: { type: boolean } }
        - { name: privileged, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-log/exports:
    post:
      tags: [audit]
      operationId: exportAuditLog
      summary: Export the filtered Audit Log as CSV (job; the export is itself audited)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                actor_id: { type: string, format: uuid }
                site_id: { type: string, format: uuid }
                entity_type: { type: string }
                action: { type: string }
                q: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-log/integrity:
    get:
      tags: [audit]
      operationId: getAuditLogIntegrity
      summary: Verify the hash chain of the Audit Log (System Admins only)
      description: |
        The Audit Log is an append-only hash chain: each row stores the hash of the previous row, and the database refuses update and delete. This recomputes the chain and reports the row count, the sequence range, the head hash and every break. Without `from_seq` and `to_seq` the whole chain is checked. Needs a System Admin (a delegate is not enough). The check is itself audited. A break found by the scheduled check raises the mandatory alert `audit_integrity_failure`.
      parameters:
        - { name: from_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: to_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogIntegrity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ security log and sessions
  /security-log:
    get:
      tags: [security]
      operationId: listSecurityLog
      summary: Sign-in and security log (append-only; no write endpoint exists)
      description: |
        Needs a System Admin or the grant `view_security_log`. Newest first. Reading is itself audited (Audit Log action `security_log.read`, with the filters used). Separate from the Audit Log and the System Log; kept for `security_log_days` (`GET /settings/log-retention`).
        An identifier typed in the one-box sign-in that matches no registry row is never stored raw (see `identifier_masked`). `ip` is shown to System Admins only.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: event, in: query, description: 'One or more events, comma separated.', style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/SecurityOutcome' } }
        - { name: q, in: query, description: 'Free text over name, employee ID, `identifier_masked` and `request_id`.', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SecurityLogEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-log/exports:
    post:
      tags: [security]
      operationId: exportSecurityLog
      summary: Export the filtered security log as CSV (job; the export is itself audited)
      description: Goes through the existing export service (job kind `security_export`). Needs the `export` grant and `view_security_log` (or System Admin). `ip` follows the same rule as the list.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                event: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
                outcome: { $ref: '#/components/schemas/SecurityOutcome' }
                q: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-log/integrity:
    get:
      tags: [security]
      operationId: getSecurityLogIntegrity
      summary: Verify the hash chain of the security log (System Admins only)
      description: Same contract as `GET /audit-log/integrity` for the security log, which is also an append-only hash chain. The check is audited. A break raises the mandatory alert `audit_integrity_failure`.
      parameters:
        - { name: from_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: to_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogIntegrity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sessions/active:
    get:
      tags: [security]
      operationId: listActiveSessions
      summary: Who is online now
      description: |
        Needs a System Admin or the grant `manage_users`. The screen polls this with `X-PMIS-Live: 1`; polling never counts as user activity, so it cannot keep a session alive. `status` is `online` when the person had real activity inside the presence window (server setting, default 5 minutes), otherwise `idle`. The raw `ip` is returned to System Admins only; for everyone else it is null.
      parameters:
        - $ref: '#/components/parameters/LivePoll'
        - { name: status, in: query, schema: { type: string, enum: [online, idle] } }
        - { name: q, in: query, description: 'Search name or employee ID.', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ActiveSession' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions/{session_id}/revoke:
    post:
      tags: [security]
      operationId: revokeSession
      summary: End one session
      description: Needs a System Admin or the grant `manage_users`. The person's next request answers 401. Security log `session_revoked_by_admin`; audited with the reason. The caller's own session is refused (use `POST /auth/logout`).
      x-step-up: true
      x-db-path: idm_revoke_session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevokeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/sessions/revoke:
    post:
      tags: [security]
      operationId: revokeUserSessions
      summary: End all sessions of a user
      description: Same rules as `POST /sessions/{session_id}/revoke`, for every session of the user. Deactivating or deleting a user does this automatically. A caller's own sessions are not touched.
      x-step-up: true
      x-db-path: idm_revoke_session
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevokeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ master export
  /exports/master:
    post:
      tags: [exports]
      operationId: startMasterExport
      summary: Start a full, partial or current-view export in the Site Master layout (job; needs the `export` grant)
      description: |
        All sheets and the 187 columns of `GSDN_Site_Master.xlsx`, plus custom fields that carry a Master export column.
        Content is limited to the caller's regions and modules (B3); a System Admin gets everything. The same export feeds
        the parallel-run comparison. Starting the export is audited.

        **Full, partial or current view (0.2.3).** No `parts` (or an empty array) exports the whole project. `parts` picks parts
        from `GET /exports/parts`. `view` exports exactly what a list screen shows (its filters, columns and sort). `parts` and
        `view` together are 422 `validation_failed`. Each part keeps the Master sheet and column layout. The `export` grant is
        needed for every requested part; otherwise 403 and `errors[]` lists the denied parts.

        **Field-level rules.** The export applies the same field-level rules as the read paths: custom fields and restricted
        staff fields (phone and email visibility) the caller cannot read are omitted or nulled. System Admin is the only exception.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MasterExportRequest' }
      responses:
        '202':
          description: Job started (`kind` = `master_export`). On `done` the job `result` carries `export_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [exports]
      operationId: listMasterExports
      summary: The caller's recent Master exports (within the retention window)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Exports, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MasterExport' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exports/parts:
    get:
      tags: [exports]
      operationId: listExportParts
      summary: The parts the caller may export (the choices of the export dialog)
      description: Only parts for which the caller holds the `export` grant, in their regions (B3). A System Admin sees all.
      parameters:
        - { name: include_columns, in: query, description: 'Add `columns` (the stable column codes of each part) to every item. Columns the caller cannot read (field-level rules) are left out.', schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Parts in dialog order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ExportPart' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exports/master/{export_id}/download:
    get:
      tags: [exports]
      operationId: downloadMasterExport
      summary: Download a finished export (audited before streaming)
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The workbook, `GSDN_Site_Master_<date>.xlsx` for a full export, otherwise `GSDN_<part>_<date>.xlsx`. Streamed by the API, as `/files/{file_id}/download`.
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="..."' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  # ------------------------------------------------------------------ settings (read)
  /settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Settings visible to the caller (admin sees all keys)
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/sla-rules:
    get:
      tags: [settings]
      operationId: listSlaRules
      summary: SLA rules with version history
      parameters:
        - { name: task_code, in: query, schema: { type: string } }
        - { name: active_on, in: query, schema: { type: string, format: date } }
        - { name: include_history, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: SLA rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SlaRule' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/sla-rule-sets:
    get:
      tags: [settings]
      operationId: listSlaRuleSets
      summary: SLA rule set versions with who, when and why (newest first)
      description: |
        One item per version of the whole SLA rule set (a draft, the version in force, earlier and future-dated versions). The per-task rows stay in `GET /settings/sla-rules`.
        Needs `view` on `admin.settings` (System Admin or a delegate holding `settings.edit`).
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SlaRuleSetSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [settings]
      operationId: createSlaRuleSetDraft
      summary: Create the draft rule set (a copy of the version in force)
      description: |
        Needs the `settings` permission or a delegation of it (`settings.edit`). Only one draft exists at a time, a second one is 409 `duplicate`.
        A light change (B9): allowed during the structural freeze.
      x-db-path: admin_save_sla_rule_set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/sla-rule-sets/{set_id}:
    parameters:
      - $ref: '#/components/parameters/SlaRuleSetId'
    get:
      tags: [settings]
      operationId: getSlaRuleSet
      summary: One version with its rules (per task, with overrides)
      responses:
        '200':
          description: Rule set.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [settings]
      operationId: updateSlaRuleSetDraft
      summary: Change rules in the draft
      description: |
        Only for `status = draft` (else 409 `invalid_transition`). Needs `weights.edit`. `If-Match` is the ETag of the draft (a hash of its activities). A light change (B9): allowed during the structural freeze.
        Each item of `rules` replaces the whole rule of its `task_code` (the base min and max, the start event, the calendar and all its overrides). Tasks not listed keep the rule copied from the version in force.
        **Validation (422 `validation_failed`, closed schema, `errors[].path` is a JSON pointer into the body):** `min_working_days` must not exceed `max_working_days`, in the base rule and in every override (`code` = `min_exceeds_max`, path of `max_working_days`); `unknown_task_code`; `unknown_start_event`; `unknown_calendar`; `duplicate_task_code`; `duplicate_override` (same scenario and region twice).
        Rule found for a task: most specific override wins (scenario and region, then region, then scenario, then the base rule).
        Audited with before and after values and the reason.
      x-db-path: admin_save_sla_rule_set
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaRuleSetPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/sla-rule-sets/{set_id}/preview:
    post:
      tags: [settings]
      operationId: previewSlaRuleSetPublish
      summary: Dry run, how many open tasks would change due date if the draft were applied to them
      description: |
        Changes nothing and is not audited as a change. Runs the same validation as the publish (422 with the same `errors[]`). The result assumes `apply_to_open_tasks = true`, which is the only case where open tasks change; with `false`, the publish changes none.
        Closed (approved) tasks are never counted. Needs `settings.edit`.
      parameters:
        - $ref: '#/components/parameters/SlaRuleSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effective_date]
              properties:
                effective_date: { type: string, format: date }
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPublishPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/sla-rule-sets/{set_id}/publish:
    post:
      tags: [settings]
      operationId: publishSlaRuleSet
      summary: Publish the draft as a new SLA version
      description: |
        Needs `weights.edit` and step-up. A light change (B9): allowed during the structural freeze, never 409 `freeze_active`.
        Tasks opened on or after `effective_date` use the new version. **A task keeps the SLA version in force when it opened**, so past KPIs and closed tasks never change. Only when `apply_to_open_tasks` is true are the SLA rule and due date of the open (not approved) tasks switched to the new version, by a `sla_recalculation` job that runs at once when `effective_date` is today and on that date otherwise; the start date of each task is not changed.
        A regional delegate can apply it only to open tasks in their delegated regions (403 `action_forbidden` otherwise).
        **Validation (422 `validation_failed`):** the same as the draft; `effective_date_in_past` (path `/effective_date`, earlier than today in Africa/Tripoli); `effective_date_not_after_current` (not later than the `effective_from` of the latest published version); a draft equal to the version in force is `no_changes`.
        Audited with before and after values (rules, effective date, `apply_to_open_tasks`, number of tasks affected, `bulk_action_id` of the re-pointing).
      x-step-up: true
      x-db-path: admin_publish_sla_rule_set (app_actor_is_admin('settings.edit'))
      parameters:
        - $ref: '#/components/parameters/SlaRuleSetId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaRuleSetPublish' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSetPublishResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/weight-sets:
    get:
      tags: [settings]
      operationId: listWeightSets
      summary: Weight sets (Project Status, health index, delay attribution), also the version history
      description: All versions of each set, newest first, each with who changed it, when and why (`changed_by`, `created_at`, `published_at`, `reason`). Without `status` the drafts are included.
      parameters:
        - { name: code, in: query, schema: { type: string, enum: [project_status, health_index, delay_attribution] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
      responses:
        '200':
          description: Weight sets with activities and items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WeightSet' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [settings]
      operationId: createWeightSetDraft
      summary: Create a draft weight set (a copy of the set in force, or of an older one)
      description: |
        Needs `weights.edit` (the System Admin or a delegation of it; the Settings screen reads). One open draft per `code` (a second one is 409 `duplicate`). A light change (B9): allowed during the structural freeze.
        `base_set_id` copies another set of the same `code` (for example an older set to go back to it); omitted means the set in force.
      x-db-path: admin_save_weight_set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, reason]
              properties:
                code: { $ref: '#/components/schemas/WeightSetCode' }
                base_set_id: { type: string, format: uuid }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/weight-sets/{set_id}:
    parameters:
      - $ref: '#/components/parameters/WeightSetId'
    get:
      tags: [settings]
      operationId: getWeightSet
      summary: One weight set version with its activities and items
      responses:
        '200':
          description: Weight set.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [settings]
      operationId: replaceWeightSetDraft
      summary: Replace the activities and items of a draft
      description: |
        Only for `status = draft` (else 409 `invalid_transition`). Needs `settings.edit`. A light change (B9): allowed during the structural freeze.
        Closed schema (an unknown key is 422 `validation_failed`). Each weight is 0 to 100 with at most 3 decimals; an item with weight 0 is not weighted. **A draft may be saved while its totals are not 100**, because the screen shows the live sum while the admin works; the 100% rule is enforced by the preview (reports it) and by the publish (refuses it).
        Audited with before and after values and the reason.
      x-db-path: admin_save_weight_set
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightSetInput' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/weight-sets/{set_id}/preview:
    post:
      tags: [settings]
      operationId: previewWeightSetPublish
      summary: Check the 100% rule and show the effect of the draft on current progress
      description: |
        Changes nothing. Always 200: `valid` is false and `errors[]` lists the problems (same shape and codes as the publish 422), so the screen can show them without an error response. Needs `weights.edit`.
        `progress_current_pct` is the project progress with the set in force and `progress_new_pct` with the draft. Saved weekly snapshots are not part of the preview and never change.
      parameters:
        - $ref: '#/components/parameters/WeightSetId'
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSetPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/weight-sets/{set_id}/publish:
    post:
      tags: [settings]
      operationId: publishWeightSet
      summary: Publish the draft as a new weight set version
      description: |
        Needs `settings.edit` and step-up. A light change (B9): allowed during the structural freeze, never 409 `freeze_active`.
        **100% rule, per level (422 `validation_failed`):** the activity weights of the set must total 100, and the items of every activity that has items must total 100 (tolerance 0.001). Each level that fails gives one `errors[]` entry with `code` = `weights_must_total_100`, `path` = `/activities` for the set level or `/activities/<index>/items` for the items of one activity, and the actual total in `message`.
        Other 422 codes in `errors[].code`: `effective_date_in_past` (earlier than today in Africa/Tripoli), `effective_date_not_after_current` (not later than the `effective_from` of the latest published set of the same `code`), `no_changes`.
        The set takes effect on `effective_date`; the previous set gets `effective_to` = `effective_date`. Progress is computed on every read with the set in force on the date, so there is nothing to recalculate (`recalculation_job_id` is null). **Saved weekly snapshots keep the values computed at the time** and a report can be re-run with an older set (`GET /project-status?weight_set_id=`).
        Audited with before and after values, the effective date and the reason.
      x-step-up: true
      x-db-path: admin_publish_weight_set (app_actor_is_admin('weights.edit'))
      parameters:
        - $ref: '#/components/parameters/WeightSetId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightSetPublish' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSetPublishResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/calendars:
    get:
      tags: [settings]
      operationId: listCalendars
      summary: Work calendars with weekend days and holidays
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2020, maximum: 2035 } }
      responses:
        '200':
          description: Calendars.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Calendar' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/task-definitions:
    get:
      tags: [settings]
      operationId: listTaskDefinitions
      summary: Task definitions (catalogue) with placement in a workflow version
      parameters:
        - { name: workflow_version, in: query, schema: { type: integer, minimum: 1 } }
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Task definitions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskDefinition' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ system
  /jobs/{job_id}:
    get:
      tags: [system]
      operationId: getJob
      summary: Status of a background job (exports, migrations)
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /client-errors:
    post:
      tags: [system]
      operationId: reportClientError
      summary: Report a caught UI error to the System Log (rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
