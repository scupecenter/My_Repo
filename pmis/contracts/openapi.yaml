        status: { type: string, enum: [online, idle] }
        last_activity_at: { type: string, format: date-time }
        current_screen: { type: [string, 'null'], description: 'App route of the screen the person is on, reported by real activity.' }
        signed_in_at: { type: string, format: date-time }
        client_type: { type: string, enum: [web, mobile, break_glass] }
        ip: { type: [string, 'null'], description: 'Raw IP, System Admins only; null for a `manage_users` holder who is not a System Admin.' }
        is_current: { type: boolean, description: 'The caller''s own session.' }
    SessionRevokeResult:
      type: object
