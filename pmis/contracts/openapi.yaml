      - name: to
        in: query
        schema: {type: string, format: date}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Snapshots.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageEnvelope'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/ProjectStatusSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pmis_session
      description: Server-side session created by the Entra OIDC flow (ADR 0002).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on unsafe methods; value from `GET /auth/session`. Ignored on GET.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Reserved for the future mobile app (Entra access token for the PMIS API scope). Not enabled in v0.1.

  headers:
    ETag:
      description: Version of the resource, to send back as `If-Match`.
      schema: { type: string, examples: ['"7"'] }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `page.next_cursor`.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag last read.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 100 }
    LivePoll:
      name: X-PMIS-Live
      in: header
      description: 'Sent as `1` by timer-driven polling (notification bell, online-now list). The server does not count the request as user activity: it neither extends the idle timeout nor updates `last_activity_at`. Only real user activity does.'
      schema: { type: string, enum: ['1'] }
    SlaRuleSetId:
      name: set_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WeightSetId:
      name: set_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViewCode:
      name: view
      in: query
      description: '0.4.7. View code (for example `CW`, `TE`, `OM`). Shows only the tasks of that view: on `GET /sites`, rail, late and waiting counts, `stage_code` and `bucket` are computed over the view''s tasks and sites with no task in the view are left out; on the task grid, only those tasks and their stages. Combined with `stream`, the tasks in both. 422 `validation_failed` for an unknown code (for the grid: a code the site''s workflow version does not have). Region and module scope are unchanged.'
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,30}$' }
    SiteId:
      name: site_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowVersionNo:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    NodeCode:
      name: code
      in: path
      required: true
      description: Stable milestone or gate code (for example MS4, G5).
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,30}$' }

    EmployeeIdPath:
      name: employee_id
      in: path
      required: true
      description: Four-digit employee ID.
      schema: {$ref: '#/components/schemas/EmployeeId'}
    AbsenceId:
      name: absence_id
      in: path
      required: true
      description: Absence record.
      schema: {type: string, format: uuid}
    HolidayId:
      name: holiday_id
      in: path
      required: true
      description: Holiday.
      schema: {type: string, format: uuid}
    RegisterKeyPath:
      name: register_key
      in: path
      required: true
      description: Register key.
      schema: {$ref: '#/components/schemas/RegisterKey'}
    RegisterRecordId:
      name: record_id
      in: path
      required: true
      description: Register record.
      schema: {type: string, format: uuid}
    DocTypeId:
      name: doc_type_id
      in: path
      required: true
      description: Document Library definition.
      schema: {type: string, format: uuid}
    TemplateId:
      name: template_id
      in: path
      required: true
      description: Template ID such as TPL-SITE.
      schema: {type: string, pattern: '^TPL-[A-Z0-9_-]{2,40}$'}
    BatchId:
      name: batch_id
      in: path
      required: true
      description: Import batch.
      schema: {type: string, format: uuid}
    FormId:
      name: form_id
      in: path
      required: true
      description: Generated form.
      schema: {type: string, format: uuid}
    FormKindPath:
      name: form_kind
      in: path
      required: true
      description: Form kind.
      schema: {$ref: '#/components/schemas/FormKind'}
    SequenceKey:
      name: sequence_key
      in: path
      required: true
      description: Numbering sequence key.
      schema: {type: string}
    WarehouseItemId:
      name: item_id
      in: path
      required: true
      description: Warehouse item.
      schema: {type: string, format: uuid}
    MovementId:
      name: movement_id
      in: path
      required: true
      description: Stock movement.
      schema: {type: string, format: uuid}
    AsBuiltItemId:
      name: item_id
      in: path
      required: true
      description: As-Built item.
      schema: {type: string, format: uuid}
    SnagTypeId:
      name: snag_type_id
      in: path
      required: true
      description: Snag type.
      schema: {type: string, format: uuid}
    SnagId:
      name: snag_id
      in: path
      required: true
      description: Snag.
      schema: {type: string, format: uuid}
    FieldId:
      name: field_id
      in: path
      required: true
      description: Custom field definition.
      schema: {type: string, format: uuid}
    NotificationId:
      name: notification_id
      in: path
      required: true
      description: Notification.
      schema: {type: string, format: uuid}

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not signed in, session expired, `mfa_required`, or `step_up_required` (with `step_up_url`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in but not allowed (`pending_assignment`, `module_forbidden`, `action_forbidden`, `field_read_only`, `self_beneficiary`, `delegate_forbidden`, `not_eligible_holder`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or outside the caller's visibility.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (`already_claimed`, `invalid_transition`, `last_admin`, `already_assigned`, `override_not_revertible`, `migration_not_revertible`, `stale_preview`, `duplicate`, `freeze_active`, `role_in_use`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: The resource existed but has expired (`export_expired`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: '`If-Match` does not match the current version (`precondition_failed`). Re-read and retry.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`If-Match` is missing (`precondition_required`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: File larger than the slot allows (`file_too_large`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed (`validation_failed`, `note_required`, `mandatory_slots_missing`, `mandatory_fields_missing`, `open_snags`, `empty_cell`, `workflow_invalid`, `master_impact_unconfirmed`, `file_rejected`, `template_rejected`, `insufficient_stock`, `confirmation_mismatch`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited or account locked (`rate_limited`, `account_locked`).
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TaskTransition:
      description: Transition applied; the task after the transition and what happened.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TransitionResult' }

  schemas:
    UserPickerItem:
      type: object
      additionalProperties: false
      required: [id, display_name, employee_id]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        employee_id: { type: [string, 'null'], pattern: '^[0-9]{4}$', description: '0.3.1: null for a local account created without an employee ID.' }
    # ---------------------------------------------------------- common
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: ['https://pmis.aljeel.internal/problems/note_required'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, code]
            properties:
              path: { type: string, description: 'JSON pointer or "slot:<id>" / "field:<code>".' }
              code: { type: string }
              message: { type: string }
        step_up_url: { type: string, description: 'Present with `step_up_required` on an M365 session.' }
        step_up_method: { type: string, enum: [password, password_totp, m365, totp], description: '0.3.0. With `step_up_required`: `password` means call `POST /auth/local/step-up`; `password_totp` (0.5.0) means the same call with `code` (or `recovery_code`) as well.' }
        reason: { anyOf: [{ $ref: '#/components/schemas/TemplateRejectReason' }, { type: string }], description: 'Closed-list reason; for `template_rejected` a TemplateRejectReason.' }
        claimed_by: { $ref: '#/components/schemas/UserRef' }
        missing: { type: array, items: { type: string }, description: 'Missing slot or field names.' }
        cells:
          type: array
          description: '0.4.6. With `empty_cell`: the cells of levels in use that have no holder.'
          items:
            type: object
            required: [stage_code, level]
            properties:
              stage_code: { type: string }
              task_code: { type: [string, 'null'] }
              level: { type: integer, minimum: 1, maximum: 3 }
              level_kind: { type: string, enum: [entry, review, approve] }
              region_id: { type: [integer, 'null'] }
        count: { type: integer, description: '0.4.2. With `open_snags`: the number of open snags of the stream that block the task.' }
        scope: { type: string, enum: [CW, TE], description: '0.4.2. With `open_snags`: the stream of the blocking snags.' }
        existing_id: { type: string, format: uuid, description: '0.4.5. With `duplicate` on a register record: the record that exists already (GECOL and HLC have one per site; make a new version of it).' }
        order_scope: { type: [string, 'null'], description: '0.9.1. With `team_scope_mismatch`: the scope of the Procurement order.' }
        team_specialization: { type: [string, 'null'], description: '0.9.1. With `team_scope_mismatch`: the specialization of the team (null when the team has none).' }
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthenticated
        - mfa_required
        - step_up_required
        - pending_assignment
        - module_forbidden
        - action_forbidden
        - field_read_only
        - not_eligible_holder
        - self_beneficiary
        - delegate_forbidden
        - last_admin
        - not_found
        - already_claimed
        - already_assigned
        - invalid_transition
        - note_required
        - mandatory_slots_missing
        - mandatory_fields_missing
        - open_snags
        - empty_cell
        - override_not_revertible
        - workflow_invalid
        - master_impact_unconfirmed
        - stale_preview
        - migration_not_revertible
        - precondition_failed
        - precondition_required
        - file_too_large
        - file_rejected
        - template_rejected
        - duplicate
        - rate_limited
        - account_locked
        - freeze_active
        - insufficient_stock
        - item_in_use
        - role_in_use
        - export_expired
        - confirmation_mismatch
        - invalid_credentials
        - invalid_code
        - invalid_enrol_code
        - enrol_code_expired
        - password_change_required
        - weak_password
        - internal_error
        - team_scope_mismatch
        - two_factor_enforced
    PageEnvelope:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: {} }
        page: { $ref: '#/components/schemas/PageInfo' }
    PageInfo:
      type: object
      required: [limit, next_cursor]
      properties:
        limit: { type: integer }
        next_cursor: { type: [string, 'null'] }
        total: { type: integer }
    VersionedRef:
      type: object
      required: [id, version]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    BulkResult:
      type: object
      required: [bulk_action_id, done, skipped, failed]
      properties:
        bulk_action_id: { type: string, format: uuid }
        dry_run: { type: boolean }
        done:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, format: uuid }
              created_id: { type: string, format: uuid }
              skipped_levels: { type: array, items: { type: integer } }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/BulkItemIssue' }
        failed:
          type: array
          items: { $ref: '#/components/schemas/BulkItemIssue' }
    BulkItemIssue:
      type: object
      required: [ref, code]
      properties:
        ref: { type: string, description: 'The item id, or `user_id:role_id` for assign rows.' }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
    Reason:
      type: string
      minLength: 3
      maxLength: 1000
    ConfirmText:
      type: string
      maxLength: 200
      description: 'Typed confirmation of a dangerous action (0.2.5). Must equal the target code or name named by the operation; a mismatch is 422 `confirmation_mismatch`. Optional: omitted means no typed check.'
    Job:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [zip_export, audit_export, workflow_migration, import_parse, import_apply, sla_recalculation, pdf_generate, master_export, security_export, progress_recalculation] }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        result_file_id: { type: [string, 'null'], format: uuid }
        result: { type: object, additionalProperties: true }
        error: { $ref: '#/components/schemas/Problem' }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    MasterExportRequest:
      type: object
      description: |
        Optional body. An empty body or no body exports the whole project for all of the caller's regions as of now.
        `parts` and `view` are mutually exclusive (both given is 422 `validation_failed`). The export applies the same
        field-level rules as the read paths: custom fields and restricted staff fields (phone and email visibility) the
        caller cannot read are omitted or nulled; System Admin is the only exception.
      properties:
        parts:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ExportPartKey' }
          description: Parts to export. Omitted or empty = whole project (`kind` = `full`). A part the caller may not export is 403 and `errors[]` lists the denied parts.
        view:
          $ref: '#/components/schemas/ExportView'
        regions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RegionId' }
          description: Subset of the caller's regions (B3). A region outside the caller's scope is 422 `validation_failed`. Default is all of the caller's regions.
        as_of: { type: string, format: date, description: 'Data as of this date (end of day). Default is now; a future date is 422 `validation_failed`.' }
    ExportPartKey:
      type: string
      description: Part key. Every register key used by `/registers` (including `dismantle`), plus the four non-register parts.
      enum: [procurement, contractors, gecol, hlc, permits_hse, warehouse, quality, issues, risks, change_control, readiness_handover, as_built, meetings, dismantle, sites, milestones, tasks, project_status]
    ExportPart:
      type: object
      required: [key, label_en, label_ar, master_sheet]
      properties:
        key: { $ref: '#/components/schemas/ExportPartKey' }
        label_en: { type: string }
        label_ar: { type: string }
        master_sheet: { type: string, description: 'Master sheet that holds the part.' }
        columns: { type: array, items: { $ref: '#/components/schemas/ExportColumn' }, description: 'Present with `include_columns=true`. The columns a list screen may send in `ExportView.columns` (0.2.5).' }
    SitesExportColumnCode:
      type: string
      description: 'Column codes of the `sites` part that exist in every installation (0.2.6). Other columns of the part (milestone dates, scope flags) and custom fields have codes served by `GET /exports/parts?include_columns=true`.'
      enum: [site_code, site_name, region, scenario, overall_status, current_stage, progress_pct, health_index]
    TasksExportColumnCode:
      type: string
      description: 'Column codes of the `tasks` part that exist in every installation (0.2.6). Custom fields on tasks are `cf:<field code>`.'
      enum: [site_code, task_code, task_name, stage, task_state, holder, due_date, sla_status, approved_at]
    ExportColumnCode:
      description: |
        Stable, language-independent column code of a part. Codes never change when a label is renamed. A custom field is `cf:<field code>`.
        Known codes (0.2.6): `sites` has `SitesExportColumnCode`, `tasks` has `TasksExportColumnCode`. The other parts (registers, `milestones`, `project_status`, `dismantle`) and the milestone and scope columns of `sites` use the same pattern, for example `ms_site_release_actual`; their codes are listed by `GET /exports/parts?include_columns=true`, so a client never guesses them.
        A code is valid only for the part named in `ExportView.source` (the same `site_code` appears in `sites` and `tasks`).
      anyOf:
        - $ref: '#/components/schemas/SitesExportColumnCode'
        - $ref: '#/components/schemas/TasksExportColumnCode'
        - type: string
          pattern: '^(cf:)?[a-z][a-z0-9_]{1,60}$'
    ExportColumn:
      type: object
      required: [code, label_en, label_ar]
      properties:
        code: { $ref: '#/components/schemas/ExportColumnCode' }
        label_en: { type: string }
        label_ar: { type: string }
        master_column: { type: [string, 'null'], description: 'Master column letters (for example `AB`); null for a custom field without a Master export column.' }
        custom: { type: boolean, description: 'true for a custom field.' }
        default_visible: { type: boolean, description: 'Shown by default on the list screen.' }
    ExportView:
      type: object
      description: The current view of a list screen. The export has exactly these rows (filters), columns and order, in the Master layout of the source part.
      required: [source, filters, columns]
      properties:
        source: { $ref: '#/components/schemas/ExportPartKey' }
        filters: { type: object, additionalProperties: true, description: 'The list query parameters of the screen, as sent to its list endpoint. Applied together with B3 scope.' }
        columns: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/ExportColumnCode' }, description: 'Column codes of `source` from `GET /exports/parts?include_columns=true`, in screen order (the visible columns of the screen). A code that does not belong to `source` is 422 `validation_failed` with the path of the item; a column the caller cannot read is omitted.' }
        sort: { type: string, description: 'Sort expression of the list endpoint.' }
    MasterExport:
      type: object
      description: The export applied the same field-level rules as the read paths (custom fields and restricted staff fields the caller cannot read are omitted or nulled; System Admin is the only exception).
      required: [id, created_at, status, kind, regions, row_count, expires_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [full, partial, view] }
        parts: { type: array, items: { $ref: '#/components/schemas/ExportPartKey' }, description: 'Echo of the request; empty for `full` and `view`.' }
        view:
          $ref: '#/components/schemas/ExportView'
        job_id: { type: string, description: 'The `master_export` job (`GET /jobs/{job_id}`).' }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [queued, running, done, failed, expired] }
        regions: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        as_of: { type: string, format: date }
        row_count: { type: [integer, 'null'], description: 'Site rows written; null until the job is done.' }
        expires_at: { type: [string, 'null'], format: date-time, description: 'Set when done: created_at plus the setting `master_export.retention_days` (default 7).' }
    CustomValues:
      type: object
      description: Custom field values keyed by field code (ADR 0009). Hidden fields are omitted.
      additionalProperties: true
    ModuleKey:
      type: string
      description: Module or `module.screen` key. The list is served by `GET /permissions/catalogue`; values below are the seed.
      examples: [sites, sites.documents, approvals, my_work, dashboard, procurement, contractors, rf_design, acquisition, gecol, hlc, permits_hse, warehouse, quality, issues, risks, change_control, readiness, as_built, meetings, templates, reports, admin.users, admin.matrix, admin.workflow, admin.settings, audit]
    PermissionAction:
      type: string
      enum: [view, create, edit, delete, approve, export, import, download_documents, view_audit, administer, manage_users, view_security_log]
      description: '`manage_users` (module `admin.users`) opens the active-sessions list and session revoke; `view_security_log` (module `admin.security_log`) opens the security log (0.2.5).'
    PermissionLevel:
      type: string
      enum: [view, entry, review, approve, admin]
      description: |
        Ordered; each includes the lower ones. Decides matrix eligibility (ADR 0003 §2). Since 0.6.1 `entry` = L1 (Data Entry) and `approve` = L2
        (Data Reviewer & Approver); `review` (the old middle level) is folded into `approve`: it is still accepted on input and is stored and returned
        as `approve`. A person (or role or group) granted both levels is named at L1 and L2 of the same matrix row.
    DelegableRight:
      type: string
      description: Closed list for partial delegation (ADR 0003 §5).
      enum: [unlock, skip, mark_na, accept_without_document, accept_without_workflow, reopen, edit_date, reassign, users.edit, assignments.edit, groups.edit, matrix.edit, roles.edit, profiles.edit, settings.edit, documents.edit, templates.edit, fields.edit, workflow.edit, workflow.publish, workflow.migrate, warehouse.items.edit, users.two_factor]
    RegionId:
      type: integer
      minimum: 1
      maximum: 7
      description: 1 Tripoli, 2 Middle, 3 WM, 4 Zawia, 5 Benghazi, 6 GM, 7 Sebha.
    EmployeeId:
      type: string
      pattern: '^[0-9]{4}$'
    UserStatus:
      type: string
      enum: [pending_assignment, active, suspended, disabled]
    TeamKind:
      type: string
      enum: [cw, te, both, none]
    DeliveryScenario:
      type: string
      enum: [new_build, expansion, hot_swap, cold_swap, relocation]
    OverallStatus:
      type: string
      enum: [not_started, in_progress, on_hold, completed, cancelled]
    ScopeFlag:
      type: [string, 'null']
      enum: [yes, na, null]

    # ---------------------------------------------------------- auth / me
    Session:
      type: object
      required: [authenticated, csrf_token]
      properties:
        authenticated: { type: boolean }
        csrf_token: { type: string }
        user: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/UserStatus' }
        needs_employee_id: { type: boolean }
        mfa: { type: boolean, description: 'The sign-in token carried `amr` = mfa.' }
        break_glass: { type: boolean }
        auth_method: { type: string, enum: [local, m365, break_glass], description: '0.3.0. How this session signed in.' }
        must_change_password: { type: boolean, description: '0.3.0. True after a temporary password; only `/auth/*` and `GET /me` work until it is changed.' }
        two_factor:
          type: object
          description: '0.5.0. The signed-in user''s two-factor. `enabled` means a code is asked at sign-in and at step-up.'
          required: [enabled, recovery_codes_remaining]
          properties:
            enabled: { type: boolean }
            recovery_codes_remaining: { type: integer, minimum: 0, maximum: 10 }
            enforced: { type: boolean, description: '0.9.2. An admin enforces it: the user cannot turn it off. False while it is off.' }
        stepup_valid_until: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
    PendingSignIn:
      type: object
      description: '0.5.0. The password was right; no session exists yet. The cookie `pmis_2fa` (5 minutes, single use) says who is signing in.'
      required: [authenticated, next, expires_at]
      properties:
        authenticated: { type: boolean, const: false }
        next: { type: string, enum: [two_factor, enrol], description: '`two_factor`: call `POST /auth/local/2fa`. `enrol`: two-factor is on but no authenticator is set up; call the enrolment endpoints.' }
        expires_at: { type: string, format: date-time }
    TwoFactorCode:
      type: object
      description: 'Exactly one of `code` and `recovery_code`.'
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, maxLength: 16, description: 'The 6-digit code from the authenticator app. Spaces are ignored.' }
        recovery_code: { type: string, maxLength: 32, description: 'One of the 10 recovery codes (XXXXX-XXXXX). Works once.' }
    TwoFactorEnrolment:
      type: object
      required: [secret, otpauth_uri, issuer, account, algorithm, digits, period]
      properties:
        secret: { type: string, description: 'Base32 manual key. Shown only in this answer.' }
        otpauth_uri: { type: string, description: 'otpauth://totp/GSDN%20PMIS:<account>?secret=...&issuer=GSDN%20PMIS&algorithm=SHA1&digits=6&period=30, for the QR code.' }
        issuer: { type: string, const: GSDN PMIS }
        account: { type: string, description: The user's email. }
        algorithm: { type: string, const: SHA1 }
        digits: { type: integer, const: 6 }
        period: { type: integer, const: 30 }
    TwoFactorEnrolled:
      type: object
      required: [session, recovery_codes]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
          description: 'One-time codes, shown only in this answer; the server keeps a keyed hash.'
    RecoveryCodes:
      type: object
      required: [recovery_codes, recovery_codes_remaining]
      properties:
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
        recovery_codes_remaining: { type: integer }
    TwoFactorLabel:
      type: string
      enum: [off, pending_enrolment, 'on']
      description: '0.5.0. `pending_enrolment` = on, but the user has not set up an authenticator yet.'
    TwoFactorState:
      type: object
      required: [two_factor]
      properties:
        two_factor: { $ref: '#/components/schemas/TwoFactorLabel' }
        enrol_code:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$'
          description: '0.6.0. A new one-time enrolment code (8 characters, XXXX-XXXX). Present only when this call made one; shown only in this answer, never stored in clear, never cached. The admin hands it to the user in person or by phone.'
        enrol_code_expires_at: { type: string, format: date-time, description: '0.6.0. When `enrol_code` stops working (setting `two_factor.enrol_code_hours`, default 72). Present with `enrol_code`.' }
    EnrolCodeInput:
      type: string
      minLength: 1
      maxLength: 32
      description: '0.6.0. The one-time enrolment code the admin handed over. Upper or lower case, with or without the dash or spaces.'
    TwoFactorEnrolStart:
      type: object
      additionalProperties: false
      required: [enrol_code]
      properties:
        enrol_code: { $ref: '#/components/schemas/EnrolCodeInput' }
    MyTwoFactor:
      type: object
      description: '0.9.2. The signed-in user''s two-factor and what they may do themselves.'
      required: [state, enforced, recovery_codes_remaining, can_enable, can_disable]
      properties:
        state: { $ref: '#/components/schemas/TwoFactorLabel' }
        enforced: { type: boolean, description: 'An admin enforces it: the user cannot turn it off.' }
        recovery_codes_remaining: { type: integer, minimum: 0, maximum: 10 }
        can_enable: { type: boolean, description: 'A local session whose two-factor is off.' }
        can_disable: { type: boolean, description: 'A local session whose two-factor is on and not enforced.' }
    EmailChangeStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    EmailChangeRequest:
      type: object
      required: [id, old_email, new_email, status, requested_at, decided_at, decision_reason]
      properties:
        id: { type: string, format: uuid }
        old_email: { type: string, format: email }
        new_email: { type: string, format: email }
        status: { $ref: '#/components/schemas/EmailChangeStatus' }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_reason: { type: [string, 'null'] }
    EmailChangeRequestAdmin:
      allOf:
        - $ref: '#/components/schemas/EmailChangeRequest'
        - type: object
          required: [user, decided_by]
          properties:
            user: { $ref: '#/components/schemas/UserRef' }
            decided_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    MyProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: '0.9.2. Only these fields are self-editable. Any admin-owned field is 403 `field_read_only`.'
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{7,14}$', description: 'E.164; a local sign-in identifier, unique.' }
        locale: { type: string, enum: [en, ar] }
        theme: { type: string, enum: [light, dark] }
    MyProfile:
      type: object
      description: '0.9.2. The "My profile" page.'
      required: [id, display_name, email, employee_id, phone, locale, theme, status, auth_method, local_sign_in, editable_fields, admin_owned, two_factor, email_change, version]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email, description: 'The login email. Changes only through an approved email change request.' }
        employee_id: { type: [string, 'null'], pattern: '^[0-9]{4}$', description: 'Admin-owned.' }
        phone: { type: [string, 'null'] }
        locale: { type: string, enum: [en, ar] }
        theme: { type: string, enum: [light, dark] }
        status: { $ref: '#/components/schemas/UserStatus' }
        auth_method: { type: string, enum: [local, m365, break_glass] }
        local_sign_in: { type: boolean }
        editable_fields: { type: array, items: { type: string, enum: [display_name, phone, locale, theme] } }
        admin_owned:
          type: object
          required: [roles, teams, region_ids, department, manager]
          properties:
            roles: { type: array, items: { $ref: '#/components/schemas/RoleRef' } }
            teams: { type: array, items: { $ref: '#/components/schemas/TeamKind' } }
            region_ids:
              oneOf:
                - { type: string, const: all }
                - { type: array, items: { type: integer } }
            department: { oneOf: [{ $ref: '#/components/schemas/DepartmentRef' }, { type: 'null' }] }
            manager: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        two_factor: { $ref: '#/components/schemas/MyTwoFactor' }
        email_change: { oneOf: [{ $ref: '#/components/schemas/EmailChangeRequest' }, { type: 'null' }], description: 'The newest request, any status.' }
        version: { type: integer }
    Me:
      type: object
      required: [user, assignments, effective]
      properties:
        user: { $ref: '#/components/schemas/User' }
        assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        groups: { type: array, items: { $ref: '#/components/schemas/GroupRef' } }
        is_system_admin: { type: boolean }
        acting_delegations:
          type: array
          description: Delegations I hold now (banner "X on behalf of System Admin").
          items: { $ref: '#/components/schemas/Delegation' }
        effective: { $ref: '#/components/schemas/EffectivePermissions' }
    EffectivePermissions:
      type: object
      required: [grants, nav]
      properties:
        grants:
          type: array
          description: Union over active assignments (app_resolve_permissions), each with the regions where it applies.
          items:
            type: object
            required: [module_key, action, region_ids]
            properties:
              module_key: { $ref: '#/components/schemas/ModuleKey' }
              action: { $ref: '#/components/schemas/PermissionAction' }
              region_ids:
                description: Regions where the grant applies; "all" for every region.
                oneOf:
                  - type: string
                    const: all
                  - type: array
                    items: { $ref: '#/components/schemas/RegionId' }
        matrix_levels:
          type: array
          description: Highest permission level per module and region set (for matrix eligibility hints).
          items:
            type: object
            properties:
              module_key: { $ref: '#/components/schemas/ModuleKey' }
              level: { $ref: '#/components/schemas/PermissionLevel' }
              region_ids:
                oneOf:
                  - type: string
                    const: all
                  - type: array
                    items: { $ref: '#/components/schemas/RegionId' }
        nav: { type: array, items: { $ref: '#/components/schemas/ModuleKey' } }

    # ---------------------------------------------------------- users, roles, permissions
    UserRef:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        employee_id: { type: [string, 'null'] }
    User:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [email, status]
          properties:
            email: { type: string, format: email }
            status: { $ref: '#/components/schemas/UserStatus' }
            locale: { type: string, enum: [en, ar] }
            theme: { type: string, enum: [light, dark] }
            is_break_glass: { type: boolean }
            phone: { type: [string, 'null'], description: '0.3.0. E.164; a local sign-in identifier.' }
            local_sign_in: { type: boolean, description: '0.3.0. The account can sign in with a password.' }
            manager: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: '0.4.0. Direct manager.' }
            department: { oneOf: [{ $ref: '#/components/schemas/DepartmentRef' }, { type: 'null' }], description: '0.4.0.' }
            must_change_password: { type: boolean, description: '0.3.0. A temporary password is waiting to be changed.' }
            two_factor: { $ref: '#/components/schemas/TwoFactorLabel' }
            two_factor_enrol_code_expires_at: { type: [string, 'null'], format: date-time, description: '0.6.0. When the outstanding one-time enrolment code ends (a past time = expired); null when none is outstanding. Never the code itself.' }
            two_factor_enforced: { type: boolean, description: '0.9.2. "Enforced by admin": an admin turned two-factor on, or marked it. The user cannot turn it off. False while it is off.' }
            mfa_exempt: { type: boolean, description: 'Drives the "MFA exempt" badge. Detail via GET /users/{user_id}/mfa-exemption.' }
            mfa_exempt_until: { type: [string, 'null'], format: date-time }
            last_login_at: { type: [string, 'null'], format: date-time }
            deleted_at: { type: [string, 'null'], format: date-time, description: 'Soft delete (B14); null while the user is not deleted.' }
            deleted_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            delete_reason: { type: [string, 'null'], minLength: 3, maxLength: 500 }
            created_at: { type: string, format: date-time }
            version: { type: integer }
    UserAccountStatus:
      type: string
      enum: [active, deactivated, deleted]
      description: 'Badge on a person who holds a task (B14): `deactivated` = status suspended or disabled, `deleted` = soft-deleted. The task stays on the person; the Team Lead decides (B12b).'
    DeleteReason:
      type: string
      minLength: 3
      maxLength: 500
    DeletedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [deleted_at]
          properties:
            can_restore: { type: boolean, description: 'false when the employee ID or the email is now owned by another account.' }
            restore_blocked_reason: { type: [string, 'null'] }
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
            groups: { type: array, items: { $ref: '#/components/schemas/GroupRef' } }
            teams: { type: array, items: { $ref: '#/components/schemas/TeamKind' }, description: 'Union of the active rows.' }
    RoleRef:
      type: object
      required: [id, code, name_en]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
    Role:
      allOf:
        - $ref: '#/components/schemas/RoleRef'
        - type: object
          required: [is_active, can_hold_matrix_levels]
          properties:
            description_en: { type: [string, 'null'] }
            description_ar: { type: [string, 'null'] }
            default_profile_id: { type: [string, 'null'], format: uuid }
            default_region_ids:
              oneOf:
                - type: string
                  const: all
                - type: array
                  items: { $ref: '#/components/schemas/RegionId' }
            default_module_keys:
              oneOf:
                - type: string
                  const: all
                - type: array
                  items: { $ref: '#/components/schemas/ModuleKey' }
            can_hold_matrix_levels: { type: boolean }
            is_active: { type: boolean }
            active_assignment_count: { type: integer }
            version: { type: integer }
    RoleInput:
      type: object
      required: [code, name_en, can_hold_matrix_levels, reason]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,40}$' }
        name_en: { type: string, minLength: 2 }
        name_ar: { type: string }
        description_en: { type: string }
        description_ar: { type: string }
        parent_role_id: { type: 'null', deprecated: true, description: 'Deprecated in 0.4.2 (roles are flat). Accepted only as null so older clients keep working; any other value is refused with 422.' }
        default_profile_id: { type: [string, 'null'], format: uuid }
        default_region_ids:
          oneOf:
            - type: string
              const: all
            - type: array
              items: { $ref: '#/components/schemas/RegionId' }
        default_module_keys:
          oneOf:
            - type: string
              const: all
            - type: array
              items: { $ref: '#/components/schemas/ModuleKey' }
        can_hold_matrix_levels: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    RolePatch:
      type: object
      minProperties: 1
      properties:
        name_en: { type: string, minLength: 2 }
        name_ar: { type: string }
        description_en: { type: string }
        description_ar: { type: string }
        default_profile_id: { type: [string, 'null'], format: uuid }
        default_region_ids:
          oneOf:
            - type: string
              const: all
            - type: array
              items: { $ref: '#/components/schemas/RegionId' }
        default_module_keys:
          oneOf:
            - type: string
              const: all
            - type: array
              items: { $ref: '#/components/schemas/ModuleKey' }
        can_hold_matrix_levels: { type: boolean }
        is_active: { type: boolean }
    Assignment:
      type: object
      required: [id, user, role, permission_level, region_ids, module_keys, profile_ids, valid_from, version]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/RoleRef' }
        permission_level: { $ref: '#/components/schemas/PermissionLevel' }
        team: { $ref: '#/components/schemas/TeamKind' }
        region_ids:
          oneOf:
            - type: string
              const: all
            - type: array
              items: { $ref: '#/components/schemas/RegionId' }
        module_keys:
          oneOf:
            - type: string
              const: all
            - type: array
              items: { $ref: '#/components/schemas/ModuleKey' }
        profile_ids: { type: array, items: { type: string, format: uuid } }
        is_primary: { type: boolean }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        is_active_now: { type: boolean }
        assigned_by: { $ref: '#/components/schemas/UserRef' }
        assigned_at: { type: string, format: date-time }
        version: { type: integer }
    AssignmentPatch:
      type: object
      minProperties: 1
      properties:
        permission_level: { $ref: '#/components/schemas/PermissionLevel' }
        team: { $ref: '#/components/schemas/TeamKind' }
        region_ids:
          oneOf:
            - type: string
              const: all
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RegionId' }
        module_keys:
          oneOf:
            - type: string
              const: all
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/ModuleKey' }
        profile_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
    BulkAssignRequest:
      type: object
      required: [user_ids, role_ids, defaults, reason]
      description: Cartesian product of users and roles. By role = 1 role, N users. By person = N roles, 1 user. Missing defaults come from the role definition.
      properties:
        user_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
        role_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        defaults:
          allOf:
            - $ref: '#/components/schemas/AssignmentPatch'
            - type: object
              required: [permission_level]
        reason: { $ref: '#/components/schemas/Reason' }
        dry_run: { type: boolean, default: false }
    PermissionCatalogue:
      type: object
      required: [modules, actions, delegable_rights]
      properties:
        modules:
          type: array
          items:
            type: object
            required: [key, name_en]
            properties:
              key: { $ref: '#/components/schemas/ModuleKey' }
              name_en: { type: string }
              name_ar: { type: string }
              screens:
                type: array
                items:
                  type: object
                  properties:
                    key: { $ref: '#/components/schemas/ModuleKey' }
                    name_en: { type: string }
                    name_ar: { type: string }
              actions: { type: array, items: { $ref: '#/components/schemas/PermissionAction' } }
        actions: { type: array, items: { $ref: '#/components/schemas/PermissionAction' } }
        delegable_rights: { type: array, items: { $ref: '#/components/schemas/DelegableRight' } }
    PermissionGrant:
      type: object
      required: [module_key, action]
      properties:
        module_key: { $ref: '#/components/schemas/ModuleKey' }
        action: { $ref: '#/components/schemas/PermissionAction' }
    FieldRule:
      type: object
      required: [field_id, access]
      properties:
        field_id: { type: string, format: uuid }
        field_code: { type: string }
        entity_type: { type: string }
        access: { type: string, enum: [hidden, read, edit] }
    PermissionProfile:
      type: object
      required: [id, code, name_en, is_active, grants, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
        grants: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } }
        field_rules: { type: array, items: { $ref: '#/components/schemas/FieldRule' } }
        assignment_count: { type: integer }
        version: { type: integer }
        changed_by: { $ref: '#/components/schemas/UserRef' }
        changed_at: { type: string, format: date-time }
    PermissionProfileInput:
      type: object
      required: [code, name_en, grants, reason]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,40}$' }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }
        grants: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } }
        field_rules: { type: array, items: { $ref: '#/components/schemas/FieldRule' } }
        reason: { $ref: '#/components/schemas/Reason' }

    # ---------------------------------------------------------- groups, delegations, regions
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_system_admins: { type: boolean }
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupRef'
        - type: object
          properties:
            description: { type: [string, 'null'] }
            is_active: { type: boolean }
            member_count: { type: integer }
            matrix_cell_count: { type: integer }
            version: { type: integer }
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                required: [user, added_at]
                properties:
                  user: { $ref: '#/components/schemas/UserRef' }
                  status: { $ref: '#/components/schemas/UserStatus' }
                  added_at: { type: string, format: date-time }
    Delegation:
      type: object
      required: [id, from_user, target_kind, scope, valid_from, state]
      properties:
        id: { type: string, format: uuid }
        from_user: { $ref: '#/components/schemas/UserRef' }
        to_user: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'The delegate when `target_kind` is `user`; null for a role or group target (0.2.5).' }
        target_kind: { $ref: '#/components/schemas/DelegationTargetKind' }
        target: { $ref: '#/components/schemas/DelegationTarget' }
        scope: { type: string, enum: [full, partial] }
        rights: { type: array, items: { $ref: '#/components/schemas/DelegableRight' } }
        region_codes: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RegionId' }, description: 'Regions where the delegation applies; empty = all regions.' }
        module_codes: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/ModuleKey' }, description: 'Modules where the delegation applies; empty = all modules.' }
        allow_redelegate: { type: boolean, default: false, description: 'The delegate may delegate further. Default false (a delegate cannot re-delegate unless the admin allows it here).' }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [active, scheduled, expired, revoked] }
        reason: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoked_by: { $ref: '#/components/schemas/UserRef' }
    DelegationTargetKind:
      type: string
      enum: [user, role, group]
      description: Delegation goes to anyone (CLAUDE.md "Delegation covers anything, to anyone"). Every active member of a role or group holds the delegated rights while they are members; each action is logged "X on behalf of System Admin". Joining the target cannot be used to grant oneself the rights; adding oneself to a target group, or assigning oneself a target role, is refused with `self_beneficiary` unless done by a System Admin acting without delegation.
    DelegationTarget:
      type: object
      required: [kind, id, label]
      properties:
        kind: { $ref: '#/components/schemas/DelegationTargetKind' }
        id: { type: string, format: uuid }
        label: { type: string, description: 'Display name of the person, role or group.' }
    DelegationInput:
      type: object
      description: Name the target either with `to_user_id` (a person, as in 0.2.4) or with `target_kind` and `target_id`. Giving both, or neither, is 422 `validation_failed`.
      required: [scope, valid_from, reason]
      properties:
        to_user_id: { type: string, format: uuid, description: 'Shorthand for `target_kind` = `user`. Kept from 0.2.4.' }
        target_kind: { $ref: '#/components/schemas/DelegationTargetKind' }
        target_id: { type: string, format: uuid, description: 'Required with `target_kind`: the user, role or group.' }
        scope: { type: string, enum: [full, partial] }
        rights: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DelegableRight' }, description: 'Required when scope = partial.' }
        region_codes: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RegionId' }, default: [], description: 'Regions where the delegation applies; empty = all regions.' }
        module_codes: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/ModuleKey' }, default: [], description: 'Modules where the delegation applies; empty = all modules.' }
        allow_redelegate: { type: boolean, default: false, description: 'Lets the delegate delegate further. Off unless the admin sets it.' }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, 'null'], format: date-time, description: 'null = until revoked.' }
        reason: { $ref: '#/components/schemas/Reason' }
    Region:
      type: object
      required: [id, code, name_en, visible]
      properties:
        id: { $ref: '#/components/schemas/RegionId' }
        code: { type: string, enum: [Tripoli, Middle, WM, Zawia, Benghazi, GM, Sebha] }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        visible: { type: boolean, description: 'The caller can see sites of this region in at least one module.' }

    # ---------------------------------------------------------- sites
    RailNode:
      type: object
      required: [code, state]
      properties:
        code: { type: string, description: 'Stable milestone code.' }
        state: { type: string, enum: [done, current, late, na, planned, not_in_workflow] }
    Stream:
      type: object
      required: [code, name_en, sort_order]
      properties:
        code: { type: string, description: 'Stable code, for example DESIGN_ACQ, CW, TE, CLOSURE.' }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        sort_order: { type: integer }
    ViewRef:
      type: object
      description: '0.4.7. A view of the Site Register (CW, TE, OM): a tab that shows only its own tasks. Seed data, admin-configurable and versioned with the workflow, like a stream.'
      required: [code, name_en, sort_order]
      properties:
        code: { type: string, description: 'Stable code, for example CW, TE, OM.' }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        sort_order: { type: integer }
    View:
      allOf:
        - $ref: '#/components/schemas/ViewRef'
        - type: object
          required: [stage_codes, task_codes]
          properties:
            stage_codes: { type: array, items: { type: string }, description: 'Stages whose tasks are all in the view.' }
            task_codes: { type: array, items: { type: string }, description: 'Single tasks in the view. CW DLP (B14) and CW FAC (B15) are always in the CW view. The O&M view always lists TE FAC (D18) and Final Closure (Z1); the TE view ends at HOTO (owner decision 2026-11-01, migration 0030). `views.om_team_assigned` decides who acts, not where the task shows; only the tasks that apply now are listed.' }
    StreamStatus:
      description: The status of one site within one stream (only the tasks and stages of that stream).
      allOf:
        - $ref: '#/components/schemas/Stream'
        - type: object
          required: [state, done_tasks, total_tasks, late_count]
          properties:
            state: { type: string, enum: [not_started, in_progress, done, na], description: 'na = the site has no counting task in the stream; done = all of them approved or N/A.' }
            current_stage: { type: [string, 'null'], description: 'Code of the first stage of the stream that is not done yet; null when done or N/A.' }
            done_tasks: { type: integer, description: 'Counting tasks approved.' }
            total_tasks: { type: integer, description: 'Counting tasks of the stream that are not N/A.' }
            late_count: { type: integer, description: 'Open tasks past their due date.' }
            milestone_date: { type: [string, 'null'], format: date, description: 'Date of the milestone that closes the stream (the milestone task of its last stage) once approved.' }
    SiteListItem:
      type: object
      required: [id, site_code, name, region_id, overall_status, rail]
      properties:
        id: { type: string, format: uuid }
        site_code: { type: string }
        name: { type: string }
        region_id: { $ref: '#/components/schemas/RegionId' }
        cluster_code: { type: [string, 'null'] }
        delivery_scenario: { $ref: '#/components/schemas/DeliveryScenario' }
        overall_status: { $ref: '#/components/schemas/OverallStatus' }
        current_milestone: { type: [string, 'null'] }
        next_milestone: { type: [string, 'null'] }
        workflow_version: { type: integer }
        late_task_count: { type: integer }
        waiting_approval_count: { type: integer }
        rail: { type: array, items: { $ref: '#/components/schemas/RailNode' } }
        streams: { type: array, items: { $ref: '#/components/schemas/StreamStatus' }, description: 'One entry per stream of the site''s workflow version, in order.' }
        views: { type: array, items: { $ref: '#/components/schemas/ViewRef' }, description: '0.4.7. One entry per view of the site''s workflow version, in order (the tabs). The stages and tasks of each view are in `GET /sites/{site_id}/tasks`.' }
        custom: { $ref: '#/components/schemas/CustomValues' }
    PipelineNode:
      type: object
      required: [code, kind, name_en, state]
      properties:
        code: { type: string }
        kind: { type: string, enum: [milestone, gate] }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        state: { type: string, enum: [done, current, late, na, planned, locked, awaiting_confirmation] }
        progress: { type: number, minimum: 0, maximum: 1, description: 'Share of counting tasks approved (ring).' }
        actual_date: { type: [string, 'null'], format: date }
        baseline_date: { type: [string, 'null'], format: date }
        planned_date: { type: [string, 'null'], format: date }
        variance_wd: { type: [integer, 'null'], description: 'Working days actual (or forecast) minus baseline.' }
        lock_reasons: { type: array, items: { $ref: '#/components/schemas/LockReason' } }
        shifted_by_suspension: { type: boolean }
    SiteDetail:
      allOf:
        - $ref: '#/components/schemas/SiteListItem'
        - type: object
          required: [pipeline, version]
          properties:
            owner_site_id: { type: [string, 'null'] }
            sub_region: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
            address: { type: [string, 'null'] }
            site_type: { type: [string, 'null'] }
            project_phase: { type: [string, 'null'] }
            delivery_batch: { type: [string, 'null'] }
            cw_delivery_model: { type: [string, 'null'] }
            scope_flags:
              type: object
              properties:
                tower_erection: { $ref: '#/components/schemas/ScopeFlag' }
                site_adaption: { $ref: '#/components/schemas/ScopeFlag' }
                gecol_power: { $ref: '#/components/schemas/ScopeFlag' }
                hlc_fiber: { $ref: '#/components/schemas/ScopeFlag' }
                te_full: { $ref: '#/components/schemas/ScopeFlag' }
                te_ip_router_only: { $ref: '#/components/schemas/ScopeFlag' }
            cluster_progress:
              type: [object, 'null']
              description: Information only ("6 of 9 sites at TE PAC").
              properties:
                cluster_code: { type: string }
                sites_total: { type: integer }
                sites_at_te_pac: { type: integer }
                kpi_acceptance_date: { type: [string, 'null'], format: date }
            pipeline: { type: array, items: { $ref: '#/components/schemas/PipelineNode' } }
            counts:
              type: object
              properties:
                open_snags: { type: integer }
                open_issues: { type: integer }
                documents_missing: { type: integer }
            version: { type: integer }

    # ---------------------------------------------------------- tasks
    TaskState:
      type: string
      enum: [locked, open, entry, in_review, in_approval, approved, awaiting_confirmation, na, skipped, suspended, retired]
      description: ADR 0004 §2. `awaiting_confirmation` and `retired` need schema changes (gate report).
    LockReason:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [predecessor_not_approved, gate_closed, stop_work, suspension, open_snags, condition_not_met, admin_lock] }
        ref_code: { type: [string, 'null'] }
        message: { type: string }
        count: { type: [integer, 'null'] }
    MatrixAssignee:
      type: object
      required: [kind, ref_id, label]
      properties:
        kind: { type: string, enum: [user, role, group] }
        ref_id: { type: string, format: uuid }
        label: { type: string }
        employee_id: { oneOf: [{ $ref: '#/components/schemas/EmployeeId' }, { type: 'null' }], description: '4-digit employee ID when `kind` is `user`; null for role and group holders.' }
        user_id: { type: string, format: uuid, description: 'Present only when `kind` is `user` (same value as `ref_id`).' }
        account_status: { $ref: '#/components/schemas/UserAccountStatus' }
        member_count: { type: integer, minimum: 0, description: '0.4.6. In the matrix: for a role, the people with an active assignment of it; for a group, its members. Absent for users.' }
    BallInCourt:
      type: object
      required: [level, holders]
      properties:
        level: { type: integer, minimum: 1 }
        level_kind: { type: string, enum: [entry, review, approve] }
        holders: { type: array, items: { $ref: '#/components/schemas/MatrixAssignee' } }
        rule: { type: string, enum: [any_one, all_members] }
        claimed_by: { $ref: '#/components/schemas/UserRef' }
        votes_done: { type: integer }
        votes_needed: { type: integer }
        external_party: { $ref: '#/components/schemas/ExternalPartyRef' }
        no_eligible_holder: { type: boolean }
    ExternalPartyRef:
      type: [object, 'null']
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cw_contractor, te_vendor, gecol, hlc, supplier, landlord, other] }
    ApprovalPathLevel:
      type: object
      required: [level, kind, status]
      properties:
        level: { type: integer }
        kind: { type: string, enum: [entry, review, approve] }
        status: { type: string, enum: [pending, current, done, skipped, returned] }
        acted_by: { $ref: '#/components/schemas/UserRef' }
        acted_at: { type: [string, 'null'], format: date-time }
        will_skip: { type: boolean, description: 'Self-skip preview (MX-06).' }
    SlaInfo:
      type: object
      properties:
        code: { type: [string, 'null'] }
        min_wd: { type: [integer, 'null'] }
        max_wd: { type: [integer, 'null'] }
        start_event: { type: [string, 'null'] }
        start_date: { type: [string, 'null'], format: date }
        elapsed_wd: { type: [integer, 'null'] }
        due_date: { type: [string, 'null'], format: date }
        colour: { type: string, enum: [green, amber, red, none] }
        rule_id: { type: [string, 'null'], format: uuid }
        rule_set_version: { type: [integer, 'null'], minimum: 1, description: 'SLA rule set version the task opened with, kept unless an admin applied a newer one to open tasks (0.2.6).' }
        negative: { type: boolean, description: '0.4.4 (Q82). True when the task is approved and its clock closed at an actual date before the start (elapsed_wd < 0). A data-quality flag for review; the System Admins and the stage lead were alerted and an audit row of kind sla_negative_duration was written. False or absent otherwise.' }
    TaskSummary:
      type: object
      required: [id, site_id, site_code, task_code, name_en, stage_code, state, version]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        region_id: { $ref: '#/components/schemas/RegionId' }
        task_code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        stage_code: { type: string }
        stream_code: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/TaskState' }
        current_level: { type: integer }
        levels_required: { type: integer }
        ball_in_court: { $ref: '#/components/schemas/BallInCourt' }
        planned_date: { type: [string, 'null'], format: date }
        actual_date: { type: [string, 'null'], format: date }
        sla: { $ref: '#/components/schemas/SlaInfo' }
        slots_filled: { type: integer }
        slots_required: { type: integer }
        template_id: { type: [string, 'null'] }
        return_count: { type: integer }
        last_return_note: { type: [string, 'null'] }
        admin_override: { type: boolean }
        holder_absent: { type: boolean, description: 'The holder has an active absence ("absent" badge, B12b).' }
        holder_account_status: { $ref: '#/components/schemas/UserAccountStatus' }
        idle_working_days: { type: [integer, 'null'], description: 'Working days without activity; alerts the lead at the idle-task setting.' }
        lock_reasons: { type: array, items: { $ref: '#/components/schemas/LockReason' }, description: 'Why the task is locked (empty when it is not), so "Why locked?" needs no extra call.' }
        register_fields: { type: array, items: { $ref: '#/components/schemas/TaskRegisterField' }, description: '0.4.9. Only in the Site Register task grid. Register-owned fields shown read-through; edit them in the source register (Q73, Q99).' }
        version: { type: integer }
    TaskRegisterField:
      type: object
      required: [code, label_en, type, value, editable, edit_via, source]
      properties:
        code: { type: string, description: 'The register field code, or `external_party_id` (the contractor of the record).' }
        label_en: { type: string }
        label_ar: { type: [string, 'null'] }
        type: { type: string, enum: [text, number, date, list, yes_no, user, party] }
        options: { type: array, items: { type: object, required: [value, label_en], properties: { value: { type: string }, label_en: { type: string } } } }
        master_column: { type: [string, 'null'], description: 'The Master column this field replaces (for example BU, EF, FO, FT).' }
        value: { description: 'Read from the source record; null when there is no record yet. For `party`, the party name.' }
        editable: { type: boolean, description: 'A hint: the caller may use `edit_via`. The register decides again on every call.' }
        edit_via: { type: string, enum: [patch, new_version, create, none], description: '`patch` the record (in entry); `new_version` of an approved record, then patch; `create` a record (no record yet); `none` not now.' }
        source:
          type: object
          required: [register_key, site_id, field]
          properties:
            register_key: { type: string }
            record_type: { type: [string, 'null'] }
            site_id: { type: string, format: uuid }
            record_id: { type: [string, 'null'], format: uuid }
            entity_id: { type: [string, 'null'], format: uuid }
            record_state: { type: [string, 'null'] }
            record_version: { type: [integer, 'null'], description: 'The If-Match value of the record.' }
            field: { type: string, description: '`data.<code>` or `external_party_id`: where the value sits in the record body.' }
    DocumentFile:
      type: object
      required: [id, file_group_id, version, is_current, original_name, download_name, size_bytes, uploaded_at]
      properties:
        capture_date: { type: [string, 'null'], format: date-time, description: 'Photos: the EXIF capture date; null when the file has none.' }
        unknown_capture_date: { type: boolean, description: 'A photo without an EXIF date: accepted and flagged for the reviewer.' }
        superseded_by: { type: [string, 'null'], format: uuid, description: 'The file that replaced this version; null for the current version (and for a withdrawn file).' }
        id: { type: string, format: uuid }
        file_group_id: { type: string, format: uuid }
        version: { type: integer }
        is_current: { type: boolean }
        original_name: { type: string }
        download_name: { type: string, description: 'Computed `SITE_TASK_DOC_APPROVEDDATE.ext` (ADR 0008 §3).' }
        mime_type: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string }
        uploaded_by: { $ref: '#/components/schemas/UserRef' }
        uploaded_at: { type: string, format: date-time }
        approved_date: { type: [string, 'null'], format: date }
    DocumentSlot:
      type: object
      required: [id, doc_code, name_en, status, mandatory, files]
      properties:
        id: { type: string, format: uuid }
        doc_code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        kind: { type: string, enum: [scanned_document, photo, email, report, excel_template, generated_form] }
        mandatory: { type: boolean }
        status: { type: string, enum: [missing, uploaded, in_review, approved, rejected, not_required] }
        reject_reason: { type: [string, 'null'] }
        candidate_label: { type: [string, 'null'] }
        doc_type_id: { type: string, format: uuid }
        form_kind: { oneOf: [{ $ref: '#/components/schemas/FormKind' }, { type: 'null' }] }
        conditional: { type: boolean, description: 'The document has a rule: it is on the task because the rule holds, or because Data Entry declared that it applies.' }
        can_upload: { type: boolean, description: 'The caller may upload to this slot now (Data Entry of a pending or ongoing task, slot not approved or in review).' }
        expiry_tracked: { type: boolean }
        formats: { type: array, items: { type: string } }
        max_size_mb: { type: integer }
        min_files: { type: integer }
        max_files: { type: [integer, 'null'] }
        camera_only: { type: boolean }
        blank_form_file_id: { type: [string, 'null'], format: uuid }
        valid_to: { type: [string, 'null'], format: date }
        files: { type: array, items: { $ref: '#/components/schemas/DocumentFile' } }
    AllowedAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [edit, start, submit, review, approve, reject, claim, release, comment, override, act_on_behalf] }
        step_up: { type: boolean }
        will_skip_to: { type: [integer, 'null'], description: 'Level the task lands on after self-skip.' }
        final: { type: boolean, description: 'This action completes final approval (after self-skip).' }
        disabled_reason: { type: [string, 'null'] }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [approval_path, slots, allowed_actions]
          properties:
            baseline_date: { type: [string, 'null'], format: date }
            planned_start: { type: [string, 'null'], format: date }
            actual_start: { type: [string, 'null'], format: date }
            submitted_date: { type: [string, 'null'], format: date }
            approved_date: { type: [string, 'null'], format: date }
            prefill_date: { type: [string, 'null'], format: date, description: 'Site RFI pre-fill (latest condition date).' }
            values: { type: object, additionalProperties: true }
            custom: { $ref: '#/components/schemas/CustomValues' }
            field_access:
              type: object
              description: Field code -> access for the caller (hidden fields are absent).
              additionalProperties: { type: string, enum: [read, edit] }
            approval_path: { type: array, items: { $ref: '#/components/schemas/ApprovalPathLevel' } }
            slots: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
            missing_for_submit: { type: array, items: { type: string } }
            allowed_actions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
            is_na: { type: boolean }
            na_reason: { type: [string, 'null'] }
            workflow_version: { type: integer }
    TaskEntryPatch:
      type: object
      minProperties: 1
      properties:
        actual_start: { type: [string, 'null'], format: date }
        actual_date: { type: [string, 'null'], format: date }
        planned_date: { type: [string, 'null'], format: date }
        values: { type: object, additionalProperties: true }
        custom: { $ref: '#/components/schemas/CustomValues' }
    RejectRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000 }
        via: { $ref: '#/components/schemas/WorkflowVia' }
        rejected_slots:
          type: array
          items:
            type: object
            required: [slot_id, reason]
            properties:
              slot_id: { type: string, format: uuid }
              reason: { type: string, minLength: 1, maxLength: 500 }
    TransitionResult:
      type: object
      required: [task, step_ids]
      properties:
        task: { $ref: '#/components/schemas/TaskDetail' }
        step_ids: { type: array, items: { type: string, format: uuid } }
        skipped_levels: { type: array, items: { type: integer }, description: 'Levels auto-skipped (same holder).' }
        unlocked_task_ids: { type: array, items: { type: string, format: uuid } }
        votes_missing: { type: integer, minimum: 1, description: 'Under `all_members`: members who have not voted yet; the level stays open. Absent when the level completed.' }
        returned_to_level: { type: integer, minimum: 1, description: 'After a rejection: the level the task went back to (a level skipped by the same person is not a target, B6).' }
    OnBehalfKind:
      type: [string, 'null']
      enum: [system_admin, assignee, null]
      description: '`system_admin`: a delegate acting for the System Admin. `assignee`: a lead acting for the assignee of a level (B12b). Null when `on_behalf_of` is absent.'
    WorkflowStep:
      type: object
      required: [id, level, action, created_at]
      properties:
        id: { type: string, format: uuid }
        level: { type: integer }
        action: { type: string, enum: [start, submit, review, approve, reject, auto_skip, claim, release, reassign, admin_override, override_revert, reopen, migrate] }
        acted_by: { $ref: '#/components/schemas/UserRef' }
        on_behalf_of: { $ref: '#/components/schemas/UserRef' }
        on_behalf_kind: { $ref: '#/components/schemas/OnBehalfKind' }
        note: { type: [string, 'null'] }
        before_state: { $ref: '#/components/schemas/TaskState' }
        after_state: { $ref: '#/components/schemas/TaskState' }
        self_approval: { type: boolean }
        admin_override: { type: boolean }
        stepup_verified: { type: boolean }
        batch_row_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserRef' }
        body: { type: string }
        is_rejection_note: { type: boolean }
        mentions: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        created_at: { type: string, format: date-time }
    OverrideRequest:
      type: object
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [unlock, skip, mark_na, accept_without_document, accept_without_workflow, reopen, edit_date, reassign] }
        reason: { $ref: '#/components/schemas/Reason' }
        date_field: { type: string, enum: [actual_start, actual_date, planned_date, baseline_date], description: 'For edit_date.' }
        new_date: { type: [string, 'null'], format: date }
        reassign_to_user_id: { type: string, format: uuid, description: 'For reassign.' }
    Override:
      type: object
      required: [id, task_id, kind, reason, created_at, revertible]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        kind: { type: string }
        reason: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        acted_by: { $ref: '#/components/schemas/UserRef' }
        on_behalf_of: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        reverted_at: { type: [string, 'null'], format: date-time }
        revertible: { type: boolean }

    # ---------------------------------------------------------- approvals
    ApprovalItem:
      type: object
      required: [task, level_kind, waiting_since]
      properties:
        task: { $ref: '#/components/schemas/TaskSummary' }
        level_kind: { type: string, enum: [review, approve] }
        via_group: { $ref: '#/components/schemas/GroupRef' }
        waiting_since: { type: string, format: date-time }
        submitted_by: { $ref: '#/components/schemas/UserRef' }
        will_self_skip: { type: boolean }
        documents_summary:
          type: array
          description: One entry per document slot of the task, so the Approvals detail needs no extra `GET /tasks/{task_id}`.
          items:
            type: object
            required: [slot_id, name, status, file_count]
            properties:
              slot_id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [missing, uploaded, in_review, approved, rejected, not_required] }
              file_count: { type: integer, minimum: 0 }

    # ---------------------------------------------------------- matrix
    MatrixCell:
      type: object
      required: [id, stage_code, level, rule, assignees]
      properties:
        id: { type: string, format: uuid }
        stage_code: { type: string, description: 'The row: a stage code, or the register key of a register or Dismantle row.' }
        task_code: { type: [string, 'null'], description: 'null = the row default; a task code = a holder override for that task.' }
        level: { type: integer, minimum: 1, maximum: 3, description: 'The cell level: 1 is L1 (Data Entry), 3 is L2 (Data Reviewer & Approver). 2 is the old middle level, kept only for tasks already in flight on a 3-level snapshot (`used` false).' }
        level_kind: { type: string, enum: [entry, review, approve], description: '0.4.6. entry = L1, approve = L2, review = the old middle cell.' }
        level_code: { type: string, enum: [L1, L2], description: '0.6.1. L1 for cell level 1, L2 for cells 2 and 3 (the middle cell is never in use).' }
        used: { type: boolean, description: '0.4.6. False for the middle cell (level 2): it is kept for tasks already in flight on a 3-level snapshot.' }
        region_id: { oneOf: [{ $ref: '#/components/schemas/RegionId' }, { type: 'null' }], description: 'null = every region.' }
        rule: { type: string, enum: [any_one, all_members], description: 'The Entry level is always any_one.' }
        assignees: { type: array, items: { $ref: '#/components/schemas/MatrixAssignee' } }
        skip_preview:
          type: array
          description: People who also hold the next level (level will be skipped for them).
          items: { $ref: '#/components/schemas/UserRef' }
        updated_at: { type: [string, 'null'], format: date-time, description: '0.4.6.' }
    MatrixSkipCase:
      type: object
      description: '0.4.6. One person who holds consecutive levels of a row, in the regions listed.'
      required: [user, from_level_kind, skipped_level_kinds, self_approval, region_ids]
      properties:
        task_code: { type: [string, 'null'], description: 'null = the row default; a task code = the override cells of that task.' }
        user: { $ref: '#/components/schemas/UserRef' }
        from_level_kind: { type: string, enum: [entry, review], description: 'The level the person acts at. Since 0.6.1 always `entry` (L1).' }
        from_level_code: { type: string, enum: [L1], description: '0.6.1. Always L1.' }
        skipped_level_kinds: { type: array, items: { type: string, enum: [review, approve] }, description: 'The levels skipped after it, in order. Each skip is logged (B6). Since 0.6.1 always `[approve]` (L2).' }
        skipped_level_codes: { type: array, items: { type: string, enum: [L2] }, description: '0.6.1. Always [L2], one per skipped level.' }
        self_approval: { type: boolean, description: 'True when the last level is among them: the person finishes the task alone (B5). The final approval then needs step-up and is flagged in KPIs and the audit log.' }
        region_ids: { type: array, items: { $ref: '#/components/schemas/RegionId' }, description: 'Regions where this holds (only regions the caller can see).' }
    MatrixPreview:
      type: object
      description: '0.4.6. Self-skip and self-approval, shown in advance (B5, B6, MX-06). Computed with the engine rules: the people behind users, roles and groups; a level is skipped only when its rule is `any_one`.'
      required: [single_level, skips]
      properties:
        single_level: { type: boolean, description: 'Always false since 0.6.1 (every row has two levels). A person who holds L1 and L2 is a self-approval case in `skips`.' }
        skips: { type: array, items: { $ref: '#/components/schemas/MatrixSkipCase' } }
    MatrixTaskCounts:
      type: object
      description: '0.4.6. Open tasks of a stage in the caller''s regions, for the level-count change (decision B7). Tasks with their own level count are left out of `not_submitted`.'
      required: [not_submitted, in_flight]
      properties:
        not_submitted: { type: integer, minimum: 0, description: 'Not yet submitted (locked, open or in entry before the first submission): they follow the current level count.' }
        in_flight: { type: integer, minimum: 0, description: 'Submitted at least once and not finished: they keep the level path frozen at their first submission.' }
    MatrixRowKey:
      type: string
      description: '0.4.6. Code of a matrix row that is not a stage: the register keys, plus `rf_design`, `acquisition` (Q44) and `deliverables` (Q71). 0.9.0: `procurement_hlc`, the row of the Procurement scope HLC (its L1 enters the HLC purchase requests).'
      enum: [procurement, procurement_hlc, contractors, rf_design, acquisition, gecol, hlc, permits_hse, warehouse, quality, issues, risks, change_control, readiness_handover, as_built, meetings, deliverables, dismantle]
    Matrix:
      type: object
      required: [workflow_version, stages, version]
      properties:
        workflow_version: { type: integer }
        version: { type: integer, description: 'Matrix revision (ETag). Rises with every saved change, in any workflow version.' }
        stages:
          type: array
          description: 'Stage rows in workflow order, then the register rows, then Dismantle.'
          items:
            type: object
            required: [code, name_en, approval_levels, cells]
            properties:
              kind: { type: string, enum: [stage, register, dismantle], default: stage, description: 'Register and Dismantle rows (B11); `code` is then the register key.' }
              register_key: { oneOf: [{ $ref: '#/components/schemas/MatrixRowKey' }, { type: 'null' }] }
              code: { type: string }
              name_en: { type: string }
              name_ar: { type: [string, 'null'] }
              approval_levels: { type: integer, const: 2, description: 'Always 2 since 0.6.1: L1 Data Entry and L2 Data Reviewer & Approver.' }
              used_levels: { type: array, items: { type: integer, enum: [1, 3] }, description: '0.4.6. Cell levels in use. Always [1, 3] since 0.6.1 (L1 = cell 1, L2 = cell 3).' }
              region_ids_with_cells: { type: array, items: { $ref: '#/components/schemas/RegionId' }, description: '0.4.6. Regions that have cells of their own in this row (visible regions only).' }
              task_counts: { $ref: '#/components/schemas/MatrixTaskCounts' }
              preview: { $ref: '#/components/schemas/MatrixPreview' }
              cells: { type: array, items: { $ref: '#/components/schemas/MatrixCell' }, description: 'The row default of each level first, then the task and region cells.' }
    MatrixPatch:
      type: object
      required: [reason]
      minProperties: 2
      properties:
        workflow_version: { type: integer }
        stage_levels:
          type: array
          items:
            type: object
            required: [stage_code, approval_levels]
            properties:
              stage_code: { type: string, description: 'A stage code of the workflow version, or the code of a register or Dismantle row (0.4.6).' }
              approval_levels: { type: integer, const: 2, description: 'Fixed at 2 since 0.6.1 (owner decision 2026-11-01); saving 2 writes nothing, any other value is 422.' }
        cells:
          type: array
          items:
            type: object
            required: [stage_code, level, rule, assignees]
            properties:
              stage_code: { type: string, description: 'A stage code of the workflow version, or the code of a register or Dismantle row (0.4.6).' }
              task_code: { type: [string, 'null'], description: 'Only for stage rows: a holder override for one task of the stage.' }
              level: { type: integer, minimum: 1, maximum: 3, description: '1 entry, 2 review, 3 approve.' }
              region_id: { oneOf: [{ $ref: '#/components/schemas/RegionId' }, { type: 'null' }] }
              rule: { type: string, enum: [any_one, all_members] }
              assignees:
                type: array
                items:
                  type: object
                  required: [kind, ref_id]
                  properties:
                    kind: { type: string, enum: [user, role, group] }
                    ref_id: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/Reason' }

    # ---------------------------------------------------------- workflow (ADR 0010)
    WorkflowVersionSummary:
      type: object
      required: [version, status, light_revision]
      properties:
        version: { type: integer }
        status: { type: string, enum: [draft, published, retired] }
        is_current: { type: boolean, description: 'New sites use this version.' }
        light_revision: { type: integer }
        parent_version: { type: [integer, 'null'] }
        site_count: { type: integer }
        reason: { type: [string, 'null'] }
        published_by: { $ref: '#/components/schemas/UserRef' }
        published_at: { type: [string, 'null'], format: date-time }
    WorkflowMilestone:
      type: object
      required: [code, seq, name_en, formula_kind, counts_in_project_status]
      properties:
        code: { type: string }
        seq: { type: integer }
        canonical_seq: { type: integer }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        formula_kind: { type: string, enum: [master, generic] }
        counts_in_project_status: { type: boolean }
        master_export_column: { type: [string, 'null'] }
        custom: { $ref: '#/components/schemas/CustomValues' }
    GateCondition:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [milestone, task, permit, date_field, stop_work_blocks] }
        ref: { type: string, description: 'Milestone code, task code, permit type, or date field key.' }
        accept_na: { type: boolean, description: 'For permits, an approved N/A satisfies (D36).' }
    WorkflowGate:
      type: object
      required: [code, from_milestone, to_milestone, name_en, conditions]
      properties:
        code: { type: string }
        from_milestone: { type: string }
        to_milestone: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        conditions: { type: array, items: { $ref: '#/components/schemas/GateCondition' } }
        sla_min_wd: { type: [integer, 'null'] }
        sla_max_wd: { type: [integer, 'null'] }
        master_export_column: { type: [string, 'null'] }
        custom: { $ref: '#/components/schemas/CustomValues' }
    TaskPlacement:
      type: object
      required: [task_code, stage_code, sort_order]
      properties:
        task_code: { type: string }
        stage_code: { type: string, description: 'Code of the milestone this task belongs to.' }
        sort_order: { type: integer }
        predecessors: { type: array, items: { type: string } }
        counts_toward_milestone: { type: boolean }
    WorkflowStructure:
      type: object
      required: [milestones, gates, placements]
      properties:
        milestones:
          type: array
          items:
            type: object
            required: [name_en]
            properties:
              code: { type: string, description: 'Omit for a new milestone; a new code is assigned.' }
              name_en: { type: string }
              name_ar: { type: string }
              master_export_column: { type: [string, 'null'] }
              counts_in_project_status: { type: boolean }
        gates:
          type: array
          items:
            type: object
            required: [from_milestone, to_milestone, name_en]
            properties:
              code: { type: string }
              from_milestone: { type: string }
              to_milestone: { type: string }
              name_en: { type: string }
              name_ar: { type: string }
              conditions: { type: array, items: { $ref: '#/components/schemas/GateCondition' } }
              master_export_column: { type: [string, 'null'] }
        placements: { type: array, items: { $ref: '#/components/schemas/TaskPlacement' } }
    WorkflowVersion:
      allOf:
        - $ref: '#/components/schemas/WorkflowVersionSummary'
        - type: object
          required: [milestones, gates, placements]
          properties:
            milestones: { type: array, items: { $ref: '#/components/schemas/WorkflowMilestone' } }
            gates: { type: array, items: { $ref: '#/components/schemas/WorkflowGate' } }
            placements: { type: array, items: { $ref: '#/components/schemas/TaskPlacement' } }
            validation:
              type: object
              properties:
                valid: { type: boolean }
                problems: { type: array, items: { type: string } }
                warnings: { type: array, items: { type: string } }
                master_impact:
                  type: object
                  properties:
                    affected_columns: { type: array, items: { type: string } }
                    parallel_run_active: { type: boolean }
                    confirmation_phrase: { type: [string, 'null'] }
            version_etag: { type: integer, description: 'Draft revision for If-Match.' }
    SiteSelection:
      type: object
      description: Either explicit site ids or a filter. Only sites on another version are considered.
      properties:
        site_ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
        filter:
          type: object
          properties:
            region_id: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
            from_version: { type: integer }
            overall_status: { type: array, items: { $ref: '#/components/schemas/OverallStatus' } }
    DateChange:
      type: object
      required: [code, before, after]
      properties:
        code: { type: string }
        before: { type: [string, 'null'], format: date }
        after: { type: [string, 'null'], format: date }
    MigrationPreview:
      type: object
      required: [preview_hash, to_version, sites]
      properties:
        preview_hash: { type: string }
        to_version: { type: integer }
        master_impact:
          type: object
          properties:
            affected_columns: { type: array, items: { type: string } }
            parallel_run_active: { type: boolean }
            confirmation_phrase: { type: [string, 'null'] }
        sites:
          type: array
          items:
            type: object
            required: [site_id, site_code, from_version, migratable]
            properties:
              site_id: { type: string, format: uuid }
              site_code: { type: string }
              from_version: { type: integer }
              migratable: { type: boolean }
              blockers: { type: array, items: { type: string } }
              tasks_kept: { type: array, items: { type: string } }
              tasks_moved: { type: array, items: { type: string } }
              tasks_added: { type: array, items: { type: string } }
              tasks_retired: { type: array, items: { type: string } }
              date_changes: { type: array, items: { $ref: '#/components/schemas/DateChange' } }
    SiteMigration:
      type: object
      required: [id, site_id, from_version, to_version, migrated_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        from_version: { type: integer }
        to_version: { type: integer }
        reason: { type: string }
        migrated_by: { $ref: '#/components/schemas/UserRef' }
        migrated_at: { type: string, format: date-time }
        date_changes: { type: array, items: { $ref: '#/components/schemas/DateChange' } }
        reverted_at: { type: [string, 'null'], format: date-time }
        revertible: { type: boolean }

    # ---------------------------------------------------------- audit
    AuditEntry:
      type: object
      required: [id, at, action, entity_type]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/UserRef' }
        on_behalf_of: { $ref: '#/components/schemas/UserRef' }
        on_behalf_kind: { $ref: '#/components/schemas/OnBehalfKind' }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'] }
        site_id: { type: [string, 'null'], format: uuid }
        site_code: { type: [string, 'null'] }
        region_id: { oneOf: [{ $ref: '#/components/schemas/RegionId' }, { type: 'null' }] }
        module_key: { type: [string, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        reason: { type: [string, 'null'] }
        bulk_action_id: { type: [string, 'null'], format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        is_admin_override: { type: boolean }
        privileged: { type: boolean }
        stepup_verified: { type: boolean }
        mfa: { type: boolean }
        self_approval: { type: boolean }
        ip: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }

    # ---------------------------------------------------------- settings
    Setting:
      type: object
      required: [key, value]
      properties:
        key: { type: string, examples: [require_mfa, stepup_max_age_seconds, geofence_radius_m, parallel_run_start, legacy_master_import_until] }
        value: {}
        description: { type: [string, 'null'] }
        updated_by: { $ref: '#/components/schemas/UserRef' }
        updated_at: { type: string, format: date-time }
    SlaStartEvent:
      type: string
      minLength: 1
      maxLength: 60
      description: 'What the SLA is measured from, as a code of the workflow version in force: a task code, a milestone code or a gate code (D-1 TE Access uses the Site RFI milestone), or one of the reserved values `PRED` (latest date of the predecessors), `OPEN` (the day the task opens) and `DLP:<task code>:<setting key>` (the date of the task plus the DLP months of the setting `dlp.months.cw` or `dlp.months.te`) and, since 0.4.4, `DLPD:<task code>:<setting key>` (the date of the task plus the calendar days of the setting `sla.dlp_days.cw`, default 90), and, since 0.9.0, `PR:<scope>` (the earliest PR date of the approved Procurement records of that scope on the site; C-3 uses `PR:HLC`). The contract has no separate catalogue; an unknown code is 422 `validation_failed` with `errors[].code` = `unknown_start_event`.'
    SlaRuleOverride:
      type: object
      description: 'A different minimum and maximum for one delivery scenario, one region, or one scenario in one region. The most specific override wins (scenario and region, then region, then scenario, then the base rule).'
      additionalProperties: false
      required: [min_working_days, max_working_days]
      anyOf:
        - { required: [scenario] }
        - { required: [region_id] }
      properties:
        scenario: { $ref: '#/components/schemas/DeliveryScenario' }
        region_id: { $ref: '#/components/schemas/RegionId' }
        min_working_days: { type: integer, minimum: 0, maximum: 365, description: 'Target (green). Must not exceed `max_working_days`, else 422 `min_exceeds_max`.' }
        max_working_days: { type: integer, minimum: 0, maximum: 365, description: 'Limit. Above it the task is late.' }
    SlaTaskRule:
      type: object
      description: 'The SLA rule of one task in a rule set: base minimum and maximum in working days, the start event, the calendar and optional overrides.'
      additionalProperties: false
      required: [task_code, min_working_days, max_working_days, start_event, calendar_code]
      properties:
        task_code: { type: string, maxLength: 40 }
        min_working_days: { type: integer, minimum: 0, maximum: 365, description: 'Target (green). Must not exceed `max_working_days`, else 422 `min_exceeds_max`.' }
        max_working_days: { type: integer, minimum: 0, maximum: 365, description: 'Limit. Above it the task is late.' }
        start_event: { $ref: '#/components/schemas/SlaStartEvent' }
        calendar_code: { type: string, description: 'A calendar of `GET /settings/calendars` (weekend days and holidays).' }
        overrides: { type: array, maxItems: 47, items: { $ref: '#/components/schemas/SlaRuleOverride' } }
    SlaRuleSetSummary:
      type: object
      description: 'One version of the whole SLA rule set. Versions are numbered 1, 2, 3 and so on; the seed is version 1.'
      required: [id, version, status, is_active, effective_from, reason, created_by, created_at, rule_count]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published] }
        is_active: { type: boolean, description: 'true for the published version in force today.' }
        effective_from: { type: [string, 'null'], format: date, description: 'Null while a draft.' }
        effective_to: { type: [string, 'null'], format: date }
        base_version: { type: [integer, 'null'], description: 'The version the draft was copied from.' }
        reason: { type: string, description: 'The reason of the last change; for a published version, the reason given at publish.' }
        created_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        published_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        published_at: { type: [string, 'null'], format: date-time }
        apply_to_open_tasks: { type: [boolean, 'null'], description: 'The choice made at publish; null for a draft.' }
        affected_open_tasks: { type: [integer, 'null'], description: 'Open tasks switched to this version at publish; null for a draft.' }
        rule_count: { type: integer }
    SlaRuleSet:
      allOf:
        - $ref: '#/components/schemas/SlaRuleSetSummary'
        - type: object
          required: [rules]
          properties:
            rules: { type: array, items: { $ref: '#/components/schemas/SlaTaskRule' } }
    SlaRuleSetPatch:
      type: object
      additionalProperties: false
      required: [reason, rules]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
        rules: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/SlaTaskRule' }, description: 'Each item replaces the whole rule of its `task_code`.' }
    SlaRuleSetPublish:
      type: object
      additionalProperties: false
      required: [effective_date, reason]
      properties:
        effective_date: { type: string, format: date, description: 'Today or later (Africa/Tripoli).' }
        reason: { $ref: '#/components/schemas/Reason' }
        apply_to_open_tasks: { type: boolean, default: false, description: 'false keeps every open task on the version it opened with; true switches them to the new version (preview first).' }
    SlaRuleSetPublishResult:
      type: object
      required: [rule_set, affected_open_tasks]
      properties:
        rule_set: { $ref: '#/components/schemas/SlaRuleSetSummary' }
        affected_open_tasks: { type: integer, description: '0 when `apply_to_open_tasks` is false. Closed tasks keep their values.' }
        recalculation_job_id: { type: [string, 'null'], description: 'The `sla_recalculation` job (`GET /jobs/{job_id}`); null when no task is affected.' }
    SlaPublishPreview:
      type: object
      required: [set_id, effective_date, open_tasks_total, changed_due_date_count, became_late_count, no_longer_late_count, by_task, samples]
      properties:
        set_id: { type: string, format: uuid }
        effective_date: { type: string, format: date }
        open_tasks_total: { type: integer, description: 'Open (not approved) tasks in the caller''s scope.' }
        changed_due_date_count: { type: integer, description: 'Open tasks whose due date would change.' }
        became_late_count: { type: integer, description: 'Of those, tasks not late today that would be late.' }
        no_longer_late_count: { type: integer, description: 'Of those, tasks late today that would no longer be late.' }
        by_task:
          type: array
          items:
            type: object
            required: [task_code, open_tasks, changed]
            properties:
              task_code: { type: string }
              open_tasks: { type: integer }
              changed: { type: integer }
        samples:
          type: array
          maxItems: 20
          items:
            type: object
            required: [task_id, site_code, task_code, due_date_before, due_date_after]
            properties:
              task_id: { type: string, format: uuid }
              site_code: { type: string }
              task_code: { type: string }
              due_date_before: { type: [string, 'null'], format: date }
              due_date_after: { type: [string, 'null'], format: date }
    WeightSetCode:
      type: string
      enum: [project_status, health_index, delay_attribution]
    WeightItemInput:
      type: object
      additionalProperties: false
      required: [code, name_en, weight]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$', description: 'Stable code, for example `1.1`. Never reused for another item of the activity.' }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        name_ar: { type: [string, 'null'], maxLength: 200 }
        weight: { type: number, minimum: 0, maximum: 100, description: 'Percent inside the activity, at most 3 decimals. 0 means not weighted.' }
        unit: { type: [string, 'null'], maxLength: 40 }
        measure_rule: { type: [string, 'null'], maxLength: 500, description: 'How the item is measured, as a JSON object in text (0.7.2): `{"method":"tasks","tasks":["A2"],"plan":"MS1"}` counts the approved and the applicable instances of those task codes (a milestone task has the code of its milestone, MS1 to MS10) and plans against the baseline of the milestone `plan`; `{"method":"none","central":true}` is a project-wide item with no data in the PMIS yet: it is left out and its weight redistributed. Any other text is kept and measures nothing.' }
        source: { type: [string, 'null'], maxLength: 200 }
    WeightActivityInput:
      type: object
      additionalProperties: false
      required: [code, name_en, weight]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        name_ar: { type: [string, 'null'], maxLength: 200 }
        weight: { type: number, minimum: 0, maximum: 100, description: 'Percent of the whole set, at most 3 decimals. Default for Project Status: 12, 8, 5, 25, 20, 12, 13, 5.' }
        items: { type: array, items: { $ref: '#/components/schemas/WeightItemInput' }, description: 'Optional. When present and not empty they must total 100 to be published.' }
    WeightSetInput:
      type: object
      additionalProperties: false
      required: [reason, activities]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
        activities: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/WeightActivityInput' } }
    WeightSetPublish:
      type: object
      additionalProperties: false
      required: [effective_date, reason]
      properties:
        effective_date: { type: string, format: date, description: 'Today or later (Africa/Tripoli).' }
        reason: { $ref: '#/components/schemas/Reason' }
    WeightSetPublishResult:
      type: object
      required: [weight_set]
      properties:
        weight_set: { $ref: '#/components/schemas/WeightSet' }
        previous_set_id: { type: [string, 'null'], format: uuid }
        recalculation_job_id: { type: [string, 'null'], description: 'The `progress_recalculation` job (`GET /jobs/{job_id}`).' }
    WeightSetPreview:
      type: object
      required: [valid, errors, progress_current_pct, progress_new_pct]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          description: 'Same entries as the 422 of the publish (`weights_must_total_100` per level and the others).'
          items:
            type: object
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
        progress_current_pct: { type: [number, 'null'], description: 'Project progress with the set in force. Null for a code that has no progress (health index, delay attribution).' }
        progress_new_pct: { type: [number, 'null'], description: 'Project progress with the draft. Null when `valid` is false.' }
        activities:
          type: array
          items:
            type: object
            required: [code, current_pct, new_pct]
            properties:
              code: { type: string }
              current_pct: { type: number }
              new_pct: { type: [number, 'null'] }
    SlaRule:
      type: object
      required: [id, task_code, min_working_days, max_working_days, start_event, calendar_code, effective_from]
      properties:
        id: { type: string, format: uuid }
        task_code: { type: string }
        min_working_days: { type: integer }
        max_working_days: { type: integer }
        start_event: { type: string }
        scenario: { oneOf: [{ $ref: '#/components/schemas/DeliveryScenario' }, { type: 'null' }] }
        region_id: { oneOf: [{ $ref: '#/components/schemas/RegionId' }, { type: 'null' }] }
        calendar_code: { type: string }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        reason: { type: string }
        changed_by: { $ref: '#/components/schemas/UserRef' }
        changed_at: { type: string, format: date-time }
        open_task_count: { type: integer }
        set_version: { type: integer, minimum: 1, description: 'The SLA rule set version this row belongs to (0.2.6).' }
    WeightItem:
      type: object
      required: [code, name_en, weight]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        weight: { type: number }
        unit: { type: [string, 'null'] }
        measure_rule: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
    WeightSet:
      type: object
      required: [id, code, version, status, effective_from, activities]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, enum: [project_status, health_index, delay_attribution] }
        version: { type: integer }
        status: { type: string, enum: [draft, published] }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        reason: { type: [string, 'null'] }
        is_active: { type: boolean, description: 'true for the published set in force today (0.2.6).' }
        changed_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        activities:
          type: array
          items:
            type: object
            required: [code, name_en, weight, items]
            properties:
              code: { type: string }
              name_en: { type: string }
              name_ar: { type: [string, 'null'] }
              weight: { type: number }
              items: { type: array, items: { $ref: '#/components/schemas/WeightItem' } }
    Calendar:
      type: object
      required: [id, code, weekend_days, is_default, holidays]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        weekend_days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: '0 = Sunday. Default [5, 6].' }
        is_default: { type: boolean }
        holidays:
          type: array
          items:
            type: object
            required: [date, name]
            properties:
              date: { type: string, format: date }
              name: { type: string }
        holiday_table_empty: { type: boolean, description: 'Drives the "holiday table empty" banner (Q4).' }
    TaskDefinition:
      type: object
      required: [id, code, name_en, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        stage_code: { type: [string, 'null'], description: 'Placement in the requested workflow version.' }
        sort_order: { type: [integer, 'null'] }
        predecessors: { type: array, items: { type: string } }
        has_documents: { type: boolean }
        is_milestone_task: { type: boolean }
        counts_toward_milestone: { type: boolean }
        approval_levels: { type: [integer, 'null'] }
        condition_rule: { $ref: '#/components/schemas/ConditionRule' }
        default_external_party: { type: [string, 'null'] }
        is_active: { type: boolean }
        version: { type: integer }
    ConditionRule:
      description: Shared JSON rule language (ADR 0009 §7). Null = always applies.
      oneOf:
        - type: 'null'
        - type: object
          minProperties: 1
          maxProperties: 1
          properties:
            all: { type: array, items: { $ref: '#/components/schemas/ConditionRule' } }
            any: { type: array, items: { $ref: '#/components/schemas/ConditionRule' } }
            not: { $ref: '#/components/schemas/ConditionRule' }
            eq: { type: array, minItems: 2, maxItems: 2, items: {} }
            in: { type: array, minItems: 2, maxItems: 2, items: {} }
            is_yes: { type: string, description: 'Operand path, e.g. site.scope_tower_erection.' }
            is_na: { type: string }
            count: { type: object, additionalProperties: true }
            lookup: { type: object, additionalProperties: true }

    # ================================================================ v0.2 additions
    Department:
      type: object
      required: [id, code, name_en, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        is_active: { type: boolean }
        member_count: { type: integer }
    DepartmentInput:
      type: object
      additionalProperties: false
      required: [code, name_en, reason]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_]{2,20}$', description: 'Stored in upper case.' }
        name_en: { type: string, minLength: 1, maxLength: 120 }
        name_ar: { type: [string, 'null'], maxLength: 120 }
        is_active: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    DepartmentRef:
      type: object
      required: [id, code, name_en]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
    MessageContacts:
      type: object
      required: [manager, reports, can_message_anyone]
      properties:
        manager: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        reports: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        can_message_anyone: { type: boolean }
    MessageThreadSummary:
      type: object
      required: [id, subject, other, last_message_at, unread]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        other: { $ref: '#/components/schemas/UserRef' }
        started_by_me: { type: boolean }
        last_message_at: { type: string, format: date-time }
        last_message_preview: { type: string, maxLength: 140 }
        last_author: { $ref: '#/components/schemas/UserRef' }
        reply_count: { type: integer }
        unread: { type: boolean }
    MessageItem:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserRef' }
        body: { type: string }
        created_at: { type: string, format: date-time }
    MessageThread:
      type: object
      required: [id, subject, participants, original, replies]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        participants: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        original: { $ref: '#/components/schemas/MessageItem' }
        replies: { type: array, description: 'Newest first.', items: { $ref: '#/components/schemas/MessageItem' } }
        last_read_at: { type: [string, 'null'], format: date-time, description: 'My last read time; replies after it are new.' }
    AnnouncementAudience:
      type: object
      additionalProperties: false
      properties:
        all: { type: boolean, default: false }
        user_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
        group_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        role_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        department_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
    AnnouncementInput:
      type: object
      additionalProperties: false
      required: [title, body, audience]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        audience: { $ref: '#/components/schemas/AnnouncementAudience' }
    AnnouncementSummary:
      type: object
      required: [id, title, created_at, created_by, recipient_count, agree_count, disagree_count, pending_count]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { $ref: '#/components/schemas/UserRef' }
        recipient_count: { type: integer }
        agree_count: { type: integer }
        disagree_count: { type: integer }
        pending_count: { type: integer }
    AnnouncementDetail:
      allOf:
        - $ref: '#/components/schemas/AnnouncementSummary'
        - type: object
          required: [body, audience]
          properties:
            body: { type: string }
            audience:
              type: object
              properties:
                all: { type: boolean }
                users: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
                groups: { type: array, items: { $ref: '#/components/schemas/GroupRef' } }
                roles: { type: array, items: { $ref: '#/components/schemas/RoleRef' } }
                departments: { type: array, items: { $ref: '#/components/schemas/DepartmentRef' } }
    AnnouncementResponse:
      type: object
      required: [user, decision]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        department: { oneOf: [{ $ref: '#/components/schemas/DepartmentRef' }, { type: 'null' }] }
        decision: { type: string, enum: [agree, disagree, pending] }
        note: { type: [string, 'null'] }
        responded_at: { type: [string, 'null'], format: date-time }
    PendingAnnouncement:
      type: object
      required: [id, title, body, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { $ref: '#/components/schemas/UserRef' }
    WithReason:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
    LocalUserCreate:
      type: object
      additionalProperties: false
      required: [display_name, email, reason]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        employee_id: { oneOf: [{ $ref: '#/components/schemas/EmployeeId' }, { type: 'null' }] }
        phone: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{7,14}$', description: 'E.164, for example +218911234567.' }
        temporary_password: { type: string, format: password, minLength: 12, maxLength: 128, description: 'Omit to have the server generate one.' }
        reason: { $ref: '#/components/schemas/Reason' }
    LocalUserCreated:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: '#/components/schemas/User' }
        temporary_password: { type: string, description: 'Shown once. Hand it to the user by a separate channel.' }
    # ---------------------------------------------------------- staff registry
    StaffField:
      type: string
      enum: [email, phone]
      description: Personal-data fields that follow visibility settings.
    StaffRegion:
      type: string
      enum: [Tripoli, Middle, WM, Zawia, Benghazi, GM, Sebha, All]
    StaffMemberFields:
      type: object
      properties:
        name_en: { type: string, minLength: 2 }
        name_ar: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, description: 'Registry format `+218 9X XXX XXXX`. Unique.' }
        position: { type: string }
        team: { $ref: '#/components/schemas/TeamKind' }
        main_role: { type: [string, 'null'], description: 'Starting value only; real roles come from assignments.' }
        region: { $ref: '#/components/schemas/StaffRegion' }
        notes: { type: [string, 'null'] }
        hidden_fields:
          type: array
          items: { $ref: '#/components/schemas/StaffField' }
          description: Fields hidden for this one employee from everyone except admins.
    StaffMember:
      description: Full registry row. Returned only to callers allowed to administer the registry.
      allOf:
        - $ref: '#/components/schemas/StaffMemberFields'
        - type: object
          required: [employee_id, name_en, name_ar, email, phone, position, team, region, status, version]
          properties:
            employee_id: { $ref: '#/components/schemas/EmployeeId' }
            status: { type: string, enum: [active, inactive] }
            linked_user: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            version: { type: integer }
            updated_at: { type: string, format: date-time }
            updated_by: { $ref: '#/components/schemas/UserRef' }
    StaffMemberInput:
      allOf:
        - $ref: '#/components/schemas/StaffMemberFields'
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [employee_id, name_en, name_ar, email, phone, position, team, region]
          properties:
            employee_id: { $ref: '#/components/schemas/EmployeeId' }
    StaffMemberPatch:
      description: '`employee_id` cannot change; deactivate and add a new row instead.'
      allOf:
        - $ref: '#/components/schemas/StaffMemberFields'
        - $ref: '#/components/schemas/WithReason'
        - type: object
          minProperties: 2
    StaffCard:
      description: Hover-card payload. The server applies field visibility; a hidden field is null and named in `hidden_fields`, and the UI shows "Not visible to you".
      type: object
      required: [employee_id, name_en, name_ar, position, team, region, status, hidden_fields, version]
      properties:
        employee_id: { $ref: '#/components/schemas/EmployeeId' }
        name_en: { type: string }
        name_ar: { type: string }
        position: { type: string }
        team: { $ref: '#/components/schemas/TeamKind' }
        region: { $ref: '#/components/schemas/StaffRegion' }
        status: { type: string, enum: [active, inactive], description: 'inactive shows an "Inactive" badge.' }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        hidden_fields: { type: array, items: { $ref: '#/components/schemas/StaffField' } }
        version: { type: integer, description: 'Row version for If-Match (admins).' }
    StaffFieldVisibility:
      type: object
      required: [default_visible, allow, deny]
      properties:
        default_visible: { type: boolean, description: 'true = every signed-in Aljeel employee sees the field (default).' }
        allow: { type: array, items: { $ref: '#/components/schemas/MatrixAssignee' }, description: 'Roles, groups or persons who see it when `default_visible` is false.' }
        deny: { type: array, items: { $ref: '#/components/schemas/MatrixAssignee' }, description: 'Roles, groups or persons who never see it. Deny wins over allow and default.' }
    StaffVisibility:
      type: object
      required: [fields, version]
      properties:
        fields:
          type: object
          required: [email, phone]
          properties:
            email: { $ref: '#/components/schemas/StaffFieldVisibility' }
            phone: { $ref: '#/components/schemas/StaffFieldVisibility' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: '#/components/schemas/UserRef' }
    StaffVisibilityInput:
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [fields]
          properties:
            fields:
              type: object
              minProperties: 1
              properties:
                email: { $ref: '#/components/schemas/StaffFieldVisibility' }
                phone: { $ref: '#/components/schemas/StaffFieldVisibility' }
    # ---------------------------------------------------------- templates and import batches
    Template:
      type: object
      required: [template_id, name_en, kind, current_version, is_active]
      properties:
        template_id: { type: string, examples: [TPL-SITE, TPL-STAFF, TPL-HOLIDAYS, TPL-ROLES] }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        kind: { type: string, enum: [data_import, assignment_import, config_import, master] }
        module_key: { $ref: '#/components/schemas/ModuleKey' }
        register_key: { type: [string, 'null'], description: 'The register the template enters (`gecol` for TPL-GECOL). Null for a Site Register stream template or TPL-MASTER.' }
        stream: { type: [string, 'null'], description: 'The stream of a Site Register stream template (Q73): DESIGN_ACQ, CW, TE or CLOSURE. Not built yet.' }
        current_version: { type: integer, minimum: 1, description: 'Shown as "v3". Exactly one version is current; older versions are rejected on upload. A new version is issued by the database when the register''s fields or custom fields change.' }
        field_set_version: { type: [integer, 'null'], description: 'Custom-field set the current version was built from (ADR 0009 §4).' }
        issued_at: { type: string, format: date-time }
        is_active: { type: boolean }
        versions:
          type: array
          items:
            type: object
            required: [version, issued_at]
            properties:
              version: { type: integer }
              issued_at: { type: string, format: date-time }
              reason: { type: [string, 'null'], description: 'For example "custom field added".' }
    TemplateRejectReason:
      type: string
      description: Closed list returned as `reason` on 422 `template_rejected`. Each rejection is also written to the System Log (`source = template-check`).
      enum: [size_or_rows_exceeded, tpl_missing, template_unknown_or_inactive, outdated_version, wrong_template, checksum_mismatch, import_not_allowed, not_xlsx, macros_not_allowed, tpl_invalid]
    ImportBatchOutcome:
      type: object
      description: What a send or a decision did. `held` lists the rows held `pending_previous_approval`; `failed` the rows that could not be sent or decided.
      properties:
        submitted: { type: integer, description: Rows sent into the flow (submit only). }
        decided: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        held:
          type: array
          items:
            type: object
            required: [row_id, row_no, reason]
            properties:
              row_id: { type: string, format: uuid }
              row_no: { type: integer }
              key: { type: [string, 'null'] }
              reason: { type: string, enum: [open_version] }
              record_id: { type: [string, 'null'], format: uuid, description: The open version that blocks the row. }
        failed:
          type: array
          items:
            type: object
            required: [row_id, row_no, code]
            properties:
              row_id: { type: string, format: uuid }
              row_no: { type: integer }
              key: { type: [string, 'null'] }
              code: { type: string }
              message: { type: string }
    ImportBatch:
      type: object
      required: [id, template_id, template_version, status, counts, version]
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string }
        template_version: { type: integer }
        source: { type: string, enum: [template, master_import, legacy_master] }
        file_name: { type: string }
        status:
          type: string
          enum: [parsing, validated, in_review, in_approval, partially_approved, approved, rejected, applied, undone, failed, discarded]
          description: |
            `validated`: staged, waiting for the uploader. `in_approval`: sent; the records wait for L2. `partially_approved`: some rows decided. `approved`: every row decided, at least one approved. `rejected`: every row returned. `discarded`: closed before it was sent.
            The status follows the rows and the records they created, so an approval made in the register screen counts too. `in_review`, `applied` and `undone` are not used for registers (two fixed levels; undo is not built).
        current_level: { type: integer, description: '1 while the batch waits for the uploader (L1 Data Entry), 2 once it is sent (L2 Data Reviewer & Approver).' }
        levels_required: { type: integer, description: Always 2. }
        register_key: { type: [string, 'null'] }
        note: { type: [string, 'null'], description: The last note of a return. }
        counts:
          type: object
          properties:
            create: { type: integer }
            update: { type: integer }
            unchanged: { type: integer }
            error: { type: integer }
            pending: { type: integer }
            approved: { type: integer }
            rejected: { type: integer }
            held: { type: integer, description: Rows held `pending_previous_approval`. }
        job_id: { type: [string, 'null'], description: 'Parse job (`GET /jobs/{job_id}`) while status is `parsing`.' }
        task_id: { type: [string, 'null'], format: uuid, description: 'Set when the file was uploaded from beside a task.' }
        site_id: { type: [string, 'null'], format: uuid, description: 'The task''s site when `task_id` is set.' }
        uploaded_by: { $ref: '#/components/schemas/UserRef' }
        uploaded_at: { type: string, format: date-time }
        version: { type: integer }
    ImportRow:
      type: object
      required: [id, row_no, action, decision]
      properties:
        id: { type: string, format: uuid }
        sheet: { type: string }
        row_no: { type: integer }
        key: { type: [string, 'null'], description: 'Human key (site code, employee ID, date).' }
        site_code: { type: [string, 'null'], description: The Site ID typed in the row. }
        record_type: { type: [string, 'null'] }
        record_id: { type: [string, 'null'], format: uuid, description: 'The register record created for the row once the batch was sent (read it with GET /registers/{register_key}/records/{id}).' }
        action: { type: string, enum: [create, update, unchanged, error] }
        diff:
          type: object
          description: 'Field code to old/new values. A `create` row lists every value with `old` null.'
          additionalProperties:
            type: object
            properties:
              old: {}
              new: {}
        errors:
          type: array
          items:
            type: object
            required: [code]
            properties:
              column: { type: string, description: The header of the column in the file. }
              field: { type: string, description: The code of the field. }
              code: { type: string, description: 'For example `site_not_in_scope`, `invalid_date`, `not_in_list`, `required`, `duplicate_in_file`, `formula_not_allowed`, `not_entry_holder`, `action_forbidden`, `stale_base`, or a register rule (`in_house_with_pr`).' }
              message: { type: string }
        decision: { type: string, enum: [pending, approved, rejected, pending_previous_approval] }
        hold_reason: { type: string, enum: [open_version], description: Why a row is held `pending_previous_approval`. }
        decided_by: { $ref: '#/components/schemas/UserRef' }
        note: { type: [string, 'null'] }
    ImportDecisionRequest:
      type: object
      required: [action, scope]
      properties:
        action: { type: string, enum: [review, approve, reject, discard], description: 'The action of the caller on the batch: `approve` (L2), `review` (a legacy middle level), `reject` (return with a note) or `discard` (a batch that was not sent).' }
        scope: { type: string, enum: [all, rows], description: '`all` decides every undecided valid row at once; `rows` uses `rows[]`.' }
        rows:
          type: array
          items:
            type: object
            required: [row_id, decision]
            properties:
              row_id: { type: string, format: uuid }
              decision: { type: string, enum: [approved, rejected] }
              note: { type: string, maxLength: 1000 }
        note: { type: string, maxLength: 2000, description: 'Required when `action` is reject.' }
    # ---------------------------------------------------------- absences and reassignment
    Absence:
      type: object
      required: [id, user, kind, from_date, to_date, version]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserRef' }
        kind: { type: string, enum: [annual, sick, emergency, other] }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 500 }
        recorded_by: { $ref: '#/components/schemas/UserRef' }
        self_recorded: { type: boolean }
        open_task_count: { type: integer, description: 'Tasks the person holds now; drives the lead alert.' }
        version: { type: integer }
    AbsenceInput:
      type: object
      required: [kind, from_date, to_date]
      properties:
        user_id: { type: string, format: uuid, description: 'Omit for the caller. An employee records only their own `annual` leave; sick or emergency leave of others needs `reassign` for the module and region, or admin.' }
        kind: { type: string, enum: [annual, sick, emergency, other] }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        note: { type: string, maxLength: 500 }
    AbsencePatch:
      type: object
      minProperties: 1
      properties:
        kind: { type: string, enum: [annual, sick, emergency, other] }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 500 }
    ReassignRequest:
      type: object
      required: [scope, decision, reason]
      properties:
        scope:
          type: string
          enum: [task, site, person]
          description: '`task` needs `task_id`; `site` needs `site_id` and `from_user_id`; `person` needs `from_user_id` (all that person''s open tasks inside the caller''s scope).'
        task_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        from_user_id: { type: string, format: uuid }
        decision:
          type: string
          enum: [reassign, act_on_behalf, keep]
          description: |
            `reassign` changes the task-level holder to `to_user_id` (the Matrix is not changed).
            `act_on_behalf` lets the caller act at the person's level; later actions are logged "lead on behalf of the assignee".
            `keep` records that the lead looked and left the person on it; it silences the alert for the idle window.
            None of them resets or pauses the SLA or stage progress (B12b).
        to_user_id: { type: string, format: uuid, description: 'Required for `reassign`; must be an eligible holder, else `not_eligible_holder`.' }
        reason: { $ref: '#/components/schemas/Reason' }
        dry_run: { type: boolean, default: false, description: 'Returns the BulkResult without writing.' }
    ActOnBehalfRequest:
      type: object
      required: [action, level, reason]
      properties:
        action: { type: string, enum: [submit, review, approve, reject], description: 'The transition to perform, with the semantics of `POST /tasks/{task_id}/{action}`.' }
        level: { type: integer, minimum: 1, description: 'The current level (guards against a stale screen).' }
        reason: { $ref: '#/components/schemas/Reason' }
        note: { type: string, maxLength: 2000, description: 'Transition note; mandatory for `reject`.' }
    ReassignmentAlert:
      type: object
      required: [task, cause]
      properties:
        task: { $ref: '#/components/schemas/TaskSummary' }
        cause: { type: string, enum: [absent, idle, holder_deactivated], description: '`holder_deactivated` (B14): the holder''s account is deactivated or deleted; see `holder_account_status`.' }
        holder_account_status: { $ref: '#/components/schemas/UserAccountStatus' }
        holder: { $ref: '#/components/schemas/UserRef' }
        absence: { oneOf: [{ $ref: '#/components/schemas/Absence' }, { type: 'null' }] }
        idle_working_days: { type: [integer, 'null'] }
    TeamScopeMatchRow:
      type: object
      additionalProperties: false
      required: [scope, allowed]
      properties:
        scope: { type: string, minLength: 1, maxLength: 60, description: 'An order scope of Procurement (the scope list), for example CW or TE Installation.' }
        exempt: { type: boolean, default: false, description: 'true = no team check for this scope (seed: HLC).' }
        allowed:
          type: array
          maxItems: 30
          description: 'The specializations whose teams may take an order of this scope. Empty = no team is accepted.'
          items: { type: string, minLength: 1, maxLength: 60 }
    TeamScopeMatchInput:
      type: object
      required: [specializations, scopes]
      properties:
        specializations:
          type: array
          maxItems: 30
          description: 'The columns, in order: the team specializations of the Contractors register (compared trimmed and case-insensitively).'
          items: { type: string, minLength: 1, maxLength: 60 }
        scopes:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/TeamScopeMatchRow' }
    TeamScopeMatch:
      description: '0.9.1 (Q97). Seed: CW, Tower Erection, Site Adaption, CW Dismantle and GECOL allow CW; TE Installation allows TE; TE Dismantle allows CW and TE; STA and ST allow none; HLC is exempt.'
      allOf:
      - {$ref: '#/components/schemas/TeamScopeMatchInput'}
      - type: object
        required: [version]
        properties:
          version: { type: integer, minimum: 1 }
          updated_at: { type: string, format: date-time }
          updated_by: { anyOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    IdleTaskAlertSetting:
      type: object
      required: [enabled, working_days, version]
      properties:
        enabled: { type: boolean }
        working_days: { type: integer, minimum: 1, maximum: 30, description: 'Default 2.' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: '#/components/schemas/UserRef' }
    # ---------------------------------------------------------- MFA exemption
    MfaExemption:
      type: object
      required: [user, exempt]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        exempt: { type: boolean }
        until: { type: [string, 'null'], format: date-time, description: 'null while exempt = until revoked.' }
        reason: { type: [string, 'null'] }
        granted_by: { $ref: '#/components/schemas/UserRef' }
        granted_at: { type: [string, 'null'], format: date-time }
    # ---------------------------------------------------------- calendar
    Holiday:
      type: object
      required: [id, date, name_en, kind, tentative, version]
      properties:
        id: { type: string, format: uuid }
        calendar_code: { type: string }
        date: { type: string, format: date }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        kind: { type: string, enum: [national, religious] }
        tentative: { type: boolean, description: 'Religious dates stay tentative until the admin confirms the official announcement.' }
        confirmed_at: { type: [string, 'null'], format: date-time }
        confirmed_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        version: { type: integer }
    HolidayInput:
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [date, name_en, kind]
          properties:
            calendar_code: { type: string, description: 'Default calendar when omitted.' }
            date: { type: string, format: date }
            name_en: { type: string, minLength: 2 }
            name_ar: { type: string }
            kind: { type: string, enum: [national, religious] }
            tentative: { type: boolean, default: false }
    HolidayPatch:
      type: object
      required: [reason]
      minProperties: 2
      properties:
        date: { type: string, format: date }
        name_en: { type: string, minLength: 2 }
        name_ar: { type: string }
        kind: { type: string, enum: [national, religious] }
        reason: { $ref: '#/components/schemas/Reason' }
    HolidayChangeResult:
      type: object
      required: [holiday, affected_open_tasks]
      properties:
        holiday: { $ref: '#/components/schemas/Holiday' }
        affected_open_tasks: { type: integer, description: 'Open tasks whose SLA due dates were recalculated. Closed tasks keep their values (ADR 0007 §6).' }
        recalculation_job_id: { type: [string, 'null'] }
    HolidaySummary:
      type: object
      required: [tentative_count, next_year, next_year_table_empty]
      properties:
        tentative_count: { type: integer }
        next_tentative_date: { type: [string, 'null'], format: date }
        tentative_reminder_due: { type: boolean, description: 'A tentative date falls within 14 days.' }
        next_year: { type: integer }
        next_year_table_empty: { type: boolean, description: 'Drives the empty-table banner.' }
    WeekendDaysRequest:
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [weekend_days]
          properties:
            calendar_code: { type: string }
            weekend_days: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 }, description: '0 = Sunday. Default [5, 6].' }
    WeekendDaysResult:
      type: object
      required: [calendar_code, weekend_days, affected_open_tasks, version]
      properties:
        calendar_code: { type: string }
        weekend_days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        affected_open_tasks: { type: integer }
        version: { type: integer }
    # ---------------------------------------------------------- freeze and DLP
    StructuralFreeze:
      type: object
      required: [active, version]
      properties:
        active: { type: boolean, description: 'true while today is inside the window and the freeze is not lifted. Structural workflow changes then answer 409 `freeze_active`.' }
        starts_on: { type: [string, 'null'], format: date, description: 'Pilot start.' }
        ends_on: { type: [string, 'null'], format: date, description: 'End of the parallel-run month.' }
        lifted: { type: boolean }
        lifted_at: { type: [string, 'null'], format: date-time }
        lifted_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        lift_reason: { type: [string, 'null'] }
        blocked_operations: { type: array, items: { type: string }, description: 'operationIds refused while active.' }
        version: { type: integer }
    StructuralFreezeInput:
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [starts_on, ends_on]
          properties:
            starts_on: { type: string, format: date }
            ends_on: { type: string, format: date }
    DlpVersion:
      type: object
      required: [version, cw_months, te_months, effective_from]
      properties:
        version: { type: integer }
        cw_months: { type: integer, minimum: 0, maximum: 120, description: 'Setting `dlp.months.cw`, default 3.' }
        te_months: { type: integer, minimum: 0, maximum: 120, description: 'Setting `dlp.months.te`, default 12.' }
        effective_from: { type: string, format: date }
        reason: { type: [string, 'null'] }
        changed_by: { $ref: '#/components/schemas/UserRef' }
        changed_at: { type: string, format: date-time }
    DlpSettings:
      type: object
      required: [current, history]
      properties:
        current: { $ref: '#/components/schemas/DlpVersion' }
        history: { type: array, items: { $ref: '#/components/schemas/DlpVersion' }, description: 'A PAC keeps the version in force on its issue date.' }
    DlpVersionInput:
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [cw_months, te_months, effective_from]
          properties:
            cw_months: { type: integer, minimum: 0, maximum: 120 }
            te_months: { type: integer, minimum: 0, maximum: 120 }
            effective_from: { type: string, format: date }
    # ---------------------------------------------------------- registers (B11) and Dismantle
    RegisterKey:
      type: string
      enum: [procurement, contractors, gecol, hlc, permits_hse, warehouse, quality, issues, risks, change_control, readiness_handover, as_built, meetings, dismantle]
    RegisterField:
      type: object
      required: [code, label_en, type]
      properties:
        code: { type: string }
        label_en: { type: string }
        label_ar: { type: [string, 'null'] }
        type: { type: string, enum: [text, number, date, list, multi_list, yes_no, user, external_party, file] }
        required: { type: boolean }
        read_only: { type: boolean, description: 'Field-level rule for the caller.' }
        in_list: { type: boolean }
        is_custom: { type: boolean }
        section: { type: [string, 'null'], description: '0.4.6. The form section of a base field (for example `Request`, `Validity`, `PTW checks`), in English, in the order of the fields. Absent for custom fields.' }
        options:
          type: array
          items:
            type: object
            required: [value, label_en]
            properties:
              value: { type: string }
              label_en: { type: string }
              label_ar: { type: [string, 'null'] }
    RegisterDefinition:
      type: object
      required: [register_key, name_en, module_key, site_scoped, approval_levels, fields]
      properties:
        register_key: { $ref: '#/components/schemas/RegisterKey' }
        name_en: { type: string }
        name_ar: { type: [string, 'null'] }
        module_key: { $ref: '#/components/schemas/ModuleKey' }
        site_scoped: { type: boolean, description: 'false = global rows (risks, meetings, project-wide change requests).' }
        multiple_per_site: { type: boolean }
        record_types: { type: array, items: { type: string }, description: 'For example pr, po, wo for procurement.' }
        approval_levels: { type: integer, const: 2, description: 'Always 2 since 0.6.1 (L1 Data Entry, L2 Data Reviewer & Approver), from the register row of the Responsibility Matrix.' }
        fields: { type: array, items: { $ref: '#/components/schemas/RegisterField' }, description: 'Base fields plus active custom fields visible to the caller.' }
        record_count: { type: integer }
        entry_scopes:
          type: array
          items: { type: string }
          description: '0.9.0. Only for a register whose scopes have their own Matrix rows (Procurement: scope HLC is entered by the HLC Fiber Team). The values of the `scope` list the caller may enter (empty = none). The server decides again on every write.'
    RegisterRecordState:
      type: string
      enum: [entry, in_review, in_approval, approved, voided]
    RegisterRecord:
      type: object
      required: [id, register_key, state, data, version]
      properties:
        id: { type: string, format: uuid }
        register_key: { $ref: '#/components/schemas/RegisterKey' }
        record_type: { type: [string, 'null'] }
        site_id: { type: [string, 'null'], format: uuid }
        site_code: { type: [string, 'null'] }
        region_id: { oneOf: [{ $ref: '#/components/schemas/RegionId' }, { type: 'null' }] }
        state: { $ref: '#/components/schemas/RegisterRecordState' }
        current_level: { type: integer }
        levels_required: { type: integer }
        ball_in_court: { $ref: '#/components/schemas/BallInCourt' }
        data: { type: object, additionalProperties: true, description: 'Base fields keyed by `RegisterField.code`.' }
        custom: { $ref: '#/components/schemas/CustomValues' }
        external_party: { $ref: '#/components/schemas/ExternalPartyRef' }
        return_count: { type: integer }
        last_return_note: { type: [string, 'null'] }
        allowed_actions: { type: array, items: { type: string, enum: [edit, submit, review, approve, reject, void, claim, release, new_version] } }
        entity_id: { type: string, format: uuid, description: 'The logical record; every version of it shares this id. The approved values are projected into the register table with the same id.' }
        version_no: { type: integer, minimum: 1, description: 'Business version of the logical record (1, 2, 3 ...). Not the ETag.' }
        supersedes_id: { type: [string, 'null'], format: uuid }
        is_current: { type: boolean, description: 'The approved version that is in force.' }
        task:
          type: object
          description: 'Q43: the task this record is the source of (set at the first submission). Review and approval then follow the task''s Matrix row, and the final approval fills the task''s date and approves it.'
          required: [id, task_code]
          properties:
            id: { type: string, format: uuid }
            task_code: { type: string }
        self_approval: { type: boolean }
        approved_by: { $ref: '#/components/schemas/UserRef' }
        approved_at: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [manual, template] }
        warnings:
          type: array
          items:
            type: object
            required: [path, code]
            properties:
              path: { type: string, description: 'JSON pointer of the field, as in `Problem.errors`.' }
              code: { type: string }
              message: { type: string }
          description: '0.9.0. Ordering issues that do not block the record (Q96), shown to the reviewer: HLC `no_approved_hlc_pr`, `hlc_not_approved`, `before_hlc_approval`, `before_link_received`, `test_without_installation`, `in_service_without_test`; Procurement scope HLC `approval_before_pr`. Empty when there is none.'
        last_transition:
          type: object
          description: Present on the answer of a transition (submit, review, approve, reject, claim, release).
          properties:
            step_ids: { type: array, items: { type: string, format: uuid } }
            skipped_levels: { type: array, items: { type: integer } }
            unlocked_task_ids: { type: array, items: { type: string, format: uuid } }
            votes_missing: { type: integer }
            returned_to_level: { type: integer }
        created_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, description: 'ETag (If-Match).' }
    RegisterRecordStep:
      type: object
      required: [id, level, action, created_at]
      properties:
        id: { type: string, format: uuid }
        level: { type: integer }
        action: { type: string, enum: [create, edit, submit, review, approve, reject, auto_skip, claim, release, new_version, void] }
        acted_by: { $ref: '#/components/schemas/UserRef' }
        note: { type: [string, 'null'] }
        before_state: { $ref: '#/components/schemas/RegisterRecordState' }
        after_state: { $ref: '#/components/schemas/RegisterRecordState' }
        self_approval: { type: boolean }
        stepup_verified: { type: boolean }
        batch_row_id: { type: [string, 'null'], format: uuid, description: 'Set when the version came from a template batch.' }
        created_at: { type: string, format: date-time }
    RegisterRecordInput:
      type: object
      required: [data]
      properties:
        site_id: { type: string, format: uuid, description: 'Required when the register is site scoped.' }
        record_type: { type: string }
        data: { type: object, additionalProperties: true }
        custom: { $ref: '#/components/schemas/CustomValues' }
        external_party_id: { type: [string, 'null'], format: uuid }
    RegisterRecordPatch:
      type: object
      minProperties: 1
      properties:
        data: { type: object, additionalProperties: true }
        custom: { $ref: '#/components/schemas/CustomValues' }
        external_party_id: { type: [string, 'null'], format: uuid }
    # ---------------------------------------------------------- Document Library
    PhotoRules:
      type: object
      properties:
        min_count: { type: integer, minimum: 0 }
        shot_types: { type: array, items: { type: string } }
        formats: { type: array, items: { type: string, enum: [JPG, PNG, HEIC] } }
        max_size_mb: { type: integer }
    DocumentPlacement:
      type: object
      required: [target, ref]
      properties:
        target: { type: string, enum: [task, qc, register] }
        ref: { type: string, description: 'Task code, snag type code or register key.' }
    FormKind:
      type: string
      enum: [dn, rn, pac, fac, snag_list]
      description: CW forms issued by the system. TE forms are deferred (classification pending).
    DocumentTypeFields:
      type: object
      properties:
        kind: { type: string, enum: [scanned_document, photo, email, report, excel_template, generated_form] }
        name_en: { type: string, minLength: 2 }
        name_ar: { type: [string, 'null'] }
        placements: { type: array, items: { $ref: '#/components/schemas/DocumentPlacement' } }
        mandatory: { type: boolean }
        condition_rule: { $ref: '#/components/schemas/ConditionRule' }
        formats: { type: array, items: { type: string } }
        max_size_mb: { type: integer, default: 20 }
        min_files: { type: integer, default: 1 }
        max_files: { type: [integer, 'null'] }
        photo_rules: { oneOf: [{ $ref: '#/components/schemas/PhotoRules' }, { type: 'null' }] }
        expiry_tracked: { type: boolean, description: 'The slot asks for a `valid_to` date.' }
        blank_form_file_id: { type: [string, 'null'], format: uuid }
        form_kind: { oneOf: [{ $ref: '#/components/schemas/FormKind' }, { type: 'null' }], description: 'Set when kind = generated_form.' }
        is_active: { type: boolean, description: 'Deactivate instead of delete.' }
    DocumentType:
      allOf:
        - $ref: '#/components/schemas/DocumentTypeFields'
        - type: object
          required: [id, code, kind, name_en, is_active, version]
          properties:
            id: { type: string, format: uuid }
            code: { type: string, description: 'Stable, for example A2, B7, CW_PAC.' }
            version: { type: integer, description: 'Row version (ETag).' }
            published_version: { type: integer, description: 'Library version tasks snapshot on open (ADR 0007 §4). 0 = never published (not on any task yet).' }
            has_unpublished_changes: { type: boolean }
            needs_review: { type: boolean, description: 'Seeded from the blueprint and the Master (stages 4 to 10) and not yet reviewed by the product owner; cleared by the first publish.' }
            open_task_count: { type: integer, description: 'Only on `GET /document-library/{doc_type_id}`: pending or ongoing tasks an "also open tasks" publish would reach.' }
            updated_at: { type: string, format: date-time }
            updated_by: { $ref: '#/components/schemas/UserRef' }
    DocumentTypeInput:
      allOf:
        - $ref: '#/components/schemas/DocumentTypeFields'
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [code, kind, name_en, placements]
          properties:
            code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,30}$' }
    DocumentTypePatch:
      allOf:
        - $ref: '#/components/schemas/DocumentTypeFields'
        - $ref: '#/components/schemas/WithReason'
        - type: object
          minProperties: 2
    DocumentTypeVersion:
      type: object
      required: [version_no, published_at, apply_to, spec]
      properties:
        version_no: { type: integer }
        published_at: { type: string, format: date-time }
        published_by: { $ref: '#/components/schemas/UserRef' }
        effective_from: { type: string, format: date }
        apply_to: { type: string, enum: [new_only, open_too] }
        reason: { type: string }
        affected_open_tasks: { type: integer }
        spec: { $ref: '#/components/schemas/DocumentTypeFields' }
    DocumentListItem:
      type: object
      required: [file, slot_id, slot_status, doc_code, doc_name_en, kind, site_id, site_code, region_id]
      properties:
        file: { $ref: '#/components/schemas/DocumentFile' }
        slot_id: { type: string, format: uuid }
        slot_status: { type: string, enum: [missing, uploaded, in_review, approved, rejected, not_required] }
        candidate_label: { type: [string, 'null'] }
        doc_code: { type: string }
        doc_name_en: { type: string }
        doc_name_ar: { type: [string, 'null'] }
        kind: { type: string, enum: [scanned_document, photo, email, report, excel_template, generated_form] }
        task_id: { type: [string, 'null'], format: uuid }
        task_code: { type: [string, 'null'] }
        task_name: { type: [string, 'null'] }
        stage_code: { type: [string, 'null'] }
        stage_name: { type: [string, 'null'] }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        site_name: { type: [string, 'null'] }
        region_id: { $ref: '#/components/schemas/RegionId' }
    ZipExportRequest:
      type: object
      additionalProperties: false
      description: At least one of `site_id`, `stage_code`, `doc_code` or `file_ids`.
      properties:
        site_id: { type: string, format: uuid }
        stage_code: { type: string }
        doc_code: { type: string }
        file_ids: { type: array, minItems: 1, maxItems: 5000, items: { type: string, format: uuid } }
        slot_status: { type: string, enum: [uploaded, in_review, approved, rejected] }
        include_superseded: { type: boolean, default: false }
    PublishRequest:
      description: Common publish body (ADR 0007 §1).
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [effective_from, apply_to]
          properties:
            effective_from: { type: string, format: date }
            apply_to: { type: string, enum: [new_only, open_too] }
    PublishResult:
      type: object
      required: [affected_open_tasks]
      properties:
        published_version: { type: integer }
        affected_open_tasks: { type: integer, description: 'For the confirmation dialog; approved tasks are never touched.' }
    # ---------------------------------------------------------- generated forms
    FormLine:
      type: object
      required: [item_id, qty]
      properties:
        item_id: { type: string, format: uuid }
        description: { type: string }
        uom: { type: string }
        qty_approved: { type: [number, 'null'] }
        qty: { type: number, description: 'Dispatched (DN) or returned (RN) quantity.' }
        serials: { type: array, items: { type: string } }
        remarks: { type: [string, 'null'] }
    GeneratedFormFields:
      type: object
      properties:
        contractor_id: { type: [string, 'null'], format: uuid }
        po_wo_ref: { type: [string, 'null'] }
        warehouse: { type: [string, 'null'] }
        lines: { type: array, items: { $ref: '#/components/schemas/FormLine' }, description: 'DN and RN. Only lines with a quantity are printed.' }
        blank_rows: { type: integer, minimum: 0, description: 'Defaults to the form template setting.' }
        reference_form_id: { type: [string, 'null'], format: uuid, description: 'FAC references its PAC; filled automatically when omitted.' }
        notes: { type: [string, 'null'] }
    GeneratedFormInput:
      allOf:
        - $ref: '#/components/schemas/GeneratedFormFields'
        - type: object
          required: [form_kind, site_id]
          properties:
            form_kind: { $ref: '#/components/schemas/FormKind' }
            site_id: { type: string, format: uuid }
    GeneratedFormPatch:
      allOf:
        - $ref: '#/components/schemas/GeneratedFormFields'
        - type: object
          minProperties: 1
    GeneratedForm:
      allOf:
        - $ref: '#/components/schemas/GeneratedFormFields'
        - type: object
          required: [id, form_kind, site_id, site_code, status, version]
          properties:
            id: { type: string, format: uuid }
            form_kind: { $ref: '#/components/schemas/FormKind' }
            site_id: { type: string, format: uuid }
            site_code: { type: string }
            region_id: { $ref: '#/components/schemas/RegionId' }
            status: { type: string, enum: [prepared, generated, voided] }
            number: { type: [string, 'null'], examples: ['DN-CW-TR-2026-0001'] }
            template_version: { type: [integer, 'null'] }
            contractor: { $ref: '#/components/schemas/ExternalPartyRef' }
            boq_lines: { type: array, items: { $ref: '#/components/schemas/FormLine' }, description: 'PAC only: net quantities on site (DN minus RN).' }
            snags: { type: array, items: { $ref: '#/components/schemas/Snag' }, description: 'PAC and snag list.' }
            signatories:
              type: array
              description: Names and positions from the Responsibility Matrix. Signatures stay blank.
              items:
                type: object
                properties:
                  label: { type: string }
                  user: { $ref: '#/components/schemas/UserRef' }
                  position: { type: [string, 'null'] }
            guard:
              type: object
              description: Why generation is blocked, if it is.
              properties:
                can_generate: { type: boolean }
                open_snag_count: { type: integer }
                code: { oneOf: [{ $ref: '#/components/schemas/ErrorCode' }, { type: 'null' }] }
            qr_url: { type: [string, 'null'] }
            pdf_file_id: { type: [string, 'null'], format: uuid }
            slot_id: { type: [string, 'null'], format: uuid, description: 'Slot that receives the signed scan.' }
            generated_at: { type: [string, 'null'], format: date-time }
            generated_by: { $ref: '#/components/schemas/UserRef' }
            voided_at: { type: [string, 'null'], format: date-time }
            void_reason: { type: [string, 'null'] }
            replaced_by_id: { type: [string, 'null'], format: uuid }
            replaces_id: { type: [string, 'null'], format: uuid }
            stock_movement_id: { type: [string, 'null'], format: uuid }
            version: { type: integer }
    VoidFormRequest:
      allOf:
        - $ref: '#/components/schemas/WithReason'
        - type: object
          properties:
            reissue: { type: boolean, default: false, description: 'Also generate a replacement with a new number from the same data.' }
    VoidFormResult:
      type: object
      required: [voided]
      properties:
        voided: { $ref: '#/components/schemas/GeneratedForm' }
        reissued: { oneOf: [{ $ref: '#/components/schemas/GeneratedForm' }, { type: 'null' }] }
    FormTemplate:
      type: object
      required: [form_kind, current_version, versions]
      properties:
        form_kind: { $ref: '#/components/schemas/FormKind' }
        name_en: { type: string }
        current_version: { type: integer }
        blank_rows_default: { type: integer }
        placeholders: { type: array, items: { type: string }, description: 'Bindings the HTML template may use.' }
        versions:
          type: array
          items:
            type: object
            required: [version, uploaded_at]
            properties:
              version: { type: integer }
