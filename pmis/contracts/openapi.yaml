              schema: {$ref: '#/components/schemas/LogRetention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [settings]
      operationId: setLogRetention
      summary: Set the retention days of the System Log and the security log
      description: |
        Closed schema: `audit_log_years` or any other key is 422 `validation_failed`; a value below its minimum is 422 with the field error.
        **Reducing** any value needs step-up and emits the mandatory alert `retention_reduced` to the System Admins (in-app and email); raising a value needs no step-up. Every change is audited with before and after values and the reason. The purge job applies the new value on its next run.
      x-step-up: when any value is smaller than the current one (retention reduced)
      x-db-path: admin_set_setting
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogRetentionInput'}
      responses:
        '200':
          description: Saved.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogRetention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
