openapi: 3.1.0
info:
  title: GSDN PMIS API
  version: 0.3.1
  summary: Contract for the web app mock phase (v0.2). P1 (sign-in, users and roles, visibility, sites, tasks, approval engine, matrix, workflow versions, audit log, settings read) plus staff registry, absences and reassignment, calendar, freeze, DLP, registers, Document Library, templates and imports, generated forms, warehouse, QC snags, custom fields, notifications, System Log and dashboard KPIs.
  description: |
    Owner: tech-lead. This file is the single source of truth for the HTTP API (CLAUDE.md "Contract first").
    The web app generates its types and MSW mocks from it (`packages/contracts`, ADR 0001).

    ## Conventions
    - **Base path** `/api/v1`. JSON property names are snake_case (ADR 0001).
    - **Auth**: session cookie `pmis_session` created by the local password sign-in (ADR 0012) or the Entra OIDC flow (ADR 0002). Unsafe methods (POST, PUT, PATCH, DELETE)
      also need the header `X-CSRF-Token` with the value from `GET /auth/session`. A future mobile client will use `bearerAuth`.
    - **Errors**: RFC 9457 `application/problem+json` (schema `Problem`). `code` is machine-readable and stable; `errors[]` lists
      field problems. Every response carries `X-Request-Id`, which is also written to the System Log.
    - **Visibility**: a row outside the caller's regions for the module answers **404**, never 403 (VI-02). A module the caller
      cannot use answers 403 `module_forbidden`. A pending user gets 403 `pending_assignment` everywhere except `/auth/*` and `/me`.
    - **Pagination**: cursor based on every list. Query `limit` (1..200, default 50) and `cursor` (opaque). Response envelope
      `{ items: [...], page: { limit, next_cursor, total? } }`. `next_cursor` is null on the last page. `total` is given where cheap.
    - **Concurrency**: single resources return `ETag: "<version>"`. Every mutation of a versioned resource needs
      `If-Match` (missing = 428 `precondition_required`, stale = 412 `precondition_failed`). Bulk bodies carry a `version` per item.
    - **Step-up**: `x-step-up` is `true` (always) or a string naming the condition (for example when self-skip reaches final approval). Such operations need a re-authentication no older than the setting `stepup_max_age_seconds`
      (default 300). Otherwise 401 `step_up_required` with `step_up_url` (ADR 0002 §6). One step-up covers a whole bulk request.
    - **Idempotency**: bulk and job-starting POSTs accept `Idempotency-Key`; a replay within 24 h returns the first response.
    - **Live polling (0.2.5)**: requests sent by a timer (notification bell, online-now list) carry the header `X-PMIS-Live: 1`. The server must not extend the idle timeout for them; only real user activity does. They also do not update `last_activity_at`.
    - **Long jobs** answer 202 with a `Job`; poll `GET /jobs/{job_id}`.
    - **Database paths**: `x-db-path` names the SECURITY DEFINER function that performs the write (ADR 0003 §7). The API never writes
      identity or permission tables directly.
    - **Audit**: every state change and every file download or export writes an audit row (ADR 0006). This is not repeated per operation.

    ## Versions
    - 0.3.1 (2026-10-28): `UserPickerItem.employee_id` may be null (a local account created without an employee ID).
    - 0.3.0 (2026-10-28): additive. Local sign-in with a password, for accounts created in the PMIS (owner decision 2026-10-28, ADR 0012): `POST /auth/local/login`, `POST /auth/local/password`, `POST /auth/local/step-up`, `POST /users` (create a local user with a temporary password), `POST /users/{user_id}/password-reset`; `Session.auth_method` and `must_change_password`; `User.phone`, `local_sign_in`, `must_change_password`; `Problem.step_up_method`; error codes `invalid_credentials`, `password_change_required`, `weak_password`. Microsoft 365 sign-in stays in the contract and is added later beside it.
    - 0.2.6 (2026-10-26): SLA rule sets and weight sets can be written and published (draft, preview, publish with effective date, reason and step-up, versions list); re-run of Project Status with an older weight set by id; enumerated export column codes for sites and tasks; required `reason` on `POST /settings/holidays/import` (not additive, see ADR 0011 amendment 0.2.6).
    - 0.2.5 (2026-10-26): additive. Phase 3b gaps (delegation to role or group, export column codes, `POST /tasks/{task_id}/act-on-behalf`) and admin additions: notification policy and catalogue, security log, log integrity, active sessions and revoke, log retention, `confirm_text` on dangerous actions, `last_admin` documented, and user soft delete and restore (B14) (ADR 0011).
    - 0.2.4 (2026-10-25): additive. `TaskSummary.lock_reasons`, `GET /tasks/{task_id}/slots`, `ImportBatch.site_id` and a described `task_id` on the template upload (ADR 0011).
    - 0.2.3 (2026-10-25): additive. Full, partial and current-view Master export: `parts` and `view` on `POST /exports/master`, `GET /exports/parts`, `MasterExport.kind`; the download streams the file (200) instead of a 302; field-level rules apply to exports (ADR 0011).
    - 0.2.2 (2026-10-25): additive. `POST/GET /exports/master` and `GET /exports/master/{export_id}/download`, job kind `master_export`, error code `export_expired` (ADR 0011).
    - 0.2.1 (2026-10-25): additive. `MatrixAssignee.employee_id` and `user_id`, documented `return_to` allowlist, `ApprovalItem.documents_summary` (ADR 0011).
    - 0.2.0 (2026-10-25): additive. No operation or schema of 0.1 was removed or renamed (ADR 0011).
    - 0.1.0 (2026-10-25): first contract for P1. Breaking changes are recorded in `docs/adr/` (ADR 0001 §6).

    ## Changes since 0.1
    - **Auth**: `GET /auth/login` accepts `identifier` (email, 4-digit employee ID or E.164 phone) and answers 302 the same way whether or not it matches; rate limited (ADR 0002 §9b). Local password sign-in stays deferred and is not in the contract.
    - **Staff registry** (`staff-registry`): search, hover card with visibility applied, create, update, deactivate, reactivate, template import, field-visibility settings.
    - **Absence and reassignment** (`absences`, `reassignment`, B12b): absences CRUD, `POST /tasks/reassign` (task, site or person; reassign, act on behalf or keep), eligible users, lead alerts, idle-task alert setting.
    - **MFA exemption** (`mfa-exemption`): per user, with end date, reason and step-up; nobody exempts themselves.
    - **Calendar** (`calendar`, B12): holidays CRUD, import, confirm tentative, weekend days. **Settings**: structural freeze (B9), DLP months (versioned), idle-task alert.
    - **Registers and Dismantle** (`registers`, B11): catalogue, records CRUD and submit, review, approve, reject, void. The Matrix gains a `kind` per row.
    - **Document Library** (`document-library`), **templates and import batches** (`templates`), **generated forms and number sequences** (`forms`), **warehouse** (`warehouse`), **QC snags and photos** (`qc`), **custom fields** (`custom-fields`).
    - **Notifications** (`notifications`), **System Log** (`system-log`), **Dashboard KPIs** (`dashboard`) and **Project Status** with the weight-set version (`project-status`).
    - **0.2.1**: `MatrixAssignee` gains `employee_id` and `user_id` (so `ball_in_court.holders` can show the ID beside the name); `return_to` allowlist is documented (`/my-work` default, `/step-up-done` for the step-up popup) and a 401 `step_up_url` already carries `return_to`; `ApprovalItem.documents_summary` removes the extra `GET /tasks/{id}` in Approvals detail.
    - **0.2.2**: on-demand full Master export (`exports`): `POST /exports/master` (202 `Job` of kind `master_export`; optional `regions` and `as_of`; `export` grant; scoped by B3; `Idempotency-Key`), `GET /exports/master` (the caller's recent exports), `GET /exports/master/{export_id}/download` (302 to `GSDN_Site_Master_<date>.xlsx`, audited, 410 `export_expired` after the retention setting `master_export.retention_days`, default 7).
    - **0.2.3**: partial export. `POST /exports/master` accepts `parts` (omitted or empty = whole project) or `view` (the current list view: source, filters, columns, sort), never both (422). `GET /exports/parts` lists the parts the caller may export. `MasterExport` echoes `parts`/`view` and adds `kind` (`full`, `partial`, `view`). Files are `GSDN_Site_Master_<date>.xlsx` (full) or `GSDN_<part>_<date>.xlsx`. The download of 0.2.2 now answers 200 with the file (`Content-Disposition: attachment`, `Cache-Control: no-store`), as `/files/{file_id}/download` does; it was documented as a 302 for one day and no client was built on it.
    - **0.2.4**: `TaskSummary.lock_reasons` (optional, same `LockReason` items as `GET /tasks/{task_id}`) so "Why locked?" needs no extra call; `GET /tasks/{task_id}/slots` lists the task's `DocumentSlot`s; the import batch created by a per-task template upload carries `task_id` and `site_id`, and `task_id` is documented on the create request.
    - **0.2.5**: `DelegationInput` and `Delegation` gain `target_kind` (user, role, group), `target_id`, `region_codes`, `module_codes`, `allow_redelegate` (`to_user_id` becomes optional, `Delegation.to_user` is null for role and group targets); `ExportPart.columns` and `ExportColumnCode` define the stable column codes of `ExportView.columns`; `POST /tasks/{task_id}/act-on-behalf` (B12b choice 3); `GET/PUT /settings/notification-policy` and `GET /settings/notification-policy/catalogue`; `GET /security-log`, `POST /security-log/exports`; `GET /audit-log/integrity`, `GET /security-log/integrity`; `GET /sessions/active`, `POST /sessions/{session_id}/revoke`, `POST /users/{user_id}/sessions/revoke`; `GET/PUT /settings/log-retention`; required `confirm_text` on freeze lift and workflow publish with error code `confirmation_mismatch`; grants `manage_users` and `view_security_log`; `last_admin` 409 documented on every operation that can remove the last System Admin; user soft delete and restore (B14): `POST /users/{user_id}/delete`, `POST /users/{user_id}/restore`, `GET /users/deleted`, `holder_account_status` on tasks, alert cause `holder_deactivated`.
    - **0.2.6**: `GET/POST /settings/sla-rule-sets`, `GET/PATCH /settings/sla-rule-sets/{set_id}`, `POST .../preview`, `POST .../publish` (SLA, draft then publish, `apply_to_open_tasks`); `POST /settings/weight-sets`, `GET/PUT /settings/weight-sets/{set_id}`, `POST .../preview`, `POST .../publish` (weights, 100% per level, error `weights_must_total_100`); `weight_set_id` on `GET /project-status`; `SitesExportColumnCode` and `TasksExportColumnCode` inside `ExportColumnCode`; `reason` required on the holidays import. Both write sets need `settings.edit` or a delegation of it, publish needs step-up, and both stay allowed during the structural freeze (B9, light changes).
    - Small additive changes to 0.1 shapes: `User.mfa_exempt`, `TaskSummary.holder_absent` and `idle_working_days`, `Matrix` stage `kind` and `register_key`, `Problem.reason`, new error codes `freeze_active`, `insufficient_stock`, `role_in_use`, new job kinds, `updateRole` also answers 409 and 422.
  license:
    name: Proprietary, Aljeel internal use
    url: https://pmis.aljeel.internal/license
  contact:
    name: GSDN PMIS tech-lead
servers:
  - url: https://pmis.aljeel.internal/api/v1
    description: Internal server (TLS from the internal CA)
security:
  - cookieAuth: []
    csrfHeader: []
tags:
  - name: auth
    description: Sign-in, session, employee-ID link, step-up and break-glass (ADR 0002).
  - name: me
    description: The caller's profile, effective permissions and My Work.
  - name: users
    description: Registered employees and their status.
  - name: assignments
    description: Many-to-many role assignments, by role or by person, in bulk (AU-10..AU-13).
  - name: roles
    description: Admin-defined roles and sub-roles.
  - name: permissions
    description: Permission grid, profiles and field-level rules (ADR 0003).
  - name: groups
    description: Named sets of users used in matrix cells.
  - name: delegations
    description: Delegation of System Admin rights.
  - name: regions
    description: The 7 regions.
  - name: sites
    description: Site list with filters and mini rail, site detail and task grid.
  - name: tasks
    description: Task detail, data entry, workflow actions, comments, files (ADR 0004).
  - name: approvals
    description: Approvals inbox and bulk actions.
  - name: matrix
    description: Responsibility Matrix.
  - name: workflow
    description: Versioned workflow definition and site migration (ADR 0010).
  - name: audit
    description: Read-only Audit Log (ADR 0006). Append-only hash chain; `GET /audit-log/integrity` verifies it.
  - name: settings
    description: |
      Read access to settings, SLA rules, weight sets, calendars and task definitions. Writes in 0.2, structural freeze, DLP months, idle-task alert, notification policy (0.2.5), log retention (0.2.5), SLA rule sets and weight sets (0.2.6, draft then publish).

      **Freeze (0.2.6).** SLA rule sets and weight sets are light changes under decision B9. They stay allowed during the structural freeze, and none of their operations answers 409 `freeze_active`.

      **Validation convention (0.2.5).** Every settings `PUT` rejects unknown keys (the request schemas are closed) and answers 422 `validation_failed`
      with field-level `errors[]` (`path` = JSON pointer, `code`, `message`), including cross-field rules (for example
      `approval_escalate_days * 24 > approval_remind_hours` in the notification policy). Every settings write needs `reason`, `If-Match`
      for a versioned setting, and writes an audit row with before and after values.
  - name: security
    description: "Sign-in and security log, active sessions and revoke (0.2.5). Separate from the Audit Log and the System Log; append-only hash chain."
  - name: exports
    description: On-demand full, partial or current-view export in the Site Master layout (owner request 2026-10-25, ADR 0011 amendments 0.2.2 and 0.2.3).
  - name: system
    description: Jobs and client error reporting.
  - name: staff-registry
    description: "Registry of Aljeel staff: search, hover card with visibility, maintenance, import, field visibility."
  - name: absences
    description: "Informational absence records (B12b)."
  - name: reassignment
    description: "Lead decisions on tasks of absent or idle people: reassign, act on behalf, keep (B12b)."
  - name: mfa-exemption
    description: "Per-user removal of the PMIS MFA requirement (ADR 0002)."
  - name: calendar
    description: "Work calendar: holidays and weekend days (B12)."
  - name: registers
    description: "Registers and Dismantle with their own menus and Matrix rows (B11)."
  - name: document-library
    description: "Document definitions kept as data (ADR 0007 §4)."
  - name: templates
    description: "Approved templates, download with embedded ID and version, upload batches, row-wise approval (ADR 0005)."
  - name: forms
    description: "Generated forms DN, RN, PAC, FAC and snag list: template versions, numbering, PDFs."
  - name: warehouse
    description: "Item master, stock levels and pending or reserved movements."
  - name: qc
    description: "Snag types, snags and QC photos."
  - name: custom-fields
    description: "Admin-defined fields on sites, tasks, milestones, gates and registers (ADR 0009)."
  - name: notifications
    description: "In-app notifications and channel preferences."
  - name: system-log
    description: "Read-only System/Error Log, separate from the Audit Log."
  - name: dashboard
    description: "Dashboard KPIs (P3 shapes, refined against the legacy dashboard)."
  - name: project-status
    description: "Project Status with the weight-set version, and weekly snapshots."

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    get:
      tags: [auth]
      operationId: authLogin
      summary: Start the Entra ID sign-in (redirect), optionally from an identifier
      description: |
        With `identifier` (email, 4-digit employee ID or E.164 phone) the API resolves it in the staff registry and keeps the
        resolved registry email **server-side only**, in the OIDC `state`/session record. The registry email never appears in
        the redirect: `login_hint` is sent to Entra only when the caller typed an email themselves (they already know it), and
        that value is passed as typed, whether or not it matches. An employee ID or phone never becomes a `login_hint`, so an
        unauthenticated caller cannot learn anyone's email. Status, headers and timing are the same whether or not the identifier
        matches. The lookup is rate limited per IP and per identifier (429 `rate_limited`). On the callback, when the identifier
        resolved to a registry row, the token account must equal that row's email or sign-in is refused and logged (ADR 0002 §9b).
        PMIS never stores passwords; local sign-in is deferred.
      security: []
      parameters:
        - name: identifier
          in: query
          description: 'Email, 4-digit employee ID, or phone in E.164 (`+2189...`). Anything else is treated as no match.'
          schema: { type: string, maxLength: 254 }
        - name: return_to
          in: query
          description: 'App-relative path to open after sign-in or step-up. Server allowlist: `/my-work` (default after login, also used when the value is missing or rejected), `/step-up-done` (the step-up popup), and any other same-origin app route that matches the pattern. The server decodes it, rejects any scheme, host, `//`, backslash or encoded slash, matches it against the server allowlist, and stores the validated value in the server-side OIDC state; the callback never reads it from the URL again. The `step_up_url` of a 401 `step_up_required` already includes `return_to`; clients must not append another.'
          schema: { type: string, maxLength: 512, pattern: '^/(?![/\\\\])[A-Za-z0-9/_\\-?=&.~%]*$' }
      responses:
        '302':
          description: Redirect to the Entra authorize endpoint.
          headers:
            Location: { schema: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: OIDC redirect URI (server side)
      description: Validates `iss`, `aud`, `tid`, signature and, when `require_mfa` is on, `amr` contains `mfa`. Creates the user on first sign-in with status `pending_assignment`.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Session cookie set; redirect to the app (or to the employee-ID page on first sign-in).
          headers:
            Set-Cookie: { schema: { type: string } }
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session state and CSRF token
      description: 'A timer-driven call sends `X-PMIS-Live: 1`; it does not extend the idle timeout.'
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LivePoll'
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      responses:
        '204': { description: 'Signed out.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/employee-id:
    post:
      tags: [auth]
      operationId: linkEmployeeId
      summary: Link the 4-digit employee ID (once, first sign-in)
      x-db-path: idm_link_employee_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id]
              properties:
                employee_id: { $ref: '#/components/schemas/EmployeeId' }
      responses:
        '200':
          description: Linked. The account stays `pending_assignment` until an admin assigns it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/step-up:
    get:
      tags: [auth]
      operationId: startStepUp
      summary: Start a step-up re-authentication (redirect)
      description: Redirects to Entra with `prompt=login` and `max_age=0` (break-glass sessions get a TOTP page instead).
      security:
        - cookieAuth: []
      parameters:
        - name: return_to
          in: query
          required: true
          description: 'App-relative path to open after sign-in or step-up. Server allowlist: `/my-work` (default after login, also used when the value is missing or rejected), `/step-up-done` (the step-up popup), and any other same-origin app route that matches the pattern. The server decodes it, rejects any scheme, host, `//`, backslash or encoded slash, matches it against the server allowlist, and stores the validated value in the server-side OIDC state; the callback never reads it from the URL again. The `step_up_url` of a 401 `step_up_required` already includes `return_to`; clients must not append another.'
          schema: { type: string, maxLength: 512, pattern: '^/(?![/\\\\])[A-Za-z0-9/_\\-?=&.~%]*$' }
      responses:
        '302':
          description: Redirect to Entra.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/step-up/callback:
    get:
      tags: [auth]
      operationId: stepUpCallback
      summary: Step-up redirect URI (server side)
      security:
        - cookieAuth: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Step-up recorded (`stepup_at`), redirect to `return_to`.
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/break-glass:
    post:
      tags: [auth]
      operationId: breakGlassLogin
      summary: Break-glass local admin sign-in (internal network only)
      description: Accepted only from `internal_cidrs`. Every attempt is written to the System Log; success is audited as privileged and emailed to all System Admins. Locked 15 min after 5 failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, totp]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Signed in (session cookie set, max 60 minutes).
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/local/login:
    post:
      tags: [auth]
      operationId: localLogin
      summary: Sign in with an identifier and a password (local account, ADR 0012)
      description: |
        `identifier` is a 4-digit employee ID, an email or an E.164 phone, like the one sign-in box. Every failure answers the
        same 401 `invalid_credentials` with the same text and similar timing, whether the identifier is unknown, the password is
        wrong, the account is locked (5 failures lock it for 15 minutes) or local sign-in is off for it, so the response never
        tells who is registered. Rate limited per IP and per identifier (429 `rate_limited`). On success the session cookie
        `pmis_session` is set (`HttpOnly`, `Secure`, `SameSite=Strict`, path `/api`). When the password was set by an admin,
        `must_change_password` is true and every call except `/auth/*` and `GET /me` answers 403 `password_change_required`
        until `POST /auth/local/password` succeeds. A suspended or disabled account gets 401 `invalid_credentials` too.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, password]
              properties:
                identifier: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, format: password, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change my password (required after a temporary password)
      description: |
        Needs the current password. Policy (422 `weak_password`, `errors[]` names the rule): 12 to 128 characters, not equal to
        the current password, not containing the email, employee ID or phone, not in the server's list of common passwords.
        On success the other sessions of the user end; this session stays and `must_change_password` becomes false.
      x-db-path: auth_local_set_own_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, maxLength: 128 }
                new_password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/step-up:
    post:
      tags: [auth]
      operationId: localStepUp
      summary: Step-up for a local session (re-enter the password)
      description: |
        A 401 `step_up_required` on a local session carries `step_up_method` = `password` and no `step_up_url`; the client asks
        for the password and calls this, then retries. Sets `stepup_at`; the window is the setting `stepup_max_age_seconds`
        (default 300). A wrong password answers 401 `invalid_credentials` and counts toward the lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, maxLength: 128 }
      responses:
        '200':
          description: Step-up recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ------------------------------------------------------------------ me
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: My profile, assignments and effective permissions (drives navigation)
      responses:
        '200':
          description: Me.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/preferences:
    patch:
      tags: [me]
      operationId: updateMyPreferences
      summary: Change language and theme
      x-db-path: idm_set_preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                locale: { type: string, enum: [en, ar] }
                theme: { type: string, enum: [light, dark] }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/notify-admins:
    post:
      tags: [me]
      operationId: notifyAdmins
      summary: Pending user asks the System Admins for an assignment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 500 }
      responses:
        '202': { description: 'Notification queued (in-app and email).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/tasks:
    get:
      tags: [me]
      operationId: listMyTasks
      summary: My Work (tasks where I am an eligible holder or the claimant)
      parameters:
        - name: bucket
          in: query
          description: late = over SLA max; do_now = at my level; waiting = submitted by me, at a later level.
          schema: { type: string, enum: [late, do_now, waiting] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ users
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Registered employees (everyone who signed in with M365)
      description: Needs `view` on `admin.users`. Name pickers use `GET /users/picker`, which returns a reduced shape. Soft-deleted users (B14) are not listed here; see `GET /users/deleted`.
      parameters:
        - { name: q, in: query, description: 'Search name, email or employee ID.', schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: role_id, in: query, description: 'Users holding this role or sub-role (active rows).', schema: { type: string, format: uuid } }
        - { name: region_id, in: query, schema: { $ref: '#/components/schemas/RegionId' } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createLocalUser
      summary: Create a user who signs in with a password (local account, ADR 0012)
      description: |
        Needs `create` on `users` (System Admin or a delegation, all regions). The new account is `pending_assignment` until an
        admin assigns it, like a first M365 sign-in. The server generates a temporary password when `temporary_password` is
        omitted and returns it **once** in the response; it is never stored or shown again. The user must change it at the first
        sign-in. Email, employee ID and phone must each be unused (409 `duplicate`, `errors[]` names the field).
      x-db-path: idm_create_local_user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUserCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/deleted:
    get:
      tags: [users]
      operationId: listDeletedUsers
      summary: Soft-deleted users (B14), newest deletion first
      description: Needs `view` on `admin.users`. Each row says whether it can be restored (`can_restore`) and why not (`restore_blocked_reason`).
      parameters:
        - { name: q, in: query, description: 'Search name, email or employee ID.', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Deleted users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DeletedUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/picker:
    get:
      tags: [users]
      operationId: pickUsers
      summary: Name picker for any active user (id, display name, employee ID only)
      description: Separate endpoint so the response can never fall back to the full User. Returns active users only; at most 20 per page; `q` of at least 2 characters is required.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: role_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Picker items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/UserPickerItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: One user with assignments and groups
      responses:
        '200':
          description: User.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change status or employee ID (admin)
      description: |
        Deactivating a user (`status` suspended or disabled) ends all their sessions at once (security log `session_revoked_by_admin`). Claimed tasks return to the cell (AU-09). Tasks held at a level by the person do **not** move (B14, B12b): they stay on the person with `holder_account_status` = `deactivated`, the Team Lead is alerted at once (`holder_deactivated`, `GET /reassignments/alerts`) and decides with `POST /tasks/reassign` or `POST /tasks/{task_id}/act-on-behalf`. SLA never pauses or resets. A level left with no eligible active holder goes to the System Admins' inbox as "no holder" (B10).
        Refused with 409 `last_admin` if it would leave no active System Admin, and with `self_beneficiary` for the caller's own row.
      x-step-up: true
      x-db-path: idm_set_user_status / idm_link_employee_id
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                status: { $ref: '#/components/schemas/UserStatus' }
                employee_id: { $ref: '#/components/schemas/EmployeeId' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{user_id}/delete:
    post:
      tags: [users]
      operationId: deleteUser
      summary: Soft-delete a user (B14); reversible with restore
      description: |
        Sets `deleted_at`, `deleted_by` and the reason; the row, its history and its assignments are kept (nothing is hard-deleted). The user is deactivated first if needed, all sessions end, and the account can no longer sign in. Same effect on open tasks as a deactivation: **nothing moves automatically**; tasks stay on the person with `holder_account_status` = `deleted`, the Team Lead is alerted (`holder_deactivated`) and uses reassign, act on behalf or keep (B12b). SLA never pauses or resets.
        Refused with 409 `last_admin` if it would leave no active System Admin, 403 `self_beneficiary` for the caller's own row, and 409 `invalid_transition` when already deleted.
      x-step-up: true
      x-db-path: idm_delete_user
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/DeleteReason' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{user_id}/restore:
    post:
      tags: [users]
      operationId: restoreUser
      summary: Restore a soft-deleted user (B14)
      description: |
        Re-enables the account and its previous assignments (their validity dates still apply). Refused with 409 `duplicate` when the employee ID (staff registry row) or the email is now owned by another account; `errors[]` names the field and `GET /users/deleted` shows `can_restore` = false with `restore_blocked_reason`. Tasks that stayed on the person show `holder_account_status` = `active` again.
      x-step-up: true
      x-db-path: idm_restore_user
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{user_id}/password-reset:
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Set a temporary password for a user (local sign-in)
      description: |
        Needs `edit` on `users` (all regions) and step-up. Not for yourself (use `POST /auth/local/password`). Whoever sets a
        password can sign in as the user, so a delegate may reset only an account with no rights yet (no current or future
        assignment, no Entra link, not an admin or delegate); anything else is System Admin only (403 `action_forbidden`). Turns local sign-in on for the account if it was off, unlocks it, ends all its
        sessions, and makes the user change the password at the next sign-in. Omit `temporary_password` to have the server
        generate one; it is returned once.
      x-step-up: true
      x-db-path: idm_reset_local_password
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                temporary_password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password]
                properties:
                  temporary_password: { type: string, description: 'Shown once. Hand it to the user by a separate channel.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/assignments:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [assignments]
      operationId: listUserAssignments
      summary: Assignment rows of one person (by-person view)
      parameters:
        - { name: include_ended, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ assignments
  /assignments:
    get:
      tags: [assignments]
      operationId: listAssignments
      summary: Assignment rows (by-role view)
      parameters:
        - { name: role_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: profile_id, in: query, schema: { type: string, format: uuid } }
        - { name: active_on, in: query, description: 'Rows active on this date (default today).', schema: { type: string, format: date } }
        - { name: include_ended, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assignments/bulk-assign:
    post:
      tags: [assignments]
      operationId: bulkAssign
      summary: Assign one role to many people, or many roles to one person
      description: |
        Creates one row per (user, role). Existing overlapping rows are skipped with `already_assigned` (AU-11).
        Rows whose beneficiary is the caller are refused with `self_beneficiary` unless the caller is a System Admin without delegation.
        All rows share one `bulk_action_id` in the audit log. `dry_run=true` returns the same result without writing.
      x-step-up: true
      x-db-path: idm_assign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkAssignRequest' }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /assignments/bulk-update:
    post:
      tags: [assignments]
      operationId: bulkUpdateAssignments
      summary: Edit level, regions, modules, profiles or dates of many rows
      description: A change (lower level, narrower scope, earlier `valid_to`) that would leave no active System Admin is refused with `last_admin`, per row in `failed`, or 409 when every row is refused.
      x-step-up: true
      x-db-path: idm_update_assignment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, patch, reason]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/VersionedRef' }
                patch: { $ref: '#/components/schemas/AssignmentPatch' }
                reason: { $ref: '#/components/schemas/Reason' }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /assignments/bulk-end:
    post:
      tags: [assignments]
      operationId: bulkEndAssignments
      summary: Remove (end) assignment rows
      description: |
        Sets `valid_to` (default now); rows are never deleted (AU-13). Claimed tasks of the ended role return to their cell.
        A row whose end would leave no active System Admin is refused with `last_admin`: reported in `failed` of the result, and the whole request answers 409 `last_admin` when every row is refused.
      x-step-up: true
      x-db-path: idm_end_assignment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/VersionedRef' }
                valid_to: { type: string, format: date-time }
                reason: { $ref: '#/components/schemas/Reason' }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /assignments/copy:
    post:
      tags: [assignments]
      operationId: copyAssignments
      summary: Copy the active rows of one person to others (add or replace)
      description: Use `dry_run=true` for the preview shown before confirming (AU-13). A `to_user_ids` entry equal to the caller is refused with 403 `self_beneficiary` (also in the dry run) unless the caller is a System Admin acting without delegation, so nobody can copy another person's rights to themselves; `idm_copy_assignments` enforces it like `idm_assign`.
      x-step-up: true
      x-db-path: idm_copy_assignments
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_user_id, to_user_ids, mode, reason]
              properties:
                from_user_id: { type: string, format: uuid }
                to_user_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                mode: { type: string, enum: [add, replace] }
                reason: { $ref: '#/components/schemas/Reason' }
                dry_run: { type: boolean, default: true }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ roles
  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: Roles and sub-roles (tree)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role or sub-role (admin)
      x-step-up: true
      x-db-path: idm_save_role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [roles]
      operationId: getRole
      summary: One role
      responses:
        '200':
          description: Role.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [roles]
      operationId: updateRole
      summary: Rename, change defaults, or deactivate a role (never deleted while assigned)
      description: Deactivating the role that gives the System Admin rights, or removing those rights from it, is refused with 409 `last_admin` when it would leave no active System Admin. A role with active assignments is refused with 409 `role_in_use`.
      x-step-up: true
      x-db-path: idm_save_role
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RolePatch'
                - type: object
                  required: [reason]
                  properties:
                    reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ permissions
  /permissions/catalogue:
    get:
      tags: [permissions]
      operationId: getPermissionCatalogue
      summary: Modules, screens, actions and delegable rights (for the grid editor)
      responses:
        '200':
          description: Catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionCatalogue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /permission-profiles:
    get:
      tags: [permissions]
      operationId: listPermissionProfiles
      summary: Named permission profiles
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PermissionProfile' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [permissions]
      operationId: createPermissionProfile
      summary: Create a profile with its grid and field rules
      x-step-up: true
      x-db-path: idm_save_profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionProfileInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /permission-profiles/{profile_id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [permissions]
      operationId: getPermissionProfile
      summary: One profile
      responses:
        '200':
          description: Profile.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [permissions]
      operationId: replacePermissionProfile
      summary: Replace the grid and field rules of a profile (or deactivate it)
      description: A caller linked to this profile through an active assignment is refused with `self_beneficiary`, unless they are a System Admin acting without delegation.
      x-step-up: true
      x-db-path: idm_save_profile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionProfileInput' }
      responses:
        '200':
          description: Saved (new version).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ groups
  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: Groups with member counts and matrix usage
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group
      x-step-up: true
      x-db-path: idm_group_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reason]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                member_ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: getGroup
      summary: One group with members
      responses:
        '200':
          description: Group.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Rename, describe or deactivate a group
      description: Deactivating the System Admins group is refused with 409 `last_admin`.
      x-step-up: true
      x-db-path: idm_group_update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                is_active: { type: boolean }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      operationId: addGroupMembers
      summary: Add members
      description: Only a System Admin acting without delegation may change the System Admins group. Pending users are refused. When the group is the target of an active delegation (0.2.5), the caller cannot add themselves (403 `self_beneficiary`) unless they are a System Admin acting without delegation, so group membership cannot be used to grant oneself delegated rights.
      x-step-up: true
      x-db-path: idm_group_add_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, reason]
              properties:
                user_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Per-user result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{group_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [groups]
      operationId: removeGroupMember
      summary: Remove a member
      description: Refused with 409 `last_admin` when it would leave the System Admins group without an active member. Claimed tasks of the member under this group return to the group.
      x-step-up: true
      x-db-path: idm_group_remove_member
      parameters:
        - name: reason
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Reason' }
      responses:
        '204': { description: 'Removed.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ delegations
  /delegations:
    get:
      tags: [delegations]
      operationId: listDelegations
      summary: Delegations (timeline)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [active, scheduled, expired, revoked, all], default: active } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Delegations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Delegation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [delegations]
      operationId: createDelegation
      summary: Delegate full or partial admin rights (System Admin only, never by a delegate)
      x-step-up: true
      x-db-path: idm_delegate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /delegations/{delegation_id}/revoke:
    post:
      tags: [delegations]
      operationId: revokeDelegation
      summary: Revoke a delegation
      x-step-up: true
      x-db-path: idm_revoke_delegation
      parameters:
        - name: delegation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ regions
  /regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: The 7 regions (with the caller's visibility flag)
      responses:
        '200':
          description: Regions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Region' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ sites
  /sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: Sites with filters and the mini rail
      description: Only sites in the caller's regions for the `sites` module are returned (RLS).
      parameters:
        - { name: q, in: query, description: 'Site code, owner ID or name.', schema: { type: string } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, description: 'Current milestone/stage code (stable code, ADR 0010).', schema: { type: string } }
        - { name: scenario, in: query, schema: { $ref: '#/components/schemas/DeliveryScenario' } }
        - { name: overall_status, in: query, schema: { $ref: '#/components/schemas/OverallStatus' } }
        - { name: bucket, in: query, schema: { type: string, enum: [all, mine, late, waiting_approval, closed], default: all } }
        - { name: cluster_code, in: query, schema: { type: string } }
        - { name: delivery_batch, in: query, schema: { type: string } }
        - { name: workflow_version, in: query, schema: { type: integer, minimum: 1 } }
        - name: custom
          in: query
          description: Filter on custom fields shown in filters, as `code:value` pairs (repeatable).
          style: form
          explode: true
          schema: { type: array, items: { type: string, pattern: '^[a-z0-9_]+:.+$' } }
        - { name: sort, in: query, schema: { type: string, enum: [site_code, -site_code, region, -region, stage, -stage, due_date, -due_date], default: site_code } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteListItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: getSite
      summary: Site detail with pipeline, gates and cluster progress
      responses:
        '200':
          description: Site.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sites/{site_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: listSiteTasks
      summary: Task grid of a site, grouped by stage (site's workflow version)
      responses:
        '200':
          description: Stages with their tasks.
          content:
            application/json:
              schema:
                type: object
                required: [workflow_version, stages]
                properties:
                  workflow_version: { type: integer }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [code, name_en, tasks]
                      properties:
                        code: { type: string }
                        name_en: { type: string }
                        name_ar: { type: [string, 'null'] }
                        tasks: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ tasks
  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Task detail (drawer)
      responses:
        '200':
          description: Task.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateTaskEntry
      summary: Save entry data (dates, values, custom fields) at level 1
      description: Allowed in states `open` and `entry` to an eligible entry holder. Read-only and hidden fields are refused with `field_read_only`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskEntryPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/start:
    post:
      tags: [tasks]
      operationId: startTask
      summary: Move a Pending task to Ongoing with a start date
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actual_start: { type: string, format: date, description: 'Default today (TE MOS date for D6).' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/submit:
    post:
      tags: [tasks]
      operationId: submitTask
      summary: Submit for review (level 1 done)
      description: |
        Refused with 422 `mandatory_slots_missing` or `mandatory_fields_missing` (listing them). Freezes `levels_required`.
        Self-skip may carry the task further (`skipped_levels` in the result). If the chain reaches final approval, step-up is required.
      x-step-up: conditional (only when self-skip reaches final approval, or levels_required = 1)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/review:
    post:
      tags: [tasks]
      operationId: reviewTask
      summary: Pass a review level (levels 2..N-1)
      x-step-up: conditional (only when self-skip reaches final approval)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/approve:
    post:
      tags: [tasks]
      operationId: approveTask
      summary: Final approval (level N)
      description: Refused with 422 `open_snags` for preliminary acceptances while snags are open. Under `all_members` the result shows the votes still missing.
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/reject:
    post:
      tags: [tasks]
      operationId: rejectTask
      summary: Return the task one level back, with a note
      description: Allowed at level >= 2. `note` is mandatory (422 `note_required`). Target level follows ADR 0004 §6.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Claim a group-assigned level (any one member)
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/release:
    post:
      tags: [tasks]
      operationId: releaseTask
      summary: Release my claim back to the group
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/TaskTransition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /tasks/{task_id}/history:
    get:
      tags: [tasks]
      operationId: getTaskHistory
      summary: Workflow steps (timeline), including auto-skips and overrides
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Steps, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{task_id}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskComments
      summary: Comment thread
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tasks]
      operationId: addTaskComment
      summary: Add a comment (with optional mentions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                mention_user_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/slots:
    get:
      tags: [tasks]
      operationId: listTaskSlots
      summary: The task's document slots
      description: Same items as `TaskDetail.slots`, without loading the whole task (for example the per-task template upload and the slot pickers).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Slots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{task_id}/slots/{slot_id}/files:
    post:
      tags: [tasks]
      operationId: uploadSlotFile
      summary: Upload a file into a document slot (new version if the slot has files)
      description: Streams through the API; format by magic bytes, size and file count from the slot's document-type version (ADR 0008).
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: slot_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                replaces_file_group_id: { type: string, format: uuid, description: 'Set to upload a new version of an existing file.' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tasks/{task_id}/overrides:
    post:
      tags: [tasks]
      operationId: createOverride
      summary: Admin override on a task (reason and step-up)
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '201':
          description: Applied.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /overrides/{override_id}/revert:
    post:
      tags: [tasks]
      operationId: revertOverride
      summary: Revert an admin override
      description: 409 `override_not_revertible` if the task has moved on since.
      x-step-up: true
      parameters:
        - name: override_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /files/{file_id}/download:
    get:
      tags: [tasks]
      operationId: downloadFile
      summary: Download a file (audited before streaming)
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The file, named `SITE_TASK_DOC_APPROVEDDATE.ext` (ADR 0008 §3).
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ approvals
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approvals inbox (items where I can act at review or approve level)
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [all, review, approve], default: all } }
        - name: region_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/RegionId' } }
        - { name: stage_code, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: group_only, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inbox.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ApprovalItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/bulk:
    post:
      tags: [approvals]
      operationId: bulkApprovals
      summary: Pass or approve many tasks at once (one step-up)
      description: Each item is processed in its own transaction; the result lists done, skipped (with reason) and failed items. Rejection is never bulk because each needs its own note.
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, items]
              properties:
                action: { type: string, enum: [pass, approve], description: 'pass = review level, approve = final level.' }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/VersionedRef' }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Per-item result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ matrix
  /matrix:
    get:
      tags: [matrix]
      operationId: getMatrix
      summary: Responsibility Matrix for a workflow version, with self-skip preview
      parameters:
        - { name: workflow_version, in: query, description: 'Default = current published version.', schema: { type: integer, minimum: 1 } }
        - { name: region_id, in: query, description: 'Show region-specific cells for this region.', schema: { $ref: '#/components/schemas/RegionId' } }
      responses:
        '200':
          description: Matrix.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [matrix]
      operationId: updateMatrix
      summary: Save changed cells and stage level counts in one step
      description: |
        All changes in one transaction. A used level with no assignee is refused (422 `empty_cell`). Roles with
        `can_hold_matrix_levels = false` are refused. Applies to new level transitions only (MX-04).
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ workflow (ADR 0010)
  /workflow/versions:
    get:
      tags: [workflow]
      operationId: listWorkflowVersions
      summary: Workflow definition versions with site counts
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkflowVersionSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [workflow]
      operationId: createWorkflowDraft
      summary: Create a draft (copy of a published version) for structural changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_version, reason]
              properties:
                parent_version: { type: integer, minimum: 1 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflow/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/WorkflowVersionNo'
    get:
      tags: [workflow]
      operationId: getWorkflowVersion
      summary: Full definition of a version (milestones, gates, task placements)
      responses:
        '200':
          description: Version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [workflow]
      operationId: replaceWorkflowDraft
      summary: Replace the structure of a draft (add, remove, reorder milestones and gates; move tasks)
      description: Only for `status = draft`. Codes of existing nodes are kept; new nodes get new codes that are never reused.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowStructure' }
      responses:
        '200':
          description: Saved, with validation warnings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/publish:
    post:
      tags: [workflow]
      operationId: publishWorkflowVersion
      summary: Publish a draft (structural change); new sites use it
      description: |
        Runs the ADR 0010 §2 validation. Returns 422 `workflow_invalid` with the list of problems.
        Answers 409 `freeze_active` during the structural freeze (`GET /settings/structural-freeze`, B9).
        During the parallel run, a change that affects Master export columns needs `confirm_master_impact` equal to the
        phrase in `master_impact.confirmation_phrase` of the validation result.
        Required typed confirmation (0.2.5, per CLAUDE.md), `confirm_text` must equal `v<version>` (for example `v4`), else 422 `confirmation_mismatch`.
      x-step-up: true
      x-db-path: admin_publish_workflow_version (app_actor_is_admin('workflow.publish'))
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirm_text]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
                confirm_text: { $ref: '#/components/schemas/ConfirmText' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/milestones/{code}:
    patch:
      tags: [workflow]
      operationId: updateMilestoneLight
      summary: Light change to a milestone (names, custom fields, counts in Project Status); applies at once
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/NodeCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                counts_in_project_status: { type: boolean }
                custom: { $ref: '#/components/schemas/CustomValues' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Saved (light revision + 1).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowMilestone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/gates/{code}:
    patch:
      tags: [workflow]
      operationId: updateGateLight
      summary: Light change to a gate (names, conditions, SLA, custom fields); applies to gates not yet open
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/NodeCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                conditions: { type: array, items: { $ref: '#/components/schemas/GateCondition' } }
                sla_min_wd: { type: integer, minimum: 0 }
                sla_max_wd: { type: integer, minimum: 0 }
                custom: { $ref: '#/components/schemas/CustomValues' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '200':
          description: Saved (light revision + 1).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /workflow/versions/{version}/migration-preview:
    post:
      tags: [workflow]
      operationId: previewSiteMigration
      summary: Preview migrating sites to this version (tasks kept, added, retired; date changes; blockers)
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteSelection' }
      responses:
        '200':
          description: Preview with a hash to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workflow/versions/{version}/migrations:
    post:
      tags: [workflow]
      operationId: migrateSites
      summary: Migrate the previewed sites (job, one transaction per site)
      x-step-up: true
      x-db-path: admin_migrate_site_workflow (app_actor_is_admin('workflow.migrate'))
      parameters:
        - $ref: '#/components/parameters/WorkflowVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_hash, selection, reason]
              properties:
                preview_hash: { type: string }
                selection: { $ref: '#/components/schemas/SiteSelection' }
                reason: { $ref: '#/components/schemas/Reason' }
                confirm_master_impact: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflow/site-migrations:
    get:
      tags: [workflow]
      operationId: listSiteMigrations
      summary: Site migration log
      parameters:
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: to_version, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Migrations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteMigration' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workflow/site-migrations/{migration_id}/revert:
    post:
      tags: [workflow]
      operationId: revertSiteMigration
      summary: Move a site back to its previous version (only if nothing was approved since)
      x-step-up: true
      x-db-path: admin_migrate_site_workflow (revert)
      parameters:
        - name: migration_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMigration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ audit
  /audit-log:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Read the Audit Log (append-only; no write endpoint exists)
      description: Needs `view_audit`. Rows are limited to the reader's regions; rows without a region need all regions. Newest first.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: bulk_action_id, in: query, schema: { type: string, format: uuid } }
        - { name: admin_override, in: query, schema: { type: boolean } }
        - { name: privileged, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-log/exports:
    post:
      tags: [audit]
      operationId: exportAuditLog
      summary: Export the filtered Audit Log as CSV (job; the export is itself audited)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                actor_id: { type: string, format: uuid }
                site_id: { type: string, format: uuid }
                entity_type: { type: string }
                action: { type: string }
                q: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-log/integrity:
    get:
      tags: [audit]
      operationId: getAuditLogIntegrity
      summary: Verify the hash chain of the Audit Log (System Admins only)
      description: |
        The Audit Log is an append-only hash chain: each row stores the hash of the previous row, and the database refuses update and delete. This recomputes the chain and reports the row count, the sequence range, the head hash and every break. Without `from_seq` and `to_seq` the whole chain is checked. Needs a System Admin (a delegate is not enough). The check is itself audited. A break found by the scheduled check raises the mandatory alert `audit_integrity_failure`.
      parameters:
        - { name: from_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: to_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogIntegrity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ security log and sessions
  /security-log:
    get:
      tags: [security]
      operationId: listSecurityLog
      summary: Sign-in and security log (append-only; no write endpoint exists)
      description: |
        Needs a System Admin or the grant `view_security_log`. Newest first. Reading is itself audited (Audit Log action `security_log.read`, with the filters used). Separate from the Audit Log and the System Log; kept for `security_log_days` (`GET /settings/log-retention`).
        An identifier typed in the one-box sign-in that matches no registry row is never stored raw (see `identifier_masked`). `ip` is shown to System Admins only.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: event, in: query, description: 'One or more events, comma separated.', style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/SecurityOutcome' } }
        - { name: q, in: query, description: 'Free text over name, employee ID, `identifier_masked` and `request_id`.', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SecurityLogEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-log/exports:
    post:
      tags: [security]
      operationId: exportSecurityLog
      summary: Export the filtered security log as CSV (job; the export is itself audited)
      description: Goes through the existing export service (job kind `security_export`). Needs the `export` grant and `view_security_log` (or System Admin). `ip` follows the same rule as the list.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                event: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
                outcome: { $ref: '#/components/schemas/SecurityOutcome' }
                q: { type: string }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-log/integrity:
    get:
      tags: [security]
      operationId: getSecurityLogIntegrity
      summary: Verify the hash chain of the security log (System Admins only)
      description: Same contract as `GET /audit-log/integrity` for the security log, which is also an append-only hash chain. The check is audited. A break raises the mandatory alert `audit_integrity_failure`.
      parameters:
        - { name: from_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: to_seq, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogIntegrity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sessions/active:
    get:
      tags: [security]
      operationId: listActiveSessions
      summary: Who is online now
      description: |
        Needs a System Admin or the grant `manage_users`. The screen polls this with `X-PMIS-Live: 1`; polling never counts as user activity, so it cannot keep a session alive. `status` is `online` when the person had real activity inside the presence window (server setting, default 5 minutes), otherwise `idle`. The raw `ip` is returned to System Admins only; for everyone else it is null.
      parameters:
        - $ref: '#/components/parameters/LivePoll'
        - { name: status, in: query, schema: { type: string, enum: [online, idle] } }
        - { name: q, in: query, description: 'Search name or employee ID.', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ActiveSession' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions/{session_id}/revoke:
    post:
      tags: [security]
      operationId: revokeSession
      summary: End one session
      description: Needs a System Admin or the grant `manage_users`. The person's next request answers 401. Security log `session_revoked_by_admin`; audited with the reason. The caller's own session is refused (use `POST /auth/logout`).
      x-step-up: true
      x-db-path: idm_revoke_session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevokeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/sessions/revoke:
    post:
      tags: [security]
      operationId: revokeUserSessions
      summary: End all sessions of a user
      description: Same rules as `POST /sessions/{session_id}/revoke`, for every session of the user. Deactivating or deleting a user does this automatically. A caller's own sessions are not touched.
      x-step-up: true
      x-db-path: idm_revoke_session
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevokeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ master export
  /exports/master:
    post:
      tags: [exports]
      operationId: startMasterExport
      summary: Start a full, partial or current-view export in the Site Master layout (job; needs the `export` grant)
      description: |
        All sheets and the 187 columns of `GSDN_Site_Master.xlsx`, plus custom fields that carry a Master export column.
        Content is limited to the caller's regions and modules (B3); a System Admin gets everything. The same export feeds
        the parallel-run comparison. Starting the export is audited.

        **Full, partial or current view (0.2.3).** No `parts` (or an empty array) exports the whole project. `parts` picks parts
        from `GET /exports/parts`. `view` exports exactly what a list screen shows (its filters, columns and sort). `parts` and
        `view` together are 422 `validation_failed`. Each part keeps the Master sheet and column layout. The `export` grant is
        needed for every requested part; otherwise 403 and `errors[]` lists the denied parts.

        **Field-level rules.** The export applies the same field-level rules as the read paths: custom fields and restricted
        staff fields (phone and email visibility) the caller cannot read are omitted or nulled. System Admin is the only exception.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MasterExportRequest' }
      responses:
        '202':
          description: Job started (`kind` = `master_export`). On `done` the job `result` carries `export_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [exports]
      operationId: listMasterExports
      summary: The caller's recent Master exports (within the retention window)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Exports, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MasterExport' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exports/parts:
    get:
      tags: [exports]
      operationId: listExportParts
      summary: The parts the caller may export (the choices of the export dialog)
      description: Only parts for which the caller holds the `export` grant, in their regions (B3). A System Admin sees all.
      parameters:
        - { name: include_columns, in: query, description: 'Add `columns` (the stable column codes of each part) to every item. Columns the caller cannot read (field-level rules) are left out.', schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Parts in dialog order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ExportPart' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exports/master/{export_id}/download:
    get:
      tags: [exports]
      operationId: downloadMasterExport
      summary: Download a finished export (audited before streaming)
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The workbook, `GSDN_Site_Master_<date>.xlsx` for a full export, otherwise `GSDN_<part>_<date>.xlsx`. Streamed by the API, as `/files/{file_id}/download`.
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="..."' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  # ------------------------------------------------------------------ settings (read)
  /settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Settings visible to the caller (admin sees all keys)
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/sla-rules:
    get:
      tags: [settings]
      operationId: listSlaRules
      summary: SLA rules with version history
      parameters:
        - { name: task_code, in: query, schema: { type: string } }
        - { name: active_on, in: query, schema: { type: string, format: date } }
        - { name: include_history, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: SLA rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SlaRule' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/sla-rule-sets:
    get:
      tags: [settings]
      operationId: listSlaRuleSets
      summary: SLA rule set versions with who, when and why (newest first)
      description: |
        One item per version of the whole SLA rule set (a draft, the version in force, earlier and future-dated versions). The per-task rows stay in `GET /settings/sla-rules`.
        Needs `view` on `admin.settings` (System Admin or a delegate holding `settings.edit`).
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SlaRuleSetSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [settings]
      operationId: createSlaRuleSetDraft
      summary: Create the draft rule set (a copy of the version in force)
      description: |
        Needs the `settings` permission or a delegation of it (`settings.edit`). Only one draft exists at a time, a second one is 409 `duplicate`.
        A light change (B9): allowed during the structural freeze.
      x-db-path: admin_save_sla_rule_set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/sla-rule-sets/{set_id}:
    parameters:
      - $ref: '#/components/parameters/SlaRuleSetId'
    get:
      tags: [settings]
      operationId: getSlaRuleSet
      summary: One version with its rules (per task, with overrides)
      responses:
        '200':
          description: Rule set.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [settings]
      operationId: updateSlaRuleSetDraft
      summary: Change rules in the draft
      description: |
        Only for `status = draft` (else 409 `invalid_transition`). Needs `settings.edit`. A light change (B9): allowed during the structural freeze.
        Each item of `rules` replaces the whole rule of its `task_code` (the base min and max, the start event, the calendar and all its overrides). Tasks not listed keep the rule copied from the version in force.
        **Validation (422 `validation_failed`, closed schema, `errors[].path` is a JSON pointer into the body):** `min_working_days` must not exceed `max_working_days`, in the base rule and in every override (`code` = `min_exceeds_max`, path of `max_working_days`); `unknown_task_code`; `unknown_start_event`; `unknown_calendar`; `duplicate_task_code`; `duplicate_override` (same scenario and region twice).
        Rule found for a task: most specific override wins (scenario and region, then region, then scenario, then the base rule).
        Audited with before and after values and the reason.
      x-db-path: admin_save_sla_rule_set
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaRuleSetPatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/sla-rule-sets/{set_id}/preview:
    post:
      tags: [settings]
      operationId: previewSlaRuleSetPublish
      summary: Dry run, how many open tasks would change due date if the draft were applied to them
      description: |
        Changes nothing and is not audited as a change. Runs the same validation as the publish (422 with the same `errors[]`). The result assumes `apply_to_open_tasks = true`, which is the only case where open tasks change; with `false`, the publish changes none.
        Closed (approved) tasks are never counted. Needs `settings.edit`.
      parameters:
        - $ref: '#/components/parameters/SlaRuleSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effective_date]
              properties:
                effective_date: { type: string, format: date }
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPublishPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/sla-rule-sets/{set_id}/publish:
    post:
      tags: [settings]
      operationId: publishSlaRuleSet
      summary: Publish the draft as a new SLA version
      description: |
        Needs `settings.edit` and step-up. A light change (B9): allowed during the structural freeze, never 409 `freeze_active`.
        Tasks opened on or after `effective_date` use the new version. **A task keeps the SLA version in force when it opened**, so past KPIs and closed tasks never change. Only when `apply_to_open_tasks` is true are the SLA rule and due date of the open (not approved) tasks switched to the new version, by a `sla_recalculation` job that runs at once when `effective_date` is today and on that date otherwise; the start date of each task is not changed.
        A regional delegate can apply it only to open tasks in their delegated regions (403 `action_forbidden` otherwise).
        **Validation (422 `validation_failed`):** the same as the draft; `effective_date_in_past` (path `/effective_date`, earlier than today in Africa/Tripoli); `effective_date_not_after_current` (not later than the `effective_from` of the latest published version); a draft equal to the version in force is `no_changes`.
        Audited with before and after values (rules, effective date, `apply_to_open_tasks`, number of tasks affected, `bulk_action_id` of the re-pointing).
      x-step-up: true
      x-db-path: admin_publish_sla_rule_set (app_actor_is_admin('settings.edit'))
      parameters:
        - $ref: '#/components/parameters/SlaRuleSetId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaRuleSetPublish' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaRuleSetPublishResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/weight-sets:
    get:
      tags: [settings]
      operationId: listWeightSets
      summary: Weight sets (Project Status, health index, delay attribution), also the version history
      description: All versions of each set, newest first, each with who changed it, when and why (`changed_by`, `created_at`, `published_at`, `reason`). Without `status` the drafts are included.
      parameters:
        - { name: code, in: query, schema: { type: string, enum: [project_status, health_index, delay_attribution] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
      responses:
        '200':
          description: Weight sets with activities and items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WeightSet' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [settings]
      operationId: createWeightSetDraft
      summary: Create a draft weight set (a copy of the set in force, or of an older one)
      description: |
        Needs the `settings` permission or a delegation of it (`settings.edit`). One open draft per `code` (a second one is 409 `duplicate`). A light change (B9): allowed during the structural freeze.
        `base_set_id` copies another set of the same `code` (for example an older set to go back to it); omitted means the set in force.
      x-db-path: admin_save_weight_set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, reason]
              properties:
                code: { $ref: '#/components/schemas/WeightSetCode' }
                base_set_id: { type: string, format: uuid }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/weight-sets/{set_id}:
    parameters:
      - $ref: '#/components/parameters/WeightSetId'
    get:
      tags: [settings]
      operationId: getWeightSet
      summary: One weight set version with its activities and items
      responses:
        '200':
          description: Weight set.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [settings]
      operationId: replaceWeightSetDraft
      summary: Replace the activities and items of a draft
      description: |
        Only for `status = draft` (else 409 `invalid_transition`). Needs `settings.edit`. A light change (B9): allowed during the structural freeze.
        Closed schema (an unknown key is 422 `validation_failed`). Each weight is 0 to 100 with at most 3 decimals; an item with weight 0 is not weighted. **A draft may be saved while its totals are not 100**, because the screen shows the live sum while the admin works; the 100% rule is enforced by the preview (reports it) and by the publish (refuses it).
        Audited with before and after values and the reason.
      x-db-path: admin_save_weight_set
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightSetInput' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings/weight-sets/{set_id}/preview:
    post:
      tags: [settings]
      operationId: previewWeightSetPublish
      summary: Check the 100% rule and show the effect of the draft on current progress
      description: |
        Changes nothing. Always 200: `valid` is false and `errors[]` lists the problems (same shape and codes as the publish 422), so the screen can show them without an error response. Needs `settings.edit`.
        `progress_current_pct` is the project progress with the set in force and `progress_new_pct` with the draft. Saved weekly snapshots are not part of the preview and never change.
      parameters:
        - $ref: '#/components/parameters/WeightSetId'
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSetPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/weight-sets/{set_id}/publish:
    post:
      tags: [settings]
      operationId: publishWeightSet
      summary: Publish the draft as a new weight set version
      description: |
        Needs `settings.edit` and step-up. A light change (B9): allowed during the structural freeze, never 409 `freeze_active`.
        **100% rule, per level (422 `validation_failed`):** the activity weights of the set must total 100, and the items of every activity that has items must total 100 (tolerance 0.001). Each level that fails gives one `errors[]` entry with `code` = `weights_must_total_100`, `path` = `/activities` for the set level or `/activities/<index>/items` for the items of one activity, and the actual total in `message`.
        Other 422 codes in `errors[].code`: `effective_date_in_past` (earlier than today in Africa/Tripoli), `effective_date_not_after_current` (not later than the `effective_from` of the latest published set of the same `code`), `no_changes`.
        The set takes effect on `effective_date`; the previous set gets `effective_to` = `effective_date`. Current progress is recalculated with the new set by a `progress_recalculation` job (at once when the date is today, otherwise on that date). **Saved weekly snapshots keep the values computed at the time** and a report can be re-run with an older set (`GET /project-status?weight_set_id=`).
        Audited with before and after values, the effective date and the reason.
      x-step-up: true
      x-db-path: admin_publish_weight_set (app_actor_is_admin('settings.edit'))
      parameters:
        - $ref: '#/components/parameters/WeightSetId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightSetPublish' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightSetPublishResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
