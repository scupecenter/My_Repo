openapi: 3.1.0
info:
  title: GSDN PMIS API
  version: 0.9.2
  summary: Contract for the web app mock phase (v0.2). P1 (sign-in, users and roles, visibility, sites, tasks, approval engine, matrix, workflow versions, audit log, settings read) plus staff registry, absences and reassignment, calendar, freeze, DLP, registers, Document Library, templates and imports, generated forms, warehouse, QC snags, custom fields, notifications, System Log and dashboard KPIs.
  description: |
    Owner: tech-lead. This file is the single source of truth for the HTTP API (CLAUDE.md "Contract first").
    The web app generates its types and MSW mocks from it (`packages/contracts`, ADR 0001).

    ## Conventions
    - **Base path** `/api/v1`. JSON property names are snake_case (ADR 0001).
    - **Auth**: session cookie `pmis_session` created by the local password sign-in (ADR 0012) or the Entra OIDC flow (ADR 0002). Unsafe methods (POST, PUT, PATCH, DELETE)
      also need the header `X-CSRF-Token` with the value from `GET /auth/session`. A future mobile client will use `bearerAuth`.
    - **Errors**: RFC 9457 `application/problem+json` (schema `Problem`). `code` is machine-readable and stable; `errors[]` lists
      field problems. Every response carries `X-Request-Id`, which is also written to the System Log.
    - **Visibility**: a row outside the caller's regions for the module answers **404**, never 403 (VI-02). A module the caller
      cannot use answers 403 `module_forbidden`. A pending user gets 403 `pending_assignment` everywhere except `/auth/*` and `/me`.
    - **Pagination**: cursor based on every list. Query `limit` (1..200, default 50) and `cursor` (opaque). Response envelope
      `{ items: [...], page: { limit, next_cursor, total? } }`. `next_cursor` is null on the last page. `total` is given where cheap.
    - **Concurrency**: single resources return `ETag: "<version>"`. Every mutation of a versioned resource needs
      `If-Match` (missing = 428 `precondition_required`, stale = 412 `precondition_failed`). Bulk bodies carry a `version` per item.
    - **Step-up**: `x-step-up` is `true` (always) or a string naming the condition (for example when self-skip reaches final approval). Such operations need a re-authentication no older than the setting `stepup_max_age_seconds`
      (default 300). Otherwise 401 `step_up_required` with `step_up_url` (ADR 0002 §6). One step-up covers a whole bulk request.
    - **Idempotency**: bulk and job-starting POSTs accept `Idempotency-Key`; a replay within 24 h returns the first response.
    - **Live polling (0.2.5)**: requests sent by a timer (notification bell, online-now list) carry the header `X-PMIS-Live: 1`. The server must not extend the idle timeout for them; only real user activity does. They also do not update `last_activity_at`.
    - **Long jobs** answer 202 with a `Job`; poll `GET /jobs/{job_id}`.
    - **Database paths**: `x-db-path` names the SECURITY DEFINER function that performs the write (ADR 0003 §7). The API never writes
      identity or permission tables directly.
    - **Audit**: every state change and every file download or export writes an audit row (ADR 0006). This is not repeated per operation.

    ## Versions
    - 0.9.2 (2026-11-02): additive. The self-service "My profile" page (owner decisions 2026-11-02, ADR 0014 amendment 2, migration 0044). (1) `GET /me/profile` and `PATCH /me/profile` (ETag / `If-Match`): a user changes only their own `display_name`, `phone`, `locale` and `theme`; admin-owned fields (email, employee ID, status, roles, team, regions, department, manager) answer 403 `field_read_only`; every change is audited with before and after. (2) `POST /me/password`: the local password change from the profile (same policy, lock and session rules as `POST /auth/local/password`); an M365 session gets 403. (3) Email change is a request an admin approves: `POST /me/email-change` (new email and the password re-entered; one pending request per user; the address must be free), `DELETE /me/email-change` (cancel while pending), `GET /email-change-requests` and `POST /email-change-requests/{request_id}/decide` (System Admin or a delegate holding `users.edit` for all regions, a reason and step-up, never one's own account; only an approval changes the login email); new notification kinds `email_change_requested` (to the deciders) and `email_change_decided` (to the user). (4) Two-factor self-service: `POST /me/two-factor/enrol/start` (fresh step-up, no enrolment code), `POST /me/two-factor/enrol/confirm` (recovery codes once; the other sessions end), `POST /me/two-factor/disable` (password and a code or a recovery code; 403 `two_factor_enforced` while an admin enforces it); `PUT /users/{user_id}/two-factor/enforced` (System Admin or a delegate holding `users.two_factor`; reason, step-up, never oneself). Turning two-factor on through `PUT /users/{user_id}/two-factor` enforces it, also for a user who had turned it on themselves. (5) `User.two_factor_enforced`, `Session.two_factor.enforced`, error code `two_factor_enforced`.
    - 0.9.1 (2026-11-02): additive. (1) Gate-lock exempt list (owner decision 2026-11-02, migration 0043): the setting `calc.gate_lock_exempt_tasks` also holds D1 (TE access permission), the DLP / FAC tasks B14, B15 and D18 and the dismantle tasks E2 and E3, beside C1 to C4; the codes were merged into the current value, an admin's own edits are kept. These tasks are no longer returned with `LockReason` `gate_closed`. (2) Team specialization / scope match of Procurement (Q97): `GET /settings/team-scope-match` and `PUT /settings/team-scope-match` (`TeamScopeMatch`; reading needs the Settings screen `admin.settings`, saving needs `admin.settings` edit for all regions, a reason and `If-Match`; audited with before and after). A Procurement record that names a team (`data.team_id`) whose specialization the table does not allow for the record's scope is refused, at create, at edit and again at submit, with 422 `team_scope_mismatch` (`errors[0].path` `/data/team_id`, `order_scope`, `team_specialization`); an exempt scope (seed: HLC) is not checked, a scope missing from the table and a team without a specialization are refused. New `ErrorCode` `team_scope_mismatch`.
    - 0.9.0 (2026-11-02): HLC fiber purchasing (owner decision 2026-11-02) and Q91, migration 0042. (1) The HLC purchase request is a Procurement record of scope `HLC`: the `scope` list gains `HLC` (no longer `wrong_register`; GECOL still is), and the Procurement fields gain `hlc_approval_date` (scope HLC only, `hlc_scope_only` otherwise; PR No. and PR date are required for scope HLC; a site whose HLC scope is N/A gives `scope_conflict`). Scope HLC has its own Responsibility Matrix row `procurement_hlc` (`MatrixRowKey`; default L1 HLC Fiber Team, L2 CW Team Lead): only its L1 holders enter scope-HLC records and only the Procurement row's holders enter the other scopes (refused with 403 `not_eligible_holder` by the database, also for a change of scope, a new version and a template row). `RegisterDefinition.entry_scopes` lists the scopes the caller may enter in a register whose scopes have their own rows (Procurement). (2) The HLC register holds execution only: new fields `link_received_date` and `in_service_date`; `request_no` and `request_date` are no longer fields (`unknown_field`; old values stay in `data`, read-only); the read-only fields `pr_no`, `hlc_approval_date` and `procurement_record_id` (the approved scope-HLC Procurement version) are filled by the server. Submit refuses `before_installation` (TX link test before installation) and `before_test` (in service before the TX link test). (3) `RegisterRecord.warnings` (items shaped like `Problem.errors`): ordering issues that do not block (Q96), for the reviewer: `no_approved_hlc_pr`, `hlc_not_approved`, `before_hlc_approval`, `before_link_received`, `test_without_installation`, `in_service_without_test`, `approval_before_pr`. (4) Task sources: C3 closes from the approved scope-HLC Procurement record on `hlc_approval_date`, C4 from the HLC record on `in_service_date` (no longer TX Link Tested), C1 from the approved GECOL record on `request_date` (Q91); one approval also closes the next source task of the same record that it has just opened when that task has the same L2 holders. `SlaStartEvent` accepts `PR:<scope>` (the earliest PR date of the approved Procurement records of that scope; C3 uses `PR:HLC`, so C-3 measures PR issue to HLC approval). No endpoint was added or removed.
    - 0.8.0 (2026-11-02): additive. The document upload module (owner rules "Document Library" and "Documents and QC"). (1) Slots: `DocumentSlot` gains `doc_type_id`, `form_kind`, `conditional`, `can_upload` and `expiry_tracked`, the kind `generated_form`; `DocumentFile` gains `capture_date`, `unknown_capture_date` and `superseded_by`. New: `POST /tasks/{task_id}/slots` (add a candidate slot or a conditional document that applies), `DELETE /tasks/{task_id}/slots/{slot_id}/files/{file_id}` (withdraw a file before submission; it stays on record), `POST /tasks/{task_id}/slots/suggest` (type suggested from file names). `uploadSlotFile` documents the checks and the error codes `file_too_large` (413) and `file_rejected` (422, with `reason`). (2) Download: `GET /documents` (the site Documents tab and the cross-site document list, filters, version history through `include_superseded`), `POST /exports/zip` (bulk zip per site, per stage, per document type across sites, or an explicit file list; a background job of kind `zip_export`), `GET /exports/zip/{export_id}/download`, and `GET /jobs/{job_id}` answers for it. `GET /files/{file_id}/download` also serves the blank form of a document type. Every download is audited before the first byte. (3) Document Library: `DocumentType` gains `needs_review` and `open_task_count` (what an "also open tasks" publish would reach); `GET /document-library/{doc_type_id}/versions`; `GET /document-library/{doc_type_id}/blank-form`. A generated form is a document type with `form_kind`. The seed library (stages 1 to 3 published, stages 4 to 10 as drafts to review) is data, not code. `ErrorCode` is unchanged.
    - 0.7.2 (2026-11-02): additive. The main dashboard (owner request 2026-11-02, Q34 to Q36, `docs/spec/dashboard-kpis.md`). (1) `GET /dashboard`: one call for the headline KPIs (sites by Overall Status, milestones reached against the baseline, on-air, the Final Closure KPI, Project Status), the pipeline, the streams with Dismantle, SLA per stage and the top late tasks, blocked gates with reasons, issues per owner and age (issues counted, sites for "sites with an open issue"), the health index (draft, bands from the setting `dashboard.health_bands`), delay attribution (draft) and a region breakdown; filters `region_id`, `cluster_code`, `scenario`, `stream` and the reference date `ref_date` (default today; a past date is read from the weekly snapshot of that date when one exists, otherwise computed from dated facts, and `basis.source` says which); every figure is limited to the caller's `dashboard.view` regions (B3, VI-04). (2) `GET /dashboard/export`: the current view as CSV (`dashboard.export`, audited). (3) The five `/dashboard/*` reads of 0.1 (`milestone-pipeline`, `by-region`, `delay-attribution`, `health-index`, `final-closure`) are superseded by `GET /dashboard` and are marked deprecated; they are not built. (4) Built: `GET /project-status` and `/project-status/snapshots` (now also `planned_pct`, `spi`, `plan_coverage_pct`, `central_items_hidden`, `sites_in_scope`, item-level `measured`/`reason`; `rows[].planned_pct`; snapshots carry `planned_pct`, `spi`, `health_index`), and the weight-set endpoints of 0.2.6 (`/settings/weight-sets`, `.../{set_id}`, `.../preview`, `.../publish`; they need `weights.edit`, reads need the Settings screen). `WeightItem.measure_rule` now has a grammar (a JSON object as text). Weekly snapshots are taken by the daily job (`dashboard.snapshot_every_days`, default 7) and kept as saved.
    - 0.7.1 (2026-11-02): review fixes for UI plan 4b (X1 to X7), migration 0040. (1) Inbox (X1): a notification that points at a task or a register record is shown only while the caller can still read that module in that region (a region or a module taken away later hides it, its count and its title; `POST .../read`, `.../unread`, `.../snooze` on a hidden one answer 404, `read-all` leaves it alone); `GET /notifications` answers 422 for an unknown `kind` and 400 for a cursor that is not ours. (2) Mentions and followers (X3, X2): one rule, a person is mentioned or notified only if their own grant grid gives `view` on the module for the item's region now (assignment or delegation, account active); a duplicate mention makes one notification and the audit row lists only the people actually mentioned. `GET/POST /tasks/{task_id}/comments`, `GET/POST /registers/{register_key}/records/{record_id}/comments`, `GET /status-updates` answer 400 for a forged cursor. (3) Follow (X2): `DELETE /sites/{site_id}/follow` and `DELETE /registers/{register_key}/records/{record_id}/follow` need only a session (they remove the caller's own follow, also one the caller can no longer read), so they no longer answer 403. (4) Status updates (X7): `PATCH /status-updates/{update_id}` asks for the lead right again (403 `action_forbidden` for an author who is no longer a lead of the region); a `week_start` or report date that is not a real calendar day is 422. (5) `Me.effective.nav` gains `inbox` (every active user), `status_updates` (with `sites`) and `workload` (with `sites` and `reports`). No endpoint was added or removed.
    - 0.7.0 (2026-11-02): additive. Approved-template entry for the registers (CLAUDE.md "Approved templates only", "Two entry ways everywhere"; migration 0037). (1) `GET /templates` lists one template per register (`TPL-PO`, `TPL-GECOL`, `TPL-HLC`, `TPL-PRM` and the other registers) that the caller may use; a template version is issued by the database whenever the fields or the custom fields of its register change, and `Template` gains `register_key` and `stream`. (2) `GET /templates/{template_id}/download` builds the xlsx: locked headers in Master order, drop-downs for list fields, a very-hidden `_tpl` sheet (template_id, version, register_key, header checksum, issuer and time), a visible instructions sheet; new query parameters `prefill` and `region_id` (a pre-filled copy holds the records in force inside the caller's regions, with a `Record ID` column); every download is audited. (3) `POST /import-batches` now reads the file (multipart, size limit, `.xlsx` only, no macros, no formulas) and stages it in the database: each row is matched to a record by `Record ID` or by the register's natural key and classified `create`, `update`, `unchanged` or `error` with the reasons per cell (`ImportRow.errors[].column` is the header of the column, `field` its code), against the same rules as manual entry. A file without a valid `_tpl`, of a retired version, with a changed header row, with macros or too large answers 422 `template_rejected` with `reason` (new values `not_xlsx`, `macros_not_allowed`, `tpl_invalid`) or 413, writes a System Log row (source `template-check`) and creates no batch. (4) The batch is an entry into the normal flow, not a shortcut: `POST /import-batches/{batch_id}/submit` (the uploader) creates every valid row as a register record and submits it (L1 Data Entry), so the record waits for L2 Data Reviewer & Approver of its Matrix row; `POST /import-batches/{batch_id}/decisions` approves rows one by one or all at once, returns rows to the uploader with a note (the record goes back to L1), or discards a batch that was not sent (`action` gains `discard`). A row whose logical record still has an open version is held `pending_previous_approval`; "approve all" never touches held rows and lists them in `outcome.held`. Both calls answer the batch plus `outcome`. `ImportBatch` gains `register_key`, `note`, `counts.held` and the status `discarded`; `ImportRow` gains `site_code`, `record_type`, `record_id` (the register record created for the row) and `hold_reason`. The audit rows and the record history show "via batch". `GET /import-batches` accepts `register_key`. Not built yet: `POST /import-batches/{batch_id}/undo`, the stream templates (`TPL-SITE-DA`, `-CW`, `-TE`, `-CL`, Q73) and `TPL-MASTER`; the catalogue, the version rule and the batch tables are ready for them.
    - 0.6.1 (2026-11-02): breaking only for the level count, which no client may set any more. Two fixed approval levels (owner decision 2026-11-01, CLAUDE.md "Two approval levels", migration 0032): **L1 = Data Entry** and **L2 = Data Reviewer & Approver**, for every stage, register and Dismantle; one person may hold both (a self-approval, B5). (1) `GET /matrix`: `approval_levels` is always 2 and `used_levels` is always `[1, 3]` (L1 is cell level 1, L2 is cell level 3; cell level 2 is a leftover kept only for tasks and records already submitted on a 3-level snapshot, `used = false`); `MatrixCell.level_code` (`L1` or `L2`); `MatrixSkipCase.from_level_code` and `skipped_level_codes`; `MatrixPreview.single_level` is always false. (2) `PATCH /matrix`: `stage_levels[].approval_levels` accepts only 2 (any other value is 422 `validation_failed`, path `/stage_levels/{i}/approval_levels`); saving 2 is a no-op that writes nothing. (3) `RegisterDefinition.approval_levels` and `TaskDefinition.approval_levels` are 2 (or null for a task); `levels_required` of a task or record is 2 for everything submitted since the migration and 1 to 3 only on an older snapshot (B7). (4) The permission level `review` is folded into `approve` (= L2): it is still accepted on input and is stored and returned as `approve`; `entry` is L1; naming one person at both L1 and L2 is how a person is granted both levels. `PATCH /matrix` `empty_cell` now lists only L1 and L2 cells. (5) New `DELETE /matrix/cells/{cell_id}` (owner answer Q86): deletes a region or task override cell (step-up, `If-Match`, `reason` query parameter, audited; a row default is refused with `row_default`); the row default applies again. (6) Default holders (owner answers Q85 and Q90, migration 0035): L1 = the owning team, L2 = the stream Team Lead (Contractors, Risks and Deliverables: the Project Manager; Procurement, GECOL, HLC and Permits & HSE: the Team Lead of CW, and TE for TE permits), seeded only where the cell is missing or empty, or still the untouched legacy seed.
    - 0.6.0 (2026-11-02): one-time enrolment code, so a password alone can never enrol a phone (owner decision 2026-11-02, ADR 0014 amendment). Not purely additive: `POST /auth/local/2fa/enrol/start` now needs a request body with `enrol_code`, and `POST /auth/local/2fa/enrol/confirm` needs `enrol_code` beside `code`. (1) `PUT /users/{user_id}/two-factor` (turning it on) and `POST /users/{user_id}/two-factor/reset` return a new one-time `enrol_code` (8 characters, shown as XXXX-XXXX) and `enrol_code_expires_at` in `TwoFactorState`, once; (2) new `POST /users/{user_id}/two-factor/enrol-code` issues a new code for a user who is waiting for enrolment (the old code stops working; reason, step-up, audited); (3) the enrolment calls need the code, a wrong code counts toward the same lock as a wrong TOTP code; (4) `User.two_factor_enrol_code_expires_at` (when the outstanding code ends, never the code); (5) error codes `invalid_enrol_code` and `enrol_code_expired`; (6) the setting `two_factor.enrol_code_hours` (default 72) is how long a code lasts.
    - 0.5.0 (2026-11-02): additive. Two-factor authentication (TOTP) for local accounts (owner decision 2026-11-02, ADR 0014). (1) `POST /auth/local/login` may answer 200 with `PendingSignIn` (`authenticated: false`, `next` = `two_factor` or `enrol`) and the cookie `pmis_2fa` (HttpOnly, SameSite=Strict, path `/api/v1/auth/local/2fa`, 5 minutes, single use) instead of a session; (2) `POST /auth/local/2fa` completes the sign-in with a TOTP code or one recovery code; (3) `POST /auth/local/2fa/enrol/start` and `/enrol/confirm` enrol a user whose two-factor is on and not set up yet (otpauth URI for the QR code, manual key, 10 one-time recovery codes shown once); (4) `POST /auth/local/2fa/recovery-codes` makes new recovery codes (needs a valid TOTP code); (5) `POST /auth/local/step-up` takes `code` or `recovery_code` when the user's two-factor is on, and `Problem.step_up_method` gains `password_totp`; (6) `PUT /users/{user_id}/two-factor` turns it on or off and `POST /users/{user_id}/two-factor/reset` resets it (System Admin or a delegate holding the new delegable right `users.two_factor`; reason and step-up; nobody changes their own); (7) `User.two_factor` (off, pending_enrolment, on), `Session.two_factor` (enabled and remaining recovery codes) and `Session.mfa` is true for a session that passed a code; error code `invalid_code`.
    - 0.4.10 (2026-11-02): additive. UI plan 4b (X1 to X7) and DD6. (1) Notification inbox (X1): `GET /notifications` gains `snoozed` (hide default, only, include) and `unread_count` counts only visible ones; `POST /notifications/{id}/unread`, `POST /notifications/{id}/snooze` (a date-time, a plain date, or null to clear); `Notification.snoozed_until`; more `NotificationKind` values (`mention`, `followed_change` and the kinds the database already wrote). (2) Follow (X2): `PUT/DELETE /sites/{site_id}/follow`, `PUT/DELETE /registers/{register_key}/records/{record_id}/follow`, `GET /me/follows`; followers get a `followed_change` notification when a task of the site or the record changes, only while they can still read it. (3) Mentions (X3): `@1234` employee-ID tokens in a comment body are resolved like `mention_user_ids`; a person who cannot read the record is neither notified nor named in the answer; `GET/POST /registers/{register_key}/records/{record_id}/comments`. (4) X4: `GET /tasks/{task_id}/time-in-state` and `GET /reports/time-in-state` (needs `reports` view). (5) X5: `GET /reports/workload` (needs `reports` view; reassignment stays `POST /tasks/reassign`). (6) X6: `GET /tasks/{task_id}/blocked-by`. (7) X7: `GET/POST /status-updates`, `PATCH /status-updates/{id}`. (8) DD6: optional `via` (`button`, `drag`, `bulk`) on `start`, `submit`, `review`, `approve`, `reject` of tasks and register records and on `POST /approvals/bulk` (default `bulk`); it is recorded in the audit row and changes no rule. Migration 0031.
    - 0.4.9 (2026-11-01): additive. Write-through edits from the work views (spec registers-and-streams.md 2.7; Q73, Q99). `TaskSummary.register_fields` (only in `GET /sites/{site_id}/tasks`) lists the register-owned fields a task row shows: the value is read from the current record of the source register (the view keeps no copy), `source` points to the register record and `edit_via` says how to edit it with the existing register endpoints (`patch`: `PATCH /registers/{register_key}/records/{id}`; `new_version`: `POST .../versions` first; `create`: `POST /registers/{register_key}/records`). Permissions, the Entry / Review / Approve path and the audit are those of the register, so there is no new endpoint. A register the caller cannot view is left out. BU and EF move to the As-Built register (new fields `cw_as_built_submitted`, `as_built_date`; tasks B13 and D15) and FO / FT to the Dismantle register (the contractor of the `cw` and `te` parts; task E2), Q99. Migration 0029.
    - 0.4.8 (2026-11-01): additive. (1) The remaining registers are enabled on the generic `/registers/{register_key}/...` paths: `contractors` (record types `company` and `team`; an approved one becomes an external party or team), `quality` (`qc`, `snag`, `itp`, `ncr`), `issues`, `risks`, `change_control`, `readiness_handover`, `meetings`, `rf_design`, `acquisition`, `as_built` and `warehouse` (record types `te_dn`, `cw_dn`, `te_rn`, `cw_rn`, `pl`, `open`, `adj`; the last three have no site). Their fields are those of the spec; `Deliverables` stays disabled (Q71). (2) Warehouse in full: `StockMovement` becomes the DN / RN / PL / OPEN / ADJ document with lines (`record_type`, `doc_no`, `register_record_id`, line `qty_approved`, `condition`, `serials`, kinds `receipt` and `adjustment`); a movement is created with `POST /warehouse/movements` (reserves the stock, 422 `insufficient_stock`), is submitted, reviewed and approved through its register record and posts the stock on the final approval; `StockMovementInput` now takes `record_type` (replacing `kind`), the header fields and the lines. The item master carries `manufacturer`, `contract_qty`, `planned_delivery_date`, `progress_item_code` and the read-only `as_built_item_code`; new error code `item_in_use` (422: unit and serial tracking of an item with movements are fixed, an item with a pending movement cannot be deactivated). (3) New tag `as-built` and the editable As-Built item list, linked to Warehouse codes (Q74): `GET` and `POST /as-built/items`, `GET` and `PATCH /as-built/items/{item_id}`; every active item is a number field `q_<code>` of the As-Built register. (4) Correction of the CW / TE / O&M views (Q102 answered): CW DLP (B14) and CW FAC (B15) are always in the CW view; TE FAC (D18) is in the TE view until the O&M team is assigned and in the O&M view after; the O&M view lists only D18.
    - 0.4.7 (2026-11-01): additive. CW / TE / O&M views as tabs of the Site Register (Q98, owner decision 2026-11-01): `view` query parameter on `GET /sites` and `GET /sites/{site_id}/tasks` (a view groups tasks, not whole stages; the four streams stay the filter and can be combined with a view, the result is the tasks in both), `views` in the task grid (`View`: code, name EN/AR, order, the stage and task codes in force) and on each `SiteListItem` (`ViewRef`). View definitions are seed data versioned with the workflow, like streams. CW FAC (B15) and TE FAC (D18) belong to the CW and TE view until the O&M team is assigned (setting `views.om_team_assigned`, default false, Q102) and to the O&M view after.
    - 0.4.6 (2026-10-30): additive. Responsibility Matrix administration (P1-BE-12). `GET /matrix` rows carry `used_levels`, `region_ids_with_cells`, `task_counts` (B7: tasks that follow a new level count and tasks in flight that keep theirs) and `preview` (`MatrixPreview`: where one person holds consecutive levels, the self-skip, and where that reaches the last level, the B5 self-approval, so the screen warns in advance); cells carry `level_kind`, `used` and `updated_at`; assignees of kind role or group carry `member_count`. `Matrix.stages[].register_key` is a `MatrixRowKey` (the register keys plus `rf_design`, `acquisition` and `deliverables`, which have their own matrix rows, Q44 and Q71). `PATCH /matrix` also edits the register and Dismantle rows (`stage_code` is then the row code), answers `empty_cell` with the cells that miss a holder (`Problem.cells`), refuses `rule: all_members` on the Entry level (`entry_rule_fixed`) and needs `matrix.edit` (all-regions for a cell without a region and for a level count). `RegisterField.section` (the form section of a base field, English, in field order) lets the register form follow the server's field definitions. The register rows of the matrix are the register's own rows: cells are keyed by `register_key` and the level count is `RegisterDefinition.approval_levels`, one source for the matrix screen and the register engine.
    - 0.4.5 (2026-10-30): additive. The register framework and its first four registers (`procurement`, `gecol`, `hlc`, `permits_hse`) are implemented on the generic paths of 0.2. New: `POST /registers/{register_key}/records/{record_id}/claim` and `/release`, `GET .../history`, `GET .../versions` and `POST .../versions` (a new version of an approved record: GECOL and HLC requests, Q55; corrections, R9). `GET /registers/{register_key}/records` accepts `entity_id` and `all_versions` (by default the latest version of each logical record). `RegisterRecord` gains `entity_id`, `version_no`, `supersedes_id`, `is_current`, `task` (the task it is the source of, Q43), `self_approval`, `approved_by`, `approved_at`, `source` and `last_transition`; `allowed_actions` also lists `claim`, `release` and `new_version`. Final approval of a register record needs step-up, as for tasks. A `duplicate` 409 carries `existing_id`. Field-level error codes of records: `wrong_register` (Q56), `scope_conflict`, `field_read_only` (Q45) and the rules of each register. A record that is the source of a task is checked again at every submit and just before the task is closed: when its data no longer matches the task source, or the source date is empty, `task` is dropped and the record is approved on the register row only (the task stays open); a source date in the future is refused with 422 `validation_failed` (`errors[].code` `future_date`), as for a date typed on the task.
    - 0.4.4 (2026-10-30): owner answers Q76 to Q84 (minor, additive). `TaskSummary.sla.negative` (boolean): true when an approved task closed its SLA clock at an actual date before the start (a negative duration, data-quality alert, Q82). `SlaStartEvent` also accepts `DLPD:<task code>:<setting key>` (the date of the task plus the calendar days of the setting, `sla.dlp_days.cw`, default 90; used by B-15 CW FAC, Q80). `LockReason` `gate_closed` is now returned for the tasks of the stage behind a closed gate (`ref_code` = the gate code, followed by the gate's own reasons), because a gate locks the tasks of the next stage until it opens, except the tasks in the setting `calc.gate_lock_exempt_tasks` (Q81). No endpoint was added or removed.
    - 0.4.3 (2026-10-29): documentation of behaviour, no shape changed. `SlaStartEvent` also accepts the reserved values `PRED` (the latest date of the predecessors), `OPEN` (the day the task opens) and `DLP:<task code>:<setting key>` (the task date plus the DLP months), because the Master measures some steps from register fields the PMIS does not read yet. `TaskSummary.sla` is filled (start date, elapsed working days, colour, due date, rule set version). `PipelineNode` gates carry the calculated gate date, the Change Control shift and the lock reasons. Holiday, weekend-day and SLA rule-set changes recalculate the due dates of open tasks only.
    - 0.4.2 (2026-10-29): roles are flat (`parent_role_id` and `sub_roles` removed from Role, `parent_role_id` accepted only as null on create); `Problem.count` and `Problem.scope` for `open_snags`, which now blocks CW PAC/FAC on open CW snags and TE PAC/FAC on open TE snags of the site.
    - 0.4.1 (2026-10-29): additive. The Sites module is the **Site Register** (سجل المواقع) and has streams (جزئية): `stream` query parameter on `GET /sites` and `GET /sites/{site_id}/tasks`, `SiteListItem.streams` (`StreamStatus`), `Stream`, `stage.stream_code` and `streams` in the task grid, `TaskSummary.stream_code`; `TransitionResult.votes_missing` and `returned_to_level` (owner decision 2026-10-29, workflow engine).
    - 0.4.0 (2026-10-28): additive. Departments and the direct manager (`GET/POST /departments`, `PATCH /departments/{department_id}`, `PUT /users/{user_id}/org`, `User.manager` and `User.department`); messages between an employee and their direct manager (`/messages/...`); announcements with an agree / disagree answer (`/announcements/...`, `GET /me/announcements/pending`) (ADR 0013).
    - 0.3.1 (2026-10-28): `UserPickerItem.employee_id` may be null (a local account created without an employee ID).
    - 0.3.0 (2026-10-28): additive. Local sign-in with a password, for accounts created in the PMIS (owner decision 2026-10-28, ADR 0012): `POST /auth/local/login`, `POST /auth/local/password`, `POST /auth/local/step-up`, `POST /users` (create a local user with a temporary password), `POST /users/{user_id}/password-reset`; `Session.auth_method` and `must_change_password`; `User.phone`, `local_sign_in`, `must_change_password`; `Problem.step_up_method`; error codes `invalid_credentials`, `password_change_required`, `weak_password`. Microsoft 365 sign-in stays in the contract and is added later beside it.
    - 0.2.6 (2026-10-26): SLA rule sets and weight sets can be written and published (draft, preview, publish with effective date, reason and step-up, versions list); re-run of Project Status with an older weight set by id; enumerated export column codes for sites and tasks; required `reason` on `POST /settings/holidays/import` (not additive, see ADR 0011 amendment 0.2.6).
    - 0.2.5 (2026-10-26): additive. Phase 3b gaps (delegation to role or group, export column codes, `POST /tasks/{task_id}/act-on-behalf`) and admin additions: notification policy and catalogue, security log, log integrity, active sessions and revoke, log retention, `confirm_text` on dangerous actions, `last_admin` documented, and user soft delete and restore (B14) (ADR 0011).
    - 0.2.4 (2026-10-25): additive. `TaskSummary.lock_reasons`, `GET /tasks/{task_id}/slots`, `ImportBatch.site_id` and a described `task_id` on the template upload (ADR 0011).
    - 0.2.3 (2026-10-25): additive. Full, partial and current-view Master export: `parts` and `view` on `POST /exports/master`, `GET /exports/parts`, `MasterExport.kind`; the download streams the file (200) instead of a 302; field-level rules apply to exports (ADR 0011).
    - 0.2.2 (2026-10-25): additive. `POST/GET /exports/master` and `GET /exports/master/{export_id}/download`, job kind `master_export`, error code `export_expired` (ADR 0011).
    - 0.2.1 (2026-10-25): additive. `MatrixAssignee.employee_id` and `user_id`, documented `return_to` allowlist, `ApprovalItem.documents_summary` (ADR 0011).
    - 0.2.0 (2026-10-25): additive. No operation or schema of 0.1 was removed or renamed (ADR 0011).
    - 0.1.0 (2026-10-25): first contract for P1. Breaking changes are recorded in `docs/adr/` (ADR 0001 §6).

    ## Changes since 0.1
    - **Auth**: `GET /auth/login` accepts `identifier` (email, 4-digit employee ID or E.164 phone) and answers 302 the same way whether or not it matches; rate limited (ADR 0002 §9b). Local password sign-in stays deferred and is not in the contract.
    - **Staff registry** (`staff-registry`): search, hover card with visibility applied, create, update, deactivate, reactivate, template import, field-visibility settings.
    - **Absence and reassignment** (`absences`, `reassignment`, B12b): absences CRUD, `POST /tasks/reassign` (task, site or person; reassign, act on behalf or keep), eligible users, lead alerts, idle-task alert setting.
    - **MFA exemption** (`mfa-exemption`): per user, with end date, reason and step-up; nobody exempts themselves.
    - **Calendar** (`calendar`, B12): holidays CRUD, import, confirm tentative, weekend days. **Settings**: structural freeze (B9), DLP months (versioned), idle-task alert.
    - **Registers and Dismantle** (`registers`, B11): catalogue, records CRUD and submit, review, approve, reject, void. The Matrix gains a `kind` per row.
    - **Document Library** (`document-library`), **templates and import batches** (`templates`), **generated forms and number sequences** (`forms`), **warehouse** (`warehouse`), **QC snags and photos** (`qc`), **custom fields** (`custom-fields`).
    - **Notifications** (`notifications`), **System Log** (`system-log`), **Dashboard KPIs** (`dashboard`) and **Project Status** with the weight-set version (`project-status`).
    - **0.2.1**: `MatrixAssignee` gains `employee_id` and `user_id` (so `ball_in_court.holders` can show the ID beside the name); `return_to` allowlist is documented (`/my-work` default, `/step-up-done` for the step-up popup) and a 401 `step_up_url` already carries `return_to`; `ApprovalItem.documents_summary` removes the extra `GET /tasks/{id}` in Approvals detail.
    - **0.2.2**: on-demand full Master export (`exports`): `POST /exports/master` (202 `Job` of kind `master_export`; optional `regions` and `as_of`; `export` grant; scoped by B3; `Idempotency-Key`), `GET /exports/master` (the caller's recent exports), `GET /exports/master/{export_id}/download` (302 to `GSDN_Site_Master_<date>.xlsx`, audited, 410 `export_expired` after the retention setting `master_export.retention_days`, default 7).
    - **0.2.3**: partial export. `POST /exports/master` accepts `parts` (omitted or empty = whole project) or `view` (the current list view: source, filters, columns, sort), never both (422). `GET /exports/parts` lists the parts the caller may export. `MasterExport` echoes `parts`/`view` and adds `kind` (`full`, `partial`, `view`). Files are `GSDN_Site_Master_<date>.xlsx` (full) or `GSDN_<part>_<date>.xlsx`. The download of 0.2.2 now answers 200 with the file (`Content-Disposition: attachment`, `Cache-Control: no-store`), as `/files/{file_id}/download` does; it was documented as a 302 for one day and no client was built on it.
    - **0.2.4**: `TaskSummary.lock_reasons` (optional, same `LockReason` items as `GET /tasks/{task_id}`) so "Why locked?" needs no extra call; `GET /tasks/{task_id}/slots` lists the task's `DocumentSlot`s; the import batch created by a per-task template upload carries `task_id` and `site_id`, and `task_id` is documented on the create request.
    - **0.2.5**: `DelegationInput` and `Delegation` gain `target_kind` (user, role, group), `target_id`, `region_codes`, `module_codes`, `allow_redelegate` (`to_user_id` becomes optional, `Delegation.to_user` is null for role and group targets); `ExportPart.columns` and `ExportColumnCode` define the stable column codes of `ExportView.columns`; `POST /tasks/{task_id}/act-on-behalf` (B12b choice 3); `GET/PUT /settings/notification-policy` and `GET /settings/notification-policy/catalogue`; `GET /security-log`, `POST /security-log/exports`; `GET /audit-log/integrity`, `GET /security-log/integrity`; `GET /sessions/active`, `POST /sessions/{session_id}/revoke`, `POST /users/{user_id}/sessions/revoke`; `GET/PUT /settings/log-retention`; required `confirm_text` on freeze lift and workflow publish with error code `confirmation_mismatch`; grants `manage_users` and `view_security_log`; `last_admin` 409 documented on every operation that can remove the last System Admin; user soft delete and restore (B14): `POST /users/{user_id}/delete`, `POST /users/{user_id}/restore`, `GET /users/deleted`, `holder_account_status` on tasks, alert cause `holder_deactivated`.
    - **0.2.6**: `GET/POST /settings/sla-rule-sets`, `GET/PATCH /settings/sla-rule-sets/{set_id}`, `POST .../preview`, `POST .../publish` (SLA, draft then publish, `apply_to_open_tasks`); `POST /settings/weight-sets`, `GET/PUT /settings/weight-sets/{set_id}`, `POST .../preview`, `POST .../publish` (weights, 100% per level, error `weights_must_total_100`); `weight_set_id` on `GET /project-status`; `SitesExportColumnCode` and `TasksExportColumnCode` inside `ExportColumnCode`; `reason` required on the holidays import. Both write sets need `settings.edit` or a delegation of it, publish needs step-up, and both stay allowed during the structural freeze (B9, light changes).
    - Small additive changes to 0.1 shapes: `User.mfa_exempt`, `TaskSummary.holder_absent` and `idle_working_days`, `Matrix` stage `kind` and `register_key`, `Problem.reason`, new error codes `freeze_active`, `insufficient_stock`, `role_in_use`, new job kinds, `updateRole` also answers 409 and 422.
