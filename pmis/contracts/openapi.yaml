      responses:
        '200':
          description: Follows, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Follow'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /registers/{register_key}/records/{record_id}/comments:
    parameters:
    - {$ref: '#/components/parameters/RegisterKeyPath'}
    - {$ref: '#/components/parameters/RegisterRecordId'}
    get:
      tags: [registers]
      operationId: listRegisterRecordComments
      summary: Comment thread of a register record (0.4.10, X3)
      description: The thread belongs to the record, so all its versions share it. Comments on a global record (no region) are not supported yet.
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageEnvelope'}
                - type: object
                  properties:
                    items: {type: array, items: {$ref: '#/components/schemas/Comment'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [registers]
      operationId: addRegisterRecordComment
      summary: Add a comment with mentions (0.4.10, X3)
      description: Mentions come from `mention_user_ids` and from `@1234` employee-ID tokens in the body. Only a person who can read the record (module, region) is stored as mentioned and notified; anyone else is dropped silently, so the answer never shows whether a person can see the record. Audited.
      x-db-path: reg_add_comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: {type: string, minLength: 1, maxLength: 4000}
                mention_user_ids: {type: array, maxItems: 20, items: {type: string, format: uuid}}
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Comment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
