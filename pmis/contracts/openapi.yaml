tags:
  - name: messages
    description: "Threads between an employee and their direct manager; a System Admin may write to anyone (ADR 0013)."
  - name: announcements
    description: "Announcements to everyone or to chosen users, groups, roles and departments, answered agree or disagree (ADR 0013)."
  - name: departments
    description: "Admin-managed list of departments (ADR 0013)."
  - name: auth
    description: Sign-in, session, employee-ID link, step-up and break-glass (ADR 0002).
  - name: me
    description: The caller's profile, effective permissions and My Work.
  - name: users
    description: Registered employees and their status.
  - name: assignments
    description: Many-to-many role assignments, by role or by person, in bulk (AU-10..AU-13).
  - name: roles
    description: "Admin-defined roles. Roles are flat (owner decision 2026-10-29), with no main/sub-role split."
  - name: permissions
    description: Permission grid, profiles and field-level rules (ADR 0003).
  - name: groups
    description: Named sets of users used in matrix cells.
  - name: delegations
    description: Delegation of System Admin rights.
  - name: regions
    description: The 7 regions.
  - name: sites
    description: "Site Register (سجل المواقع): site list with filters, mini rail and streams (جزئية), site detail and task grid. A stream groups stages (default DESIGN_ACQ: stage 1; CW: stages 2-4; TE: stages 5-8; CLOSURE: stages 9-10; a configurable mapping stage -> stream that is part of the workflow version)."
  - name: tasks
    description: Task detail, data entry, workflow actions, comments, files (ADR 0004).
  - name: approvals
    description: Approvals inbox and bulk actions.
  - name: matrix
    description: Responsibility Matrix.
  - name: workflow
    description: Versioned workflow definition and site migration (ADR 0010).
  - name: audit
    description: Read-only Audit Log (ADR 0006). Append-only hash chain; `GET /audit-log/integrity` verifies it.
  - name: settings
    description: |
      Read access to settings, SLA rules, weight sets, calendars and task definitions. Writes in 0.2, structural freeze, DLP months, idle-task alert, notification policy (0.2.5), log retention (0.2.5), SLA rule sets and weight sets (0.2.6, draft then publish).

      **Freeze (0.2.6).** SLA rule sets and weight sets are light changes under decision B9. They stay allowed during the structural freeze, and none of their operations answers 409 `freeze_active`.

      **Validation convention (0.2.5).** Every settings `PUT` rejects unknown keys (the request schemas are closed) and answers 422 `validation_failed`
      with field-level `errors[]` (`path` = JSON pointer, `code`, `message`), including cross-field rules (for example
      `approval_escalate_days * 24 > approval_remind_hours` in the notification policy). Every settings write needs `reason`, `If-Match`
      for a versioned setting, and writes an audit row with before and after values.
  - name: security
    description: "Sign-in and security log, active sessions and revoke (0.2.5). Separate from the Audit Log and the System Log; append-only hash chain."
  - name: exports
    description: On-demand full, partial or current-view export in the Site Master layout (owner request 2026-10-25, ADR 0011 amendments 0.2.2 and 0.2.3).
  - name: system
    description: Jobs and client error reporting.
  - name: staff-registry
    description: "Registry of Aljeel staff: search, hover card with visibility, maintenance, import, field visibility."
  - name: absences
    description: "Informational absence records (B12b)."
  - name: reassignment
    description: "Lead decisions on tasks of absent or idle people: reassign, act on behalf, keep (B12b)."
  - name: mfa-exemption
    description: "Per-user removal of the PMIS MFA requirement (ADR 0002)."
  - name: calendar
    description: "Work calendar: holidays and weekend days (B12)."
  - name: registers
    description: "Registers and Dismantle with their own menus and Matrix rows (B11)."
  - name: document-library
    description: "Document definitions kept as data (ADR 0007 §4)."
  - name: documents
    description: "The site Documents tab, versions and bulk zip downloads (ADR 0008)."
  - name: templates
    description: "Approved templates, download with embedded ID and version, upload batches, row-wise approval (ADR 0005)."
  - name: forms
    description: "Generated forms DN, RN, PAC, FAC and snag list: template versions, numbering, PDFs."
  - name: warehouse
    description: "Item master, stock levels and movements (DN, RN, PL, OPEN, ADJ documents with lines and serials; reserved while pending, posted on approval)."
  - name: as-built
    description: "The editable As-Built item list (CW quantities and TE items), linked to Warehouse item codes (Q74)."
  - name: qc
    description: "Snag types, snags and QC photos."
  - name: custom-fields
    description: "Admin-defined fields on sites, tasks, milestones, gates and registers (ADR 0009)."
  - name: status-updates
    description: "Weekly status updates per region or team (X7)."
  - name: insights
    description: "Time in state, workload and blocked-by (X4 to X6), read-only."
  - name: notifications
    description: "In-app notifications and channel preferences."
  - name: system-log
    description: "Read-only System/Error Log, separate from the Audit Log."
  - name: dashboard
    description: "Dashboard KPIs (P3 shapes, refined against the legacy dashboard)."
  - name: project-status
    description: "Project Status with the weight-set version, and weekly snapshots."

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    get:
      tags: [auth]
      operationId: authLogin
      summary: Start the Entra ID sign-in (redirect), optionally from an identifier
      description: |
        With `identifier` (email, 4-digit employee ID or E.164 phone) the API resolves it in the staff registry and keeps the
        resolved registry email **server-side only**, in the OIDC `state`/session record. The registry email never appears in
        the redirect: `login_hint` is sent to Entra only when the caller typed an email themselves (they already know it), and
        that value is passed as typed, whether or not it matches. An employee ID or phone never becomes a `login_hint`, so an
        unauthenticated caller cannot learn anyone's email. Status, headers and timing are the same whether or not the identifier
        matches. The lookup is rate limited per IP and per identifier (429 `rate_limited`). On the callback, when the identifier
        resolved to a registry row, the token account must equal that row's email or sign-in is refused and logged (ADR 0002 §9b).
        PMIS never stores passwords; local sign-in is deferred.
      security: []
      parameters:
        - name: identifier
          in: query
          description: 'Email, 4-digit employee ID, or phone in E.164 (`+2189...`). Anything else is treated as no match.'
          schema: { type: string, maxLength: 254 }
        - name: return_to
          in: query
          description: 'App-relative path to open after sign-in or step-up. Server allowlist: `/my-work` (default after login, also used when the value is missing or rejected), `/step-up-done` (the step-up popup), and any other same-origin app route that matches the pattern. The server decodes it, rejects any scheme, host, `//`, backslash or encoded slash, matches it against the server allowlist, and stores the validated value in the server-side OIDC state; the callback never reads it from the URL again. The `step_up_url` of a 401 `step_up_required` already includes `return_to`; clients must not append another.'
          schema: { type: string, maxLength: 512, pattern: '^/(?![/\\\\])[A-Za-z0-9/_\\-?=&.~%]*$' }
      responses:
        '302':
          description: Redirect to the Entra authorize endpoint.
          headers:
            Location: { schema: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: OIDC redirect URI (server side)
      description: Validates `iss`, `aud`, `tid`, signature and, when `require_mfa` is on, `amr` contains `mfa`. Creates the user on first sign-in with status `pending_assignment`.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Session cookie set; redirect to the app (or to the employee-ID page on first sign-in).
          headers:
            Set-Cookie: { schema: { type: string } }
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session state and CSRF token
      description: 'A timer-driven call sends `X-PMIS-Live: 1`; it does not extend the idle timeout.'
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LivePoll'
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      responses:
        '204': { description: 'Signed out.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/employee-id:
    post:
      tags: [auth]
      operationId: linkEmployeeId
      summary: Link the 4-digit employee ID (once, first sign-in)
      x-db-path: idm_link_employee_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id]
              properties:
                employee_id: { $ref: '#/components/schemas/EmployeeId' }
      responses:
        '200':
          description: Linked. The account stays `pending_assignment` until an admin assigns it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/step-up:
    get:
      tags: [auth]
      operationId: startStepUp
      summary: Start a step-up re-authentication (redirect)
      description: Redirects to Entra with `prompt=login` and `max_age=0` (break-glass sessions get a TOTP page instead).
      security:
        - cookieAuth: []
      parameters:
        - name: return_to
          in: query
          required: true
          description: 'App-relative path to open after sign-in or step-up. Server allowlist: `/my-work` (default after login, also used when the value is missing or rejected), `/step-up-done` (the step-up popup), and any other same-origin app route that matches the pattern. The server decodes it, rejects any scheme, host, `//`, backslash or encoded slash, matches it against the server allowlist, and stores the validated value in the server-side OIDC state; the callback never reads it from the URL again. The `step_up_url` of a 401 `step_up_required` already includes `return_to`; clients must not append another.'
          schema: { type: string, maxLength: 512, pattern: '^/(?![/\\\\])[A-Za-z0-9/_\\-?=&.~%]*$' }
      responses:
        '302':
          description: Redirect to Entra.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/step-up/callback:
    get:
      tags: [auth]
      operationId: stepUpCallback
      summary: Step-up redirect URI (server side)
      security:
        - cookieAuth: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Step-up recorded (`stepup_at`), redirect to `return_to`.
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/break-glass:
    post:
      tags: [auth]
      operationId: breakGlassLogin
      summary: Break-glass local admin sign-in (internal network only)
      description: Accepted only from `internal_cidrs`. Every attempt is written to the System Log; success is audited as privileged and emailed to all System Admins. Locked 15 min after 5 failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, totp]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Signed in (session cookie set, max 60 minutes).
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/local/login:
    post:
      tags: [auth]
      operationId: localLogin
      summary: Sign in with an identifier and a password (local account, ADR 0012)
      description: |
        `identifier` is a 4-digit employee ID, an email or an E.164 phone, like the one sign-in box. Every failure answers the
        same 401 `invalid_credentials` with the same text and similar timing, whether the identifier is unknown, the password is
        wrong, the account is locked (5 failures lock it for 15 minutes) or local sign-in is off for it, so the response never
        tells who is registered. Rate limited per IP and per identifier (429 `rate_limited`). On success the session cookie
        `pmis_session` is set (`HttpOnly`, `Secure`, `SameSite=Strict`, path `/api`). When the password was set by an admin,
        `must_change_password` is true and every call except `/auth/*` and `GET /me` answers 403 `password_change_required`
        until `POST /auth/local/password` succeeds. A suspended or disabled account gets 401 `invalid_credentials` too.

        **Two-factor (0.5.0).** When the user's two-factor is on, a right password does not create a session: the answer is 200 `PendingSignIn`
        and the cookie `pmis_2fa` (HttpOnly, SameSite=Strict, path `/api/v1/auth/local/2fa`, 5 minutes, single use). `next` = `two_factor`
        (call `POST /auth/local/2fa`) or `enrol` (the user has no authenticator yet: call the enrolment endpoints). Nothing else is reachable
        with that cookie. The database refuses to create the session until a code success is recorded after the password check.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, password]
              properties:
                identifier: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, format: password, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Signed in (`Session`), or the password was right and a code or an enrolment is still needed (`PendingSignIn`, cookie `pmis_2fa`).
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/PendingSignIn'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/2fa:
    post:
      tags: [auth]
      operationId: localTwoFactor
      summary: Second step of sign-in - the code from the authenticator app (or one recovery code)
      description: |
        Needs the pending sign-in cookie `pmis_2fa` from `POST /auth/local/login` (kind `two_factor`). Send `code` (6 digits, RFC 6238, SHA-1,
        30 seconds, one step of tolerance either side) or `recovery_code` (one of the 10 codes, each works once), not both. On success the
        pending sign-in is used up, the session cookie `pmis_session` is set and `Session.mfa` is true. A time step is accepted once: the
        code that signed in cannot be used again (401 `invalid_code`, the detail says it was already used). A wrong code is 401 `invalid_code`
        and counts toward the lock: 5 wrong codes in a row lock the account for 15 minutes, the same lock as passwords, and end every pending
        sign-in. The code counter is separate from the password counter. A missing, expired, used or wrong-kind pending cookie is 401
        `unauthenticated`. Rate limited (429 `rate_limited`). Every failure is written to the security log.
      x-db-path: auth_totp_result
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCode' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/2fa/enrol/start:
    post:
      tags: [auth]
      operationId: startTwoFactorEnrolment
      summary: Enrolment step 1 - a new secret for the QR code
      description: |
        Needs the pending sign-in cookie with `next` = `enrol` (two-factor is on for the user and no authenticator is set up) **and the one-time
        enrolment code** (0.6.0) that an admin handed to the user (shown once when the admin turned two-factor on, reset it or issued a new code).
        The code is checked in the database before anything else: without a right code no secret is made, none is stored and no QR code is shown, so
        a password alone can never enrol a phone. A missing `enrol_code` is 422 and counts for nothing. A wrong code is 401 `invalid_enrol_code`, a
        code past its end is 401 `enrol_code_expired`; both count toward the same lock as wrong TOTP codes (5 in a row lock the account for 15
        minutes and end every pending sign-in). The code is not used up here (the QR code may be redrawn); it is used up at the confirm step.
        With the right code it makes a new secret, stores it encrypted (AES-256-GCM, key from the server environment) as the pending secret and
        returns it once: the `otpauth_uri` (issuer "GSDN PMIS") for the QR code and the `secret` as the manual key. Calling it again replaces the
        pending secret. The answer is never cached. A user who is already enrolled cannot start again; an admin reset is needed.
      x-db-path: auth_totp_begin_enrol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorEnrolStart' }
      responses:
        '200':
          description: Secret and URI.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorEnrolment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/2fa/enrol/confirm:
    post:
      tags: [auth]
      operationId: confirmTwoFactorEnrolment
      summary: Enrolment step 2 - confirm with a valid code; get the recovery codes
      description: |
        The user types the code their app shows for the secret from step 1. On success the secret becomes active, 10 one-time recovery codes are
        made (stored as a keyed hash, shown once in this answer, never again), the pending sign-in is used up and the user is signed in
        (session cookie set). A wrong code is 401 `invalid_code` and counts toward the lock like any wrong code.
        **0.6.0:** the enrolment code is sent again in `enrol_code` and checked again in the same database step that activates the secret; it is
        used up there (single use). A wrong or expired enrolment code is 401 `invalid_enrol_code` or `enrol_code_expired`, counts toward the same lock,
        and activates nothing. A code replaced by an admin in the meantime is a wrong code.
      x-db-path: auth_totp_confirm_enrol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, enrol_code]
              properties:
                code: { type: string, minLength: 1, maxLength: 16, description: 'The 6-digit code. Spaces are ignored.' }
                enrol_code: { $ref: '#/components/schemas/EnrolCodeInput' }
      responses:
        '200':
          description: Enrolled and signed in.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorEnrolled' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/2fa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: New recovery codes (needs a valid TOTP code)
      description: |
        For a signed-in local user whose two-factor is on. Needs a valid TOTP code (a recovery code is not accepted here). The old codes stop
        working and 10 new ones are returned once. The number left is in `Session.two_factor.recovery_codes_remaining`. 409
        `invalid_transition` when two-factor is not on for the user.
      x-db-path: auth_totp_regenerate_recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 16 }
      responses:
        '200':
          description: New codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change my password (required after a temporary password)
      description: |
        Needs the current password. Policy (422 `weak_password`, `errors[]` names the rule): 12 to 128 characters, not equal to
        the current password, not containing the email, employee ID or phone, not in the server's list of common passwords.
        On success the other sessions of the user end; this session stays and `must_change_password` becomes false.
      x-db-path: auth_local_set_own_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, maxLength: 128 }
                new_password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/local/step-up:
    post:
      tags: [auth]
      operationId: localStepUp
      summary: Step-up for a local session (re-enter the password)
      description: |
        A 401 `step_up_required` on a local session carries `step_up_method` = `password` and no `step_up_url`; the client asks
        for the password and calls this, then retries. Sets `stepup_at`; the window is the setting `stepup_max_age_seconds`
        (default 300). A wrong password answers 401 `invalid_credentials` and counts toward the lockout.

        **Two-factor (0.5.0).** When the user's two-factor is on, the 401 carries `step_up_method` = `password_totp` and this call needs `code`
        (or one `recovery_code`) as well as the password; without it 422 `validation_failed` (`/code` required) and nothing is counted. The
        password is checked first, then the code; a wrong or already used code is 401 `invalid_code` and counts toward the same lock as at sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, maxLength: 128 }
                code: { type: string, maxLength: 16, description: '0.5.0. TOTP code, required when the user''s two-factor is on.' }
                recovery_code: { type: string, maxLength: 32, description: '0.5.0. One recovery code instead of `code`.' }
      responses:
        '200':
          description: Step-up recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ------------------------------------------------------------------ departments, manager (0.4.0)
  /departments:
    get:
      tags: [departments]
      operationId: listDepartments
      summary: Departments (any signed-in user; inactive ones only with include_inactive and admin.users view)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Departments, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Department' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [departments]
      operationId: createDepartment
      summary: Create a department
      description: Needs `edit` on `users` (System Admin or an all-regions delegation). 409 `duplicate` when the code is taken.
      x-db-path: idm_department_save
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /departments/{department_id}:
    parameters:
      - { name: department_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [departments]
      operationId: updateDepartment
      summary: Rename, recode or (de)activate a department
      description: Same rights as create. A department is never deleted; deactivating it keeps its members' link.
      x-db-path: idm_department_save
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/org:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: setUserOrg
      summary: Set a user's direct manager and department
      description: |
        Needs `edit` on `users` (all regions) and step-up. Admins and delegates are changed by a System Admin only.
        The manager must be an active user and must not create a loop (422 `validation_failed`, `errors[].code` =
        `manager_loop`). The department must be active. `null` clears either one.
      x-step-up: true
      x-db-path: idm_set_user_org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manager_id, department_id, reason]
              properties:
                manager_id: { type: [string, 'null'], format: uuid }
                department_id: { type: [string, 'null'], format: uuid }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ messages (0.4.0)
  /messages/contacts:
    get:
      tags: [messages]
      operationId: getMessageContacts
      summary: Who I may start a thread with
      description: My direct manager and the people who report to me. A System Admin may write to any active user (`can_message_anyone`, use `GET /users/picker`).
      responses:
        '200':
          description: Contacts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageContacts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /messages/threads:
    get:
      tags: [messages]
      operationId: listMessageThreads
      summary: My threads, most recent activity first
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Threads.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    required: [unread_total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MessageThreadSummary' } }
                      unread_total: { type: integer, description: 'Threads with a message I have not read.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [messages]
      operationId: startMessageThread
      summary: Start a thread with my manager, one of my reports, or (System Admin) anyone
      description: 403 `action_forbidden` when the recipient is not one of my contacts.
      x-db-path: msg_start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to_user_id, subject, body]
              properties:
                to_user_id: { type: string, format: uuid }
                subject: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /messages/threads/{thread_id}:
    parameters:
      - { name: thread_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [messages]
      operationId: getMessageThread
      summary: One thread, the original message first, then the replies newest first
      description: Only the two participants can read a thread; anyone else gets 404. Reading does not mark it read; call `POST .../read`.
      responses:
        '200':
          description: Thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/threads/{thread_id}/replies:
    parameters:
      - { name: thread_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messages]
      operationId: replyToMessageThread
      summary: Reply in a thread (participants only)
      x-db-path: msg_reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: The thread with the new reply first among the replies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /messages/threads/{thread_id}/read:
    parameters:
      - { name: thread_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messages]
      operationId: markMessageThreadRead
      summary: Mark a thread read for me
      x-db-path: msg_mark_read
      responses:
        '204': { description: 'Marked.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ announcements (0.4.0)
  /announcements:
    get:
      tags: [announcements]
      operationId: listAnnouncements
      summary: Announcements I sent (a System Admin sees all), newest first, with answer counts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Announcements.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AnnouncementSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [announcements]
      operationId: sendAnnouncement
      summary: Send an announcement (System Admin, or a delegation of announcements.create)
      description: |
        The recipients are fixed when it is sent: active users matching `all` or any of the chosen users, groups, roles
        (an assignment valid today) and departments, never the sender. 422 `validation_failed` with `errors[].code` =
        `no_recipients` when nobody matches. Each recipient sees it as a blocking pop-up until they answer.
      x-db-path: ann_send
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /announcements/{announcement_id}:
    parameters:
      - { name: announcement_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [announcements]
      operationId: getAnnouncement
      summary: One announcement with its audience and counts (sender or System Admin; a recipient gets the text only)
      responses:
        '200':
          description: Announcement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /announcements/{announcement_id}/responses:
    parameters:
      - { name: announcement_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [announcements]
      operationId: listAnnouncementResponses
      summary: Every recipient with their answer (sender or System Admin)
      parameters:
        - { name: decision, in: query, schema: { type: string, enum: [agree, disagree, pending] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Responses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AnnouncementResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /announcements/{announcement_id}/responses/export:
    parameters:
      - { name: announcement_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [announcements]
      operationId: exportAnnouncementResponses
      summary: All answers as a CSV file that opens in Excel (UTF-8 with BOM); audited
      responses:
        '200':
          description: 'CSV file (`Content-Disposition: attachment`).'
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /announcements/{announcement_id}/respond:
    parameters:
      - { name: announcement_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [announcements]
      operationId: respondToAnnouncement
      summary: Answer an announcement addressed to me (once)
      description: '`disagree` needs a `note` of at least 3 characters (422 `note_required`). A second answer is 409 `duplicate`. Not addressed to me: 404.'
      x-db-path: ann_respond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [agree, disagree] }
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '204': { description: 'Recorded.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/announcements/pending:
    get:
      tags: [announcements, me]
      operationId: listMyPendingAnnouncements
      summary: Announcements I have not answered yet, oldest first (the web app shows them as a blocking pop-up)
      description: 'Pending and must-change-password accounts may call it too. A timer-driven call sends `X-PMIS-Live: 1`.'
      parameters:
        - $ref: '#/components/parameters/LivePoll'
      responses:
        '200':
          description: Pending announcements.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PendingAnnouncement' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ me
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: My profile, assignments and effective permissions (drives navigation)
      responses:
        '200':
          description: Me.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/preferences:
    patch:
      tags: [me]
      operationId: updateMyPreferences
      summary: Change language and theme
      x-db-path: idm_set_preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                locale: { type: string, enum: [en, ar] }
                theme: { type: string, enum: [light, dark] }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/notify-admins:
    post:
      tags: [me]
      operationId: notifyAdmins
      summary: Pending user asks the System Admins for an assignment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 500 }
      responses:
        '202': { description: 'Notification queued (in-app and email).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/profile:
    get:
      tags: [me]
      operationId: getMyProfile
      summary: My profile (0.9.2)
      description: |
        The signed-in user's own data for the "My profile" page: the fields they edit (`editable_fields`), the admin-owned data shown read-only
        (roles, teams, regions, department, manager, employee ID, status), the two-factor state with what the user may do themselves, and the
        newest email change request. Not for a pending account (403 `pending_assignment`).
      responses:
        '200':
          description: Profile.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [me]
      operationId: updateMyProfile
      summary: Change my own name, phone, language or theme (0.9.2)
      description: |
        Only `display_name`, `phone` (E.164 or null, unique: 409 `duplicate`), `locale` and `theme`. Admin-owned fields (`email`, `employee_id`,
        `status`, `team`, `region_ids`, `roles`, `department_id`, `manager_id` and the like) answer 403 `field_read_only` with `errors[]`
        naming them; the email changes only through `POST /me/email-change`. Unknown keys are 422. Needs `If-Match` (428 / 412). Audited once
        with the before and after values of what really changed (`profile_updated`); sending the current values changes nothing.
      x-db-path: idm_update_own_profile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyProfilePatch' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: Change my password from the profile (0.9.2)
      description: |
        Same as `POST /auth/local/password` for a full session: the current password (a wrong one is 401 `invalid_credentials` and counts toward
        the same lock as sign-in: 5 in a row lock the account for 15 minutes, then 429 `account_locked`), a new password that passes the
        policy (422 `weak_password`), the other sessions end and this one stays. Audited (`password_changed`). Local accounts only: an M365
        session gets 403 `action_forbidden` (the page shows a note instead).
      x-db-path: auth_local_set_own_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, maxLength: 128 }
                new_password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/email-change:
    post:
      tags: [me]
      operationId: requestMyEmailChange
      summary: Ask for a new email (an admin approves it) (0.9.2)
      description: |
        The new email and the password re-entered (a wrong password is 401 `invalid_credentials` and counts toward the lock). The request is
        stored as `pending`; the login email does not change until an admin approves it (`POST /email-change-requests/{request_id}/decide`).
        One pending request per user (409 `invalid_transition`: cancel it first). The address must be free: not the email of any account and
        not asked for in another pending request (409 `duplicate`); the current email is 422. The deciders are told in the inbox
        (`email_change_requested`). Audited. Local accounts only (an M365 session gets 403).
      x-db-path: idm_request_email_change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 128 }
      responses:
        '201':
          description: Pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [me]
      operationId: cancelMyEmailChange
      summary: Cancel my pending email change (0.9.2)
      description: 404 when no request is pending. Audited (`email_change_cancelled`).
      x-db-path: idm_cancel_email_change
      responses:
        '204': { description: Cancelled. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/two-factor/enrol/start:
    post:
      tags: [me]
      operationId: startMyTwoFactorEnrolment
      summary: Turn two-factor on myself, step 1 - a secret for the QR code (0.9.2)
      description: |
        For a signed-in local user whose two-factor is off (409 otherwise). Needs a **fresh step-up of this session** (password; 401
        `step_up_required` otherwise) and **no admin enrolment code**: the one-time code of 0.6.0 protects the sign-in enrolment (a password
        alone at sign-in), while this path needs a live session that already passed sign-in plus a step-up, which the database checks again.
        Returns the secret once (`otpauth_uri` for the QR code, `secret` as the manual key); it is stored encrypted as the pending secret of
        this session for 10 minutes, and only this session can confirm it. Calling again replaces it. Never cached.
      x-step-up: true
      x-db-path: auth_totp_self_begin_enrol
      responses:
        '200':
          description: Secret and URI.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorEnrolment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/two-factor/enrol/confirm:
    post:
      tags: [me]
      operationId: confirmMyTwoFactorEnrolment
      summary: Turn two-factor on myself, step 2 - confirm with a code (0.9.2)
      description: |
        The first code from the app. A wrong code is 401 `invalid_code` and counts toward the lock like any wrong code; nothing started from
        this session (or older than 10 minutes) is 409. On success two-factor is on and **not enforced**, 10 recovery codes are returned once,
        the user's other sessions end (they never passed a code) and this session stays, counting as having passed a code. From now on every
        sign-in asks for the code. Audited (`two_factor_self_enabled`). Never cached.
      x-db-path: auth_totp_self_confirm_enrol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 16 }
      responses:
        '200':
          description: On.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes, two_factor, other_sessions_ended]
                properties:
                  recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
                  two_factor: { $ref: '#/components/schemas/MyTwoFactor' }
                  other_sessions_ended: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/two-factor/disable:
    post:
      tags: [me]
      operationId: disableMyTwoFactor
      summary: Turn two-factor off myself (0.9.2)
      description: |
        Needs the password and a TOTP `code` or one `recovery_code` (missing: 422, nothing counted). **403 `two_factor_enforced` when an admin
        enforces it** (`User.two_factor_enforced`), answered before anything is counted. A wrong password (401 `invalid_credentials`) or code
        (401 `invalid_code`) counts toward the lock. On success the secret, the recovery codes and pending sign-ins are deleted. 409 when
        two-factor is not on. Audited (`two_factor_self_disabled`).
      x-db-path: auth_totp_self_disable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, maxLength: 128 }
                code: { type: string, maxLength: 16 }
                recovery_code: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTwoFactor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/tasks:
    get:
      tags: [me]
      operationId: listMyTasks
      summary: My Work (tasks where I am an eligible holder or the claimant)
      parameters:
        - name: bucket
          in: query
          description: late = over SLA max; do_now = at my level; waiting = submitted by me, at a later level.
          schema: { type: string, enum: [late, do_now, waiting] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ users
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Registered employees (everyone who signed in with M365)
      description: Needs `view` on `admin.users`. Name pickers use `GET /users/picker`, which returns a reduced shape. Soft-deleted users (B14) are not listed here; see `GET /users/deleted`.
      parameters:
        - { name: q, in: query, description: 'Search name, email or employee ID.', schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: role_id, in: query, description: 'Users holding this role (active rows).', schema: { type: string, format: uuid } }
        - { name: region_id, in: query, schema: { $ref: '#/components/schemas/RegionId' } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createLocalUser
      summary: Create a user who signs in with a password (local account, ADR 0012)
      description: |
        Needs `create` on `users` (System Admin or a delegation, all regions). The new account is `pending_assignment` until an
        admin assigns it, like a first M365 sign-in. The server generates a temporary password when `temporary_password` is
        omitted and returns it **once** in the response; it is never stored or shown again. The user must change it at the first
        sign-in. Email, employee ID and phone must each be unused (409 `duplicate`, `errors[]` names the field).
      x-db-path: idm_create_local_user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUserCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/deleted:
    get:
      tags: [users]
      operationId: listDeletedUsers
      summary: Soft-deleted users (B14), newest deletion first
      description: Needs `view` on `admin.users`. Each row says whether it can be restored (`can_restore`) and why not (`restore_blocked_reason`).
      parameters:
        - { name: q, in: query, description: 'Search name, email or employee ID.', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Deleted users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DeletedUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/picker:
    get:
      tags: [users]
      operationId: pickUsers
      summary: Name picker for any active user (id, display name, employee ID only)
      description: Separate endpoint so the response can never fall back to the full User. Returns active users only; at most 20 per page; `q` of at least 2 characters is required.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: role_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Picker items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/UserPickerItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: One user with assignments and groups
      responses:
        '200':
          description: User.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change status or employee ID (admin)
      description: |
        Deactivating a user (`status` suspended or disabled) ends all their sessions at once (security log `session_revoked_by_admin`). Claimed tasks return to the cell (AU-09). Tasks held at a level by the person do **not** move (B14, B12b): they stay on the person with `holder_account_status` = `deactivated`, the Team Lead is alerted at once (`holder_deactivated`, `GET /reassignments/alerts`) and decides with `POST /tasks/reassign` or `POST /tasks/{task_id}/act-on-behalf`. SLA never pauses or resets. A level left with no eligible active holder goes to the System Admins' inbox as "no holder" (B10).
        Refused with 409 `last_admin` if it would leave no active System Admin, and with `self_beneficiary` for the caller's own row.
      x-step-up: true
      x-db-path: idm_set_user_status / idm_link_employee_id
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              minProperties: 2
              properties:
                status: { $ref: '#/components/schemas/UserStatus' }
                employee_id: { $ref: '#/components/schemas/EmployeeId' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{user_id}/delete:
    post:
      tags: [users]
      operationId: deleteUser
      summary: Soft-delete a user (B14); reversible with restore
      description: |
        Sets `deleted_at`, `deleted_by` and the reason; the row, its history and its assignments are kept (nothing is hard-deleted). The user is deactivated first if needed, all sessions end, and the account can no longer sign in. Same effect on open tasks as a deactivation: **nothing moves automatically**; tasks stay on the person with `holder_account_status` = `deleted`, the Team Lead is alerted (`holder_deactivated`) and uses reassign, act on behalf or keep (B12b). SLA never pauses or resets.
        Refused with 409 `last_admin` if it would leave no active System Admin, 403 `self_beneficiary` for the caller's own row, and 409 `invalid_transition` when already deleted.
      x-step-up: true
      x-db-path: idm_delete_user
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/DeleteReason' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{user_id}/restore:
    post:
      tags: [users]
      operationId: restoreUser
      summary: Restore a soft-deleted user (B14)
      description: |
        Re-enables the account and its previous assignments (their validity dates still apply). Refused with 409 `duplicate` when the employee ID (staff registry row) or the email is now owned by another account; `errors[]` names the field and `GET /users/deleted` shows `can_restore` = false with `restore_blocked_reason`. Tasks that stayed on the person show `holder_account_status` = `active` again.
      x-step-up: true
      x-db-path: idm_restore_user
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{user_id}/two-factor:
    put:
      tags: [users]
      operationId: setUserTwoFactor
      summary: Turn two-factor (TOTP) on or off for a user (0.5.0)
      description: |
        System Admin, or a delegate holding the delegable right `users.two_factor` (delegation grant `users.administer`, all regions). Needs a
        reason and the acting admin's own step-up. **Nobody changes their own setting** (403 `self_beneficiary`, also for an admin). Only a
        System Admin changes an admin or a delegate. The user needs a local account (422 otherwise).
        On: the user is asked to enrol (QR code) at the next sign-in, and their local sessions end now so no session lives on without a
        code. **0.6.0:** the answer carries a one-time `enrol_code` (and `enrol_code_expires_at`), shown only in this answer and never cached: the
        admin hands it to the user in person or by phone, and the user cannot enrol without it. Only a keyed hash is stored. Off: the secret, the
        recovery codes and any outstanding enrolment code are deleted. Setting what is already set changes nothing, writes no audit row and returns
        no code (use `POST /users/{user_id}/two-factor/enrol-code` for a new one).
        The change is audited with before and after (never the secret).
        **0.9.2:** turning it on also marks it **enforced by admin** (`User.two_factor_enforced`), so the user cannot turn it off; "on" for a user who
        already turned it on themselves marks it enforced and returns no code. Turning it off clears the mark. A user whose two-factor is not
        enforced may turn it off from the profile (`POST /me/two-factor/disable`); see also `PUT /users/{user_id}/two-factor/enforced`.
      x-step-up: true
      x-db-path: idm_set_two_factor
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, reason]
              properties:
                enabled: { type: boolean }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/two-factor/enforced:
    put:
      tags: [users]
      operationId: setUserTwoFactorEnforced
      summary: Mark or unmark two-factor as enforced by an admin (0.9.2)
      description: |
        While two-factor is enforced the user cannot turn it off from the profile (403 `two_factor_enforced`). Turning two-factor on through
        `PUT /users/{user_id}/two-factor` enforces it already; this call marks or unmarks it on its own, for a user whose two-factor is on or
        waiting for enrolment (409 `invalid_transition` while it is off). Same rights as the toggle: System Admin, or a delegate holding
        `users.two_factor` (delegation grant `users.administer`, all regions); only a System Admin for an admin or a delegate; never one's own
        account (403 `self_beneficiary`). Needs a reason and step-up. Setting what is set changes nothing and writes no audit row; otherwise
        audited (`two_factor_enforced`, `two_factor_unenforced`) with before and after.
      x-step-up: true
      x-db-path: idm_set_two_factor_enforced
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enforced, reason]
              properties:
                enforced: { type: boolean }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema:
                type: object
                required: [two_factor, enforced]
                properties:
                  two_factor: { $ref: '#/components/schemas/TwoFactorLabel' }
                  enforced: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /email-change-requests:
    get:
      tags: [users]
      operationId: listEmailChangeRequests
      summary: Email change requests to decide (0.9.2)
      description: |
        System Admin, or a delegate holding `users.edit` for all regions (403 otherwise). `status` defaults to `pending`; `all` lists every
        request. Newest first, at most 200.
      x-db-path: idm_email_change_list
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled, all], default: pending }
      responses:
        '200':
          description: Requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EmailChangeRequestAdmin' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /email-change-requests/{request_id}/decide:
    post:
      tags: [users]
      operationId: decideEmailChangeRequest
      summary: Approve or reject an email change (0.9.2)
      description: |
        System Admin, or a delegate holding `users.edit` for all regions; a delegate never for an admin or a delegate. **Never on one's own
        account** (403 `self_beneficiary`). Needs a reason and step-up. Only `approve` changes the user's login email (and so the address the
        first M365 sign-in matches); uniqueness is checked again (409 `duplicate`). A request that is no longer pending is 409
        `invalid_transition`. The user is told in the inbox (`email_change_decided`). Audited (`email_changed` or `email_change_rejected`) with
        before and after.
      x-step-up: true
      x-db-path: idm_decide_email_change
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeRequestAdmin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/two-factor/reset:
    post:
      tags: [users]
      operationId: resetUserTwoFactor
      summary: Reset a user's two-factor after a lost phone (0.5.0)
      description: |
        Same rights, reason, step-up and self rule as `PUT /users/{user_id}/two-factor`. Clears the secret and the recovery codes, forces a
        new enrolment at the next sign-in and ends all the user's sessions. 409 `invalid_transition` when two-factor is not on for the user.
        **0.6.0:** returns a new one-time `enrol_code` and `enrol_code_expires_at` (shown once, never cached) that the user needs to enrol again.
      x-step-up: true
      x-db-path: idm_reset_two_factor
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: New state (`pending_enrolment`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/two-factor/enrol-code:
    post:
      tags: [users]
      operationId: issueUserTwoFactorEnrolCode
      summary: Issue a new one-time enrolment code for a user who is waiting for enrolment (0.6.0)
      description: |
        Same rights, reason, step-up and self rule as `PUT /users/{user_id}/two-factor` (System Admin, or a delegate holding `users.two_factor`;
        nobody issues one for their own account, 403 `self_beneficiary`). For a user whose two-factor is on and who has not enrolled yet
        (`two_factor` = `pending_enrolment`): the code was lost, has expired, or the admin does not trust it. The old code stops working at once, a
        half-made enrolment is dropped and the user's pending sign-ins end. The new code is returned once (never cached); only a keyed hash is
        stored, and it lasts the setting `two_factor.enrol_code_hours` (default 72). 409 `invalid_transition` when the user is not waiting for
        enrolment (two-factor off, or already enrolled: use the reset). The change is audited (`two_factor_enrol_code_issued`, with whether the
        old code was none, active or expired; never a code).
      x-step-up: true
      x-db-path: idm_issue_two_factor_enrol_code
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithReason' }
      responses:
        '200':
          description: The new code, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/password-reset:
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Set a temporary password for a user (local sign-in)
      description: |
        Needs `edit` on `users` (all regions) and step-up. Not for yourself (use `POST /auth/local/password`). Whoever sets a
        password can sign in as the user, so a delegate may reset only an account with no rights yet (no current or future
        assignment, no Entra link, not an admin or delegate); anything else is System Admin only (403 `action_forbidden`). Turns local sign-in on for the account if it was off, unlocks it, ends all its
        sessions, and makes the user change the password at the next sign-in. Omit `temporary_password` to have the server
        generate one; it is returned once.
      x-step-up: true
      x-db-path: idm_reset_local_password
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                temporary_password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password]
                properties:
                  temporary_password: { type: string, description: 'Shown once. Hand it to the user by a separate channel.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{user_id}/assignments:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [assignments]
      operationId: listUserAssignments
      summary: Assignment rows of one person (by-person view)
      parameters:
        - { name: include_ended, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ assignments
  /assignments:
    get:
      tags: [assignments]
      operationId: listAssignments
      summary: Assignment rows (by-role view)
      parameters:
        - { name: role_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: profile_id, in: query, schema: { type: string, format: uuid } }
        - { name: active_on, in: query, description: 'Rows active on this date (default today).', schema: { type: string, format: date } }
        - { name: include_ended, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assignments/bulk-assign:
    post:
      tags: [assignments]
      operationId: bulkAssign
      summary: Assign one role to many people, or many roles to one person
      description: |
        Creates one row per (user, role). Existing overlapping rows are skipped with `already_assigned` (AU-11).
        Rows whose beneficiary is the caller are refused with `self_beneficiary` unless the caller is a System Admin without delegation.
        All rows share one `bulk_action_id` in the audit log. `dry_run=true` returns the same result without writing.
      x-step-up: true
      x-db-path: idm_assign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkAssignRequest' }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /assignments/bulk-update:
    post:
      tags: [assignments]
      operationId: bulkUpdateAssignments
      summary: Edit level, regions, modules, profiles or dates of many rows
      description: A change (lower level, narrower scope, earlier `valid_to`) that would leave no active System Admin is refused with `last_admin`, per row in `failed`, or 409 when every row is refused.
      x-step-up: true
      x-db-path: idm_update_assignment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, patch, reason]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/VersionedRef' }
                patch: { $ref: '#/components/schemas/AssignmentPatch' }
                reason: { $ref: '#/components/schemas/Reason' }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /assignments/bulk-end:
    post:
      tags: [assignments]
      operationId: bulkEndAssignments
      summary: Remove (end) assignment rows
      description: |
        Sets `valid_to` (default now); rows are never deleted (AU-13). Claimed tasks of the ended role return to their cell.
        A row whose end would leave no active System Admin is refused with `last_admin`: reported in `failed` of the result, and the whole request answers 409 `last_admin` when every row is refused.
      x-step-up: true
      x-db-path: idm_end_assignment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/VersionedRef' }
                valid_to: { type: string, format: date-time }
                reason: { $ref: '#/components/schemas/Reason' }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /assignments/copy:
    post:
      tags: [assignments]
      operationId: copyAssignments
      summary: Copy the active rows of one person to others (add or replace)
      description: Use `dry_run=true` for the preview shown before confirming (AU-13). A `to_user_ids` entry equal to the caller is refused with 403 `self_beneficiary` (also in the dry run) unless the caller is a System Admin acting without delegation, so nobody can copy another person's rights to themselves; `idm_copy_assignments` enforces it like `idm_assign`.
      x-step-up: true
      x-db-path: idm_copy_assignments
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_user_id, to_user_ids, mode, reason]
              properties:
                from_user_id: { type: string, format: uuid }
                to_user_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                mode: { type: string, enum: [add, replace] }
                reason: { $ref: '#/components/schemas/Reason' }
                dry_run: { type: boolean, default: true }
      responses:
        '200':
          description: Per-row result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ roles
  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: Roles (flat list)
      description: One flat list in the admin's order (`sort`, then name). There is no main/sub-role nesting. Since 0.4.2 `parent_role_id` and `sub_roles` are gone from the answer.
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role (admin)
      description: Roles are flat. `parent_role_id` is deprecated in 0.4.2 and accepted only as `null`; any other value is refused with 422 `validation_failed` on `/parent_role_id`.
      x-step-up: true
      x-db-path: idm_save_role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [roles]
      operationId: getRole
      summary: One role
      responses:
        '200':
          description: Role.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [roles]
      operationId: updateRole
      summary: Rename, change defaults, or deactivate a role (never deleted while assigned)
      description: Deactivating the role that gives the System Admin rights, or removing those rights from it, is refused with 409 `last_admin` when it would leave no active System Admin. A role with active assignments is refused with 409 `role_in_use`.
      x-step-up: true
      x-db-path: idm_save_role
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RolePatch'
                - type: object
                  required: [reason]
                  properties:
                    reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------------ permissions
  /permissions/catalogue:
    get:
      tags: [permissions]
      operationId: getPermissionCatalogue
      summary: Modules, screens, actions and delegable rights (for the grid editor)
      responses:
        '200':
          description: Catalogue.
          content:
            application/json:
