    # ---------------------------------------------------------- custom fields
    CustomFieldEntity:
      type: string
      enum: [site, milestone, gate, task, rf_design, acquisition, procurement, contractors, gecol, hlc, permits_hse, warehouse, quality, issues, risks, change_control, readiness_handover, as_built, meetings, dismantle]
    CustomFieldFields:
      type: object
      properties:
        label_en: { type: string, minLength: 1 }
        label_ar: { type: [string, 'null'] }
        required: { type: boolean }
        validation:
          type: object
          properties:
            min: { type: number }
            max: { type: number }
            min_length: { type: integer }
            max_length: { type: integer }
            pattern:
              type: string
              maxLength: 200
              description: 'Validated as a safe regular expression and matched with a linear-time engine (RE2) with a time limit, in the API and in the import parser (no ReDoS).'
        default_value: {}
        section: { type: [string, 'null'] }
        sort_order: { type: integer }
        list_values:
          type: array
          items:
            type: object
            required: [value, label_en]
            properties:
              value: { type: string }
              label_en: { type: string }
              label_ar: { type: [string, 'null'] }
              is_active: { type: boolean, default: true }
        visible_to_role_ids: { type: array, items: { type: string, format: uuid }, description: 'Empty = everyone who can see the entity.' }
        editable_by_role_ids: { type: array, items: { type: string, format: uuid } }
        in_templates: { type: boolean }
        in_exports: { type: boolean }
        in_list_filters: { type: boolean }
        in_lists: { type: boolean }
        master_export_column: { type: [string, 'null'], description: 'Must not collide with the 187 Master columns (422 `validation_failed`).' }
        is_active: { type: boolean }
    CustomFieldDefinition:
      allOf:
        - $ref: '#/components/schemas/CustomFieldFields'
        - type: object
          required: [id, entity_type, code, label_en, data_type, is_active, version]
          properties:
            id: { type: string, format: uuid }
            entity_type: { $ref: '#/components/schemas/CustomFieldEntity' }
            task_code: { type: [string, 'null'], description: 'Set for task-scoped fields.' }
            code: { type: string }
            data_type: { type: string, enum: [text, number, date, list, multi_list, yes_no, user, external_party, file] }
            has_values: { type: boolean, description: 'A field holding values cannot be re-typed or re-keyed.' }
            version: { type: integer }
    CustomFieldInput:
      allOf:
        - $ref: '#/components/schemas/CustomFieldFields'
        - $ref: '#/components/schemas/WithReason'
        - type: object
          required: [entity_type, code, label_en, data_type]
          properties:
            entity_type: { $ref: '#/components/schemas/CustomFieldEntity' }
            task_code: { type: string }
            code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
            data_type: { type: string, enum: [text, number, date, list, multi_list, yes_no, user, external_party, file] }
    CustomFieldPatch:
      allOf:
        - $ref: '#/components/schemas/CustomFieldFields'
        - $ref: '#/components/schemas/WithReason'
        - type: object
          minProperties: 2
    # ---------------------------------------------------------- 0.2.5: notification policy, security log, sessions, retention
    NotificationTypeCode:
      type: string
      enum: [task_submitted_review, task_submitted_approval, task_rejected, approval_overdue_reminder, approval_overdue_escalation, task_idle, assignee_absent, holder_deactivated, sla_near_max, sla_exceeded, no_holder, batch_upload_pending, batch_upload_result, snag_opened, snag_closed, pac_blocked_by_snags, holiday_tentative_reminder, structural_freeze_lifted, mfa_exemption_granted, mfa_exemption_revoked, admin_override_used, repeated_failed_sign_in, callback_account_mismatch, audit_integrity_failure, retention_reduced]
    NotificationCategory:
      type: string
      enum: [approvals, tasks, sla, registers, security, system]
    NotificationRecipientKind:
      type: string
      enum: [holder, previous_holder, team_lead, project_manager, system_admins, affected_user, actor]
      description: 'Default recipient of a type. `holder` = the person (or group) holding the level; `team_lead` = the Team Lead of the task''s module and region.'
    NotificationChannels:
      type: object
      additionalProperties: false
      required: [in_app, email]
      properties:
        in_app: { type: boolean }
        email: { type: boolean }
    NotificationTypeDef:
      type: object
      required: [code, category, label_en, label_ar, kind, default_recipients, eligible_roles, system_admins_only, mandatory, default_channels]
      properties:
        code: { $ref: '#/components/schemas/NotificationTypeCode' }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        label_en: { type: string }
        label_ar: { type: string }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        default_recipients: { type: array, items: { $ref: '#/components/schemas/NotificationRecipientKind' } }
        eligible_roles:
          description: Role codes (`Role.code`) that may get a column for this type; `all` = any role or group. Empty when `system_admins_only`.
          oneOf:
            - type: string
              const: all
            - type: array
              items: { type: string }
        system_admins_only: { type: boolean, description: 'Security and system types: the recipients are System Admins only.' }
        mandatory: { type: boolean, description: 'Locked: the policy cannot switch it off (422 `mandatory_locked`) and a person cannot switch it off.' }
        immediate: { type: boolean, description: 'Sent at once, never held for the daily digest.' }
        default_channels: { $ref: '#/components/schemas/NotificationChannels' }
    NotificationThresholds:
      type: object
      additionalProperties: false
      description: |
        Limits are enforced on write (422 `validation_failed`). `no_holder` (B10) is always immediate and has no threshold. The idle-task days stay in `/settings/idle-task-alert`.
        Rule: `approval_escalate_days * 24 > approval_remind_hours`.
      required: [approval_remind_hours, approval_escalate_days, sla_warning_days_before_max, rate_cap_per_hour, retention_days]
      properties:
        approval_remind_hours: { type: integer, minimum: 4, maximum: 168, default: 48, description: 'Hours a task waits at a level before the holder is reminded.' }
        approval_escalate_days: { type: integer, minimum: 1, maximum: 30, default: 5, description: 'Days a task waits before the Team Lead is alerted (escalation).' }
        sla_warning_days_before_max: { type: integer, minimum: 0, maximum: 30, default: 2, description: 'Working days before the SLA maximum at which `sla_near_max` is sent; 0 = no early warning.' }
        rate_cap_per_hour: { type: integer, minimum: 5, maximum: 500, default: 50, description: 'Notifications one person can receive per hour; the rest wait for the digest. Mandatory types are not capped.' }
        retention_days: { type: integer, minimum: 30, maximum: 730, default: 180, description: 'Days notifications are kept before they are purged.' }
    NotificationPolicyColumn:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [role, group] }
        id: { type: string, format: uuid }
        name: { type: string, readOnly: true }
    NotificationPolicyCell:
      type: object
      additionalProperties: false
      required: [kind, id, on]
      properties:
        kind: { type: string, enum: [role, group] }
        id: { type: string, format: uuid, description: 'Must be one of the `columns`.' }
        on: { type: boolean }
    NotificationPolicyRow:
      type: object
      additionalProperties: false
      required: [type_code, channels, cells]
      properties:
        type_code: { $ref: '#/components/schemas/NotificationTypeCode' }
        channels: { $ref: '#/components/schemas/NotificationChannels' }
        mandatory: { type: boolean, readOnly: true, description: 'From the catalogue; a mandatory type cannot be switched off.' }
        cells: { type: array, items: { $ref: '#/components/schemas/NotificationPolicyCell' }, description: 'On or off per column. A column without a cell uses the catalogue default recipients.' }
    NotificationPolicy:
      type: object
      required: [enabled, timezone, digest_hour, work_days_follow_calendar, work_days, thresholds, columns, matrix, version]
      properties:
        enabled: { type: boolean, description: 'Master switch. Mandatory types are still sent when false.' }
        timezone: { type: string, default: Africa/Tripoli, description: 'IANA time zone used for the digest hour and working days.' }
        digest_hour: { type: integer, minimum: 0, maximum: 23, default: 8, description: 'Hour (0-23, in `timezone`) at which the daily digest is sent.' }
        work_days_follow_calendar: { type: boolean, default: true, description: 'true = working days come from the work calendar (weekend Friday and Saturday by default, `/settings/weekend-days`) and `work_days` is derived.' }
        work_days: { type: array, uniqueItems: true, minItems: 1, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 }, default: [0, 1, 2, 3, 4], description: '0 = Sunday. Derived from the calendar when `work_days_follow_calendar`; otherwise this list is used.' }
        thresholds: { $ref: '#/components/schemas/NotificationThresholds' }
        columns: { type: array, items: { $ref: '#/components/schemas/NotificationPolicyColumn' }, description: 'The roles and groups shown as matrix columns.' }
        matrix: { type: array, items: { $ref: '#/components/schemas/NotificationPolicyRow' } }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: '#/components/schemas/UserRef' }
    NotificationPolicyInput:
      type: object
      additionalProperties: false
      description: Closed schema. `work_days` is needed only when `work_days_follow_calendar` is false; `columns` may be omitted to keep the current ones. Read-only fields (`name`, `mandatory`) are ignored if echoed back.
      required: [reason, enabled, timezone, digest_hour, work_days_follow_calendar, thresholds, matrix]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
        enabled: { type: boolean }
        timezone: { type: string }
        digest_hour: { type: integer, minimum: 0, maximum: 23 }
        work_days_follow_calendar: { type: boolean }
        work_days: { type: array, uniqueItems: true, minItems: 1, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 } }
        thresholds: { $ref: '#/components/schemas/NotificationThresholds' }
        columns: { type: array, items: { $ref: '#/components/schemas/NotificationPolicyColumn' } }
        matrix: { type: array, items: { $ref: '#/components/schemas/NotificationPolicyRow' } }
    LogRetention:
      type: object
      required: [system_log_days, security_log_days, audit_log_years, version]
      properties:
        system_log_days: { type: integer, minimum: 90, maximum: 3650, default: 365 }
        security_log_days: { type: integer, minimum: 365, maximum: 3650, default: 730 }
        audit_log_years: { type: integer, const: 10, readOnly: true, description: 'Fixed at 10 years; the Audit Log is never purged and this is not settable.' }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: '#/components/schemas/UserRef' }
    LogRetentionInput:
      type: object
      additionalProperties: false
      required: [reason, system_log_days, security_log_days]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
        system_log_days: { type: integer, minimum: 90, maximum: 3650 }
        security_log_days: { type: integer, minimum: 365, maximum: 3650 }
    SecurityEvent:
      type: string
      enum: [sign_in_started, sign_in_succeeded, callback_account_mismatch, sign_in_failed, signed_out, session_expired, session_revoked_by_admin, mfa_exemption_granted, mfa_exemption_revoked, step_up_passed, step_up_failed, break_glass_used]
    SecurityOutcome:
      type: string
      enum: [success, failure, info]
    SecurityLogEntry:
      type: object
      required: [id, at, event, outcome]
      properties:
        id: { type: integer, format: int64, description: 'Position in the hash chain.' }
        at: { type: string, format: date-time }
        event: { $ref: '#/components/schemas/SecurityEvent' }
        outcome: { $ref: '#/components/schemas/SecurityOutcome' }
        user: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'The matched person; null when the identifier matched no registry row.' }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'The admin, for admin-caused events (revoke, MFA exemption).' }
        identifier_masked:
          type: [string, 'null']
          pattern: '^\?[A-Za-z0-9+]?\*\*\*#[0-9a-f]{12}$'
          description: |
            Set only when the identifier typed in the one-box sign-in matches no registry row. The raw text is NEVER stored or logged.
            Format: `?` + the first character only if the input looks like an email, employee ID or phone (otherwise nothing) + `***#` + the first 12 hex digits of HMAC-SHA-256 of the normalised input (trimmed, lower case) with a server-side key. Examples: `?a***#3f9c01d2ab47`, `?***#3f9c01d2ab47`. The same input gives the same suffix, so repeated attempts can be grouped without revealing the text.
        client_type: { type: string, enum: [web, mobile, break_glass] }
        ip: { type: [string, 'null'], description: 'Raw IP, System Admins only; null for a reader with `view_security_log`.' }
        user_agent: { type: [string, 'null'] }
        session_id: { type: [string, 'null'], format: uuid }
        request_id: { type: [string, 'null'] }
        details: { type: [object, 'null'], additionalProperties: true }
    LogIntegrity:
      type: object
      required: [log, status, row_count, first_seq, last_seq, head_hash, checked_at, breaks]
      properties:
        log: { type: string, enum: [audit, security] }
        status: { type: string, enum: [ok, broken] }
        row_count: { type: integer, format: int64 }
        first_seq: { type: [integer, 'null'], format: int64 }
        last_seq: { type: [integer, 'null'], format: int64 }
        head_hash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'SHA-256 hash of the last row checked (chain head).' }
        checked_at: { type: string, format: date-time }
        breaks:
          type: array
          items:
            type: object
            required: [seq, kind]
            properties:
              seq: { type: integer, format: int64, description: 'First row at which the chain no longer holds.' }
              kind: { type: string, enum: [hash_mismatch, sequence_gap, previous_hash_mismatch] }
              expected_hash: { type: [string, 'null'] }
              found_hash: { type: [string, 'null'] }
    ActiveSession:
      type: object
      required: [session_id, user, status, last_activity_at, signed_in_at, client_type]
