      x-step-up: true
      x-db-path: idm_set_mfa_exempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/WithReason'}
              - type: object
                properties:
                  until:
                    type: [string, 'null']
                    format: date-time
                    description: null = until revoked.
