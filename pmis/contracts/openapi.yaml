      summary: Exempt a user from the PMIS MFA requirement
      description: Removes only the PMIS `amr = mfa` check for sign-in and step-up of that user. MFA enforced by Entra Conditional Access is not affected. Needs a reason and the acting admin's own step-up. Nobody can exempt themselves (403 `self_beneficiary`).
