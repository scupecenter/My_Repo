      required: [sites_total, sites_closed, closed_pct, active_sites, closed_pct_of_active, pending_cw_fac, pending_te_fac]
      properties:
        sites_total: {type: integer, description: 'Base: active sites with HOTO achieved (rules.md section 6.1, ASSUMPTION).'}
        sites_closed: {type: integer}
        closed_pct: {type: number}
        active_sites: {type: integer}
        closed_pct_of_active: {type: number}
        pending_cw_fac:
          allOf:
          - {$ref: '#/components/schemas/FinalClosureAging'}
          - {type: object, properties: {not_due: {type: integer}}}
        pending_te_fac:
          allOf:
          - {$ref: '#/components/schemas/FinalClosureAging'}
          - {type: object, properties: {not_due: {type: integer}}}
    DashboardHeadline:
      type: object
      required: [sites_total, sites_cancelled, by_overall_status, milestones, final_closure, project_status]
      properties:
        sites_total: {type: integer, description: 'Active sites (cancelled ones are not counted).'}
        sites_cancelled: {type: integer}
        by_overall_status:
          type: object
          required: [not_started, in_progress, on_hold, completed, cancelled]
          properties:
            not_started: {type: integer}
            in_progress: {type: integer}
            on_hold: {type: integer}
            completed: {type: integer}
            cancelled: {type: integer}
        milestones: {type: array, items: {$ref: '#/components/schemas/DashboardHeadlineMilestone'}}
        on_air:
          type: [object, 'null']
          properties:
            code: {type: string}
            applicable: {type: integer}
            done: {type: integer}
            done_pct: {type: number}
            plan: {type: integer}
            vs_plan: {type: integer}
        final_closure: {$ref: '#/components/schemas/DashboardFinalClosure'}
        project_status: {$ref: '#/components/schemas/DashboardProjectStatus'}
    DashboardStreamCounts:
      type: object
      properties:
        not_due: {type: integer, description: 'The first gate of the stream is closed and nothing of it is done.'}
        not_started: {type: integer, description: 'Dismantle only: the RFD was asked and no work has started.'}
        in_progress: {type: integer}
        done: {type: integer}
        na: {type: integer, description: 'The stream does not apply to the site (Dismantle: the site has no Dismantle part).'}
        on_hold: {type: integer, description: 'Sites that are On Hold and not done in the stream (an overlay, also counted in their status).'}
    DashboardStream:
      type: object
      required: [code, name_en, sort_order, counts, by_region]
      properties:
        code: {type: string}
        name_en: {type: string}
        name_ar: {type: [string, 'null']}
        sort_order: {type: integer}
        counts: {$ref: '#/components/schemas/DashboardStreamCounts'}
        by_region:
          type: array
          items:
            allOf:
            - {$ref: '#/components/schemas/DashboardStreamCounts'}
            - type: object
              required: [region_id]
              properties:
                region_id: {$ref: '#/components/schemas/RegionId'}
    DashboardSla:
      type: object
      required: [totals, by_stage, top_late]
      properties:
        totals: {$ref: '#/components/schemas/DashboardSlaCounts'}
        by_stage:
          type: array
          items:
            allOf:
            - {$ref: '#/components/schemas/DashboardSlaCounts'}
            - type: object
              required: [stage_code, name_en, order]
              properties:
                stage_code: {type: string}
                name_en: {type: string}
                name_ar: {type: [string, 'null']}
                order: {type: integer}
                stream_code: {type: [string, 'null']}
        top_late:
          type: array
          maxItems: 10
          items:
            type: object
            required: [task_id, site_id, site_code, region_id, task_code, task_name, stage_code, due_date, days_late_wd]
            properties:
              task_id: {type: string, format: uuid}
              site_id: {type: string, format: uuid}
              site_code: {type: string}
              region_id: {$ref: '#/components/schemas/RegionId'}
              task_code: {type: string}
              task_name: {type: string}
              stage_code: {type: string}
              due_date: {type: string, format: date}
              days_late_wd: {type: integer, description: 'Working days past the due date at the reference date.'}
              state: {type: string}
              party: {type: [string, 'null']}
    DashboardSlaCounts:
      description: Open tasks are on time (green), at risk (amber) or late (red) at the reference date; completed ones are within the maximum or over it.
      type: object
      required: [open_on_time, open_at_risk, open_late, completed_on_time, completed_late]
      properties:
        open_on_time: {type: integer}
        open_at_risk: {type: integer}
        open_late: {type: integer}
        completed_on_time: {type: integer}
        completed_late: {type: integer}
    DashboardGates:
      type: object
      required: [available, blocked_total, items]
      properties:
        available: {type: boolean, description: 'False for a past reference date: the state of a gate on a past date is not kept.'}
        blocked_total: {type: integer}
        by_gate:
          type: array
          items:
            type: object
            properties:
              gate_code: {type: string}
              name_en: {type: string}
              name_ar: {type: [string, 'null']}
              to_code: {type: string}
              count: {type: integer}
        items:
          type: array
          maxItems: 50
          description: The longest blocked first.
          items:
            type: object
            required: [site_id, site_code, region_id, gate_code, reasons]
            properties:
              site_id: {type: string, format: uuid}
              site_code: {type: string}
              region_id: {$ref: '#/components/schemas/RegionId'}
              gate_code: {type: string}
              name_en: {type: string}
              name_ar: {type: [string, 'null']}
              to_code: {type: string}
              since: {type: string, format: date-time}
              reasons: {type: array, items: {$ref: '#/components/schemas/LockReason'}}
    DashboardIssues:
      description: Counted by issue for the owner bars and the totals, by site for `sites_with_open_issue` (Q36). Age in working days from the raised date.
      type: object
      required: [available, open_total, sites_with_open_issue, by_owner, age_buckets]
      properties:
        available: {type: boolean}
        open_total: {type: integer}
        sites_with_open_issue: {type: integer}
        blocking_total: {type: integer, description: 'Open issues linked to a gate or task.'}
        oldest_age_wd: {type: [integer, 'null']}
        avg_age_wd: {type: [number, 'null']}
        by_owner:
          type: array
          items:
            type: object
            required: [owner_key, owner_kind, count, sites]
            properties:
              owner_key: {type: string}
              owner_kind: {type: string, enum: [user, party, none]}
              owner_name: {type: [string, 'null']}
              count: {type: integer}
              sites: {type: integer}
              oldest_age_wd: {type: [integer, 'null']}
              avg_age_wd: {type: [number, 'null']}
        age_buckets:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: {type: string, enum: ['0_7', '8_15', '16_30', over_30]}
              count: {type: integer}
    DashboardHealth:
      description: Project health index, formula version 1. A draft under owner review.
      type: object
      required: [draft, bands, score, band, components, by_region]
      properties:
        draft: {type: boolean}
        formula_version: {type: integer}
        bands:
          type: object
          required: [green, amber]
          properties:
            green: {type: number, description: 'Green from this score (setting `dashboard.health_bands`, default 85).'}
            amber: {type: number, description: 'Amber from this score, red below (default 70).'}
        score: {type: [number, 'null'], minimum: 0, maximum: 100}
        band: {type: [string, 'null'], enum: [green, amber, red, null]}
        components:
          type: array
          items:
            type: object
            required: [code, name_en, weight, value, excluded, contribution]
            properties:
              code: {type: string}
              name_en: {type: string}
              name_ar: {type: [string, 'null']}
              weight: {type: number}
              value: {type: [number, 'null']}
              excluded: {type: boolean, description: 'No data: left out and its weight redistributed.'}
              contribution: {type: number}
        by_region:
          type: array
          items:
            type: object
            required: [region_id, score, band]
            properties:
              region_id: {$ref: '#/components/schemas/RegionId'}
              score: {type: number}
              band: {type: string, enum: [green, amber, red]}
    DashboardDelay:
      description: Delay attribution, rules.md section 8 (draft). Overdue working days per responsible party; attribution periods and suspension days are not built yet.
      type: object
      required: [draft, total_late_working_days, unattributed_pct, items]
      properties:
        draft: {type: boolean}
        total_late_working_days: {type: integer}
        unattributed_pct: {type: number, description: 'Share of the days on tasks with no external party and no default party type.'}
        overlapping_periods: {type: integer}
        periods_supported: {type: boolean}
        items:
          type: array
          items:
            type: object
            required: [party, kind, late_tasks, late_working_days, share_pct]
            properties:
              party: {type: string, description: 'The external party name, the default party type of the task, or `unassigned`.'}
              kind: {type: string, enum: [external, default_type, unassigned]}
              external_party_id: {type: [string, 'null'], format: uuid}
              party_type: {type: [string, 'null']}
              late_tasks: {type: integer}
              late_working_days: {type: integer}
              share_pct: {type: number}
    DashboardRegion:
      type: object
      required: [region_id, region_name, sites_total, by_overall_status, progress_pct]
      properties:
        region_id: {$ref: '#/components/schemas/RegionId'}
        region_name: {type: string}
        region_name_ar: {type: [string, 'null']}
        sites_total: {type: integer}
        completed: {type: integer}
        in_progress: {type: integer}
        late: {type: integer, description: 'Open tasks past their SLA maximum.'}
        by_overall_status:
          type: object
          properties:
            not_started: {type: integer}
            in_progress: {type: integer}
            on_hold: {type: integer}
            completed: {type: integer}
            cancelled: {type: integer}
        progress_pct: {type: number}
        health_score: {type: [number, 'null']}
        by_milestone: {type: object, additionalProperties: {type: integer}, description: 'Sites that reached each milestone, by code.'}
    Dashboard:
      type: object
      required: [meta, basis, filters, headline, pipeline, streams, sla, gates, issues, health, delay, regions]
      properties:
        meta: {$ref: '#/components/schemas/DashboardMeta'}
        basis: {$ref: '#/components/schemas/DashboardBasis'}
        filters: {$ref: '#/components/schemas/DashboardFilters'}
        headline: {$ref: '#/components/schemas/DashboardHeadline'}
        pipeline:
          type: object
          required: [nodes]
          properties:
            nodes: {type: array, items: {$ref: '#/components/schemas/DashboardMilestone'}}
        streams:
          type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/DashboardStream'}}
        sla: {$ref: '#/components/schemas/DashboardSla'}
        gates: {$ref: '#/components/schemas/DashboardGates'}
        issues:
          oneOf:
          - {$ref: '#/components/schemas/DashboardIssues'}
          - {type: 'null'}
          description: Null when the caller has no `issues.view`.
        health: {$ref: '#/components/schemas/DashboardHealth'}
        delay: {$ref: '#/components/schemas/DashboardDelay'}
        regions:
          type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/DashboardRegion'}}
