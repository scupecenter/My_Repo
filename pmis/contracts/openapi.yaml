        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /import-batches/{batch_id}/submit:
    parameters:
    - {$ref: '#/components/parameters/BatchId'}
    post:
      tags: [templates]
      operationId: submitImportBatch
      summary: Send the validated batch into the normal flow (L1 Data Entry)
      description: |
        Only the uploader (403 `not_eligible_holder` for anyone else, an admin too: the records are entered as L1 in the uploader's name only). Each valid row (`create` or `update`) becomes a register record, and is submitted as the uploader through the same functions as manual entry (`reg_save_record`, `reg_new_version`, `reg_transition_record`, with the import row so that the audit and the history show "via batch"), so it follows the Matrix row of its register: L2 Data Reviewer & Approver decides next. An update is a new version of the record in force; the version in force stays until the new one is approved (R9).
        A row whose logical record has an open version is held `pending_previous_approval` and listed in `outcome.held`; send the batch again after that version is decided and the row is released. A row that the register refuses at submit becomes an `error` row (listed in `outcome.failed`) and nothing of it is kept. When the caller also holds L2, the submission is a self-approval and needs a step-up (401 `step_up_required`, nothing is created).
      x-db-path: imp_submit_batch
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: Sent.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ImportBatch'}
                - type: object
                  properties:
                    outcome: {$ref: '#/components/schemas/ImportBatchOutcome'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /import-batches/{batch_id}/decisions:
    parameters:
    - {$ref: '#/components/parameters/BatchId'}
    post:
      tags: [templates]
      operationId: decideImportBatch
      summary: 'Approve, return or discard: row by row, or all at once'
      description: |
        A row is decided by the same transition a person makes on the record it created (`reg_transition_record`), with the same grid right (`approve` on the register's module for L2), the same holders of the Matrix row and the same step-up for a final approval (401 `step_up_required`); nothing here is a shortcut.
        `approve` (or `review`, for a record still at a legacy middle level) with `scope=all` decides every open row; with `scope=rows` the rows listed. `reject` returns the rows to the uploader with a note (mandatory, 422 `note_required`): the record goes back to L1 Data Entry, the row is `rejected`. `discard` (uploader or System Admin) closes a batch that was not sent; nothing was created.
        Rows held `pending_previous_approval` have no record yet: "approve all" does not touch them and lists them in `outcome.held`; a `reject` takes them back. A row that cannot be decided (not the holder of L2, the record is not at that level) is listed in `outcome.failed`; when no row could be decided because the caller is not allowed, the answer is 403.
      x-step-up: when an approval is final (L2 approve) or a self-approval (B5); not for a return or a discard
      x-db-path: imp_decide_batch
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportDecisionRequest'}
      responses:
        '200':
          description: Decision recorded.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ImportBatch'}
                - type: object
                  properties:
                    outcome: {$ref: '#/components/schemas/ImportBatchOutcome'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /import-batches/{batch_id}/undo:
    parameters:
    - {$ref: '#/components/parameters/BatchId'}
    post:
      tags: [templates]
      operationId: undoImportBatch
      summary: Undo an applied batch (admin override, reversible)
      description: Not built yet (0.7.0). With records entering through the register flow, an undo is a new version of each record that restores its before values, reviewed like any other.
      x-step-up: true
      x-db-path: imp_undo_batch
