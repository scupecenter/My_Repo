        id: {type: string, format: uuid}
        entity_type: {type: string, enum: [site, register_record]}
        entity_id: {type: string, format: uuid, description: 'The site id, or the record entity id (stable across versions).'}
        register_key: {type: [string, 'null']}
        site_id: {type: [string, 'null'], format: uuid}
        label: {type: string, description: 'Only in GET /me/follows.'}
        created_at: {type: string, format: date-time}
    InStateKind:
      type: string
      enum: [entry, review, approve]
      description: 'The level a task sits at.'
    TaskTimeInState:
      type: object
      required: [task_id, current_state, items, segments]
      properties:
        task_id: {type: string, format: uuid}
        current_state: {oneOf: [{$ref: '#/components/schemas/InStateKind'}, {type: 'null'}], description: 'The level the task sits at now; null when it is locked, approved or otherwise not at a level.'}
        items:
          type: array
          description: One per level.
          items:
            type: object
            required: [state, visits, total_seconds, longest_seconds, working_days]
            properties:
              state: {$ref: '#/components/schemas/InStateKind'}
              visits: {type: integer}
              total_seconds: {type: integer}
              longest_seconds: {type: integer}
              working_days: {type: integer, description: 'Sum of the working days of each visit (weekend Friday and Saturday, holidays).'}
        segments:
          type: array
          items:
            type: object
            required: [state, started_at, ended_at, seconds, working_days]
            properties:
              state: {$ref: '#/components/schemas/InStateKind'}
              started_at: {type: string, format: date-time}
              ended_at: {type: [string, 'null'], format: date-time}
              seconds: {type: integer}
              working_days: {type: integer}
              handled_by: {$ref: '#/components/schemas/UserRef'}
    TimeInStateReport:
      type: object
      required: [group_by, items]
      properties:
        group_by: {type: string, enum: [holder, team]}
        items:
          type: array
          items:
            type: object
            required: [levels]
            properties:
              holder: {$ref: '#/components/schemas/UserRef'}
              team: {type: string, enum: [cw, te, both, none]}
              levels:
                type: object
                description: 'Keyed by level (entry, review, approve).'
                additionalProperties:
                  type: object
                  required: [visits, total_seconds, average_seconds, max_seconds, working_days]
                  properties:
                    visits: {type: integer}
                    total_seconds: {type: integer}
                    average_seconds: {type: integer}
                    max_seconds: {type: integer}
                    working_days: {type: integer}
    Workload:
      type: object
      required: [items, no_holder]
      properties:
        items:
          type: array
          items:
            type: object
            required: [holder, team, open, late, by_level]
            properties:
              holder: {$ref: '#/components/schemas/UserRef'}
              team: {type: string, enum: [cw, te, both, none]}
              open: {type: integer}
              late: {type: integer}
              by_level:
                type: object
                properties:
                  entry: {type: integer}
                  review: {type: integer}
                  approve: {type: integer}
        no_holder:
          type: object
          required: [open, late]
          properties:
            open: {type: integer}
            late: {type: integer}
    BlockedBy:
      type: object
      required: [task_id, state, blocked, items]
      properties:
        task_id: {type: string, format: uuid}
        state: {type: string}
        blocked: {type: boolean}
        items:
          type: array
          items:
            type: object
            required: [kind, message]
