    parameters:
    - {$ref: '#/components/parameters/TaskId'}
    get:
      tags: [insights]
      operationId: getTaskBlockedBy
      summary: What the task waits for (0.4.10, X6)
      description: The predecessors not yet approved (with the predecessor task), the closed gate with its conditions (permits, stop work, suspension) and the open snags. The same facts as `TaskSummary.lock_reasons`, in one place.
      responses:
        '200':
          description: The chain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockedBy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reports/time-in-state:
    get:
      tags: [insights]
      operationId: getTimeInStateReport
      summary: Time in each level, per person or per team (0.4.10, X4)
      description: Completed visits only, attributed to the person who handled them. Needs `view` on `reports` and `sites`; counts only tasks in the regions both grants cover (a System Admin sees all).
      parameters:
      - {name: group_by, in: query, schema: {type: string, enum: [holder, team], default: holder}}
      - {name: region_id, in: query, schema: {type: integer, minimum: 1, maximum: 7}}
      - {name: stage_code, in: query, schema: {type: string}}
      - {name: from, in: query, description: 'Visits that ended on or after this date.', schema: {type: string, format: date}}
      - {name: to, in: query, description: 'Visits that ended on or before this date.', schema: {type: string, format: date}}
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimeInStateReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /reports/workload:
    get:
      tags: [insights]
      operationId: getWorkload
      summary: Open and late tasks per holder (0.4.10, X5)
      description: A claimed task counts for its claimant, an unclaimed one for everyone who could act on its level. Late = the SLA is past its maximum. A level nobody can hold is counted under `no_holder`. Needs `view` on `reports` and `sites`, limited to the regions both cover. Reassign with `POST /tasks/reassign` (B12b).
      parameters:
      - {name: region_id, in: query, schema: {type: integer, minimum: 1, maximum: 7}}
      - {name: stage_code, in: query, schema: {type: string}}
      responses:
        '200':
          description: Workload.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /status-updates:
    get:
      tags: [status-updates]
      operationId: listStatusUpdates
      summary: Weekly status updates (0.4.10, X7)
      description: Newest week first. Needs `view` on `sites`; only updates of the caller's regions, plus updates that cover all regions.
      parameters:
      - {name: scope, in: query, schema: {type: string, enum: [region, team]}}
      - {name: region_id, in: query, schema: {type: integer, minimum: 1, maximum: 7}}
      - {name: team, in: query, schema: {type: string, enum: [cw, te]}}
