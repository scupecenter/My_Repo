*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--text-md)/var(--lh-text) var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir=rtl] body{line-height:var(--lh-ar)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--link)}
h1,h2,h3,h4{margin:0;font-weight:700}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--accentText);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:.9em;direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.mute{color:var(--mute)}.sp{flex:1}.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
[dir=rtl] .flip{transform:scaleX(-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---- buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-4);padding:6px 12px;font-weight:700;font-size:var(--text-base);min-height:34px;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--done);border-color:var(--done);color:var(--accentInk)}
.btn.no{color:var(--lateInk);border-color:var(--late)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.sm{padding:2px 9px;min-height:28px;font-size:var(--text-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-4);width:36px;height:34px;display:grid;place-items:center;position:relative}
.ibtn:hover{background:var(--hover)}
.ibtn .bd{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--late);color:var(--accentInk);border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;font-weight:700}
.inp,.sel,textarea.inp{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-4);padding:6px 10px;min-height:34px;max-width:100%;outline:none}
.inp:focus,.sel:focus{border-color:var(--accentText);box-shadow:0 0 0 3px var(--accentSoft)}
.inp[disabled]{background:var(--card2);color:var(--mute)}
.inp.bad{border-color:var(--late)}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:var(--text-sm);color:var(--mute);margin-bottom:4px}
.fld .inp,.fld .sel{width:100%}
.hint{font-size:var(--text-sm);color:var(--mute)}.err{color:var(--lateInk);font-size:var(--text-sm)}
kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card2);color:var(--mute);direction:ltr;display:inline-block}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
/* ---- atoms */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-3);padding:1px 8px;font-size:var(--text-sm);font-weight:700;white-space:nowrap}
.pill svg.ic{width:13px;height:13px;vertical-align:-2px}
.p-done{background:var(--doneBg);color:var(--doneInk)}.p-open{background:var(--openBg);color:var(--openInk)}.p-wait{background:var(--waitBg);color:var(--waitInk)}.p-late{background:var(--lateBg);color:var(--lateInk)}.p-lock{background:var(--lockBg);color:var(--lockInk)}
.p-acc{background:var(--accentSoft);color:var(--accentText)}
.p-ovr{background:var(--accentText);color:var(--card)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:1px 10px;font-size:var(--text-sm);color:var(--mute);min-height:26px}
button.chip:hover{background:var(--hover)}
.chip.on{background:var(--accentSoft);border-color:var(--accentText);color:var(--accentText);font-weight:700}
.chip .x{border:0;background:none;padding:0 2px;color:var(--mute)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-6);box-shadow:var(--shadow-sm)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.ch h3{font-size:var(--text-md)}
.cb{padding:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 14px;color:var(--mute);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accentText);border-bottom-color:var(--accentText)}
.tabs button:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-4);overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 10px;font-size:var(--text-sm);font-weight:700;color:var(--mute)}
.seg button.on{background:var(--accentSoft);color:var(--accentText)}
.empty,.state{text-align:center;padding:44px 16px;color:var(--mute)}
.empty h3,.state h3{color:var(--ink);margin:8px 0 4px}
.state .big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:var(--card2)}
.state .big svg{width:28px;height:28px}
.state.err .big{background:var(--lateBg);color:var(--lateInk)}.state.deny .big{background:var(--lockBg);color:var(--lockInk)}
.sk{background:linear-gradient(90deg,var(--card2),var(--hover),var(--card2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--radius-4);height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-5);padding:10px 12px;font-size:var(--text-base);margin-bottom:12px}
.banner.wait{background:var(--waitBg);color:var(--waitInk)}.banner.late{background:var(--lateBg);color:var(--lateInk)}.banner.lock{background:var(--lockBg);color:var(--lockInk)}.banner.open{background:var(--openBg);color:var(--openInk)}.banner.done{background:var(--doneBg);color:var(--doneInk)}
/* ---- tables */
.tw{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--text-base)}
.t th{position:sticky;top:0;background:var(--card2);color:var(--mute);font-weight:700;font-size:var(--text-sm);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.t th[data-sort]{cursor:pointer}
.t td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t td.nw{white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr:hover td{background:var(--hover)}
.t tr.sel td{background:var(--openBg)}
/* ---- shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.shell.mini{grid-template-columns:64px minmax(0,1fr)}
.side{background:var(--side);border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700}
.brand .mk{width:30px;height:30px;border-radius:var(--radius-5);background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-size:13px;flex:none}
.nav{padding:0 10px 14px;flex:1}
.nav .gh{font-size:var(--text-xs);font-weight:700;color:var(--mute);padding:14px 10px 4px}
.nav a,.nav summary{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-4);color:var(--ink);text-decoration:none;font-size:var(--text-base);margin-bottom:1px;cursor:pointer;list-style:none}
.nav summary::-webkit-details-marker{display:none}
.nav a:hover,.nav summary:hover{background:var(--sideOn)}
.nav a.on{background:var(--sideOn);font-weight:700;box-shadow:inset 3px 0 0 var(--accentText)}
[dir=rtl] .nav a.on{box-shadow:inset -3px 0 0 var(--accentText)}
.nav .sub a{padding-inline-start:38px;font-size:var(--text-sm)}
.nav .bdg{margin-inline-start:auto;background:var(--wait);color:var(--accentInk);border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.shell.mini .brand span,.shell.mini .nav .gh,.shell.mini .nav .lb,.shell.mini .nav .bdg,.shell.mini .nav .sub,.shell.mini .sfoot{display:none}
.shell.mini .nav a,.shell.mini .nav summary{justify-content:center}
.sfoot{padding:10px 14px;font-size:var(--text-xs);color:var(--mute);border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.crumb{color:var(--mute);font-size:var(--text-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-4);padding:5px 10px;color:var(--mute);min-width:230px;min-height:34px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 12px 2px 3px;min-height:34px}
[dir=rtl] .me{padding:2px 3px 2px 12px}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-5);box-shadow:var(--shadow-lg);min-width:230px;padding:6px;z-index:60}
.menu button,.menu a{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;text-align:start;padding:7px 10px;border-radius:var(--radius-3);text-decoration:none;color:var(--ink)}
.menu button:hover,.menu a:hover{background:var(--hover)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu .mh{font-size:var(--text-xs);color:var(--mute);padding:4px 10px}
.page{padding:20px 22px 70px;width:100%;max-width:1480px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:var(--text-4xl)}
.ph .sub{color:var(--mute)}
.burger{display:none}

/* ================= workflow: slots, levels, return, overrides, snags, batches ================= */
const DOC=id=>DOCLIB.find(d=>d.id===id);
const ruleTrue=(site,d)=>d.rule==='airport'?site.airport:d.rule==='outsourced'?site.outsourced:d.rule==='tower'?site.cwTower:!!d.rule?true:false;
const docApplies=(site,d)=>d.mand==='mandatory'||ruleTrue(site,d);
function docIds(site,i){const x=site.tasks[i];if(x.docIds)return x.docIds;const ids=DOCLIB.filter(d=>d.active&&d.place.includes(STEPS[i].code)).map(d=>d.id);if(x.state!=='lock'&&x.state!=='na')x.docIds=ids;return ids}
const slotDocs=(site,i)=>docIds(site,i).map(DOC).filter(d=>d&&docApplies(site,d));
const extOf=n=>(n.split('.').pop()||'').toUpperCase();
const fileDate=d=>(d||TODAY).replaceAll('-','');
function finalName(site,i,d,f,date,n,tot){return`${site.id}_${STEPS[i].code}_${d.id}_${fileDate(date)}${tot>1?'_'+(n+1):''}.${f.name.split('.').pop().toLowerCase()}`}
function getSlot(site,i,id){const x=site.tasks[i];x.slots=x.slots||{};if(x.slots[id])return x.slots[id];const d=DOC(id),s=STEPS[i];
 const mk=n=>Array.from({length:n},(_,k)=>({name:`${s.code}_${id}_scan${k+1}.${d.kind==='photo'?'jpg':d.kind==='email'?'eml':'pdf'}`,size:200+hsh(site.id+id+k)%1800,at:x.act||TODAY,by:x.hist[0]?x.hist[0].by:'1204'}));
 const sl={status:'missing',files:[],vers:[],reason:''};
 if(x.state==='done'&&x.docState!=='missing'){sl.status='approved';sl.files=mk(Math.max(1,d.min));sl.files.forEach((f,k)=>f.final=finalName(site,i,d,f,x.act,k,sl.files.length));if(hsh(site.id+id)%6===0)sl.vers=[{name:s.code+'_'+id+'_v1_scan.pdf',size:410,at:x.act,by:'1204',final:'(superseded)'}]}
 else if(x.state==='review'||x.state==='approve'){sl.status='review';sl.files=mk(Math.max(1,d.min))}
 else if(x.state==='open'&&hsh(site.id+id)%3===0){sl.status='uploaded';sl.files=mk(Math.max(1,d.min))}
 x.slots[id]=sl;return sl}
function validateFile(d,f,count){const ext=extOf(f.name),ok=d.fmt.toUpperCase().split(/[ ,]+/).filter(Boolean);
 if(!ok.includes(ext)&&!(ext==='JPEG'&&ok.includes('JPG')))return t('Format {e} not allowed (allowed: {f})',{e:ext||'?',f:d.fmt});
 if(f.size>d.maxMB*1048576)return t('File is {s} MB, maximum is {m} MB',{s:(f.size/1048576).toFixed(1),m:d.maxMB});
 if(count>=d.max)return t('Maximum {n} files for this document',{n:d.max});return null}
function addFiles(site,i,id,files){const d=DOC(id),sl=getSlot(site,i,id),x=site.tasks[i];const u=me();const bad=[];
 if(x.state!=='open'&&!(x.state==='lock'&&false)){toast(t('Files can be changed only while the task is open for entry'),true);return{bad:[]}}
 if(d.camera){toast(t('Proof photos are taken with the mobile app camera'),true);return{bad:[]}}
 if(sl.status==='rejected'){sl.vers.push(...sl.files);sl.files=[]}
 for(const f of files){const r=validateFile(d,f,sl.files.length);if(r)bad.push({name:f.name,reason:r});else sl.files.push({name:f.name,size:Math.max(1,Math.round(f.size/1024)),at:TODAY,by:u.id})}
 if(sl.files.length){sl.status='uploaded';sl.reason=''}
 if(files.length){audit('Uploaded document',site.id+' · '+STEPS[i].code,d.en+': '+files.map(f=>f.name).join(', '),'',sl.files.length+' file(s)')}
 bad.forEach(b=>syslog('WARN','Documents',`Upload of '${b.name}' rejected for ${site.id} ${STEPS[i].code}: ${b.reason}`));
 return{bad}}
function suggestDoc(site,i,name){const n=name.toLowerCase();let best=null;for(const d of slotDocs(site,i)){const keys=[d.id.toLowerCase(),...d.en.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2)];if(keys.some(k=>n.includes(k)))best=best||d.id}return best}
const dlSlotFiles=(site,i,d,sl)=>sl.files.map((f,k)=>f.final||f.name);
/* ---------- gating */
function openSnags(site){return site.snags.filter(s=>s.state!=='approved').length}
function approvalLock(site,i){if(STEPS[i].code==='B13'){const n=openSnags(site);if(n)return t('{n} open QC snag(s) on this site. A preliminary acceptance cannot be approved until all are closed.',{n})}return null}
function missingForSubmit(site,i,dateVal){const out=[];if(!dateVal)out.push(t('Actual date'));for(const d of slotDocs(site,i)){if(d.mand==='mandatory'||ruleTrue(site,d)){const sl=getSlot(site,i,d.id);if(sl.files.length<d.min||sl.status==='rejected'&&!sl.files.length)out.push(d.en)}}return out}
function whyLocked(site,i){const x=site.tasks[i],s=STEPS[i],r=[];
 if(x.state==='na'){r.push(t('Not applicable for this site (scenario {sc}, scope flags)',{sc:site.scenario}));return r}
 if(s.ms){const rest=STEPS.filter(q=>q.stage===s.stage&&!q.ms&&site.tasks[q.i].state!=='done'&&site.tasks[q.i].state!=='na');if(rest.length)r.push(t('Milestone is calculated. {n} task(s) of this stage are not approved yet: {l}',{n:rest.length,l:rest.map(q=>q.code).join(', ')}));return r}
 if(x.state==='lock'&&site.cur>=0&&site.cur<i){const c=site.cur,cs=STEPS[c];r.push(t('Previous task {c} {n} is not approved yet ({st}).',{c:cs.code,n:cs.name,st:t({open:'Open',review:'Awaiting review',approve:'Awaiting approval'}[site.tasks[c].state]||'Locked')}))}
 if(x.state==='lock'&&STEPS[i].stage>0&&site.stage<STEPS[i].stage&&!r.length)r.push(t('Phase gate {g} is not open yet.',{g:GATES[STEPS[i].stage]}));
 const al=approvalLock(site,i);if(al&&x.state!=='done')r.push(al);
 return r}
function bic(site,i){const x=site.tasks[i],s=STEPS[i];if(x.state==='done')return{kind:'done',users:[],ext:''};if(x.state==='na')return{kind:'na',users:[],ext:''};
 let j=i,st=x.state,blocked=false;if(st==='lock'){if(site.cur>=0&&site.cur!==i){j=site.cur;st=site.tasks[j].state;blocked=true}else return{kind:'blocked',users:[],ext:ext(site,i)}}
 const lv=st==='open'?'entry':st==='review'?'review':'approve';const us=holders(site,j,lv);const xj=site.tasks[j];
 return{kind:lv,users:us,ext:ext(site,j),blocked,by:j,claim:xj.claim&&xj.claim.level===lv?U2[xj.claim.by]:null,rule:MX[STEPS[j].stage][lv].rule}}
const bicTxt=b=>b.kind==='done'?'—':b.kind==='na'?'—':b.users.length?(b.users.length>2?b.users.slice(0,2).map(u=>u.name).join(', ')+' +'+(b.users.length-2):b.users.map(u=>u.name).join(', ')):'—';
const lvName=l=>t({entry:'Entry',review:'Review',approve:'Approve'}[l]);
/* ---------- level engine */
const logH=(x,a,by,note)=>x.hist.push({a,at:TODAY,by,note:note||''});
function advance(site,i,u,done){const x=site.tasks[i],st=STEPS[i].stage,lv=lvlsOf(st);let k=lv.indexOf(done)+1;x.skipped=x.skipped||[];x.claim=null;x.apprBy=[];
 while(k<lv.length){const L=lv[k];const cell=MX[st][L];
  if(cell.rule!=='all'&&isHolder(u,site,i,L)){x.skipped.push(L);logH(x,'Skipped '+L,u.id,'Same person holds consecutive levels');audit('Level skipped',site.id+' · '+STEPS[i].code,`${lvName(L)} skipped automatically: ${u.name} holds two consecutive levels`,L,'skipped');k++;continue}
  x.state=L==='review'?'review':'approve';return false}
 complete(site,i,u);return true}
function complete(site,i,u){const x=site.tasks[i],s=STEPS[i];x.state='done';x.act=x.act||TODAY;x.rejected=null;
 slotDocs(site,i).forEach(d=>{const sl=getSlot(site,i,d.id);if(sl.files.length){sl.status='approved';sl.files.forEach((f,k)=>f.final=finalName(site,i,d,f,x.act,k,sl.files.length))}});
 logH(x,'Approved',u.id);const before=site.cur;recompute(site);const nx=site.tasks[site.cur];
 audit('Approved',site.id+' · '+s.code,s.name,'Awaiting approval','Done');
 if(site.cur>=0&&site.cur!==i)toast(t('Approved. Next task opened: {c} {n}',{c:STEPS[site.cur].code,n:STEPS[site.cur].name}))}
function doSubmit(site,i,u,date){const x=site.tasks[i];x.act=date;x.rejected=null;x.skipped=[];logH(x,'Entered',u.id);
 slotDocs(site,i).forEach(d=>{const sl=getSlot(site,i,d.id);if(sl.files.length)sl.status='review'});
 audit('Submitted',site.id+' · '+STEPS[i].code,STEPS[i].name+' · '+date,'Open','Awaiting review');
 const fin=advance(site,i,u,'entry');recompute(site);return fin}
function claimOK(x,u,lv){return !x.claim||x.claim.by===u.id||x.claim.level!==lv}
function doReview(site,i,u){const x=site.tasks[i];if(!claimOK(x,u,'review'))return toast(t('Already claimed by {n}',{n:U2[x.claim.by].name}),true);
 logH(x,'Reviewed',u.id);audit('Reviewed',site.id+' · '+STEPS[i].code,STEPS[i].name,'Awaiting review','Awaiting approval');advance(site,i,u,'review');recompute(site)}
function doApprove(site,i,u){const x=site.tasks[i];const al=approvalLock(site,i);if(al)return toast(al,true);
 if(!claimOK(x,u,'approve'))return toast(t('Already claimed by {n}',{n:U2[x.claim.by].name}),true);
 const cell=MX[STEPS[i].stage].approve;
 if(cell.rule==='all'){x.apprBy=[...new Set([...(x.apprBy||[]),u.id])];const need2=expand(cell,site).map(h=>h.id);logH(x,'Approved (1 of '+need2.length+')',u.id);audit('Approved (partial)',site.id+' · '+STEPS[i].code,`${x.apprBy.length} of ${need2.length} required approvals`);
  if(!need2.every(id=>x.apprBy.includes(id))){toast(t('Your approval is recorded. {n} more required.',{n:need2.filter(id=>!x.apprBy.includes(id)).length}));return false}}
 else if(expand(cell,site).length>1)x.claim={by:u.id,level:'approve'};
 complete(site,i,u);return true}
function doReturn(site,i,u,note,docs){const x=site.tasks[i],lv=lvlsOf(STEPS[i].stage);const cur=x.state==='approve'?'approve':'review';let k=lv.indexOf(cur)-1;while(k>0&&(x.skipped||[]).includes(lv[k]))k--;const tg=lv[Math.max(0,k)];
 x.state=tg==='entry'?'open':tg;x.apprBy=[];x.claim=null;x.rejected={by:u.id,at:TODAY,note,level:cur,to:tg};
 x.notes.push({kind:'return',by:u.id,at:TODAY,text:note});logH(x,'Returned to '+tg,u.id,note);
 (docs||[]).forEach(id=>{const sl=getSlot(site,i,id);sl.status='rejected';sl.reason=note});
 if(tg==='entry')slotDocs(site,i).forEach(d=>{const sl=getSlot(site,i,d.id);if(sl.status==='review')sl.status='uploaded'});
 audit('Returned',site.id+' · '+STEPS[i].code,note,lvName(cur),lvName(tg));recompute(site)}
/* ---------- admin overrides (reason + step-up, reversible, flagged) */
const OVR={unlock:'Unlock task',na:'Skip / mark N/A',accept:'Accept without document or workflow',reopen:'Reopen approved task',date:'Edit date'};
function applyOverride(site,i,kind,reason,val){const x=site.tasks[i],u=me(),b={state:x.state,act:x.act,docIds:x.docIds};
 if(kind==='unlock'){x.state='open'}else if(kind==='na'){x.state='na'}else if(kind==='accept'){x.state='done';x.act=x.act||TODAY;slotDocs(site,i).forEach(d=>{const sl=getSlot(site,i,d.id);if(!sl.files.length)sl.status='waived'})}else if(kind==='reopen'){x.state='open';x.act=''}else if(kind==='date'){x.act=val}
 x.ovr={kind,by:u.id,at:TODAY,reason,before:b,behalf:delegateOf(u)&&!GROUPS[0].members.includes(u.id)};logH(x,'Admin override: '+OVR[kind],u.id,reason);
 audit('Admin override',site.id+' · '+STEPS[i].code,OVR[kind]+' · '+reason,`${b.state} ${b.act||''}`,`${x.state} ${x.act||''}`,{admin:true,mfa:true});recompute(site)}
function revertOverride(site,i){const x=site.tasks[i];if(!x.ovr)return;const b=x.ovr.before;audit('Admin override reverted',site.id+' · '+STEPS[i].code,OVR[x.ovr.kind],`${x.state}`,`${b.state}`,{admin:true,mfa:true});x.state=b.state;x.act=b.act;x.ovr=null;recompute(site)}
/* ---------- snags */
function exifFor(name,raised){const n=name.toLowerCase();if(n.includes('_noexif'))return null;if(n.includes('_old'))return '2026-09-01';return TODAY}
function addSnagPhotos(site,sn,files,shot){const ty=SNAG_TYPES[sn.type],bad=[];const u=me();
 for(const f of files){const ext=extOf(f.name);if(!ty.fmt.split(/[ ,]+/).includes(ext)&&!(ext==='JPEG')){bad.push({name:f.name,reason:t('Format {e} not allowed (allowed: {f})',{e:ext,f:ty.fmt})});continue}
  if(f.size>ty.maxMB*1048576){bad.push({name:f.name,reason:t('File is {s} MB, maximum is {m} MB',{s:(f.size/1048576).toFixed(1),m:ty.maxMB})});continue}
  const ex=exifFor(f.name,sn.raised);if(ex&&ex<sn.raised){bad.push({name:f.name,reason:t('Photo taken {d}, before the snag was raised ({r}). Rejected by EXIF date.',{d:ex,r:sn.raised})});continue}
  sn.photos.push({name:f.name,exif:ex,shot,by:u.id,flag:ex?'':t('Unknown capture date')})}
 bad.forEach(b=>syslog('WARN','QC',`Photo '${b.name}' rejected for snag ${sn.id}: ${b.reason}`));
 if(files.length)audit('Uploaded QC photos',sn.id,sn.photos.length+' photo(s)');return bad}
const snagReady=sn=>{const ty=SNAG_TYPES[sn.type];if(sn.photos.length<ty.min)return t('At least {n} photos needed ({h} so far)',{n:ty.min,h:sn.photos.length});const miss=ty.shots.filter(s=>!sn.photos.some(p=>p.shot===s));return miss.length?t('Missing shot type(s): {l}',{l:miss.join(', ')}):null};
function snagStep(site,sn,act,note){const u=me();const b=sn.state;
 if(act==='submit'){const r=snagReady(sn);if(r)return toast(r,true);sn.state='review'}else if(act==='review')sn.state='approve';else if(act==='approve')sn.state='approved';else if(act==='return'){sn.state='open';sn.note=note}
 audit('QC snag '+act,sn.id,note||sn.title,b,sn.state);return true}
/* ---------- batches */
function applyBatch(b){let n=0;b.rows.forEach(r=>{if(r.state!=='ok')return;const s=SITES.find(q=>q.id===r.site),x=s&&s.tasks[r.idx];if(!x||x.state==='done'||x.state==='na'){r.conflict=true;return}x.act=r.nw;x.state='done';logH(x,'Applied from batch '+b.id,b.by);recompute(s);n++;audit('Batch row applied',r.site+' · '+r.code,'Batch '+b.id,r.old||'—',r.nw)});return n}
/* ---------- inbox */
function inbox(u){const out=[];if(!u||u.status!=='Active')return out;
 for(const s of mySites())for(let i=0;i<STEPS.length;i++){const x=s.tasks[i];if(x.state!=='review'&&x.state!=='approve')continue;const lv=x.state;if(!isHolder(u,s,i,lv))continue;
  const by=x.claim&&x.claim.level===lv&&x.claim.by!==u.id?U2[x.claim.by]:null;const cell=MX[STEPS[i].stage][lv];
  out.push({kind:'task',key:s.id+':'+i,site:s,i,lv,claimedBy:by,viaGroup:cell.m.some(r=>r.k==='g')&&!cell.m.some(r=>r.k==='u'&&r.id===u.id),partial:cell.rule==='all'&&(x.apprBy||[]).includes(u.id)})}
 for(const s of mySites())for(const sn of s.snags){if(sn.state==='review'&&permOK(u,'review'))out.push({kind:'snag',key:sn.id,site:s,sn,lv:'review'});if(sn.state==='approve'&&permOK(u,'approve'))out.push({kind:'snag',key:sn.id,site:s,sn,lv:'approve'})}
 for(const b of BATCHES){if(b.state==='review'&&permOK(u,'review')||b.state==='approve'&&permOK(u,'approve'))out.push({kind:'batch',key:b.id,b,lv:b.state})}
 return out.filter(o=>!(o.partial))}
function myWork(u){const out=[];if(!u)return out;for(const s of mySites()){const i=s.cur;if(i<0)continue;const x=s.tasks[i];if(x.state==='open'&&isHolder(u,s,i,'entry'))out.push({s,i,col:isLate(s,i)?'late':'do'});else if(x.state==='review'||x.state==='approve')if(!isHolder(u,s,i,x.state)){const mineEntry=x.hist.some(h=>h.by===u.id);if(mineEntry)out.push({s,i,col:'wait'})}}
 return out}

function stageInfo(site,st){const rows=STEPS.filter(q=>q.stage===st&&!q.ms&&site.tasks[q.i].state!=='na');const total=rows.length;const done=rows.filter(q=>site.tasks[q.i].state==='done').length;const planned=rows.filter(q=>site.tasks[q.i].plan&&site.tasks[q.i].plan<=TODAY).length;

function siteMatches(s,f){const u=me();if(f.q&&!(s.id+' '+s.name+' '+s.cluster).toLowerCase().includes(f.q.toLowerCase()))return false;if(f.region&&s.region!==f.region)return false;if(f.stage!==''&&f.stage!=null&&s.stage!==+f.stage)return false;if(f.scen&&s.scenario!==f.scen)return false;
 const x=s.cur>=0?s.tasks[s.cur]:null;if(f.status==='late'&&!(x&&isLate(s,s.cur)))return false;if(f.status==='wait'&&!(x&&(x.state==='review'||x.state==='approve')))return false;if(f.status==='done'&&s.stage<10)return false;if(f.status==='mine'&&!(x&&isHolder(u,s,s.cur,x.state==='open'?'entry':x.state)))return false;return true}
function sitesRows(){const f=S.f.sites=S.f.sites||{q:'',region:'',stage:'',scen:'',status:'',sort:'id',n:40};let rows=mySites().filter(s=>siteMatches(s,f));
 const key={id:s=>s.id,stage:s=>-s.stage,region:s=>s.region}[f.sort]||(s=>s.id);rows.sort((a,b)=>key(a)>key(b)?1:key(a)<key(b)?-1:0);const tot=rows.length;rows=rows.slice(0,f.n);
 if(!tot)return`<div class="empty">${ic('search')}<h3>${t('No sites match these filters')}</h3><button class="btn" data-act="sitesreset">${t('Clear filters')}</button></div>`;
 return`<div class="tw"><table class="t"><thead><tr><th data-sort="id" data-act="sitesort" data-a="id">${t('Site')}</th><th class="hide-m" data-act="sitesort" data-a="region">${t('Region')}</th><th class="hide-m">${t('Scenario')}</th><th>${t('Stage progress')}</th><th data-act="sitesort" data-a="stage">${t('Stage')}</th><th>${t('Current task')}</th><th class="hide-m">${t('Ball in court')}</th><th>${t('Status')}</th></tr></thead><tbody>
 ${rows.map(s=>{const i=s.cur,x=i>=0?s.tasks[i]:null,b=x?bic(s,i):null;return`<tr class="click" tabindex="0" data-act="gosite" data-a="${s.id}" data-site="${s.id}"><td class="nw"><b class="mono">${s.id}</b><br><span class="mute">${esc(s.name)}</span></td><td class="hide-m nw">${t(s.region)}</td><td class="hide-m nw">${t(s.scenario)}</td><td>${miniRail(s)}</td><td class="nw">${s.stage>=10?t('Closed'):esc(stg(s.stage))}</td><td>${x?`<span class="mono">${STEPS[i].code}</span> ${esc(STEPS[i].name)}`:'—'}</td><td class="hide-m nw">${b?esc(bicTxt(b)):'—'}</td><td class="nw">${x?statePill(x.state,isLate(s,i)):statePill('done')}</td></tr>`}).join('')}</tbody></table></div>
 <div class="row" style="padding:10px 14px"><span class="hint">${t('Showing {a} of {b}',{a:rows.length,b:tot})}</span>${rows.length<tot?`<button class="btn sm" data-act="sitesmore">${t('Show more')}</button>`:''}</div>`}
function vSites(){const f=S.f.sites=S.f.sites||{q:'',region:'',stage:'',scen:'',status:'',sort:'id',n:40};
 const chip=(k,v,l)=>`<button class="chip ${f[k]===v?'on':''}" data-act="sf" data-k="${k}" data-v="${esc(v)}" aria-pressed="${f[k]===v}">${l}</button>`;
 return ph(t('Sites'),t('{n} sites in your visibility',{n:mySites().length}),'')+`<div class="card"><div class="cb" style="border-bottom:1px solid var(--line2)"><div class="row wrap"><label class="sr" for="sq">${t('Search')}</label><input class="inp" id="sq" data-search data-in="sq" placeholder="${t('Search site ID, name or cluster')} ( / )" value="${esc(f.q)}" style="min-width:min(280px,100%)">
 <select class="sel" data-ch="sfsel" data-k="stage" aria-label="${t('Stage')}"><option value="">${t('All stages')}</option>${STAGES.map((x,i)=>`<option value="${i}" ${String(f.stage)===String(i)?'selected':''}>${stg(i)}</option>`).join('')}</select>
 <select class="sel" data-ch="sfsel" data-k="scen" aria-label="${t('Scenario')}"><option value="">${t('All scenarios')}</option>${['New Build','Expansion','Hot Swap','Cold Swap','Relocation'].map(x=>`<option ${f.scen===x?'selected':''} value="${x}">${t(x)}</option>`).join('')}</select>
 <div class="seg" role="group" aria-label="${t('Status')}">${[['','All'],['mine','Mine'],['late','Late'],['wait','Waiting approval'],['done','Closed']].map(([v,l])=>`<button class="${f.status===v?'on':''}" data-act="sf" data-k="status" data-v="${v}">${t(l)}</button>`).join('')}</div></div>
 <div class="row wrap" style="margin-top:8px">${chip('region','',t('All regions'))}${REGIONS.map(r=>chip('region',r,t(r))).join('')}</div></div><div id="sites-body">${sitesRows()}</div></div>`}
/* ---------- Site page */
function clusterNote(s){const cl=SITES.filter(q=>q.cluster===s.cluster),n=cl.filter(q=>q.tasks[sIdx('MS7')].state==='done').length;return t('Cluster {c}: {n} of {m} sites at TE PAC (information only)',{c:s.cluster,n,m:cl.length})}
function vSite(r){const s=SITES.find(q=>q.id===r.args[0]);if(!s)return stateView('empty',{name:'site',args:[r.args[0]]});if(!visible(s))return stateView('denied',r);
 const tab=r.q.tab||'tasks';const f=S.f.site=S.f.site||{};const sel=f.stage;const i=s.cur,x=i>=0?s.tasks[i]:null;
 const ovrN=s.tasks.filter(q=>q.ovr).length;
 const tabs=[['tasks',t('Tasks')],['docs',t('Documents')],['snags',t('QC snags')+(openSnags(s)?` (${openSnags(s)})`:'')],['issues',t('Issues')+(s.issues.length?` (${s.issues.length})`:'')],['history',t('History')]];
 return`<div class="ph"><div><div class="row wrap"><a href="#/sites" class="hint">${ic('chev','flip')} ${t('Sites')}</a></div><h1><span class="mono">${s.id}</span> ${esc(s.name)}</h1><div class="sub">${t(s.region)} · ${t(s.type)} · ${t(s.scenario)} · ${esc(s.contractor)} · ${t('Vendor')}: ${esc(s.vendor)}</div></div><div class="sp"></div>${x?statePill(x.state,isLate(s,i)):statePill('done')}${ovrN?`<span class="pill p-ovr">${ic('shield')}${t('Admin override')} ×${ovrN}</span>`:''}</div>

 <div class="card" style="margin-top:14px"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${tab===k?'on':''}" aria-selected="${tab===k}" data-act="stab" data-a="${k}">${l}</button>`).join('')}</div><div id="stabbody">${tab==='tasks'?siteTasks(s):tab==='docs'?siteDocs(s):tab==='snags'?siteSnags(s):tab==='issues'?siteIssues(s):siteHistory(s)}</div></div>`}
function siteTasks(s){const f=S.f.site=S.f.site||{};const col=f.col=f.col||{};const mode=f.mode||'all';let h=`<div class="tb row wrap cb" style="border-bottom:1px solid var(--line2)"><div class="seg">${[['all','All tasks'],['act','Actionable'],['late','Late']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-act="smode" data-a="${k}">${t(l)}</button>`).join('')}</div>${f.stage!=null?`<button class="chip on" data-act="stage" data-a="${f.stage}">${esc(stg(f.stage))} ${ic('x')}</button>`:''}<div class="sp"></div><span class="hint">${t('Click a row to open the task')} · <kbd>j</kbd><kbd>k</kbd> <kbd>Enter</kbd></span></div><div class="tw"><table class="t" id="taskgrid"><thead><tr><th>${t('Code')}</th><th>${t('Task')}</th><th>${t('Ball in court')}</th><th>${t('Plan / Actual')}</th><th>${t('Status')}</th><th>${t('Docs')}</th><th>${t('Template')}</th></tr></thead><tbody>`;
 for(let st=0;st<10;st++){if(f.stage!=null&&f.stage!==st)continue;const info=stageInfo(s,st);const rows=STEPS.filter(q=>q.stage===st&&(q.i!==msIdx(st))).filter(q=>{const x=s.tasks[q.i];return mode==='all'||mode==='act'&&(x.state==='open'||x.state==='review'||x.state==='approve')||mode==='late'&&isLate(s,q.i)});if(!rows.length&&mode!=='all')continue;
  h+=`<tr class="sgrp" data-act="gcol" data-a="${st}"><td colspan="7">${ic('chev',col[st]?'flip':'')} ${esc(stg(st))} <span class="mute">${info.done}/${info.total}</span> ${info.complete?`<span class="pill p-done">${ic('check')}${t('Done')}</span>`:''}</td></tr>`;
  if(!col[st]){for(const q of rows)h+=taskRow(s,q.i);const mi=msIdx(st),m=s.tasks[mi];h+=`<tr><td colspan="7" class="mute" style="background:var(--card2)">&#9670; ${t('Milestone')}: <b>${esc(STEPS[mi].name)}</b> · ${m.state==='done'?`<span class="mono">${m.act}</span>`:`${t('plan')} <span class="mono">${m.plan}</span>`} ${m.state==='lock'?`<button class="btn sm ghost" data-act="why" data-a="${s.id}:${mi}">${t('Why locked?')}</button>`:''}</td></tr>`}}
 return h+'</tbody></table></div>'}
function taskRow(s,i){const x=s.tasks[i],st=STEPS[i],b=bic(s,i),late=isLate(s,i);const sl=slotDocs(s,i);const have=sl.filter(d=>{const k=getSlot(s,i,d.id);return k.files.length>=d.min}).length;const tp=st.tpl&&TPL_BY[st.tpl]&&TEMPLATES.find(q=>q.id===TPL_BY[st.tpl]);
 return`<tr class="click" tabindex="0" data-act="opentask" data-a="${s.id}:${i}" data-row="1" style="${x.state==='na'?'opacity:.6':''}"><td class="nw"><b class="mono">${st.code}</b></td><td><div>${esc(st.name)}${x.ovr?` <span class="pill p-ovr">${t('Admin override')}</span>`:''}</div>${x.state==='lock'?`<button class="btn sm ghost" style="padding:0 4px;min-height:22px;color:var(--lockInk)" data-act="why" data-a="${s.id}:${i}">${ic('lock')}${t('Why locked?')}</button>`:''}${x.rejected&&x.state!=='done'?`<div class="err">${ic('undo')} ${esc(x.rejected.note)}</div>`:''}</td>
 <td>${b.kind==='done'||b.kind==='na'?'<span class="mute">—</span>':`<div class="who">${bicHtml(b)}${b.claim?` <small>${t('claimed by')} ${emp(b.claim)}</small>`:''}${b.blocked?`<small>(${t('via')} ${STEPS[b.by].code})</small>`:''}${b.ext?`<small>${t('External')}: ${esc(b.ext)}</small>`:''}</div>`}</td>
 <td class="nw"><span class="hint">${t('plan')}</span> ${fdate(x.plan)}<br>${x.act?`<span class="hint">${t('act')}</span> ${fdate(x.act)}`:''}${st.sla?` <span class="hint">${t('SLA')} ${st.sla[1]}${t('wd')}</span>`:''}</td><td class="nw">${statePill(x.state,late)}</td>
 <td class="nw">${sl.length?`<span class="chip ${have===sl.length?'on':''}">${ic('file')}${have}/${sl.length}</span>`:'<span class="mute">—</span>'}</td>
 <td class="nw">${tp?`<button class="ibtn" style="width:32px;height:30px" data-act="tpldl" data-a="${s.id}:${i}" aria-label="${t('Download template')} ${tp.id}" title="${t('Download template')} ${tp.id} ${tp.ver}">${ic('download')}</button> <button class="ibtn" style="width:32px;height:30px" data-act="tplul" data-a="${s.id}:${i}" aria-label="${t('Upload filled template')}" title="${t('Upload filled template')}">${ic('upload')}</button>`:'<span class="mute">—</span>'}</td></tr>`}
function siteDocs(s){const f=S.f.docs=S.f.docs||{stage:'',status:'',q:''};const rows=[];
 STEPS.forEach(st=>{if(st.ms||s.tasks[st.i].state==='na')return;slotDocs(s,st.i).forEach(d=>{const sl=getSlot(s,st.i,d.id);rows.push({st,d,sl})})});
 const fl=rows.filter(r=>(f.stage===''||String(r.st.stage)===f.stage)&&(f.status===''||r.sl.status===f.status)&&(!f.q||(r.d.en+r.st.code+r.sl.files.map(x=>x.name).join()).toLowerCase().includes(f.q.toLowerCase())));
 const sc={missing:'p-late',uploaded:'p-open',review:'p-wait',approved:'p-done',rejected:'p-late',waived:'p-lock'};
 let h=`<div class="cb row wrap" style="border-bottom:1px solid var(--line2)"><select class="sel" data-ch="dflt" data-k="stage" aria-label="${t('Stage')}"><option value="">${t('All stages')}</option>${STAGES.map((x,i)=>`<option value="${i}" ${f.stage===String(i)?'selected':''}>${stg(i)}</option>`).join('')}</select><select class="sel" data-ch="dflt" data-k="status" aria-label="${t('Status')}"><option value="">${t('All statuses')}</option>${['missing','uploaded','review','approved','rejected','waived'].map(k=>`<option value="${k}" ${f.status===k?'selected':''}>${t(k)}</option>`).join('')}</select><input class="inp" data-in="dfq" placeholder="${t('Filter documents')}" value="${esc(f.q)}" aria-label="${t('Filter documents')}"><div class="sp"></div>
 <button class="btn sm" data-act="zipsel" data-a="${s.id}">${ic('download')}${t('Zip selected')} (<span id="nsel">${S.dsel.size}</span>)</button><button class="btn sm" data-act="zipsite" data-a="${s.id}">${ic('download')}${t('Zip whole site')}</button><button class="btn sm" data-act="zipstage" data-a="${s.id}">${ic('download')}${t('Zip filtered')}</button><button class="btn sm" data-act="ziptype" data-a="${s.id}">${ic('download')}${t('Zip one document type across sites')}</button></div>`;
 if(!fl.length)return h+`<div class="empty">${ic('file')}<h3>${t('No documents match')}</h3></div>`;
 h+=`<div class="tw"><table class="t"><thead><tr><th><span class="sr">${t('Select')}</span></th><th>${t('Task')}</th><th>${t('Document')}</th><th>${t('File')}</th><th>${t('Version')}</th><th>${t('Status')}</th><th></th></tr></thead><tbody>`;
 fl.forEach(({st,d,sl})=>{const key=s.id+':'+st.i+':'+d.id;const fn=sl.files.length?sl.files.map(f=>f.final||f.name).join('<br>'):'—';
  h+=`<tr><td><input type="checkbox" data-ch="docsel" data-k="${key}" ${S.dsel.has(key)?'checked':''} aria-label="${t('Select')} ${esc(d.en)}" ${sl.files.length?'':'disabled'}></td><td class="nw"><a href="#/site/${s.id}?task=${st.code}"><b class="mono">${st.code}</b></a> ${esc(st.name)}</td><td>${esc(S.lang==='ar'?d.ar:d.en)}${d.mand==='conditional'?` <span class="chip">${t('conditional')}</span>`:''}</td><td class="mono" style="font-size:12px">${fn}</td>
  <td class="nw">${sl.files.length?`v${sl.vers.length+1}`:''}${sl.vers.length?` <button class="btn sm ghost" data-act="vers" data-a="${key}">${t('Versions')}</button>`:''}</td><td class="nw"><span class="pill ${sc[sl.status]}">${t(sl.status)}</span>${sl.reason?`<div class="err">${esc(sl.reason)}</div>`:''}</td><td class="nw">${sl.files.length?`<button class="ibtn" style="width:32px;height:30px" data-act="dlfile" data-a="${key}" aria-label="${t('Download')}">${ic('download')}</button>`:''}</td></tr>`});
 return h+'</tbody></table></div>'}
function siteSnags(s){const op=openSnags(s);let h=`<div class="cb">`;
 h+=op?`<div class="banner lock">${ic('lock')}<span>${t('{n} open snag(s) block approval of CW PAC (B13).',{n:op})}</span></div>`:`<div class="banner done">${ic('check')}<span>${t('All snags are closed. CW PAC can be approved.')}</span></div>`;
 h+=`<p class="hint">${t('Prototype: name a file with _old (EXIF before the snag) or _noexif (no capture date) to see the photo rules.')}</p>`;
 if(!s.snags.length)h+=`<div class="empty">${ic('check')}<h3>${t('No snags on this site')}</h3></div>`;
 s.snags.forEach(sn=>{const ty=SNAG_TYPES[sn.type];const pc={open:'p-open',review:'p-wait',approve:'p-wait',approved:'p-done'}[sn.state];const u=me();
  h+=`<div class="card" style="margin-bottom:12px"><div class="ch"><b class="mono">${sn.id}</b><span>${esc(sn.title)}</span><div class="sp"></div><span class="pill ${pc}">${t({open:'Open',review:'Awaiting review',approve:'Awaiting approval',approved:'Closed'}[sn.state])}</span></div><div class="cb">
  <div class="hint">${t('Raised')} <span class="mono">${sn.raised}</span> · ${t('Required')}: ≥${ty.min} ${t('photos')}, ${t('shots')}: ${ty.shots.map(esc).join(', ')} · ${ty.fmt} · ≤${ty.maxMB} MB</div>${sn.note?`<div class="banner late" style="margin-top:6px">${ic('undo')}<span>${esc(sn.note)}</span></div>`:''}
  <div style="margin:8px 0">${sn.photos.length?sn.photos.map(p=>`<span class="chip" style="margin:2px">${ic('camera')}${esc(p.name)}${p.shot?` · ${esc(p.shot)}`:''} · <span class="mono">${p.exif||'?'}</span>${p.flag?` <span class="pill p-wait">${esc(p.flag)}</span>`:''}</span>`).join(''):`<span class="mute">${t('No photos yet')}</span>`}</div>
  ${sn.state==='open'&&permOK(u,'entry')?`<div class="row wrap"><select class="sel" id="shot-${sn.id}" aria-label="${t('Shot type')}">${ty.shots.map(x=>`<option>${esc(x)}</option>`).join('')}</select><label class="btn sm">${ic('upload')}${t('Add photos')}<input type="file" multiple accept="image/*" hidden data-snaginput="${sn.id}"></label><label class="btn sm">${ic('camera')}${t('Camera')}<input type="file" accept="image/*" capture="environment" hidden data-snaginput="${sn.id}"></label><button class="btn sm pri" data-act="snag" data-a="${sn.id}:submit" ${snagReady(sn)?'aria-disabled="true"':''}>${t('Submit fix for review')}</button></div>${snagReady(sn)?`<div class="hint">${esc(snagReady(sn))}</div>`:''}`:''}

  ${sn.state==='approve'&&permOK(u,'approve')?`<div class="row wrap"><button class="btn sm ok" data-act="snag" data-a="${sn.id}:approve">${t('Approve and close snag')}</button><button class="btn sm no" data-act="snag" data-a="${sn.id}:return">${t('Return with note')}</button></div>`:''}</div></div>`});

function siteIssues(s){return`<div class="cb">${s.issues.length?s.issues.map(i=>`<div class="row wrap" style="padding:8px 0;border-bottom:1px solid var(--line2)"><b>${esc(i.text)}</b><span class="chip">${t('Owner')}: ${esc(i.owner)}</span><span class="mono mute">${i.raised}</span><div class="sp"></div><span class="pill p-wait">${t(i.status)}</span></div>`).join(''):`<div class="empty">${ic('check')}<h3>${t('No issues logged for this site')}</h3></div>`}<p class="hint">${t('The Issue Log register holds several issues per site.')}</p></div>`}

 const all=[...ev.map(a=>({at:a.at.slice(0,10),by:a.user,txt:a.action+' · '+a.target,note:a.detail})),...tk].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,60);

 ${b.kind!=='done'&&b.kind!=='na'?`<div class="sect" style="margin-top:14px"><h4>${ic('user')} ${t('Ball in court')}</h4><div>${b.users.length?b.users.map(u=>`<span class="chip">${emp(u)}</span>`).join(' '):'—'} <span class="hint">${lvName(b.kind==='blocked'?'entry':b.kind)}${b.blocked?` (${STEPS[b.by].code})`:''}</span></div>${b.ext?`<div class="hint">${t('External party')}: ${esc(b.ext)}</div>`:''}</div>`:''}
 ${isAdmin(me())&&x.state==='lock'?`<div class="banner open" style="margin-top:12px">${ic('shield')}<span>${t('As System Admin you can unlock this task with a reason (logged, reversible).')}</span></div>`:''}</div><div class="ft">${ovrKinds(me()).length?`<button class="btn" data-act="ovr" data-a="${sid}:${i}">${t('Admin override')}</button>`:''}<button class="btn pri" data-act="mclose">${t('Close')}</button></div>`)}
/* ---------- task drawer */
function openTask(sid,code,silent){const s=SITES.find(q=>q.id===sid);if(!s)return;const i=/^\d+$/.test(code)?+code:sIdx(code);if(i<0)return;S.drawer={sid,i};renderDrawer();if(!silent&&parseHash().name==='site'){const q=new URLSearchParams(location.hash.split('?')[1]||'');q.set('task',STEPS[i].code);history.replaceState(null,'',(location.hash.split('?')[0]||'#/site/'+sid)+'?'+q)}}

 return ph(t('Settings'),t('SLA rules and Project Status weights. Versioned with effective date, reason and author; every change is audited.'))+`<div class="card"><div class="tabs" role="tablist">${[['sla','SLA rules'],['weights','Project Status weights']].map(([k,l])=>`<button role="tab" class="${f.tab===k?'on':''}" aria-selected="${f.tab===k}" data-act="settab" data-a="${k}">${t(l)}</button>`).join('')}</div>${f.tab==='sla'?slaTab():weightsTab()}</div>`}
function slaTab(){const D=S.slaD||{};const n=Object.keys(D).length;const bad=Object.values(D).some(d=>d.min>d.max);
 return`<div class="cb"><div class="banner open">${ic('clock')}<span>${t('Min = target (green). Max = limit; above max the task is late. Counted in working days. A task keeps the SLA version in force when it opened.')}</span></div>
 ${n?`<div class="bulk" role="region">${ic('pen')}<span>${n} ${t('unsaved change(s)')}</span><button class="btn pri sm" data-act="slapub" ${bad?'disabled':''}>${t('Publish…')}</button><button class="btn sm" data-act="sladiscard">${t('Discard')}</button>${bad?`<span class="err">${t('Min must not exceed max')}</span>`:''}</div>`:''}
 <div class="tw" style="max-height:560px"><table class="t"><thead><tr><th>${t('Task')}</th><th>${t('Min (wd)')}</th><th>${t('Max (wd)')}</th><th>${t('Measured from')}</th><th class="hide-m">${t('Calendar')}</th><th>${t('Version')}</th><th>${t('Overrides')}</th></tr></thead><tbody>${SLA_R.map(r=>{const d=D[r.code]||{};const v=k=>d[k]!==undefined?d[k]:r[k];return`<tr><td class="nw"><b class="mono">${r.code}</b> ${esc(STEPS[r.i].name)}</td><td><input class="inp" type="number" min="0" style="width:72px" data-ch="slaf" data-k="${r.code}:min" value="${v('min')}" aria-label="${r.code} min"></td><td><input class="inp" type="number" min="0" style="width:72px" data-ch="slaf" data-k="${r.code}:max" value="${v('max')}" aria-label="${r.code} max"></td><td><select class="sel" data-ch="slaf" data-k="${r.code}:start" aria-label="${r.code} start">${STARTS.map(x=>`<option ${v('start')===x?'selected':''}>${x}</option>`).join('')}</select></td><td class="hide-m hint">${r.cal}</td><td class="nw"><button class="btn sm ghost" data-act="slahist" data-a="${r.code}">v${r.ver} · <span class="mono">${r.eff}</span></button></td><td class="nw"><button class="btn sm" data-act="slaovr" data-a="${r.code}">${r.ovr.length||'+'} </button></td></tr>`}).join('')}</tbody></table></div></div>`}
function weightsTab(){const W=S.wD||(S.wD=null);const D=W||WSET;const f=S.f.set;const sel=f.act||0;const sum=D.acts.reduce((a,x)=>a+x.w,0);const A=D.acts[sel];const isum=Math.round(A.items.reduce((a,x)=>a+x.w,0)*10)/10;const hs=D.health.late+D.health.wait;const okAll=Math.abs(sum-100)<.05&&D.acts.every(a=>Math.abs(a.items.reduce((x,i)=>x+i.w,0)-100)<.05)&&hs===100;
 return`<div class="cb"><div class="banner open">${ic('shield')}<span>${t('Weights must sum to 100% at every level before publishing. Weekly snapshots keep the values computed at the time.')} · ${t('Active set')} v${WSET.ver} (<span class="mono">${WSET.eff}</span>)</span></div>
 ${W?`<div class="bulk" role="region">${ic('pen')}<span>${t('Unsaved')}</span><button class="btn pri sm" data-act="wpub" ${okAll?'':'disabled'}>${t('Publish…')}</button><button class="btn sm" data-act="wdiscard">${t('Discard')}</button></div>`:''}
 <div class="g2"><div><h4 style="margin-bottom:6px">${t('Activity weights')} <span class="pill ${Math.abs(sum-100)<.05?'p-done':'p-late'}">${Math.round(sum*10)/10}%</span></h4>${D.acts.map((a,k)=>`<div class="row" style="margin-bottom:6px"><button class="chip ${k===sel?'on':''}" style="flex:1;justify-content:flex-start" data-act="wact" data-a="${k}">${esc(a.n)}</button><input class="inp" type="number" step="0.1" min="0" style="width:84px" data-ch="wf" data-k="a:${k}" value="${a.w}" aria-label="${esc(a.n)}"><span>%</span></div>`).join('')}
 <h4 style="margin:14px 0 6px">${t('Project health index')} <span class="pill ${hs===100?'p-done':'p-late'}">${hs}%</span></h4><div class="row wrap"><label class="fld" style="margin:0"><span>${t('Late share weight')}</span><input class="inp" type="number" style="width:84px" data-ch="wf" data-k="h:late" value="${D.health.late}"></label><label class="fld" style="margin:0"><span>${t('Waiting share weight')}</span><input class="inp" type="number" style="width:84px" data-ch="wf" data-k="h:wait" value="${D.health.wait}"></label></div></div>
 <div><h4 style="margin-bottom:6px">${esc(A.n)} · ${t('items')} <span class="pill ${Math.abs(isum-100)<.05?'p-done':'p-late'}">${isum}%</span></h4>${A.items.map((it,k)=>`<div class="row" style="margin-bottom:6px"><span style="flex:1">${esc(it.n)}</span><input class="inp" type="number" step="0.1" min="0" style="width:84px" data-ch="wf" data-k="i:${k}" value="${it.w}" aria-label="${esc(it.n)}"><span class="hint">${it.unit}</span></div>`).join('')}<div class="hint">${t('45 items in total across the 8 activities; each has its own unit and measure.')}</div></div></div>
 <h4 style="margin:16px 0 6px">${t('Versions')}</h4><div class="tl">${WSET.hist.map(h=>`<div class="ev"><b>v${h.ver}</b> <span class="mono">${h.eff}</span> · ${esc(h.reason)} <span class="hint">${esc((U2[h.by]||{}).name||'')}</span></div>`).join('')}</div></div>`}
function pubDialog(title,onok,extra=''){modal(`<h3>${ic('shield')} ${title}</h3><div class="cb"><label class="fld"><span>${t('Reason (required)')}</span><textarea class="inp" id="pr" rows="2" style="width:100%"></textarea></label><label class="fld"><span>${t('Effective date')}</span><input class="inp" type="date" id="pe" value="${TODAY}"></label>${extra}<div id="perr" class="err" role="alert"></div></div><div class="ft"><button class="btn" data-act="mclose">${t('Cancel')}</button><button class="btn pri" id="pok">${t('Publish (needs step-up)')}</button></div>`);
 $('#pok').onclick=()=>{const r=$('#pr').value.trim();if(!r){$('#perr').textContent=t('A reason is required.');return}const e=$('#pe').value,ap=$('#papply')&&$('#papply').checked;closeModal();stepUp(title,()=>onok(r,e,ap))}}
Object.assign(ACT,{settab:el=>{S.f.set.tab=el.dataset.a;render()},sladiscard:()=>{S.slaD=null;render()},wdiscard:()=>{S.wD=null;render()},wact:el=>{S.f.set.act=+el.dataset.a;render()},
 slahist:el=>{const r=SLA_R.find(q=>q.code===el.dataset.a);modal(`<h3>${ic('layers')} ${t('SLA versions')} · ${r.code}</h3><div class="cb"><div class="tl">${r.hist.slice().reverse().map(h=>`<div class="ev"><b>v${h.ver}</b> ${h.min}–${h.max} ${t('wd')} · <span class="mono">${h.eff}</span><br>${esc(h.reason)} <span class="hint">${esc((U2[h.by]||{}).name||'')}</span></div>`).join('')}</div></div><div class="ft"><button class="btn pri" data-act="mclose">${t('Close')}</button></div>`)},
 slaovr:el=>{const r=SLA_R.find(q=>q.code===el.dataset.a);modal(`<h3>${t('Overrides')} · ${r.code}</h3><div class="cb">${r.ovr.map(o=>`<div class="chip" style="margin:2px">${esc(o.sc||t('any scenario'))} · ${esc(o.rg||t('any region'))}: ${o.min}–${o.max}</div>`).join('')||`<div class="hint">${t('No overrides')}</div>`}<div class="g2" style="margin-top:10px"><label class="fld"><span>${t('Scenario')}</span><select class="sel" id="os"><option value="">${t('any scenario')}</option>${['New Build','Expansion','Hot Swap','Cold Swap','Relocation'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="fld"><span>${t('Region')}</span><select class="sel" id="org"><option value="">${t('any region')}</option>${REGIONS.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="fld"><span>Min</span><input class="inp" type="number" id="omin" value="${r.min}"></label><label class="fld"><span>Max</span><input class="inp" type="number" id="omax" value="${r.max}"></label></div></div><div class="ft"><button class="btn" data-act="mclose">${t('Close')}</button><button class="btn pri" id="oadd">${t('Add override')}</button></div>`);
  $('#oadd').onclick=()=>{closeModal();stepUp(t('SLA override {c}',{c:r.code}),()=>{r.ovr.push({sc:$('#os')?'':'',rg:'',min:0,max:0});});};
  $('#oadd').onclick=()=>{const o={sc:$('#os').value,rg:$('#org').value,min:+$('#omin').value,max:+$('#omax').value};closeModal();stepUp(t('SLA override {c}',{c:r.code}),()=>{r.ovr.push(o);audit('SLA override added',r.code,`${o.sc||'any'} / ${o.rg||'any'}: ${o.min}–${o.max}`,'','',{mfa:true});render()})}},
 slapub:()=>{const D=S.slaD;pubDialog(t('Publish SLA changes'),(reason,eff,ap)=>{Object.entries(D).forEach(([code,d])=>{const r=SLA_R.find(q=>q.code===code),st=STEPS[r.i];const old=[r.min,r.max,r.start];
   if(!ap)SITES.forEach(s=>{const x=s.tasks[r.i];if(['open','review','approve'].includes(x.state)&&!x.slaSnap)x.slaSnap=[r.min,r.max]});
   if(d.min!==undefined)r.min=d.min;if(d.max!==undefined)r.max=d.max;if(d.start)r.start=d.start;r.ver++;r.eff=eff;r.hist.push({ver:r.ver,min:r.min,max:r.max,eff,reason,by:S.uid});st.sla=[r.min,r.max];
   audit('SLA rule published',code,reason+' · effective '+eff+(ap?' · applied to open tasks':''),old.join(' / '),[r.min,r.max,r.start].join(' / '),{mfa:true})});SITES.forEach(recompute);S.slaD=null;toast(t('Published.'));refresh()},`<label class="chk" style="display:flex;padding:4px 0"><input type="checkbox" id="papply"> ${t('Also apply to tasks that are open now')}</label>`)},
 wpub:()=>{const W=S.wD;pubDialog(t('Publish weight set'),(reason,eff)=>{const old=JSON.stringify(WSET.acts.map(a=>a.w));WSET.acts=W.acts;WSET.health=W.health;WSET.ver++;WSET.eff=eff;WSET.hist.push({ver:WSET.ver,eff,reason,by:S.uid});audit('Weight set published','Project Status',reason+' · v'+WSET.ver,old,JSON.stringify(W.acts.map(a=>a.w)),{mfa:true});S.wD=null;toast(t('Published.'));refresh()})}});
Object.assign(CH,{slaf:el=>{const[c,f]=el.dataset.k.split(':');S.slaD=S.slaD||{};const d=S.slaD[c]=S.slaD[c]||{};d[f]=f==='start'?el.value:+el.value;const r=SLA_R.find(q=>q.code===c);if(f!=='start'&&d[f]===r[f]&&(d.min===undefined||d.min===r.min)&&(d.max===undefined||d.max===r.max)&&!d.start)delete S.slaD[c];render()},
 wf:el=>{S.wD=S.wD||JSON.parse(JSON.stringify({acts:WSET.acts,health:WSET.health}));const[k,i]=el.dataset.k.split(':');const v=+el.value;if(k==='a')S.wD.acts[+i].w=v;else if(k==='h')S.wD.health[i]=v;else S.wD.acts[S.f.set.act||0].items[+i].w=v;render()}});

/* boot */
STEPS.forEach(st=>{});SITES.forEach(s=>s.tasks.forEach((x,i)=>{if(x.state!=='lock'&&x.state!=='na')docIds(s,i)}));
if(!location.hash)location.hash='#/'+(S.uid?'my-work':'login');
applyLang();document.documentElement.dataset.theme=S.theme==='dark'?'dark':'light';render();


</script></body></html>
