name: Bug report
description: Something does not work as the documents say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report a security problem here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Contract version and newest migration number, if you know them.
