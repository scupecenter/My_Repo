# Security scan on every pull request (owner decision 2026-11-13).
# Replaces the slow local full scan: locally only a quick secrets check of staged files runs
# before each commit; the full scan (secrets, SAST, dependencies, IaC) runs here on GitHub.
# A job fails on findings of severity high or above. Known synthetic test values are
# allowlisted in .gitleaks.toml.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semgrep
        run: pip install semgrep==1.95.0
      - name: Scan (fails on ERROR severity)
        run: |
          semgrep scan --config p/default --disable-version-check --metrics off \
            --severity ERROR --error \
            --exclude node_modules --exclude dist \
            pmis/apps

  dependencies:
    name: Dependencies (grype)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/scan-action@v6
        with:
          path: pmis
          fail-build: true
          severity-cutoff: high
          output-format: table

  iac:
    name: IaC (checkov, report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checkov
        run: pip install checkov==3.2.300
      - name: Scan Dockerfiles and workflows
        run: checkov -d . --framework dockerfile github_actions --compact --soft-fail
